data_mode 隔离</text><rect x="40" y="380" width="420" height="200" rx="16" fill="white" stroke="#c6e0e8"/><rect x="40" y="380" width="420" height="48" rx="16" fill="#0c6970"/><text x="58" y="412" font-size="20" fill="white" font-weight="700">02 · 原件与上传渠道</text><text x="58" y="460" font-size="16" fill="#315062">a_report_sources</text><text x="58" y="492" font-size="16" fill="#315062">a_report_upload_metadata</text><text x="58" y="524" font-size="16" fill="#315062">PDF / 照片保留摘要及受限存储引用</text><text x="58" y="556" font-size="16" fill="#315062">上传渠道与医学数据来源分开</text><rect x="550" y="130" width="490" height="180" rx="16" fill="white" stroke="#c6e0e8"/><rect x="550" y="130" width="490" height="48" rx="16" fill="#0c6970"/><text x="568" y="162" font-size="20" fill="white" font-weight="700">03 · 逻辑报告与版本</text><text x="568" y="210" font-size="16" fill="#315062">a_report_series → a_health_reports</text><text x="568" y="242" font-size="16" fill="#315062">a_report_revision_sources</text><text x="568" y="274" font-size="16" fill="#315062">修改追加新 revision，不覆盖已审核数据</text><rect x="550" y="380" width="490" height="250" rx="16" fill="white" stroke="#c6e0e8"/><rect x="550" y="380" width="490" height="48" rx="16" fill="#0c6970"/><text x="568" y="412" font-size="20" fill="white" font-weight="700">04 · 结构化结果与证据</text><text x="568" y="460" font-size="16" fill="#315062">a_health_items · 655 种动态项目</text><text x="568" y="492" font-size="16" fill="#315062">a_occupational_profiles · 13 个职业字段</text><text x="568" y="524" font-size="16" fill="#315062">a_health_conclusions · 医生正式结论</text><text x="568" y="556" font-size="16" fill="#315062">a_health_advice · 医生建议</text><text x="568" y="588" font-size="16" fill="#315062">a_report_evidence · 页码 / 坐标 / 原文</text><rect x="1130" y="130" width="430" height="180" rx="16" fill="white" stroke="#c6e0e8"/><rect x="1130" y="130" width="430" height="48" rx="16" fill="#0c6970"/><text x="1148" y="162" font-size="20" fill="white" font-weight="700">05 · 版本化字典</text><text x="1148" y="210" font-size="16" fill="#315062">a_medical_item_dictionary · 655</text><text x="1148" y="242" font-size="16" fill="#315062">a_medical_field_mapping · 1,589</text><text x="1148" y="274" font-size="16" fill="#315062">a_medical_unit_mapping · 81 原单位键</text><rect x="1130" y="380" width="430" height="250" rx="16" fill="white" stroke="#c6e0e8"/><rect x="1130" y="380" width="430" height="48" rx="16" fill="#0c6970"/><text x="1148" y="412" font-size="20" fill="white" font-weight="700">06 · 字典补充与校验</text><text x="1148" y="460" font-size="16" fill="#315062">a_standard_field_dictionary · 67</text><text x="1148" y="492" font-size="16" fill="#315062">a_medical_unit_observations · 390</text><text x="1148" y="524" font-size="16" fill="#315062">a_dictionary_source_rows · 3,739 原始行</text><text x="1148" y="556" font-size="16" fill="#315062">a_report_template_mapping · 暂无模板种子</text><text x="1148" y="588" font-size="16" fill="#315062">单位转换批准数为 0</text><rect x="550" y="710" width="490" height="190" rx="16" fill="white" stroke="#c6e0e8"/><rect x="550" y="710" width="490" height="48" rx="16" fill="#0c6970"/><text x="568" y="742" font-size="20" fill="white" font-weight="700">07 · 校验、医生审核</text><text x="568" y="790" font-size="16" fill="#315062">a_extraction_jobs · 处理状态</text><text x="568" y="822" font-size="16" fill="#315062">a_report_quality_checks · 身份与质量校验</text><text x="568" y="854" font-size="16" fill="#315062">a_review_records · return / reject / confirm</text><text x="568" y="886" font-size="16" fill="#315062">退回补录后生成新版本，再送审核</text><rect x="550" y="980" width="490" height="190" rx="16" fill="white" stroke="#c6e0e8"/><rect x="550" y="980" width="490" height="48" rx="16" fill="#0c6970"/><text x="568" y="1012" font-size="20" fill="white" font-weight="700">08 · 正式归档与同步</text><text x="568" y="1060" font-size="16" fill="#315062">a_report_publications · 正式发布凭据</text><text x="568" y="1092" font-size="16" fill="#315062">a_report_sync_outbox · 事务消息</text><text x="568" y="1124" font-size="16" fill="#315062">质量 passed + 医生 confirm + 同一快照摘要</text><text x="568" y="1156" font-size="16" fill="#315062">发布和 outbox 必须在同一业务事务写入</text><rect x="40" y="710" width="420" height="190" rx="16" fill="white" stroke="#c6e0e8"/><rect x="40" y="710" width="420" height="48" rx="16" fill="#0c6970"/><text x="58" y="742" font-size="20" fill="white" font-weight="700">09 · 医生建议后续任务</text><text x="58" y="790" font-size="16" fill="#315062">a_health_advice → a_followup_tasks</text><text x="58" y="822" font-size="16" fill="#315062">随访任务与报告处理状态分别维护</text><text x="58" y="854" font-size="16" fill="#315062">随访完成不等于报告审核通过</text><rect x="1130" y="710" width="430" height="230" rx="16" fill="white" stroke="#c6e0e8"/><rect x="1130" y="710" width="430" height="48" rx="16" fill="#0c6970"/><text x="1148" y="742" font-size="20" fill="white" font-weight="700">10 · 个人档案与企业分析</text><text x="1148" y="790" font-size="16" fill="#315062">a_health_risk_assessments</text><text x="1148" y="822" font-size="16" fill="#315062">a_health_risk_report_sources → 已发布版本</text><text x="1148" y="854" font-size="16" fill="#315062">a_health_risk_factors → 指标与证据</text><text x="1148" y="886" font-size="16" fill="#315062">a_health_record_completeness · 规则快照</text><text x="1148" y="918" font-size="16" fill="#315062">正式医学结论 ≠ 平台低 / 中 / 高风险</text><rect x="1130" y="1010" width="430" height="160" rx="16" fill="white" stroke="#c6e0e8"/><rect x="1130" y="1010" width="430" height="48" rx="16" fill="#0c6970"/><text x="1148" y="1042" font-size="20" fill="white" font-weight="700">11 · 运维与审计</text><text x="1148" y="1090" font-size="16" fill="#315062">a_health_archive_audit_logs · 脱敏差异</text><text x="1148" y="1122" font-size="16" fill="#315062">a_health_schema_migration · SQL 版本</text><text x="1148" y="1154" font-size="16" fill="#315062">旧平台职工表及业务表保持原结构</text><text x="45" y="1230" font-size="18" fill="#315062">数据主线：原件 → 提取与证据 → 身份 / 质量校验 → 医生审核 → 正式发布 → 个人档案 / 企业统计</text><text x="45" y="1265" font-size="15" fill="#62798a">说明：这是数据层架构；OCR、大模型、审核接口及四个前端页面的数据对接需要后续开发。</text></g></svg>