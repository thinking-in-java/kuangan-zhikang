<!DOCTYPE html>
<html  lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>用户管理</title>
    <link rel="stylesheet" th:href="@{/assets/libs/layui/css/layui.css}"/>
    <link rel="stylesheet" th:href="@{/assets/module/admin.css}"/>
</head>
<body>
<!-- 页面加载loading -->
<div class="page-loading">
    <div class="ball-loader">
        <span></span><span></span><span></span><span></span>
    </div>
</div>
<!-- 正文开始 -->
<div class="layui-fluid">
    <div class="layui-card">
        <div class="layui-card-body table-tool-mini full-table">
            <div class="layui-form toolbar">
                <div class="layui-form-item">
                    <div class="layui-inline">
                        <label class="layui-form-label w-auto">任务名称：</label>
                        <div class="layui-input-inline mr0">
                            <input name="jobName" class="layui-input" type="text" placeholder="任务名称"/>
                        </div>
                    </div>
                    <div class="layui-inline">
                        <label class="layui-form-label w-auto">任务状态：</label>
                        <div class="layui-input-inline mr0">
                            <select name="status">
                                <option value="">选择状态</option>
                                <option value="0">正常</option>
                                <option value="1">暂停</option>
                            </select>
                        </div>
                    </div>
                    <div class="layui-inline">
                        <button class="layui-btn icon-btn" lay-filter="formSubSearchJob" lay-submit>
                            <i class="layui-icon">&#xe615;</i>查询
                        </button>
                    </div>
                    <div class="layui-inline">
                        <button class="layui-btn icon-btn" id="btnAddJob"><i class="layui-icon">&#xe654;</i>新增
                        </button>
                    </div>
                    
                    <div class="layui-inline">
                        <a ew-href="/task/jobLog" class="layui-btn icon-btn">
                            <i class="layui-icon">&#xe615;</i>日志
                        </a>
                    </div>
                </div>
            </div>

            <table id="tableUser" lay-filter="tableUser"></table>
        </div>
    </div>
</div>

<!-- 表格操作列 -->
<script type="text/html" id="tableBarUser">
    <a class="layui-btn layui-btn-primary layui-btn-xs" lay-event="edit">修改</a>
    <a class="layui-btn layui-btn-danger layui-btn-xs" lay-event="del">删除</a>
    <a class="layui-btn layui-btn-xs" lay-event="reset">执行一次</a>
</script>


<script type="text/html" id="tableJobGroup">
  
        <div>{{d.jobGroup=='DEFAULT'?'默认':'系统'}}</div>
</script>

<!-- 表格状态列 -->
<script type="text/html" id="tableStateUser">
    <input type="checkbox" lay-filter="ckStateJob" value="{{d.jobId}}" lay-skin="switch"
           lay-text="暂停|开启" {{d.status==0?'checked':''}}/>
</script>
<!-- 表单弹窗 -->
<script type="text/html" id="modelJob">
    <form id="modelUserForm" lay-filter="modelUserForm" class="layui-form model-form">
        <input name="jobId" type="hidden"/>
        <div class="layui-form-item">
            <label class="layui-form-label layui-form-required">任务名称</label>
            <div class="layui-input-block">
                <input name="jobName" placeholder="请输入任务名称" type="text" class="layui-input" maxlength="20"
                       lay-verType="tips" lay-verify="required" required/>
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label layui-form-required">任务分组</label>
            <div class="layui-input-block">
                <input type="radio" name="jobGroup" value="DEFAULT" title="默认" checked/>
                <input type="radio" name="jobGroup" value="SYSTEM" title="系统"/>
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label layui-form-required">调用目标字符串</label>
            <div class="layui-input-block">
                <input name="invokeTarget" placeholder="请输入调用目标字符串" type="text" class="layui-input" maxlength="100"
                       lay-verType="tips" lay-verify="required" required/>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label layui-form-required">执行表达式 </label>
            <div class="layui-input-block">
                <input name="cronExpression" placeholder="请输入执行表达式 " type="text" class="layui-input" maxlength="20"
                       lay-verType="tips" lay-verify="required" required/>
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label">执行策略</label>
            <input type="radio" name="misfirePolicy" value="1" title="立即执行" checked/>
            <input type="radio" name="misfirePolicy" value="2" title="执行一次"/>
            <input type="radio" name="misfirePolicy" value="3" title="放弃执行"/>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label">并发执行</label>
            <input type="radio" name="concurrent" value="0" title="允许" checked/>
            <input type="radio" name="concurrent" value="1" title="禁止"/>
        </div>

       <div class="layui-form-item">
            <label class="layui-form-label">任务状态</label>
            <input type="radio" name="status" value="0" title="正常" checked/>
            <input type="radio" name="status" value="1" title="暂停"/>
        </div>
        

        <div class="layui-form-item">
            <label class="layui-form-label">备注</label>
            <div class="layui-input-block">
                <textarea name="remark" placeholder="请输入内容" class="layui-textarea" maxlength="200"></textarea>
            </div>
        </div>

        <div class="layui-form-item text-right">
            <button class="layui-btn layui-btn-primary" type="button" ew-event="closePageDialog">取消</button>
            <button class="layui-btn" lay-filter="modelSubmitJob" lay-submit>保存</button>
        </div>
    </form>
</script>

<!-- js部分 -->
<script type="text/javascript" th:src="@{/assets/libs/layui/layui.js}"></script>
<script type="text/javascript" th:src="@{/assets/js/common.js}"></script>
<script th:inline="none">
    layui.use(['layer', 'form', 'table', 'util', 'admin'], function () {
        var $ = layui.jquery;
        var layer = layui.layer;
        var form = layui.form;
        var table = layui.table;
        var util = layui.util;
        var admin = layui.admin;
        // 渲染表格
        var insTb = table.render({
            elem: '#tableUser',
            url: '/job/task/list',
            request: {     
                pageName: 'pageNum' //页码的参数名称，默认：page
               ,limitName: 'pageSize' //每页数据量的参数名，默认：limit
            },
            page: true,
            method:'post',
            toolbar: true,
            cellMinWidth: 100,
            cols: [[
            	{
		            field: 'jobId',
		            title: '任务编号'
		        },
                {field: 'jobName', sort: true, title: '任务名称'},
                {field: 'jobGroup', sort: true,templet: '#tableJobGroup', title: '任务分组'},
                {field: 'invokeTarget', sort: true, title: '调用目标字符串'},
                {field: 'cronExpression', sort: true, title: '执行表达式'},
                {field: 'status', sort: true, templet: '#tableStateUser', title: '任务状态'},
                {
		            field: 'createTime',
		            title: '创建时间',
		            sort: true
		        },
                {align: 'center', toolbar: '#tableBarUser', title: '操作', minWidth: 200}
            ]]
        });
        
        // 添加
        $('#btnAddJob').click(function () {
            showEditModel();
        });

        // 搜索
        form.on('submit(formSubSearchJob)', function (data) {
            insTb.reload({where: data.field}, 'data');
        });

        // 工具条点击事件
        table.on('tool(tableUser)', function (obj) {
            var data = obj.data;
            var layEvent = obj.event;
            if (layEvent === 'edit') { // 修改
                showEditModel(data);
            } else if (layEvent === 'del') { // 删除
                doDel(data.jobId, data.jobName);
            } else if (layEvent === 'reset') { // 执行一次
            	resetJob(data);
            }
        });

        // 显示表单弹窗
        function showEditModel(mUser) {
            admin.open({
                type: 1,
                area:['500px'],
                title: (mUser ? '修改' : '添加') + '用户',
                content: $('#modelJob').html(),
                success: function (layero, dIndex) {
                    $(layero).children('.layui-layer-content').css('overflow', 'visible');
                    var url = mUser ? '/job/task/edit' : '/job/task/add';
                    // 回显数据
                    form.val('modelUserForm', mUser);
                    // 表单提交事件
                    form.on('submit(modelSubmitJob)', function (data) {
                        layer.load(2);
                        $.get(url,  data.field, function (res) {
                            layer.closeAll('loading');
                            if (res.code == 200) {
                                layer.close(dIndex);
                                layer.msg(res.msg, {icon: 1});
                                insTb.reload({}, 'data');
                            } else {
                                layer.msg(res.msg, {icon: 2});
                            }
                        }, 'json');
                        return false;
                    });
                }
            });
        }

        // 删除
        function doDel(jobId, jobName) {
            layer.confirm('确定要删除“' + jobName + '”吗？', {
                skin: 'layui-layer-admin',
                shade: .1
            }, function (i) {
                layer.close(i);
                layer.load(2);
                $.get('/job/task/remove', {
                	ids: jobId
                }, function (res) {
                    layer.closeAll('loading');
                    if (res.code == 200) {
                        layer.msg(res.msg, {icon: 1});
                        insTb.reload({}, 'data');
                    } else {
                        layer.msg(res.msg, {icon: 2});
                    }
                }, 'json');
            });
        }

        // 修改用户状态
        form.on('switch(ckStateJob)', function (obj) {
            layer.load(2);
            $.get('/job/task/changeStatus', {
            	jobId: obj.elem.value,
            	status: obj.elem.checked ? 0 : 1
            }, function (res) {
                layer.closeAll('loading');
                if (res.code == 200) {
                    layer.msg(res.msg, {icon: 1});
                } else {
                    layer.msg(res.msg, {icon: 2});
                    $(obj.elem).prop('checked', !obj.elem.checked);
                    form.render('checkbox');
                }
            }, 'json');
        });

        // 执行一次
        function resetJob(data) {
               $.post('/job/task/run',data , function (res) {
                   layer.closeAll('loading');
                   if (res.code == 200) {
                       layer.msg(res.msg, {icon: 1});
                   } else {
                       layer.msg(res.msg, {icon: 2});
                   }
               }, 'json');
           
        }

      
    });
</script>
</body>
</html>
