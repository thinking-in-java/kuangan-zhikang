<!DOCTYPE html>
<html  lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>用户管理</title>
    <link rel="stylesheet" th:href="@{/assets/libs/layui/css/layui.css}"/>
    <link rel="stylesheet" th:href="@{/assets/module/admin.css}"/>
</head>
<body>
<!-- 页面加载loading -->
<div class="page-loading">
    <div class="ball-loader">
        <span></span><span></span><span></span><span></span>
    </div>
</div>
<!-- 正文开始 -->
<div class="layui-fluid">
    <div class="layui-card">
        <div class="layui-card-body table-tool-mini full-table">
            <div class="layui-form toolbar">
                <div class="layui-form-item">
                    <div class="layui-inline">
                        <label class="layui-form-label w-auto">任务名称：</label>
                        <div class="layui-input-inline mr0">
                            <input name="jobName" class="layui-input" type="text" placeholder="任务名称"/>
                        </div>
                    </div>
                    <div class="layui-inline">
                        <label class="layui-form-label w-auto">执行状态：</label>
                        <div class="layui-input-inline mr0">
                            <select name="status">
                                <option value="">选择状态</option>
                                <option value="0">正常</option>
                                <option value="1">失败</option>
                            </select>
                        </div>
                    </div>
                    <div class="layui-inline">
                        <button class="layui-btn icon-btn" lay-filter="formSubSearchJob" lay-submit>
                            <i class="layui-icon">&#xe615;</i>查询
                        </button>
                    </div>
                    <div class="layui-inline">
                        <button class="layui-btn icon-btn" id="btnAddJob"><i class="layui-icon">&#xe654;</i>清空
                        </button>
                    </div>
               
                </div>
            </div>

            <table id="tableUser" lay-filter="tableUser"></table>
        </div>
    </div>
</div>

<!--转换时间格式-->

<!-- js部分 -->
<script type="text/javascript" th:src="@{/assets/libs/layui/layui.js}"></script>
<script type="text/javascript" th:src="@{/assets/js/common.js}"></script>
<script th:inline="none">
    layui.use(['layer', 'form', 'table', 'util', 'admin'], function () {
        var $ = layui.jquery;
        var layer = layui.layer;
        var form = layui.form;
        var table = layui.table;
        var util = layui.util;
        var admin = layui.admin;
        // 渲染表格
        var insTb = table.render({
            elem: '#tableUser',
            url: '/task/jobLog/list',
            request: {     
                pageName: 'pageNum' //页码的参数名称，默认：page
               ,limitName: 'pageSize' //每页数据量的参数名，默认：limit
            },
            page: true,
            method:'post',
            toolbar: true,
            cellMinWidth: 100,
            cols: [[
            	{
		            field: 'jobLogId',
		            title: '日志序号'
		        },
                {field: 'jobName', sort: true, title: '任务名称',maxWidth: 30},
                {field: 'jobGroup', sort: true, title: '任务分组'},
                {field: 'invokeTarget', sort: true, title: '调用目标字符串',minWidth: 200},
                {field: 'jobMessage', sort: true, title: '日志信息',minWidth: 300},
                {field: 'status', sort: true,templet: function (d) {
                    var strs = [
                        '<span class="text-success">正常</span>',
                        '<span class="text-danger">锁定</span>'
                    ];
                    return strs[d.status];},
                    title: '任务状态'},
                {field: 'exceptionInfo', sort: true, title: '异常信息'},
                {
		            field: 'createTime',
		            title: '开始时间',
		            sort: true
		        }
            ]]
        });
        
        // 清空
        $('#btnAddJob').click(function () {
        	layer.confirm('确定要清空所有日志吗？', {
                skin: 'layui-layer-admin',
                shade: .1
            }, function (i) {
                layer.close(i);
                layer.load(2);
                $.post('/task/jobLog/clean', function (res) {
                    layer.closeAll('loading');
                    if (res.code == 200) {
                        layer.msg(res.msg, {icon: 1});
                        insTb.reload({}, 'data');
                    } else {
                        layer.msg(res.msg, {icon: 2});
                    }
                }, 'json');
            });
        });

        // 搜索
        form.on('submit(formSubSearchJob)', function (data) {
            insTb.reload({where: data.field}, 'data');
        });

    });
</script>
</body>
</html>
