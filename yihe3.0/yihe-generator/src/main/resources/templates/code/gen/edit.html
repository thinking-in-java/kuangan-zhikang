<!DOCTYPE html>
<html  lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>修改生成配置</title>
    <link rel="stylesheet" th:href="@{/assets/libs/layui/css/layui.css}"/>
    <link rel="stylesheet" th:href="@{/assets/module/admin.css}"/>
    
    <style>
        .layui-form-item {
            margin-bottom: 0;
            margin-top: 20px;
        }
        .layui-form-item .layui-inline {
            margin-bottom: 25px;
            margin-right: 0;
        }
        .layui-input, .layui-textarea {
            width: 70%;
        }
        
        .layui-form-label {
          width: 100px;
        }
        .form-group-bottom {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: #fff;
            padding: 10px 20px;
            box-shadow: 0 -1px 2px 0 rgba(0, 0, 0, .05);
        }
        /* 防止下拉框的下拉列表被隐藏---必须设置--- */        
    .layui-table-cell {            overflow: visible !important;        } 
    /* 使得下拉框与单元格刚好合适 */       
    td .layui-form-select{
        margin-top: -10px;
        margin-left: -15px;
        margin-right: -15px;
    }
    /*解决下拉框被表格覆盖样式问题*/
    .layui-form-select dl {
        z-index: 9999;
    }
    .layui-table-box {
        overflow: visible
    }
    .layui-table-body{
        overflow:visible;
    }
    </style>
</head>
<body>
<!-- 加载动画 -->
<div class="page-loading">
    <div class="ball-loader">
        <span></span><span></span><span></span><span></span>
    </div>
</div>
<!-- 正文开始 -->
<form class="layui-form" id="form-gen-edit">
    <div class="layui-fluid" style="padding-bottom: 75px;">
        <div class="layui-card">
            <div class="layui-card-header">基本信息</div>
            <div class="layui-card-body">
                <input name="tableId" id="tbId" type="hidden" th:field="${table.tableId}" />
                <div class="layui-form-item layui-row">
                    <div class="layui-inline layui-col-md4">
                        <label class="layui-form-label layui-form-required">表名称:</label>
                        <div class="layui-input-block">
                            <input name="tableName" type="text" placeholder="请输入表名称" class="layui-input"
                                  th:field="${table.tableName}"  lay-verType="tips" lay-verify="required" required/>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4">
                        <label class="layui-form-label layui-form-required">表描述:</label>
                        <div class="layui-input-block">
                            <input name="tableComment" type="text" placeholder="请输入表描述" class="layui-input"
                                  th:field="${table.tableComment}" lay-verType="tips" lay-verify="required" required/>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4">
                        <label class="layui-form-label layui-form-required">类名称:</label>
                        <div class="layui-input-block">
                        <input name="className" type="text" placeholder="请输入类名称" class="layui-input"
                                 th:field="${table.className}"  lay-verType="tips" lay-verify="required" required/>
                        </div>
                    </div>
                     <div class="layui-inline layui-col-md4">
                        <label class="layui-form-label layui-form-required">作者称:</label>
                        <div class="layui-input-block">
                        <input name="functionAuthor" type="text" placeholder="请输入作者" class="layui-input"
                                 th:field="${table.functionAuthor}"  lay-verType="tips" lay-verify="required" required/>
                        </div>
                    </div>
                    
                     <div class="layui-inline layui-col-md4">
                        <label class="layui-form-label">备&nbsp;&nbsp;注:</label>
                        <div class="layui-input-block">
                        <textarea name="remark" placeholder="请输入备注" class="layui-textarea"
                                th:field="${table.remark}"   ></textarea>
                                </div>
                    </div>
                </div>

            </div>
        </div>

        <div class="layui-card">
            <div class="layui-card-header">生成信息</div>
            <div class="layui-card-body">

                <div class="layui-form-item layui-row">
                    <div class="layui-inline layui-col-md4">
                        <label class="layui-form-label layui-form-required">生成模块名:</label>
                        <div class="layui-input-block">
                            <input name="moduleName" type="text" placeholder="请输入生成模块名" class="layui-input"
                                   th:field="${table.moduleName}" lay-verType="tips" lay-verify="required" required/>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4">
                        <label class="layui-form-label layui-form-required">生成包路径:</label>
                        <div class="layui-input-block">
                            <input name="packageName" type="text" placeholder="请输入生成包路径" class="layui-input"
                                   th:field="${table.packageName}"  lay-verType="tips" lay-verify="required" required/>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4">
                        <label class="layui-form-label layui-form-required">生成业务名:</label>
                        <div class="layui-input-block">
                            <input name="businessName" type="text" placeholder="请输入生成业务名" class="layui-input"
                                   th:field="${table.businessName}" lay-verType="tips" lay-verify="required" required/>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4">
                        <label class="layui-form-label layui-form-required">生成功能名:</label>
                        <div class="layui-input-block">
                            <input name="functionName" type="text" placeholder="请输入生成功能名" class="layui-input"
                                   th:field="${table.functionName}" lay-verType="tips" lay-verify="required" required/>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="layui-card">
            <div class="layui-card-header">字段信息</div>
            <div class="layui-card-body">
                <table id="tableFormAdv" lay-filter="tableFormAdv"></table>
            </div>
        </div>
    </div>
    <div class="form-group-bottom text-right">
        <button type="reset" class="layui-btn layui-btn-primary">&emsp;重置&emsp;</button>
        <button class="layui-btn" lay-filter="formSubmitAdv" lay-submit>&emsp;提交&emsp;</button>
    </div>
</form>
<!-- java类型 -->

<!-- java类型 -->
<script id="javaTypeTpl" type="text/html">
 <div class="layui-inline">
 <div class="layui-input-inline">
           <select name="columns[{{d.LAY_INDEX-1}}].javaType">
               <option value="Long" {{ d.javaType==="Long"? 'selected':""}}>Long</option>
               <option value="String" {{ d.javaType==="String"? 'selected':""}}>String</option>
               <option value="Integer" {{ d.javaType==="Integer"? 'selected':""}}>Integer</option>
               <option value="Double" {{ d.javaType==="Double"? 'selected':""}}>Double</option>
               <option value="BigDecimal" {{ d.javaType==="BigDecimal"? 'selected':""}}>BigDecimal</option>
               <option value="Date" {{ d.javaType==="Date"? 'selected':""}}>Date</option>
           </select>
  </div>
</div>
</script>

<!-- 查询方式 -->
<script id="queryTypeTpl" type="text/html">
 <div class="layui-inline">
<div class="layui-input-inline">
           <select name="columns[{{d.LAY_INDEX-1}}].queryType">
               <option value="EQ" {{ d.queryType==="EQ"? 'selected':""}}>=</option>
               <option value="NE" {{ d.queryType==="NE"? 'selected':""}}>!=</option>
               <option value="GT" {{ d.queryType==="GT"? 'selected':""}}>></option>
               <option value="GTE" {{ d.queryType==="GTE"? 'selected':""}}>>=</option>
               <option value="LT" {{ d.queryType==="LT"? 'selected':""}}><</option>
               <option value="LTE" {{ d.queryType==="LTE"? 'selected':""}}><=</option>
               <option value="LIKE" {{ d.queryType==="LIKE"? 'selected':""}}>Like</option>
               <option value="BETWEEN" {{ d.queryType==="BETWEEN"? 'selected':""}}>Between</option>
           </select>
  </div>
</div>
</script>

<!-- 显示类型 -->
<script id="htmlTypeTpl" type="text/html">
 <div class="layui-inline">
<div class="layui-input-inline">
           <select name="columns[{{d.LAY_INDEX-1}}].htmlType">
                <option value="input" {{ d.htmlType=="input"? 'selected':""}}>文本框</option>
                <option value="textarea" {{ d.htmlType==="textarea"? 'selected':"" }}>文本域</option>
                <option value="select" {{ d.htmlType==="select"? 'selected':""}}>下拉框</option>
                <option value="radio" {{ d.htmlType==="radio"? 'selected':""}}>单选框</option>
                <option value="checkbox" {{ d.htmlType==="checkbox"? 'selected':""}}>复选框</option>
                <option value="datetime" {{ d.htmlType==="datetime"? 'selected':""}}>日期控件</option>
           </select>
  </div>
</div>
</script>

<!-- js部分 -->
<script type="text/javascript" th:src="@{/assets/libs/layui/layui.js}"></script>
<script type="text/javascript" th:src="@{/assets/js/common.js}"></script>

<script th:inline="none">
    layui.use(['layer', 'form', 'table', 'util', 'laydate'], function () {
        var $ = layui.jquery;
        var layer = layui.layer;
        var form = layui.form;
        var table = layui.table;
        var util = layui.util;
        var laydate = layui.laydate;
        // 渲染表格
        table.render({
            elem: '#tableFormAdv',
            url: '/code/gen/column/list',
            page: true,
            where: { tableId: $("#tbId").val()}, 
            cellMinWidth: 100,
            cols: [[
            {
                title: "序号",
                width: "5%",
                hide:true,
                templet: function (d) {
                    // 编号隐藏域
                    var index = d.LAY_INDEX-1;
	            	var columnIdHtml = "<input type='hidden' name='columns["+index+"].columnId' value='"+d.columnId+"'>";
	            	// 排序隐藏域
	            	var sortHtml = "<input type='hidden' name='columns["+index+"].sort' value='1' id='columns_sort_"+index+"'>";
	            	return columnIdHtml + sortHtml;
                }
            },
	        {
	            field: 'columnName',
	            title: '字段列名',
	            width: "10%"
	            
	        },
	        {
	            field: 'columnComment',
	            title: '字段描述',
	            width: "15%",
	            templet: function (d) {
	            	var index = d.LAY_INDEX-1;
	            	var html = "<input  type='text' class='layui-input' name='columns["+index+"].columnComment' value='"+d.columnComment+"'>";
	        		return html;
	        	} 
	        },
	        {
	            field: 'columnType',
	            title: '物理类型',
	            width: "10%"
	            
	        },
	        {
	            field: 'javaType',
	            title: 'Java类型',
	            width: "10%",
	            templet:"#javaTypeTpl"
	        },
	        {
	            field: 'javaField',
	            title: 'Java属性',
	            width: "15%",
	            templet: function (d) {
	            	var index = d.LAY_INDEX-1;
	        		var html = "<input  type='text' class='layui-input' name='columns["+index+"].javaField' value='"+d.javaField+"' required>";
	        		return html;
	        	}
	        },
	        {
	            field: 'isInsert',
	            title: '插入',
	            width: "5%",
	            templet: function (d) {
	            	var isCheck = d.isInsert == 1 ? 'checked' : '';
	            	var index = d.LAY_INDEX-1;
	            	var html ="<input type='checkbox' lay-skin='primary' name='columns["+index+"].isInsert' value='1' "+isCheck+"/>"
                    return html
	            }
	        },
	        {
	            field: 'isEdit',
	            title: '编辑',
	            width: "5%",
	            templet: function (d) {
	            	var isCheck = d.isEdit == 1 ? 'checked' : '';
	            	var index = d.LAY_INDEX-1;
	            	var html = "<input type='checkbox' lay-skin='primary' name='columns["+index+"].isEdit' value='1' "+isCheck+"/>"
                    return html
	            }
	        },
	        {
	            field: 'isList',
	            title: '列表',
	            width: "5%",
	            templet: function (d) {
	            	var isCheck = d.isList == 1 ? 'checked' : '';
	            	var index = d.LAY_INDEX-1;
	            	var html = "<input type='checkbox' lay-skin='primary' name='columns["+index+"].isList' value='1' "+isCheck+"/>"
                    return html
	            }
	        },
	        {
	            field: 'isQuery',
	            title: '查询',
	            width: "5%",
	            templet: function (d) {
	            	var isCheck = d.isQuery == 1 ? 'checked' : '';
	            	var index = d.LAY_INDEX-1;
	            	var html = "<input type='checkbox' lay-skin='primary' name='columns["+index+"].isQuery' value='1' "+isCheck+"/>"
                    return html
	            }
	        },
	        {
	            field: 'queryType',
	            title: '查询方式',
	            width: "10%",
	            templet:"#queryTypeTpl"
	         
	        },
	        {
	            field: 'htmlType',
	            title: '显示类型',
	            width: "10%",
	            templet:"#htmlTypeTpl"
	        
	        }]]
        });
        // 监听表单提交
        form.on('submit(formSubmitAdv)', function (data) {
            //$("#form-gen-edit").serializeArray()
              $.post("/code/gen/edit", $("#form-gen-edit").serializeArray(), function (res) {
                layer.closeAll('loading');
                if (res.code == 200) {
                    layer.msg(res.msg, {icon: 1});
                } else {
                    layer.msg(res.msg, {icon: 2});
                }
            }, 'json');  
            return false; 
        });

    });
</script>
</body>

</html>
