        function workerQuery(query) {
            var safe = new URLSearchParams();
            if (query && ['demo', 'real'].indexOf(query.get('source')) !== -1 && /^[1-9]\d{0,9}$/.test(query.get('alert') || '')) {
                safe.set('source', query.get('source'));
                safe.set('alert', query.get('alert'));
            }
            if (query && /^(archive|assess|follow|plan|care)$/.test(query.get('worker') || '')) {
                safe.set('worker', query.get('worker'));
            }
            if (query && /^[0-9a-f-]{36}$/.test(query.get('task') || '')) safe.set('task', query.get('task'));
            if (query && query.get('hub') === '1') {
                safe.set('hub', '1');
                var hubRules = {status: /^(all|active|finished|queued|in_progress|pending_review|completed|failed|cancelled|unknown)$/, source: /^(assignment|ocr|alert)$/, priority: /^(normal|high|urgent)$/, type: /^[a-z_]{1,40}$/, sort: /^(updated|created|priority)$/, page: /^[1-9]\d{0,4}$/};
                Object.keys(hubRules).forEach(function (key) { if (hubRules[key].test(query.get(key) || '')) safe.set(key, query.get(key)); });
                if (query.get('search') && query.get('search').length <= 100) safe.set('search', query.get('search'));
            }
            return safe;
        }

        // 对图片进行压缩
        function compress(file) {
            let fileObj = file //上传文件的对象
            let reader = new FileReader()
            reader.readAsDataURL(fileObj)
            reader.onload = function (e) {
                let image = new Image() //新建一个img标签（还没嵌入DOM节点)
                image.src = e.target.result
                image.onload = function () {
                    let canvas = document.createElement('canvas'),
                        context = canvas.getContext('2d'),
                        imageWidth = image.width / 2,    //压缩后图片的大小
                        imageHeight = image.height / 2,
                        data = ''
                    canvas.width = imageWidth
                    canvas.height = imageHeight

                    context.drawImage(image, 0, 0, imageWidth, imageHeight)
                    data = canvas.toDataURL('image/jpeg')
                    //压缩完成
                    document.getElementById('postCode').src = data
                    document.getElementById('tximg').src = data
                    console.log("压缩完成 ");
                }
            }
        }
