        // 对图片进行压缩
        function compress(file) {
            let fileObj = file //上传文件的对象
            let reader = new FileReader()
            reader.readAsDataURL(fileObj)
            reader.onload = function (e) {
                let image = new Image() //新建一个img标签（还没嵌入DOM节点)
                image.src = e.target.result
                image.onload = function () {
                    let canvas = document.createElement('canvas'),
                        context = canvas.getContext('2d'),
                        imageWidth = image.width / 2,    //压缩后图片的大小
                        imageHeight = image.height / 2,
                        data = ''
                    canvas.width = imageWidth
                    canvas.height = imageHeight

                    context.drawImage(image, 0, 0, imageWidth, imageHeight)
                    data = canvas.toDataURL('image/jpeg')
                    //压缩完成
                    document.getElementById('postCode').src = data
                    document.getElementById('tximg').src = data
                    console.log("压缩完成 ");
                }
            }
        }

        var loading;
        // 选择头像
        //普通图片上传
        upload.render({
            elem: '#imgHead'
            , url: '/Uploading/addEnrollImg' //改成您自己的上传接口
            , accept: 'images' //只允许传图片
            , choose: function (obj) {
                var files = this.files = obj.pushFile();  //将每次选择的文件追加到文件队列
                console.log(files);
                //读取本地文件
                obj.preview(function (index, file, result) {
                    //console.log(file.Name);
                    compress(file);
                });
            }, before: function () {
                loading = layer.msg('上传中', {icon: 16, shade: 0.1, time: 0});
            }, done: function (res, index, upload) {
                console.log(index);
                console.log("上传成功", res.files);
                $("#postCode").attr('src', res.files);
                $("#tximg").attr('src', res.files);
                //删除数组文件中上传成功的图片，防止重复上传（重点）
                delete this.files[index]
                layer.close(loading);
                //如果上传失败
                if (res.code > 0) {
                    return layer.msg('上传失败');
                }
                //上传成功
            }, error: function (index, upload) {
                layer.msg("上传失败，请重新选择图片！");
            }
        });

        //监听提交
        form.on('submit(henderSubmit)', function (dataYh) {
            var postCode = $("#postCode").attr('src');
            console.log("头像地址", postCode)
            var userCode = $("#usercode").val();
            dataYh.field.postCode = postCode;
            dataYh.field.userCode = userCode;
            $.ajax({
                type: 'post',
                url: '/YhUserReginfo/updateUserHeader',
                data: dataYh.field,
                success: function (data) {
                    console.log(data)
                    if (data == 1) {
                        layer.msg('操作成功');
                        selectHender();
                        setTimeout(function () {
                            layer.closeAll();
                        }, 2000);
                    } else {
                        layer.msg('操作失败');
                    }
                }
            });
            return false;
        });
    });
</script>
</body>
</html>
