<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">

    <link th:href="${topimg}" rel="icon">
    <title>谷宜健康管理平台</title>
    <link rel="stylesheet" th:href="@{/assets/libs/layui/css/layui.css}"/>
    <link rel="stylesheet" th:href="@{/assets/module/admin.css}"/>
    <!--[if lt IE 9]>
    <script src="https://oss.maxcdn.com/html5shiv/3.7.3/html5shiv.min.js"></script>
    <script src="https://oss.maxcdn.com/respond/1.4.2/respond.min.js"></script>

    <![endif]-->
    <style type="text/css">
        .user-info-head {
            width: 110px;
            height: 110px;
            position: relative;
            display: inline-block;
            border-radius: 50%;
            border: 2px solid #eee;
        }

        .user-info-head:hover:after {
            content: '\e624';
            position: absolute;
            left: 0;
            right: 0;
            top: 0;
            bottom: 0;
            color: #eee;
            background: rgba(0, 0, 0, 0.5);
            font-family: layui-icon;
            font-size: 28px;
            font-style: normal;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            cursor: pointer;
            line-height: 110px;
            border-radius: 50%;
        }

        .user-info-head img {
            width: 110px;
            height: 110px;
            border-radius: 50%;
        }

        .info-list-item {
            position: relative;
            padding-bottom: 8px;
        }

        .info-list-item > .layui-icon {
            position: absolute;
        }

        .info-list-item > p {
            padding-left: 30px;
        }

        .dash {
            border-bottom: 1px dashed #ccc;
            margin: 15px 0;
        }

        .bd-list-item {
            padding: 14px 0;
            border-bottom: 1px solid #e8e8e8;
            position: relative;
        }

        .bd-list-item .bd-list-item-img {
            width: 48px;
            height: 48px;
            line-height: 48px;
            margin-right: 12px;
            display: inline-block;
            vertical-align: middle;
        }

        .bd-list-item .bd-list-item-content {
            display: inline-block;
            vertical-align: middle;
        }

        .bd-list-item .bd-list-item-lable {
            margin-bottom: 4px;
            color: #333;
        }

        .bd-list-item .bd-list-item-oper {
            position: absolute;
            right: 0;
            top: 50%;
            text-decoration: none !important;
            cursor: pointer;
            transform: translateY(-50%);
        }

        .user-info-form .layui-form-item {
            margin-bottom: 25px;
        }

    </style>
</head>
<body class="layui-layout-body">
<input id="change" type="hidden" th:value="${yhuserrole[0].roletype}">
<input id="usercode" type="hidden" th:value="${yh.userCode}">
<input id="isuri" type="hidden" th:value="${isuri}">
<div class="layui-layout layui-layout-admin">
    <!-- 头部 -->
    <div class="layui-header">
        <div class="layui-logo">
            <img th:src="${leftimg}"/>
        </div>
        <ul class="layui-nav layui-layout-left">
            <li class="layui-nav-item" lay-unselect>
                <a ew-event="flexible" title="侧边伸缩"><i class="layui-icon layui-icon-shrink-right"></i></a>
            </li>
            <li class="layui-nav-item" lay-unselect>
                <a ew-event="refresh" title="刷新"><i class="layui-icon layui-icon-refresh-3"></i></a>
            </li>
        </ul>
        <ul class="layui-nav layui-layout-right">
            <li class="layui-nav-item" lay-unselect>
                <a ew-event="message" title="消息" th:if="${yh.userType eq 4}">
                    <i class="layui-icon layui-icon-notice"></i>
                    <span id="notis" class="layui-badge-dot"></span>
                </a>
            </li>
            <li class="layui-nav-item" lay-unselect>
                <a ew-event="note" title="便签"><i class="layui-icon layui-icon-note"></i></a>
            </li>
            <li class="layui-nav-item layui-hide-xs" lay-unselect>
                <a ew-event="fullScreen" title="全屏"><i class="layui-icon layui-icon-screen-full"></i></a>
            </li>
            <li class="layui-nav-item layui-hide-xs" lay-unselect>
                <a ew-event="lockScreen" title="锁屏"><i class="layui-icon layui-icon-password"></i></a>
            </li>
            <li class="layui-nav-item" lay-unselect>
                <a>
                    <img id="postCode" src="" class="layui-nav-img">
                    <cite id="ysname"></cite>
                </a>
                <dl class="layui-nav-child">
                    <dd lay-unselect><a ew-href="/manage/personage/centre">个人中心</a></dd>
                    <dd lay-unselect id="uploadhead"><a>更换头像</a></dd>
                    <dd lay-unselect><a ew-href="/manage/update/pwd">修改密码</a></dd>
                    <dd lay-unselect><a ew-event="logout" data-url="/logout">退出</a></dd>
                </dl>
            </li>
            <li class="layui-nav-item" lay-unselect>
                <a ew-event="theme" title="主题"><i class="layui-icon layui-icon-more-vertical"></i></a>
            </li>
        </ul>
    </div>
    <!-- 侧边栏 -->
    <div class="layui-side">
        <div class="layui-side-scroll">
            <ul class="layui-nav layui-nav-tree arrow2" lay-filter="admin-side-nav" lay-shrink="all">
                <span th:each="item:${upmsPermissions}">
                    <li class="layui-nav-item layui-nav-itemed" th:if="${item.type eq 1 && item.permissionValue eq 'cmd:single:signon'}">
                        <a th:id="${item.permissionId}" onclick="signonClick()">
                            <i class="layui-icon " th:classappend='${item.icon} '></i>&emsp;
                            <cite><span th:text="${item.name}"/></cite>
                        </a>
                    </li>
                    <li class="layui-nav-item layui-nav-itemed" th:if="${item.type eq 1 && item.permissionValue ne 'cmd:single:signon'}">
                        <input class="zijidian" type="hidden" th:id="${item.uri}"/>
                        <a th:id="${item.permissionId}" lay-href="${item.uri}">
                            <i class="layui-icon " th:classappend='${item.icon} '></i>&emsp;
                            <cite><span th:text="${item.name}"/></cite>
                        </a>
                    </li>
                </span>
            </ul>
        </div>
    </div>
    <!-- 主体部分 -->
    <div class="layui-body"></div>
    <!-- 底部 -->
    <div class="layui-footer layui-text">
        copyright © 2020 [[${name}]] all rights reserved.
        <span class="pull-right">Version 3.0.0</span>
    </div>
</div>

<form class="layui-form" id="addfolder" lay-filter="folderForm" style="display: none;">
    <div class="text-center layui-text" style="margin-top: 7px;">
        <div class="user-info-head" id="imgHead">
            <img id="tximg" src="">
        </div>
    </div>

    <div class="layui-form-item" style="margin-top: 26px;margin-left: -20px;">
        <div class="layui-input-block">
            <button style="width: 100px; margin-left: 14px;" id="hhh" class="layui-btn layui-btn-normal"
                    lay-submit='' lay-filter="henderSubmit" type="button">保存
            </button>
            <button style="width: 100px;" type="button" id="cancel" class="layui-btn layui-btn-primary">取消</button>
        </div>
    </div>
</form>
<!-- 加载动画 -->
<div class="page-loading">
    <div class="ball-loader">
        <span></span><span></span><span></span><span></span>
    </div>
</div>

<!-- js部分 -->
<script type="text/javascript" th:src="@{/assets/libs/layui/layui.js}"></script>
<script type="text/javascript" th:src="@{/assets/js/common.js}"></script>
<script th:src="@{/assets/js/socket.io.min.js}"></script>
<script type="text/javascript" th:src="@{/assets/js/GoEasyDemo-IM-Chat/goeasy-im-1.4.0.js}"></script>
<script th:inline="javascript">
    var ctx = [[@{/}]];
    var userCode = [[${yh.userCode}]];

    layui.use(['index', 'admin', 'notice', 'upload', 'admin', 'form'], function () {
        var index = layui.index;
        var upload = layui.upload;
        var notice = layui.notice;
        var $ = layui.jquery;
        var admin = layui.admin;
        var form = layui.form;

        signonClick = function(){
            $.ajax({
                type: 'get',
                url: '/YhUserReginfo/signonClick',
                success: function (res) {
                    console.log("signonClick", res)
                    if(res.code == 20000){
                        window.open(res.data, "_blank");
                    }else{
                        notice.info({
                            title: '消息通知',
                            message: res.message
                        });
                    }
                }
            });
        }

        //连接GoEasy 2020-12-18
        loginGoeasy();

        function loginGoeasy() {
            var options = {
                host: "hangzhou.goeasy.io", //应用所在的区域地址: [hangzhou.goeasy.io, 新加坡暂不支持IM，敬请期待]
                appkey: "BC-263ee595e9cf42d1a74c8ef3148a91c5"
            };
            //初始化
            var im = GoEasyIM.getInstance(options);
            //登录聊天功能
            var usercode = [[${doctor}]];
            var globalName = [[${globalName}]];
            var goeasyUsercode = globalName + usercode;
            console.log("usercode", usercode)
            var user = {
                id: goeasyUsercode
            }
            //连接GoEasy
            var promise = im.connect(user);
            promise.then(function () {
                console.log("Connection successful.");
            }).catch(function (error) {
                console.log("Failed to connect GoEasy, code:" + error.code + ",error:" + error.content);
            });
            var onPrivateMessageReceived = function (message) {
                if (message.senderId != globalName + usercode) {
                    console.log("接收message1111", message)
                    var promise = im.markPrivateMessageAsRead(message.senderId);
                    promise.then(function (result) {
                    }).catch(function (error) {
                        console.log("Failed to mark as read, code:" + error.code + " content:" + error.content);
                    });
                    sendServiceInfo(usercode);
                }
            };
            //监听和接收单聊消息
            im.on(GoEasyIM.EVENT.PRIVATE_MESSAGE_RECEIVED, onPrivateMessageReceived);
        }

        $.ajax({
            type: 'get',
            url: '/YhUserReginfo/loginMessage',
            success: function (data) {
                console.log("查询", data.name)
                $("#ysname").html(data.name);
            }
        });

        //服务任务消息提醒
        function sendServiceInfo(usercode) {
            $.ajax({
                type: 'get',
                url: '/messge/send',
                data: {loginUserNum: usercode, content: "您收到了一条新的健康咨询"},
                success: function (data) {
                }

            });
        }

        var socket;
        connect();
        selectHender();
        var change = $("#change").val();
        console.log(change,"change");
        var time = $(".zijidian");
        for (var i = 0; i < time.length; i++) {
            var jeidian = $(".zijidian")[i].parentNode.childNodes[3].id;
            $("#" + jeidian).attr("lay-href", $(".zijidian")[i].id)
        }
        // 默认加载主页
        if ("2" == change) {
            console.log($("#isuri").val())
            index.loadHome({
                menuPath: $("#isuri").val(),
                menuName: '<i class="layui-icon layui-icon-home"></i>'
            });
        } else if ("1" == change || "超级管理员" == change || "二级机构" == change) {
            index.loadHome({
                menuPath: $("#isuri").val(),
                menuName: '<i class="layui-icon layui-icon-home"></i>'
            });
        } else {
            index.loadHome({
                menuPath: '/job/task',
                menuName: '<i class="layui-icon layui-icon-home"></i>'
            });
        }
        var str = null

        function connect() {
            var loginUserNum = $("#usercode").val();
            console.log(loginUserNum);
            var opts = {
                query: 'loginUserNum=' + loginUserNum
            };
            var domain = document.domain;
            socket = io.connect(domain + ':9099', opts);
            socket.on('connect', function () {
                console.log("连接成功");
            });
            socket.on('push_event', function (data) {
                console.log(data);
                if (JSON.stringify(data) != str) {
                    notice.info({
                        title: '消息通知',
                        message: data.content
                    });
                }
                str = JSON.stringify(data)
                setTimeout(() => {
                    str = null
                }, 500)
            });
            socket.on('disconnect', function () {
            });
        }

        function selectHender() {
            var userCode = $("#usercode").val();
            $.ajax({
                type: 'get',
                url: '/YhUserReginfo/loginMessage',
                data: {userCode: userCode},
                success: function (data) {
                    console.log(data)
                    if (data.postCode == null || data.postCode == "") {
                        if (data.userType == 4) {
                            $("#postCode").attr('src', 'http://xcxqny.yhy.ren/xiaochengxu/toxiangnan.png');
                            $("#tximg").attr('src', 'http://xcxqny.yhy.ren/xiaochengxu/toxiangnan.png');
                        }
                        if (data.userType == 1) {
                            $("#postCode").attr('src', 'http://xcxqny.yhy.ren/webtoxiang/jigou.png');
                            $("#tximg").attr('src', 'http://xcxqny.yhy.ren/webtoxiang/jigou.png');
                        }
                    }
                    if (data.postCode != null && data.postCode != "") {
                        $("#postCode").attr('src', data.postCode);
                        $("#tximg").attr('src', data.postCode);
                    }
                }
            });
        }

        $("#uploadhead").on('click', function () {
            layer.open({
                //title:['更换头像','text-align: center;'],
                title: '更换头像',
                type: 1,
                skin: 'layui-layer-rim', //加上边框
                area: ['420px', '240px'], //宽高
                content: $("#addfolder"),
            });
        })
        //取消
        $("#cancel").on('click', function () {
            selectHender();
            layer.closeAll();
        })

        changenotice();

        function changenotice() {
            $.ajax({
                type: "POST",
                url: "/yhmanagetaskcontroller/selectunread",
                dataType: "json",
                data: '',
                success: function (res) {
                    if (res.data.length != 0) {

                    } else {
                        $("#notis").removeClass("layui-badge-dot")

                    }
                }
            });
        }

        // 对图片进行压缩
        function compress(file) {
            let fileObj = file //上传文件的对象
            let reader = new FileReader()
            reader.readAsDataURL(fileObj)
            reader.onload = function (e) {
                let image = new Image() //新建一个img标签（还没嵌入DOM节点)
                image.src = e.target.result
                image.onload = function () {
                    let canvas = document.createElement('canvas'),
                        context = canvas.getContext('2d'),
                        imageWidth = image.width / 2,    //压缩后图片的大小
                        imageHeight = image.height / 2,
                        data = ''
                    canvas.width = imageWidth
                    canvas.height = imageHeight

                    context.drawImage(image, 0, 0, imageWidth, imageHeight)
                    data = canvas.toDataURL('image/jpeg')
                    //压缩完成
                    document.getElementById('postCode').src = data
                    document.getElementById('tximg').src = data
                    console.log("压缩完成 ");
                }
            }
        }

        var loading;
        // 选择头像
        //普通图片上传
        upload.render({
            elem: '#imgHead'
            , url: '/Uploading/addEnrollImg' //改成您自己的上传接口
            , accept: 'images' //只允许传图片
            , choose: function (obj) {
                var files = this.files = obj.pushFile();  //将每次选择的文件追加到文件队列
                console.log(files);
                //读取本地文件
                obj.preview(function (index, file, result) {
                    //console.log(file.Name);
                    compress(file);
                });
            }, before: function () {
                loading = layer.msg('上传中', {icon: 16, shade: 0.1, time: 0});
            }, done: function (res, index, upload) {
                console.log(index);
                console.log("上传成功", res.files);
                $("#postCode").attr('src', res.files);
                $("#tximg").attr('src', res.files);
                //删除数组文件中上传成功的图片，防止重复上传（重点）
                delete this.files[index]
                layer.close(loading);
                //如果上传失败
                if (res.code > 0) {
                    return layer.msg('上传失败');
                }
                //上传成功
            }, error: function (index, upload) {
                layer.msg("上传失败，请重新选择图片！");
            }
        });

        //监听提交
        form.on('submit(henderSubmit)', function (dataYh) {
            var postCode = $("#postCode").attr('src');
            console.log("头像地址", postCode)
            var userCode = $("#usercode").val();
            dataYh.field.postCode = postCode;
            dataYh.field.userCode = userCode;
            $.ajax({
                type: 'post',
                url: '/YhUserReginfo/updateUserHeader',
                data: dataYh.field,
                success: function (data) {
                    console.log(data)
                    if (data == 1) {
                        layer.msg('操作成功');
                        selectHender();
                        setTimeout(function () {
                            layer.closeAll();
                        }, 2000);
                    } else {
                        layer.msg('操作失败');
                    }
                }
            });
            return false;
        });
    });
</script>
</body>
</html>
