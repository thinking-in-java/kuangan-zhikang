<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>记事

    </title>
    <link rel="stylesheet" th:href="@{/assets/js/layui-v2.9.16/layui/css/layui.css}"/>
    <script type="text/javascript" th:src="@{/assets/libs/layui/layui.js}"></script>
    <style>
        body{
            background:#F1F1F1
        }
        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
            border-color:rgb(144, 186, 221)
        }
        th, td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: rgb(231, 243, 252);
            font-size: 10pt;
            font-family: "Microsoft YaHei";
            word-break: break-word;
            overflow-wrap: break-word;
            text-align: center;
        }
        .section-title {
            text-align: center;
            font-weight: bold;
            background-color: #e6f7ff;
        }
        .input-full {
            width: 100%;
            box-sizing: border-box;
        }
        .radio-group {
            display: flex;
            align-items: center;
        }
        .radio-group label {
            margin-right: 10px;
        }
        .checkbox-group {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
        }
        .checkbox-group label {
            margin-right: 15px;
        }
        .heng{
            text-align: center;
            font-size: 10pt;
            font-family: "Microsoft YaHei";
            word-break: break-word;
            overflow-wrap: break-word;
        }
        .datainput{
            border-color: #eee !important;
            border-width: 1px;
        }

        .layui-form-checked[lay-skin=primary] i{
            border-color:#2d8cf0 !important;
            background-color:#FFF !important;
            color:#2d8cf0 !important;
            font-weight: bold;
        }

        .layui-form-checkbox[lay-skin=primary]:hover i{
            border-color:#2d8cf0 !important;
        }
        .layui-form-radio>i:hover, .layui-form-radioed>i{
            color: #2d8cf0 !important;
        }

        /* 覆盖 layui 的默认主题颜色 */
        .theme-colorful .layui-btn {
            height: 36px;
            line-height: 36px;
            border-radius: 4px;
            background-color: #2d8cf0;
            box-shadow: 0 1px 0 rgba(0, 0, 0, .03);
        }
        .layui-form-radio:hover>*, .layui-form-radioed, .layui-form-radioed>i{
            color: #2d8cf0 !important;
        }

        /*.layui-input {*/
        /*    border-color: #597FC0 !important;*/
        /*}*/

        /* ...其他元素样式 */
        /* 修改分页按钮的背景颜色和字体颜色 */
        .layui-laypage a {
            background-color: #f0f0f0; /* 设置按钮的背景颜色 */
            color: #333; /* 设置按钮的字体颜色 */
        }

        /* 鼠标悬停时按钮的背景颜色 */
        .layui-laypage a:hover {
            background-color: #fff;
            color: #2d8cf0;
        }

        /* 当前页的背景颜色和字体颜色 */
        .layui-laypage .layui-laypage-curr .layui-laypage-em {
            background-color: #2d8cf0; /* 当前页的背景颜色 */
            color: white; /* 当前页的字体颜色 */
        }

        .file-row {
            background-color: #e6f7ff;
            padding: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-radius: 5px;
            margin: 10px 0;
            width: 98%;
        }
        .file-row .file-info {
            display: flex;
            align-items: center;
        }
        .file-row .file-info img {
            width: 20px;
            margin-right: 10px;
        }
        .file-row .file-info span {
            font-size: 14px;
        }
        .file-row .actions {
            display: flex;
            align-items: center;
        }
        .file-row .actions button {
            border: none;
            background: none;
            cursor: pointer;
            margin-left: 10px;
            font-size: 16px;
        }



    </style>
</head>
<body>

<div class="layui-form " style="width:70%;margin:auto;padding:0 5%;background:#FFF;margin-top:0">
    <h2 style="text-align: center;">记事

    </h2>
    <input id="userCode" type="hidden" value="">
    <input id="regId" type="hidden" value="">




    <form class="layui-form" id="myForm" lay-filter="myForm">
        <button style="float: right" type="submit" class="layui-btn" lay-submit lay-filter="myFormSave">保存</button>
        <table>




            <tr >
                <th colspan="12">
<!--                    记事-->
                </th>
            </tr>

            <tr >
                <td colspan="12">

                    <table id="file-table3" border="1" width="100%">
                    </table>
                    <button type="button" class="layui-btn layui-btn-radius layui-btn-normal" id="test4">
                        <i class="layui-icon">&#xe67c;</i>上传文件
                    </button>
                </td>
            </tr>




        </table>
    </form>
</div>

<script type="text/javascript" th:src="@{/assets/js/common.js}"></script>
<script th:inline="javascript">
    layui.use(['form',"table",'treeSelect','notice','upload'], function(){
        var form = layui.form;
        var $ = layui.jquery;
        var layer = layui.layer;
        var table = layui.table;
        var notice=layui.notice;
        var upload = layui.upload;
        layui.config({
            skin: 'blue'  // 设置主题为蓝色
        });


        var params = new URLSearchParams(window.location.search);
        var paramValue = params.get('personalBasicInformation');

        form.on('submit(deleteRowBtn)', function(event){
            var row = event.elem.closest('tr');
            // 删除该行
            row.parentNode.removeChild(row);
            return false;
        });

        form.on('submit(preview)', function(data) {
            // 获取文件的 URL
            var url = data.elem.getAttribute('data-url');
            if(isPdfUrl(url) || isImageUrl(url)){
                window.open(url);
            }else{
                window.open("https://view.officeapps.live.com/op/view.aspx?src="+url, '_blank');
            }
            // 阻止表单默认提交行为
            return false;
        });

        form.on('submit(down)', function(data) {
            // 获取文件的 URL
            var url = data.elem.getAttribute('data-url');
            var name=data.elem.getAttribute("data-name");
            if(isPdfUrl(url) || isImageUrl(url)){
                fetchAndDownloadPDF(url,name);
            }else{
                window.open(url);
            }
            // 创建一个隐藏的 <a> 元素来触发下载


            // 阻止表单默认提交行为
            return false;
        });

        function isPdfUrl(url) {
            return /\.pdf$/i.test(url);
        }
        function isImageUrl(url) {
            return /\.(jpg|jpeg|png|gif|bmp|webp|svg)$/i.test(url);
        }
        let isDownloading = false;
        async function fetchAndDownloadPDF(url,name) {
            if (isDownloading) return;  // 如果正在下载，则不执行
            isDownloading = true;
            console.log('Function called');
            try {
                const response = await fetch(url);
                const blob = await response.blob();
                const blobUrl = window.URL.createObjectURL(blob);

                const a = document.createElement('a');
                a.href = blobUrl;
                a.download = name; // 设置下载文件的名称
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);

                // 释放 URL 对象
                window.URL.revokeObjectURL(blobUrl);
            } catch (error) {
                console.error('下载文件失败:', error);
            }finally {
                isDownloading = false;
            }
        }



        // 添加行功能
        upload.render({
            elem: '#test4'
            ,url: '/YhUserFile/upload1' //必填项
            ,size:104857600
            ,accept:'file'
            ,before: function () {
                layer.msg('上传中', {
                    icon: 16,
                    shade: 0.01
                }); //上传loading
            }
            ,done: function(res,index,upload){
                console.log("上传返回",res)
                filesUrl = res.files;
                //上传完毕回调
                layer.close(layer.index); //关闭loading
                if (parseInt(res.code) === 0) {
                    parent.layer.msg("上传成功！");
                }

                // 创建新的行元素
                var newRow = document.createElement('tr');
                var newCell = document.createElement('td');

                newCell.innerHTML = `
                    <div class="file-row">
                        <div class="file-info">
                            <span>${res.name}</span>
                        </div>
                        <div class="actions">
                              <input type="text"  style="display: none" class="input-full layui-input" name="v13"  value="${res.files}">
                              <input type="text"  style="display: none" class="input-full layui-input" name="v14"  value="${res.name}">
                               <button title="修改" class="edit-btn" style="border: none; background: none; cursor: pointer;">
                                                <i class="layui-icon layui-icon-edit"></i>
                               </button>
                                <button title="预览" lay-submit="" lay-filter="preview" data-url="${res.files}">&#128065;</button>
                              <button title="下载" lay-submit=""  lay-filter="down"  data-name="${res.name}"  data-url="${res.files}"  >&#8681;</button>
                              <button title="删除" lay-submit=""  lay-filter="deleteRowBtn"  >&#10006;</button>
                        </div>
                    </div>
                `;

                newRow.appendChild(newCell);
                newCell.querySelector('.edit-btn').onclick = function() {
                    event.preventDefault();
                    var currentName = res.name;
                    layer.prompt({
                        title: '修改文件名',
                        value: currentName,
                        formType: 0 // 输入框类型，0：单行文本
                    }, function(value, index) {
                        // 更新文件名逻辑
                        newCell.querySelector('.file-info span').innerText = value; // 更新显示的文件名
                        newCell.querySelector('input[name="v14"]').value = value; // 更新隐藏的文件名输入
                        layer.close(index); // 关闭输入框
                    });
                };
                document.getElementById('file-table3').appendChild(newRow);
            }


            ,error : function(index,upload){

            }
        });












        form.on('submit(myFormSave)', function(data){


            var v13Elements = document.querySelectorAll('input[name="v13"]');
            var v14Elements = document.querySelectorAll('input[name="v14"]');
            var pairs = [];
            var length = Math.min(v13Elements.length, v14Elements.length);
            for (var i = 0; i < length; i++) {
                // 获取 v13 和 v14 的值，并将它们存储成对的形式
                var v13Value = v13Elements[i].value;
                var v14Value = v14Elements[i].value;

                pairs.push({ v13: v13Value, v14: v14Value });
            }
            var field = data.field;

            if ($(this).data('submitted') === true) {
                return false; // 阻止重复提交
            }
            $(this).data('submitted', true);

            console.log(pairs);
            if(paramValue){
                $.ajax({
                    type : 'post',
                    url : '/NewEmployeePersonalInformationCardController/updateById',
                    data : {
                        id:paramValue,
                        notes:JSON.stringify(pairs),

                    },

                    success : function(data) {
                        if (data.code == 20000) {

                            notice.success({
                                title : '消息通知',
                                message : '操作成功!'
                            });

                            setTimeout(function() {
                                window.close();
                            }, 2000);
                        } else {
                            notice.error({
                                title : '消息通知',
                                message : '操作失败!'
                            });
                            setTimeout(function() {
                                window.close();
                            }, 2000);
                        }
                    }
                })
            }else{
            }
            return false; // 阻止默认 form 跳转
        });


        function selectForm(paramValue){
            if(paramValue){
                $.ajax({
                    type:'get',
                    url:'/NewEmployeePersonalInformationCardController/selectById',
                    data:{id:paramValue},
                    success : function(data){
                        console.log("这里是查询出来的数据",data);
                        if(data.code==20000){

                            const pairsArr = JSON.parse(data.data.notes);
                            var fileTable = document.getElementById('file-table3');

                            // 遍历数组
                            pairsArr.forEach(function(res) {
                                // 创建新的行元素
                                var newRow = document.createElement('tr');

                                // 创建新的单元格元素
                                var newCell = document.createElement('td');

                                // 设置单元格的 HTML 内容，包含文件名、隐藏的输入框、下载按钮和删除按钮
                                newCell.innerHTML = `
                                    <div class="file-row">
                                        <div class="file-info">
                                            <span>${res.v14}</span>
                                        </div>
                                        <div class="actions">
                                            <input type="text" style="display: none" class="input-full layui-input" name="v13" value="${res.v13}">
                                            <input type="text" style="display: none" class="input-full layui-input" name="v14" value="${res.v14}">
                                            <button title="修改" class="edit-btn" style="border: none; background: none; cursor: pointer;">
                                                <i class="layui-icon layui-icon-edit"></i>
                                            </button>
                                             <button title="预览" lay-submit="" lay-filter="preview" data-url="${res.v13}">&#128065;</button>
                                            <button title="下载" lay-submit=""  lay-filter="down"  data-name="${res.v14}"  data-url="${res.v13}"  >&#8681;</button>
                                           <button title="删除" lay-submit=""  lay-filter="deleteRowBtn"  >&#10006;</button>
                                        </div>
                                    </div>
                                `;

                                // 将单元格加入到行中
                                newRow.appendChild(newCell);
                                newCell.querySelector('.edit-btn').onclick = function() {
                                    event.preventDefault();
                                    var currentName = res.name;
                                    layer.prompt({
                                        title: '修改文件名',
                                        value: currentName,
                                        formType: 0 // 输入框类型，0：单行文本
                                    }, function(value, index) {
                                        // 更新文件名逻辑
                                        newCell.querySelector('.file-info span').innerText = value; // 更新显示的文件名
                                        newCell.querySelector('input[name="v14"]').value = value; // 更新隐藏的文件名输入
                                        layer.close(index); // 关闭输入框
                                    });
                                };

                                // 将新行插入到表格的最后一行
                                fileTable.appendChild(newRow);


                            });
                            $("#userCode").val(data.data.userCode);

                            form.render();
                        }

                    }
                })
            }


        }
        selectForm(paramValue);


        // 初始化表单
        form.render();
    });
</script>

</body>
</html>
