<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>劳动者个人信息卡
    </title>
    <link rel="stylesheet" th:href="@{/assets/js/layui-v2.9.16/layui/css/layui.css}"/>
    <script type="text/javascript" th:src="@{/assets/js/layui-v2.9.16/layui/layui.js}"></script>
    <style>
        body{
            background:#F1F1F1
        }
        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
            border-color:rgb(144, 186, 221)
        }
        th, td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: rgb(231, 243, 252);
            font-size: 10pt;
            font-family: "Microsoft YaHei";
            word-break: break-word;
            overflow-wrap: break-word;
            text-align: center;
        }
        .section-title {
            text-align: center;
            font-weight: bold;
            background-color: #e6f7ff;
        }
        .input-full {
            width: 100%;
            box-sizing: border-box;
        }
        .radio-group {
            display: flex;
            align-items: center;
        }
        .radio-group label {
            margin-right: 10px;
        }
        .checkbox-group {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
        }
        .checkbox-group label {
            margin-right: 15px;
        }
        .heng{
            text-align: center;
            font-size: 10pt;
            font-family: "Microsoft YaHei";
            word-break: break-word;
            overflow-wrap: break-word;
        }
        .datainput{
            border-color: #eee !important;
            border-width: 1px;
        }

        .layui-form-checked[lay-skin=primary] i{
            border-color:#2d8cf0 !important;
            background-color:#FFF !important;
            color:#2d8cf0 !important;
            font-weight: bold;
        }

        .layui-form-checkbox[lay-skin=primary]:hover i{
            border-color:#2d8cf0 !important;
        }
        .layui-form-radio>i:hover, .layui-form-radioed>i{
            color: #2d8cf0 !important;
        }

        /* 覆盖 layui 的默认主题颜色 */
        .theme-colorful .layui-btn {
            height: 36px;
            line-height: 36px;
            border-radius: 4px;
            background-color: #2d8cf0;
            box-shadow: 0 1px 0 rgba(0, 0, 0, .03);
        }
        .layui-form-radio:hover>*, .layui-form-radioed, .layui-form-radioed>i{
            color: #2d8cf0 !important;
        }

        /*.layui-input {*/
        /*    border-color: #597FC0 !important;*/
        /*}*/

        /* ...其他元素样式 */
        /* 修改分页按钮的背景颜色和字体颜色 */
        .layui-laypage a {
            background-color: #f0f0f0; /* 设置按钮的背景颜色 */
            color: #333; /* 设置按钮的字体颜色 */
        }

        /* 鼠标悬停时按钮的背景颜色 */
        .layui-laypage a:hover {
            background-color: #fff;
            color: #2d8cf0;
        }

        /* 当前页的背景颜色和字体颜色 */
        .layui-laypage .layui-laypage-curr .layui-laypage-em {
            background-color: #2d8cf0; /* 当前页的背景颜色 */
            color: white; /* 当前页的字体颜色 */
        }




        .upload-area {
            width: 100%;
            height: 220px;
            border: 2px dashed #ccc;
            display: flex;
            justify-content: center; /* 水平居中 */
            align-items: center; /* 垂直居中 */
            cursor: pointer;
            text-align: center;
            color: #999;
            font-size: 14px;
            position: relative;
        }

        .upload-area img {
            max-width: 100%;
            max-height: 100%;
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            margin: auto;
        }

        .upload-area:hover {
            border-color: #2d8cf0;
        }

        #uploadText {
            display: flex;
            justify-content: center; /* 水平居中 */
            align-items: center; /* 垂直居中 */
            width: 100%;
            height: 100%;
            color: #999;
            font-size: 14px;
            position: absolute;
            z-index: 1; /* 确保文字在前 */
        }
        @media print {
            .no-print {
                display: none !important;
            }
            @page {
                size: A4; /* 或者你可以指定其他页面大小 */
                margin: 1cm; /* 调整打印边距 */
            }
            body {
                width: 100%;
                height: 100%;
                zoom: 0.6; /* 缩小页面内容 */
            }
        }
        @page {
            /* 尝试去除默认的页眉和页脚 */
            margin: 0;
        }

    </style>
</head>
<body>

<div class="layui-form " style="width:70%;margin:auto;padding:0 5%;background:#FFF;margin-top:0">
    <h2 style="text-align: center;">劳动者个人信息卡
    </h2>
    <input id="userCode" type="hidden" value="">
    <input id="regId" type="hidden" value="">

    <form class="layui-form" id="addfolder" lay-filter="folderForm" style="display: none;min-height: 300px">
        <div id="search-header">
            <input id="guishu" type="hidden" value="">
            <div class="layui-inline" style="margin-left: -59px;display: none">
                <label class="layui-form-label">单位</label>
                <div class="layui-input-block" style="width: 270px;">
                    <input type="text" id="tree" lay-filter="tree" class="layui-input">
                </div>
            </div>

            <div class="layui-inline" style="margin-left: 3px;">
                <label class="layui-form-label w-auto">姓名:</label>
                <div class="layui-input-inline">
                    <input id="name" class="layui-input" placeholder="请输入" style="width: 124px;"/>
                </div>
            </div>

            <div class="layui-inline" style="padding-left: 20px;">
                <button class="layui-btn icon-btn sousuoDN " lay-submit="" lay-filter="regManageQueryBtn"><i class="layui-icon"></i>搜索</button>
                <button id="btnempty" style="background-color: #fff;width: 69px;color: black;border: 1px solid #e5e5e5;" class="layui-btn icon-btn"></i>清除</button>
            </div>
        </div>
        <div id="tables" class="text-center layui-text"  style="width: 100%;">

        </div>
    </form>



    <form class="layui-form" id="myForm" lay-filter="myForm">
        <button style="float: right" type="submit" class="layui-btn no-print" lay-submit lay-filter="myFormSave">保存</button>
        <button style="float: right;margin-right: 30px" type="submit" class="layui-btn no-print" lay-submit lay-filter="generatePDF">打印</button>
        <table>
            <tr >
                <th colspan="2">姓名</th>
                <td colspan="4">
                    <div class="layui-input-group">
                        <input name="v1" type="text" class="input-full layui-input" placeholder="请输入姓名" readonly>
                        <div class="layui-input-split layui-input-suffix chooseName" style="cursor: pointer;">
                            <i class="layui-icon layui-icon-search"></i>
                        </div>
                    </div>
                </td>
                <th colspan="2">性别</th>
                <td colspan="4" >
                    <input type="radio" name="v2" value="1" title="男">
                    <input type="radio" name="v2" value="2" title="女" >
                </td >
                <th colspan="4">出生日期</th>
                <td colspan="4"><input type="date" name="v3" class="input-full datainput layui-input"></td>

                <td rowspan="4" colspan="3">
                    <div class="upload-area" id="uploadPhoto">
                        <img id="previewImg" src="" alt="点击上传照片" style="display:none;max-width:100%;max-height:100%;margin-top:10px;">
                        <span id="uploadText">点击上传照片</span>
                        <button style="display:none;" type="button" class="layui-btn layui-btn-radius layui-btn-normal" id="uploadInput">
                        </button>
                    </div>
                </td>

            </tr>


            <tr>
                <th colspan="2">曾用名
                </th>
                <td colspan="4"><input type="text"  class="input-full layui-input" name="v4"  placeholder="请输入曾用名"></td>
                <th colspan="2">婚姻状况</th>
                <td colspan="4">
                    <select name="v5"  class="input-full">
                        <option value="">请选择婚姻状况</option>
                        <option value="未婚">未婚</option>
                        <option value="已婚">已婚</option>
                        <!-- 其他选项 -->
                    </select>
                </td>

                <th colspan="4">文化程度</th>
                <td colspan="4">
                    <select name="v6" class="input-full">
                        <option  value="">请选择文化程度</option>
                        <option  value="小学">小学</option>
                        <option  value="初中">初中</option>
                        <option  value="高中">高中</option>
                        <option  value="大学">大学</option>
                        <option  value="研究生">研究生</option>
                        <option  value="博士">博士</option>
                    </select>


                </td>


            </tr>


            <tr >
                <th colspan="4">籍贯</th>
                <td colspan="6"><input type="text" class="input-full layui-input" name="v7" placeholder="请输入籍贯"></td>
                <th colspan="4">本人电话</th>
                <td colspan="6"><input type="text" class="input-full layui-input" name="v8" placeholder="请输入本人电话"></td>

            </tr>

            <tr >
                <th colspan="4">嗜好</th>
                <td colspan="6"><input type="text" class="input-full layui-input" name="v9" placeholder="嗜好"></td>
                <th colspan="4">身份证号</th>
                <td colspan="6"><input type="text" class="input-full layui-input" name="v10" placeholder="请输入身份证号"></td>
            </tr>




            <tr class="section-title">
                <td class="heng" colspan="23">职业史及职业病危害接触史</td>
            </tr>

            <tr >
                <th colspan="1">序号</th>
                <th colspan="3">用人单位名称</th>
                <th colspan="3">从事工种（或岗位）</th>
                <th colspan="6">工作起始时间</th>
                <th colspan="6">接触职业病危害因素名称</th>
                <th colspan="3">证明人</th>
                <th colspan="1">操作</th>
            </tr>
            <tr  id="disease-history-table" class="section-title disease-rowc">

            </tr>
            <tr class="section-title">
                <td colspan="23" class="operation-btn" style="text-align: center"><i id="add-disease-row1" style="font-size: 20px;color: #2d8cf0" class="layui-icon layui-icon-add-circle add-btn"></i></td>
            </tr>





            <tr >
                <th colspan="2">序号</th>
                <th colspan="3">曾患病</th>
                <th colspan="4">诊断日期</th>

                <th colspan="4">诊断单位</th>
                <th colspan="5">治疗结果</th>
                <th colspan="4">备注</th>
                <th colspan="1">操作</th>
            </tr>
            <tr  id="disease-history-table2" class="section-title disease-rowb">

            </tr>

            <tr class="section-title">
                <td colspan="23" class="operation-btn" style="text-align: center"><i id="add-disease-row2" style="font-size: 20px;color: #2d8cf0" class="layui-icon layui-icon-add-circle add-btn"></i></td>
            </tr>






            <tr>
                <th colspan="8">月经史及生育史（女职工填写）</th>
                <td colspan="15">
                    <!--          <input type="text" name="v22" class="input-full layui-input" placeholder="责任健管师" >-->
                        <textarea name="v11" placeholder="请输入内容" class="layui-textarea" maxlength="200"></textarea>
                </td>

            </tr>


            <tr>
                <td colspan="23">
                    <!--          <input type="text" name="v22" class="input-full layui-input" placeholder="责任健管师" >-->
                        <textarea name="remark" placeholder="请输入内容" class="layui-textarea"  readonly>
                            注：1）本表记录用人单位接触职业病危害的作业人员基本信息；2）职业病人的职业史是指职业病病人从事过的职业及从业期限:职业病危害接触史是指劳动者接触职业病危害的种类及接触时间的长短；3）职业史、职业病危害接触史主要从到本单位工作时间开始填写，能够源到初次参加工作时间的、从初次参加工作时间开始填写；4)既往病史是指劳动者曾患病情况，包括职业病和其它疾病。
                        </textarea>
                </td>
            </tr>

        </table>
    </form>
</div>

<script type="text/javascript" th:src="@{/assets/js/common.js}"></script>
<script th:inline="javascript">
    layui.use(['form',"table",'treeSelect','notice',"upload"], function(){
        var form = layui.form;
        var $ = layui.jquery;
        var layer = layui.layer;
        var table = layui.table;
        var notice=layui.notice;
        var upload = layui.upload;
        layui.config({
            skin: 'blue'  // 设置主题为蓝色
        });

        //下拉框回显
        form.render("select");
        var params = new URLSearchParams(window.location.search);
        var paramValue = params.get('personalBasicInformation');

        document.getElementById('uploadPhoto').addEventListener('click', function() {
            document.getElementById('uploadInput').click(); // 模拟点击隐藏的 input 文件选择框
        });

        form.on('submit(generatePDF)', function(data){
            window.print();
            return false;
        });

        upload.render({
            elem: '#uploadInput'
            ,url: '/YhUserFile/upload1' //必填项
            ,size:104857600
            ,accept:'image/*'
            ,before: function () {
                layer.msg('上传中', {
                    icon: 16,
                    shade: 0.01
                }); //上传loading
            }
            ,done: function(res,index,upload){
                document.getElementById('previewImg').src = res.files;
                document.getElementById('previewImg').style.display = 'block';
                const uploadText = document.getElementById('uploadText');
                uploadText.style.display = 'none'; // 隐藏文字
            }
            ,error : function(index,upload){

            }
        });


        $(".chooseName").on("click",function (){
            var closeIndex = layer.open({
                type: 1, // page 层类型
                area: ['800px', '600px'],
                title: '选择名字',
                shade: 0.6, // 遮罩透明度
                anim: 0, // 0-6 的动画形式，-1 不开启
                content: $("#addfolder"),
                success: function(layero, index){
                    // 在弹出层初始化完成后渲染表格
                    var regManageTb=table.render({
                        elem: '#tables',
                        url: '/newRegController/queryLocallyManagedArchives', // 此处为静态模拟数据，实际使用时需换成真实接口
                        page: true,
                        limit : 10,
                        where : {regTime:""},
                        cols: [[
                            // {type: 'radio', fixed: 'left'},
                            {field:'userCode', title:'用户编号', fixed: 'left'},
                            {field: 'name', title: '姓名', align: 'center'},
                            {field: 'phone', align: 'center', title: '电话'} ,
                        ]],
                        parseData: function(res) {
                            console.log(res,"8888888888888888888888888888888888")
                            console.log(res.code,"8888888888888888888888888888888888",Number(res.code) === 20000)
                            if (Number(res.code) === 20000) {
                                console.log(res,"8888888888888888888888888888888888")
                                return {
                                    "code": 0,
                                    "msg": res.msg || "",
                                    "count": res.count || 0,
                                    "data": res.data.data || []
                                };
                            } else {
                                return {
                                    "code": 1,
                                    "msg": res.msg || "获取数据失败",
                                    "count": 0,
                                    "data": []
                                };
                            }
                        },
                        done: function() {
                            $('#tables').css('visibility', 'visible');
                        }
                    });



                    $('#tables').css('visibility', 'hidden');


                    // 行单击事件( 双击事件为: rowDouble )
                    table.on('row(tables)', function(obj){
                        var data = obj.data; // 获取当前行数据
                        // 显示 - 仅用于演示
                        form.val("myForm", {
                            "v1": data.name,
                            "v2":data.sex,
                            "v3":data.birth.substring(0,10),
                            "v5":data.marriage,
                            "v6":data.nation,
                            "v8":data.phone,
                            "v10":data.idCard,
                        });
                        $("#userCode").val(data.userCode);
                        $("#regId").val(data.id);
                        form.render();
                        layer.close(closeIndex);
                        // 标注当前点击行的选中状态
                        obj.setRowChecked({
                            type: 'radio' // radio 单选模式；checkbox 复选模式
                        });
                    });

                    form.on('submit(regManageQueryBtn)', function(data){
                        regManageTb.reload({
                            where : {
                                //这里注意一定要跟Bean 里面的属性对应
                                orgCode:$('#guishu').val(),
                                name:$('#name').val(),
                                regTime:"",
                            },
                            page : {
                                curr : 1
                            }

                        });
                        return false;
                    });


                },
                end: function () {
                    $("#addfolder").hide();
                }
            });
        });





        // 删除行功能
        function bindDeleteEvents() {
            var deleteBtns = document.querySelectorAll('.delete-btn');
            deleteBtns.forEach(function(btn, index) {
                btn.addEventListener('click', function() {
                    var row = this.parentElement.parentElement;
                    row.parentElement.removeChild(row);
                    updateRowNumbers(); // 更新序号
                });
            });
        }

        // 更新序号
        function updateRowNumbers() {
            var rows = document.querySelectorAll('.disease-row');
            rows.forEach(function(row, index) {
                row.querySelector('td[colspan="1"]').textContent = index + 1;
            });
            var rows1 = document.querySelectorAll('.disease-row1');
            rows1.forEach(function(row, index) {
                rows1.querySelector('td[colspan="1"]').textContent = index + 1;
            });
            var rows2 = document.querySelectorAll('.disease-row2');
            rows2.forEach(function(row, index) {
                rows2.querySelector('td[colspan="1"]').textContent = index + 1;
            });



        }
        form.on('submit(myFormSave)', function(data){


            var allRowsaData = [];
            var allRowsbData = [];
            $("tr").each(function() {
                var row = $(this); // 当前行
                // 检查当前行是否包含你需要的 input 元素

                var adda1Input = row.find('input[name="adda1"]');
                var adda2Input = row.find('input[name="adda2"]');
                var adda3Input = row.find('input[name="adda3"]');
                var adda4Input = row.find('input[name="adda4"]');
                var adda5Input = row.find('input[name="adda5"]');
                var adda6Input = row.find('input[name="adda6"]');
                var addb1Input = row.find('input[name="addb1"]');
                var addb2Input = row.find('input[name="addb2"]');
                var addb3Input = row.find('input[name="addb3"]');
                var addb4Input = row.find('input[name="addb4"]');
                var addb5Input = row.find('input[name="addb5"]');



                if (adda1Input.length > 0 && adda2Input.length > 0&& adda3Input.length > 0&& adda4Input.length > 0&& adda5Input.length > 0&& adda6Input.length > 0 ) {
                    var add1Value = adda1Input.val(); // 获取疾病名称的值
                    var add2Value = adda2Input.val(); // 获取确诊时间的值
                    var add3Value = adda3Input.val(); // 获取确诊时间的值
                    var add4Value = adda4Input.val(); // 获取确诊时间的值
                    var add5Value = adda5Input.val(); // 获取确诊时间的值
                    var add6Value = adda6Input.val(); // 获取确诊时间的值
                    var rowData = {
                        "add1": add1Value,
                        "add2": add2Value,
                        "add3": add3Value,
                        "add4": add4Value,
                        "add5": add5Value,
                        "add6": add6Value,
                    };
                    // 将该行的数据对象添加到数组中
                    allRowsaData.push(rowData);
                }

                if (addb1Input.length > 0 && addb2Input.length > 0&& addb3Input.length > 0&& addb4Input.length > 0&& addb5Input.length > 0 ) {
                    var add1Value = addb1Input.val(); // 获取疾病名称的值
                    var add2Value = addb2Input.val(); // 获取确诊时间的值

                    var add3Value = addb3Input.val(); // 获取确诊时间的值
                    var add4Value = addb4Input.val(); // 获取确诊时间的值
                    var add5Value = addb5Input.val(); // 获取确诊时间的值
                    var rowData = {
                        "add1": add1Value,
                        "add2": add2Value,
                        "add3": add3Value,
                        "add4": add4Value,
                        "add5": add5Value,
                    };
                    // 将该行的数据对象添加到数组中
                    allRowsbData.push(rowData);
                }


            });


            if ($(this).data('submitted') === true) {
                return false; // 阻止重复提交
            }
            $(this).data('submitted', true);

            if(paramValue){
                $.ajax({
                    type : 'post',
                    url : '/NewEmployeePersonalInformationCardController/updateById',
                    data : {
                        id:paramValue,
                        userCode :$("#userCode").val(),
                        regId:$("#regId").val(),
                        name:data.field.v1,
                        sex:data.field.v2,
                        birth:data.field.v3,
                        nameUsedBefore:data.field.v4,
                        maritalStatus:data.field.v5,
                        degreeEducation:data.field.v6,
                        nativePlace:data.field.v7,
                        myPhoneNumber:data.field.v8,
                        hobby:data.field.v9,
                        idNumber:data.field.v10,
                        occupationalHistoryExposureHistoryToOccupationalHazards:JSON.stringify(allRowsaData),
                        textJson:JSON.stringify(allRowsbData),
                        menstrualReproductiveHistory:data.field.v11,
                        photo:$("#previewImg").attr("src")
                    },

                    success : function(data) {
                        if (data.code == 20000) {
                            notice.success({
                                title : '消息通知',
                                message : '操作成功!'
                            });
                        } else {
                            notice.error({
                                title : '消息通知',
                                message : '操作失败!'
                            });
                        }
                    }
                })
            }else{
                $.ajax({
                    type : 'post',
                    url : '/NewEmployeePersonalInformationCardController/insert',
                    data : {
                        userCode :$("#userCode").val(),
                        regId:$("#regId").val(),
                        name:data.field.v1,
                        sex:data.field.v2,
                        birth:data.field.v3,

                        nameUsedBefore:data.field.v4,

                        maritalStatus:data.field.v5,
                        degreeEducation:data.field.v6,
                        nativePlace:data.field.v7,
                        myPhoneNumber:data.field.v8,

                            });

                    }
                })
