    layui.use(['form',"table",'treeSelect','notice','upload',"laydate"], function(){

        //     success: function (d) {

        // });

        var params = new URLSearchParams(window.location.search);

            var row = event.elem.closest('tr');
            // 删除该行
            row.parentNode.removeChild(row);
            return false;
        });
        form.on('submit(preview)', function(data) {
            // 获取文件的 URL
            var url = data.elem.getAttribute('data-url');
            if(isPdfUrl(url) || isImageUrl(url)){
                window.open(url);
            }else{
                window.open("https://view.officeapps.live.com/op/view.aspx?src="+url, '_blank');
            }
            // 阻止表单默认提交行为
            return false;
        });

        form.on('submit(down)', function(data) {
            // 获取文件的 URL
            var url = data.elem.getAttribute('data-url');
            var name=data.elem.getAttribute("data-name");
            if(isPdfUrl(url) || isImageUrl(url)){
                fetchAndDownloadPDF(url,name);
            }else{
                window.open(url);
            }
            // 创建一个隐藏的 <a> 元素来触发下载


            // 阻止表单默认提交行为
            return false;
        });

        function isPdfUrl(url) {
            return /\.pdf$/i.test(url);
        }
        function isImageUrl(url) {
            return /\.(jpg|jpeg|png|gif|bmp|webp|svg)$/i.test(url);
        }
        let isDownloading = false;
        async function fetchAndDownloadPDF(url,name) {
            if (isDownloading) return;  // 如果正在下载，则不执行
            isDownloading = true;
            console.log('Function called');
            try {
                const response = await fetch(url);
                const blob = await response.blob();
                const blobUrl = window.URL.createObjectURL(blob);

                const a = document.createElement('a');
                a.href = blobUrl;
                a.download = name; // 设置下载文件的名称
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);

                // 释放 URL 对象
                window.URL.revokeObjectURL(blobUrl);
            } catch (error) {
                console.error('下载文件失败:', error);
            }finally {
                isDownloading = false;
            }
        }

        upload.render({
            elem: '#test1'

                    parent.layer.msg("上传成功！");

                var newCell = document.createElement('td');

                        </div>
                        <div class="actions">
                              <input type="text"  style="display: none" class="input-full layui-input" name="v9"  value="${res.files}">
                              <input type="text"  style="display: none" class="input-full layui-input" name="v10"  value="${res.name}">
                              <button title="修改" class="edit-btn" style="border: none; background: none; cursor: pointer;">
                                    <i class="layui-icon layui-icon-edit"></i>
                              </button>
                              <button title="下载" lay-submit=""  lay-filter="down"  data-name="${res.name}"  data-url="${res.files}"  >&#8681;</button>
                              <button title="预览" lay-submit="" lay-filter="preview" data-url="${res.files}">&#128065;</button>
                              <button title="删除" lay-submit=""  lay-filter="deleteRowBtn"  >&#10006;</button>
                        </div>
                    </div>
                `;
                newRow.appendChild(newCell);
                document.getElementById('file-table').appendChild(newRow);
                newCell.querySelector('.edit-btn').onclick = function() {
                    event.preventDefault();
                    var currentName = res.name;
                    layer.prompt({
                        title: '修改文件名',
                        value: currentName,
                        formType: 0 // 输入框类型，0：单行文本
                    }, function(value, index) {
                        // 更新文件名逻辑
                        newCell.querySelector('.file-info span').innerText = value; // 更新显示的文件名
                        newCell.querySelector('input[name="v10"]').value = value; // 更新隐藏的文件名输入
                        layer.close(index); // 关闭输入框
                    });
                };
            }
            ,error : function(index,upload){
            }
        });

                                };
                            });


                            $("#userCode").val(data.data.userCode);

                            form.render();
                        }

                    }
                })
            }


        }



        // 初始化表单
        form.render();
    });
</script>
