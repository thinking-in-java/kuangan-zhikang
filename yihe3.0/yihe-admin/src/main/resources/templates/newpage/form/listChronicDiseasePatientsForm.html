<script type="text/javascript" th:src="@{/assets/js/layui-v2.9.16/layui/layui.js}"></script>

<script th:inline="javascript">
    layui.use(['form',"table",'treeSelect','notice','upload',"laydate"], function(){
        var form = layui.form;
        var $ = layui.jquery;
        var layer = layui.layer;
        var table = layui.table;
        var notice=layui.notice;
        var upload = layui.upload;
        var treeSelect= layui.treeSelect;
        layui.config({
            skin: 'blue'  // 设置主题为蓝色
        });




        var params = new URLSearchParams(window.location.search);
        var paramValue = params.get('medicalExaminationInformation');

        form.on('submit(deleteRowBtn)', function(event){
            var row = event.elem.closest('tr');
            // 删除该行
            row.parentNode.removeChild(row);
            return false;
        });

        $('#add-disease-row').on('click', function() {
            var $lastRow = $('#disease-history-table').siblings('.disease-row').last();
            var rowCount = $('#disease-history-table').siblings('.disease-row').length;
            var $newRow = $('<tr class="disease-row"></tr>');
            var $id="three"+rowCount + 1;
            var $idOrg="threeOrg"+rowCount + 1;
            $newRow.html(`
                <td colspan="1">${rowCount + 1}</td>
                <td colspan="2">
                     <div class="layui-input-group">
                        <input name="v1" type="text" class="input-full layui-input" placeholder="请输入姓名">
                        <div class="layui-input-split layui-input-suffix chooseName" style="cursor: pointer;">
                            <i class="layui-icon layui-icon-search"></i>
                        </div>
                    </div>
                </td>
                <td colspan="1"><input type="text" name="v2" class="input-full layui-input" placeholder="年龄"></td>
                <td colspan="1">
                        <select name="v2"  class="input-full">
                          <option value="男">男</option>
                          <option value="女">女</option>
                          <!-- 其他选项 -->
                        </select>
                </td>

                <td colspan="2">
                 <input type="text" name="v13"  class="layui-input" style="display: none">
                 <div class="layui-input-block" style="width: 100%;margin-left: 0" >
                        <input type="text"  id="${$id}" lay-filter="tree" class="layui-input">

                    </div>
                </td>
                <td colspan="1"><input type="text" name="v3" class="input-full layui-input" placeholder="部门"></td>
                <td colspan="2">
                    <div class="checkbox-group">
                     <input type="checkbox" name="v4" value="慢性气管炎"  title="慢性气管炎">
                     <input type="checkbox" name="v4" value="哮喘"  title="哮喘">
                     <input type="checkbox" name="v4" value="心脏病"  title="心脏病">
                     <input type="checkbox" name="v4" value="痛风"  title="痛风">
                     <input type="checkbox" name="v4" value="高血糖"  title="高血糖">

                     <input type="checkbox" name="v4" value="肿瘤"  title="肿瘤">
                     <input type="checkbox" name="v4" value="高血脂"  title="高血脂">
                     <input type="checkbox" name="v4" value="慢性胃炎"  title="慢性胃炎">
                     <input type="checkbox" name="v4" value="高血压"  title="高血压">
                     <input type="checkbox" name="v4" value="骨质疏松"  title="骨质疏松">

                     <input type="checkbox" name="v4" value="高尿酸"  title="高尿酸">
                     <input type="checkbox" name="v4" value="肥胖"  title="肥胖">
                     <input type="checkbox" name="v4" value="关节炎"  title="关节炎">
                     <input type="checkbox" name="v4" value="乳腺增生"  title="乳腺增生">
                     <input type="checkbox" name="v4" value="其他"  title="其他">
                    </div>
                </td>
                <td colspan="2"><input type="text" name="v5" class="input-full layui-input" placeholder="其他病症"></td>

                 <td colspan="1">
                   <select name="v6"  class="input-full">
                          <option value="1">1</option>
                          <option value="2">2</option>
                          <option value="3">3</option>
                          <option value="4">4</option>
                   </select>

                </td>
                <td colspan="2">
                    <select name="v7"  class="input-full">
                          <option value="已转诊">已转诊</option>
                          <option value="未转诊">未转诊</option>

                          <!-- 其他选项 -->
                   </select>
                </td>
                <td colspan="2">
                    <select name="v8"  class="input-full">
                          <option value="已干预">已干预</option>
                          <option value="未干预">未干预</option>
                   </select>

                </td>
                <td colspan="2"><input type="date" name="v9" class="input-full datainput layui-input"></td>

                 <td colspan="1"><input type="text" name="v10" class="input-full layui-input" placeholder="干预次数"></td>
                <td colspan="2"><input type="date" name="v11" class="input-full datainput layui-input"></td>
                <td colspan="2">
                    <select name="v12"  class="input-full">
                          <option value="优秀">优秀</option>
                          <option value="良好">良好</option>
                          <option value="差">差</option>
                   </select>

                </td>
                 <td colspan="1"  style="text-align: center;" class="operation-btn"><i style="color: red;font-size: 30px;" class="layui-icon layui-icon-delete delete-btn"></i></td>


            `);

            if ($lastRow.length > 0) {
                $lastRow.after($newRow);
            } else {
                $('#disease-history-table').after($newRow);
            }

            treeSelect.render({
                // 选择器
                elem: `#${$id}`,
                // 数据
                data: '/YhUserMakeCard/showPullDownTree',
                // 异步加载方式：get/post，默认get
                type: 'get',
                // 占位符
                placeholder: '全部',
                // 是否开启搜索功能：true/false，默认false
                search: true,
                // 点击回调
                click: function(d){
                    $newRow.find('input[name="v13"]').val(d.current.id);
                },
                // 加载完成后的回调函数
                success: function (d) {
                    console.log(d);

                }

            });

            form.render();

            bindDeleteEvents(); // 绑定删除事件
        });




        function bindDeleteEvents() {
            var deleteBtns = document.querySelectorAll('.delete-btn');
            deleteBtns.forEach(function(btn, index) {
                btn.addEventListener('click', function() {
                    var row = this.parentElement.parentElement;
                    row.parentElement.removeChild(row);
                    updateRowNumbers(); // 更新序号
                });
            });


        }

        function updateRowNumbers() {
            var rows = document.querySelectorAll('.disease-row');
            rows.forEach(function(row, index) {
                row.querySelector('td[colspan="1"]').textContent = index + 1;
            });
            var rows1 = document.querySelectorAll('.disease-row1');
            rows1.forEach(function(row, index) {
                rows1.querySelector('td[colspan="1"]').textContent = index + 1;
            });
            var rows2 = document.querySelectorAll('.disease-row2');
            rows2.forEach(function(row, index) {
                rows2.querySelector('td[colspan="1"]').textContent = index + 1;
            });
            var rows3 = document.querySelectorAll('.disease-row3');
            rows3.forEach(function(row, index) {
                rows3.querySelector('td[colspan="1"]').textContent = index + 1;
            });
            var rows4 = document.querySelectorAll('.disease-row4');
            rows4.forEach(function(row, index) {
                rows4.querySelector('td[colspan="1"]').textContent = index + 1;
            });

        }

        $(document).on("click", ".chooseName", function () {
            var $row = $(this).closest('tr');
            var closeIndex = layer.open({
                type: 1, // page 层类型
                area: ['800px', '600px'],
                title: '选择名字',
                shade: 0.6, // 遮罩透明度
                anim: 0, // 0-6 的动画形式，-1 不开启
                content: $("#addfolder"),
                success: function(layero, index){
                    // 在弹出层初始化完成后渲染表格
                    var regManageTb=table.render({
                        elem: '#tables',
                        url: '/newRegController/queryLocallyManagedArchives', // 此处为静态模拟数据，实际使用时需换成真实接口
                        page: true,
                        limit : 10,
                        where : {regTime:""},
                        cols: [[
                            // {type: 'radio', fixed: 'left'},
                            {field:'userCode', title:'用户编号', fixed: 'center'},
                            {field: 'name', title: '姓名', align: 'center'},
                            {field: 'phone', align: 'center', title: '电话'} ,
                        ]],
                        parseData: function(res) {
                            if (res.code === 20000) {
                                return {
                                    "code": 0,
                                    "msg": res.msg || "",
                                    "count": res.count || 0,
                                    "data": res.data.data || []
                                };
                            } else {
                                return {
                                    "code": 1,
                                    "msg": res.msg || "获取数据失败",
                                    "count": 0,
                                    "data": []
                                };
                            }
                        },
                        done: function() {
                            $('#tables').css('visibility', 'visible');
                        }
                    });
                    $('#tables').css('visibility', 'hidden');
                    // 行单击事件( 双击事件为: rowDouble )
                    table.on('row(tables)', function(obj){
                        var xx = obj.data; // 获取当前行数据
                        // 显示 - 仅用于演示
                        $.ajax({
                            type:'get',
                            url:'/YhUserReginfo/yhUserReginfo',
                            data:{userCode:xx.userCode},
                            success : function(data){
                                console.log(data,"--------------------------------------")
                                if(data!=null){
                                    $row.find('input[name="v1"]').val(data.name);
                                    console.log(data.newestAssessTime);
                                }else{
                                    $row.find('input[name="v1"]').val(data.data.data.name);
                                }

                                // 刷新表单，让Layui重新渲染
                                form.render();
                                layer.close(closeIndex);
                            }
                        })


                        // 标注当前点击行的选中状态
                        obj.setRowChecked({
                            type: 'radio' // radio 单选模式；checkbox 复选模式
                        });
                    });

                    form.on('submit(regManageQueryBtn)', function(data){
                        regManageTb.reload({
                            where : {
                                //这里注意一定要跟Bean 里面的属性对应
                                orgCode:$('#guishu').val(),
                                name:$('#name').val(),
                                regTime:"",
                            },
                            page : {
                                curr : 1
                            }

                        });
                        // 阻止表单跳转。如果需要表单跳转，去掉这段即可。
                        return false;
                    });


                },
                end: function () {
                    // 关闭弹出层时隐藏 addfolder
                    $("#addfolder").hide();
                }
            });
        });









        form.on('submit(myFormSave)', function(data){
            console.log(data,"dddddddddddddddddddddddddddddddd")


            var diseaseData = [];

            // 遍历每一行 `.disease-row`
            $('#disease-history-table').siblings('.disease-row').each(function() {
                var $row = $(this);

                // 获取每个输入框和选择框的值
                var rowData = {
                    name: $row.find('input[name="v1"]').val(),          // 姓名
                    age: $row.find('input[name="v2"]').val(),           // 年龄
                    gender: $row.find('select[name="v2"]').val(),       // 性别
                    department: $row.find('input[name="v3"]').val(),    // 部门
                    diseases: [],                                       // 疾病（多个复选框值）
                    otherDiseases: $row.find('input[name="v5"]').val(), // 其他病症
                    level: $row.find('select[name="v6"]').val(),        // 级别
                    transferStatus: $row.find('select[name="v7"]').val(), // 转诊状态
                    interventionStatus: $row.find('select[name="v8"]').val(), // 干预状态
                    firstInterventionDate: $row.find('input[name="v9"]').val(), // 首次干预时间
                    interventionTimes: $row.find('input[name="v10"]').val(),    // 干预次数
                    lastInterventionDate: $row.find('input[name="v11"]').val(), // 最新干预时间
                    evaluation: $row.find('select[name="v12"]').val() ,   // 评估
                    tree: $row.find('input[name="v13"]').val()
                };

                // 获取疾病复选框的值（多个）
                $row.find('input[name="v4"]:checked').each(function() {
                    rowData.diseases.push($(this).val());
                });

                // 将该行的数据对象添加到数组中
                diseaseData.push(rowData);
            });

            // 输出或提交数据
            console.log(diseaseData,"输出或提交数据输出或提交数据输出或提交数据输出或提交数据输出或提交数据输出或提交数据输出或提交数据");
            if ($(this).data('submitted') === true) {
                return false; // 阻止重复提交
            }
            $(this).data('submitted', true);
            if(paramValue){
                $.ajax({
                    type : 'post',
                    url : '/NewListChronicDiseasePatientsController/updateNew',
                    data : {
                        id:paramValue,
                        jsonData:JSON.stringify(diseaseData)
                    },

                    success : function(data) {
                        if (data.code == 20000) {

                            notice.success({
                                title : '消息通知',
                                message : '操作成功!'
                            });

                            setTimeout(function() {
                                window.close();
                            }, 2000);
                        } else {
                            notice.error({
                                title : '消息通知',
                                message : '操作失败!'
                            });
                            setTimeout(function() {
                                window.close();
                            }, 2000);
                        }
                    }
                })
            }else{
                $.ajax({
                    type : 'post',
                    url : '/NewListChronicDiseasePatientsController/insetNew',
                    data : {
                        jsonData:JSON.stringify(diseaseData)
                    },

                    success : function(data) {
                        if (data.code == 20000) {

                            notice.success({
                                title : '消息通知',
                                message : '操作成功!'
                            });

                            setTimeout(function() {
                                window.close();
                            }, 2000);
                        } else {
                            notice.error({
                                title : '消息通知',
                                message : '操作失败!'
                            });
                            setTimeout(function() {
                                window.close();
                            }, 2000);
                        }
                    }
                })
            }
            return false; // 阻止默认 form 跳转
        });

        function selectForm(paramValue){
            if(paramValue){
                $.ajax({
                    type:'get',
                    url:'/NewListChronicDiseasePatientsController/selectById',
                    data:{id:paramValue},
                    success : function(data){
                        console.log("这里是查询出来的数据",data);
                        if(data.code==20000){
                            var rowDataArr = JSON.parse(data.data.jsonData);
                            $('#disease-history-table').siblings('.disease-row').remove();
                            rowDataArr.forEach(function(rowData, index) {
                                var rowCount = index + 1;
                                var $id = "three" + rowCount;
                                var $idOrg = null;
                                var $lastRow = $('#disease-history-table').siblings('.disease-row').last();
                                var $newRow = $(`
                                        <tr class="disease-row">
                                            <td colspan="1">${rowCount}</td>
                                            <td colspan="2">
                                                <div class="layui-input-group">
