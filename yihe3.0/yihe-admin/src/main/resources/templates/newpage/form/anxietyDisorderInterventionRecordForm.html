<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>焦虑症干预记录表</title>
    <link rel="stylesheet" th:href="@{/assets/js/layui-v2.9.16/layui/css/layui.css}"/>
    <script type="text/javascript" th:src="@{/assets/js/layui-v2.9.16/layui/layui.js}"></script>
    <style>
        body{
            background:#F1F1F1
        }
        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
            border-color:rgb(144, 186, 221)
        }
        th, td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: rgb(231, 243, 252);
            font-size: 10pt;
            font-family: "Microsoft YaHei";
            word-break: break-word;
            overflow-wrap: break-word;
            text-align: center;
        }
        .section-title {
            text-align: center;
            font-weight: bold;
            background-color: #e6f7ff;
        }
        .input-full {
            width: 100%;
            box-sizing: border-box;
        }
        .radio-group {
            display: flex;
            align-items: center;
        }
        .radio-group label {
            margin-right: 10px;
        }
        .checkbox-group {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
        }
        .checkbox-group label {
            margin-right: 15px;
        }
        .heng{
            text-align: center;
            font-size: 10pt;
            font-family: "Microsoft YaHei";
            word-break: break-word;
            overflow-wrap: break-word;
        }
        .datainput{
            border-color: #eee !important;
            border-width: 1px;
        }

        .layui-form-checked[lay-skin=primary] i{
            border-color:#2d8cf0 !important;
            background-color:#FFF !important;
            color:#2d8cf0 !important;
            font-weight: bold;
        }

        .layui-form-checkbox[lay-skin=primary]:hover i{
            border-color:#2d8cf0 !important;
        }
        .layui-form-radio>i:hover, .layui-form-radioed>i{
            color: #2d8cf0 !important;
        }

        /* 覆盖 layui 的默认主题颜色 */
        .theme-colorful .layui-btn {
            height: 36px;
            line-height: 36px;
            border-radius: 4px;
            background-color: #2d8cf0;
            box-shadow: 0 1px 0 rgba(0, 0, 0, .03);
        }
        .layui-form-radio:hover>*, .layui-form-radioed, .layui-form-radioed>i{
            color: #2d8cf0 !important;
        }

        /*.layui-input {*/
        /*    border-color: #597FC0 !important;*/
        /*}*/

        /* ...其他元素样式 */
        /* 修改分页按钮的背景颜色和字体颜色 */
        .layui-laypage a {
            background-color: #f0f0f0; /* 设置按钮的背景颜色 */
            color: #333; /* 设置按钮的字体颜色 */
        }

        /* 鼠标悬停时按钮的背景颜色 */
        .layui-laypage a:hover {
            background-color: #fff;
            color: #2d8cf0;
        }

        /* 当前页的背景颜色和字体颜色 */
        .layui-laypage .layui-laypage-curr .layui-laypage-em {
            background-color: #2d8cf0; /* 当前页的背景颜色 */
            color: white; /* 当前页的字体颜色 */
        }

        .file-row {
            background-color: #e6f7ff;
            padding: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-radius: 5px;
            margin: 10px 0;
            width: 98%;
        }
        .file-row .file-info {
            display: flex;
            align-items: center;
        }
        .file-row .file-info img {
            width: 20px;
            margin-right: 10px;
        }
        .file-row .file-info span {
            font-size: 14px;
        }
        .file-row .actions {
            display: flex;
            align-items: center;
        }
        .file-row .actions button {
            border: none;
            background: none;
            cursor: pointer;
            margin-left: 10px;
            font-size: 16px;
        }

        .layui-laydate-header {
            background-color: #2d8cf0; /* 顶部背景颜色 */
            color: #fff; /* 顶部文字颜色 */
        }

        .layui-laydate-list li:hover {
            background-color: #2d8cf0; /* 鼠标悬停时的背景颜色 */
            color: #fff; /* 鼠标悬停时的文字颜色 */
        }

        .layui-this, .layui-this:hover {
            background-color: #fff !important; /* 选中的背景颜色 */
            color: #2d8cf0 !important; /* 选中的文字颜色 */
        }
        @media print {
            .no-print {
                display: none !important;
            }
            @page {
                size: A4; /* 或者你可以指定其他页面大小 */

            }
            body {
                width: 100%;
                height: 100%;
                zoom: 0.8; /* 缩小页面内容 */
            }
        }
        @page {
            /* 尝试去除默认的页眉和页脚 */

        }

</head>

                                <div style="line-height: 40px; width: 5%; float: left;">测量</div>
                                <input style="width: 44%; float: left;" type="text" class="input-full layui-input" name="v21">

                                <div style="line-height: 40px; width: 4%; float: left;">/目标</div>
                                <input style="width: 44%; float: left;" type="text" class="input-full layui-input" name="v22">

                                <div style="clear: both;"></div>

                            </td>
                        </tr>

                        <tr >
                            <th colspan="4">摄盐情况（咸淡）</th>
                            <td colspan="20">
                                <div style="line-height: 40px;width: 5%;float: left">测量</div>
                                <div style="width: 35%;float: left"  >
                                    <input type="radio" name="v23" value="轻" title="轻">
                                    <input type="radio" name="v23" value="中" title="中" >

                                <div style="line-height: 40px;width: 5%;float: left">/目标</div>
                                <div style="width: 35%;float: left"  >
                                    <input type="radio" name="v24" value="轻" title="轻">
                                    <input type="radio" name="v24" value="中" title="中" >

                        <tr >

                        </tr>

                        <tr >

                        </tr>

                    </table>

                </td>

            </tr>

            <tr >
                <th colspan="4">辅助检查</th>
                <td colspan="20"><input type="text" class="input-full layui-input" name="v27" style="width: 90%"></td>
            </tr>

            <tr >
                <th colspan="4">服药依从性</th>
                <td colspan="20">
                    <input type="radio" name="v28" value="规律" title="规律">
                    <input type="radio" name="v28" value="间断" title="间断" >
                    <input type="radio" name="v28" value="不服药" title="不服药" >
                </td>
            </tr>

            <tr >
                <th colspan="4">药物不良反应</th>
                <td colspan="20">
                    <input type="radio" name="v29" value="无" title="无">
                    <input type="radio" name="v29" value="有" title="有" >
                    <input type="text" class="input-full layui-input" name="v30" >

            </tr>

            <tr >

<script type="text/javascript" th:src="@{/assets/js/layui-v2.9.16/layui/layui.js}"></script>
<script type="text/javascript" th:src="@{/assets/js/common.js}"></script>
<script type="text/javascript" th:src="@{/assets/js/jquery-1.11.1.js}"></script>
<script th:inline="javascript">
    layui.use(['form',"table",'treeSelect','notice','upload',"laydate"], function(){
        var form = layui.form;
        var $ = layui.jquery;
        var layer = layui.layer;
        var table = layui.table;
        var notice=layui.notice;
        var upload = layui.upload;
        var treeSelect= layui.treeSelect;
        layui.config({
            skin: 'blue'  // 设置主题为蓝色
        });
        form.on('submit(generatePDF)', function(data){
            window.print();
            return false;
        });
        $(".chooseName").on("click",function (){
            var closeIndex = layer.open({
                type: 1, // page 层类型
                area: ['800px', '600px'],
                title: '选择名字',
                shade: 0.6, // 遮罩透明度
                anim: 0, // 0-6 的动画形式，-1 不开启
                content: $("#addfolder"),
                success: function(layero, index){
                    // 在弹出层初始化完成后渲染表格
                    var regManageTb=table.render({
                        elem: '#tables',
                        url: '/newRegController/queryLocallyManagedArchives',
                        page: true,
                        limit : 10,
                        where : {regTime:""},
                        cols: [[
                            // {type: 'radio', fixed: 'left'},
                            {field:'userCode', title:'用户编号', fixed: 'center'},
                            {field: 'name', title: '姓名', align: 'center'},
                            {field: 'phone', align: 'center', title: '电话'} ,
                        ]],
                        parseData: function(res) {
                            if (res.code === 20000) {
                                return {
                                    "code": 0,
                                    "msg": res.msg || "",
                                    "count": res.count || 0,
                                    "data": res.data.data || []
                                };
                            } else {
                                return {
                                    "code": 1,
                                    "msg": res.msg || "获取数据失败",
                                    "count": 0,
                                    "data": []
                                };
                            }
                        },
                        done: function() {
                            $('#tables').css('visibility', 'visible');
                        }
                    });
                    $('#tables').css('visibility', 'hidden');


                    // 行单击事件( 双击事件为: rowDouble )
                    table.on('row(tables)', function(obj){
                        var data = obj.data; // 获取当前行数据
                        console.log(data,"这里是点击事件啊啊啊")
                        // 显示 - 仅用于演示

                        form.val("myForm", {
                            "v1": data.name,
                            "v2":data.id,
                        });

                        form.render();
                        layer.close(closeIndex);

                    });

                    form.on('submit(regManageQueryBtn)', function(data){
                        regManageTb.reload({
                            where : {
                                //这里注意一定要跟Bean 里面的属性对应
                                name:$('#name').val(),
                                regTime:"",
                            },
                            page : {
                                curr : 1
                            }

                        });
                        // 阻止表单跳转。如果需要表单跳转，去掉这段即可。
                        return false;
                    });


                },
                end: function () {
                    // 关闭弹出层时隐藏 addfolder
                    $("#addfolder").hide();
                }
            });
        });


        var laydate = layui.laydate;

        // 初始化年份选择器
        laydate.render({
            elem: '#yearPicker',
            type: 'year',
            theme: '#2d8cf0',
            format: 'yyyy',
            trigger: 'click'
        });

        var params = new URLSearchParams(window.location.search);
        var paramValue = params.get('medicalExaminationInformation');


        $('#add-disease-row').on('click', function() {
            var $lastRow = $('#disease-history-table').siblings('.disease-row').last();
            var rowCount = $('#disease-history-table').siblings('.disease-row').length;
            var $newRow = $('<tr class="disease-row"></tr>');

            $newRow.html(`
                 <th colspan="4">${rowCount + 1}</th>
                 <td colspan="7">
                     <input  type="text" class="input-full layui-input" name="add1" >
                 </td>

                 <td colspan="10">
