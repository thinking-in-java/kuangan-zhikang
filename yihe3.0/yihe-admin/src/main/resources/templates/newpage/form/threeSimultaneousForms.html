    layui.use(['form',"table",'treeSelect','notice','upload',"laydate"], function(){
        var form = layui.form;

            elem: '#yearPicker',
            type: 'year',
            theme: '#2d8cf0',
            format: 'yyyy',
            trigger: 'click'
        });

        var params = new URLSearchParams(window.location.search);

        selectForm(paramValue);
        form.on('submit(deleteRowBtn)', function(event){
            var row = event.elem.closest('tr');
            // 删除该行
            row.parentNode.removeChild(row);
            return false;
        });

        form.on('submit(preview)', function(data) {
            // 获取文件的 URL
            var url = data.elem.getAttribute('data-url');
            if(isPdfUrl(url) || isImageUrl(url)){
                window.open(url);
            }else{
                window.open("https://view.officeapps.live.com/op/view.aspx?src="+url, '_blank');
            }
            // 阻止表单默认提交行为
            return false;
        });

        form.on('submit(down)', function(data) {
            // 获取文件的 URL
            var url = data.elem.getAttribute('data-url');
            var name=data.elem.getAttribute("data-name");
            if(isPdfUrl(url) || isImageUrl(url)){
                fetchAndDownloadPDF(url,name);
            }else{
                window.open(url);
            }
            // 创建一个隐藏的 <a> 元素来触发下载


            // 阻止表单默认提交行为
            return false;
        });

        function isPdfUrl(url) {
            return /\.pdf$/i.test(url);
        }
        function isImageUrl(url) {
            return /\.(jpg|jpeg|png|gif|bmp|webp|svg)$/i.test(url);
        }
        let isDownloading = false;
        async function fetchAndDownloadPDF(url,name) {
            if (isDownloading) return;  // 如果正在下载，则不执行
            isDownloading = true;
            console.log('Function called');
            try {
                const response = await fetch(url);
                const blob = await response.blob();
                const blobUrl = window.URL.createObjectURL(blob);

                const a = document.createElement('a');
                a.href = blobUrl;
                a.download = name; // 设置下载文件的名称
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);

                // 释放 URL 对象
                window.URL.revokeObjectURL(blobUrl);
            } catch (error) {
                console.error('下载文件失败:', error);
            }finally {
                isDownloading = false;
            }
        }

        upload.render({
            elem: '#test1'
            ,url: '/YhUserFile/upload1' //必填项
            ,size:104857600
            ,accept:'file'
            ,before: function () {
                layer.msg('上传中', {
                    icon: 16,
                    shade: 0.01
                }); //上传loading
            }
            ,done: function(res,index,upload){
                console.log("上传返回",res)
                filesUrl = res.files;
                //上传完毕回调
                layer.close(layer.index); //关闭loading
                if (parseInt(res.code) === 0) {
                    parent.layer.msg("上传成功！");
                }
                // 创建新的行元素
                var newRow = document.createElement('tr');
                var newCell = document.createElement('td');
                newCell.innerHTML = `
                    <div class="file-row">
                        <div class="file-info">
                            <span>${res.name}</span>
                        </div>
                        <div class="actions">
                              <input type="text"  style="display: none" class="input-full layui-input" name="v9"  value="${res.files}">
                              <input type="text"  style="display: none" class="input-full layui-input" name="v10"  value="${res.name}">
                                <button title="修改" class="edit-btn" style="border: none; background: none; cursor: pointer;">
                                    <i class="layui-icon layui-icon-edit"></i>
                                </button>
                                <button title="预览" lay-submit="" lay-filter="preview" data-url="${res.files}">&#128065;</button>
                              <button title="下载" lay-submit=""  lay-filter="down" data-name="${res.name}"  data-url="${res.files}"  >&#8681;</button>
                              <button title="删除" lay-submit=""  lay-filter="deleteRowBtn"  >&#10006;</button>
                        </div>
                    </div>
                `;
                newRow.appendChild(newCell);
                document.getElementById('file-table').appendChild(newRow);
                newCell.querySelector('.edit-btn').onclick = function() {
                    event.preventDefault();
                    var currentName = res.name;
                    layer.prompt({
                        title: '修改文件名',
                        value: currentName,
                        formType: 0 // 输入框类型，0：单行文本
                    }, function(value, index) {
                        // 更新文件名逻辑
                        newCell.querySelector('.file-info span').innerText = value; // 更新显示的文件名
                        newCell.querySelector('input[name="v10"]').value = value; // 更新隐藏的文件名输入
                        layer.close(index); // 关闭输入框
                    });
                };
            }
            ,error : function(index,upload){
            }
        });

        form.on('submit(myFormSave)', function(data){
            console.log(data,"dddddddddddddddddddddddddddddddd")



            var v9Elements = document.querySelectorAll('input[name="v9"]');
            var v10Elements = document.querySelectorAll('input[name="v10"]');
            var pairs1 = [];
            var length1 = Math.min(v9Elements.length, v10Elements.length);
            for (var i = 0; i < length1; i++) {
                // 获取 v13 和 v14 的值，并将它们存储成对的形式
                var v13Value = v9Elements[i].value;
                var v14Value = v10Elements[i].value;
                pairs1.push({ v13: v13Value, v14: v14Value });
            }

            if ($(this).data('submitted') === true) {
                return false; // 阻止重复提交
            }
            $(this).data('submitted', true);

            if(paramValue){
                $.ajax({
                    type : 'post',
                    url : '/NewThreeSimultaneousController/updateNew',
                    data : {
                        id:paramValue,
                        stage:data.field.v1,
                        entryName:data.field.v3,
                        fileNames:data.field.v5,
                        archiveNumber:data.field.v6,
                        archiveYear:data.field.v7,
                        archiveTime:data.field.v8,
                        file1:JSON.stringify(pairs1),

                    },

                    success : function(data) {
                        if (data.code == 20000) {

                            notice.success({
                                title : '消息通知',
                                message : '操作成功!'
                            });

                            setTimeout(function() {
                                window.close();
                            }, 2000);
                        } else {
                            notice.error({
                                title : '消息通知',
                                message : '操作失败!'
                            });
                            setTimeout(function() {
                                window.close();
                            }, 2000);
                        }
                    }
                })
            }else{
                $.ajax({
                    type : 'post',
                    url : '/NewThreeSimultaneousController/insetNew',
                    data : {
                        orgCode:$("#guishu").val(),
                        stage:data.field.v1,
                        entryName:data.field.v3,
                        fileNames:data.field.v5,
                        archiveNumber:data.field.v6,
                        archiveYear:data.field.v7,
                        archiveTime:data.field.v8,
                        file1:JSON.stringify(pairs1),
                    },

                    success : function(data) {
                        if (data.code == 20000) {

                            notice.success({
                                title : '消息通知',
                                message : '操作成功!'
                            });

                            setTimeout(function() {
                                window.close();
                            }, 2000);
                        } else {
                            notice.error({
                                title : '消息通知',
                                message : '操作失败!'
                            });
                            setTimeout(function() {
                                window.close();
                            }, 2000);
                        }
                    }
                })
            }
            return false; // 阻止默认 form 跳转
        });


        function selectForm(paramValue){
            if(paramValue){
                $.ajax({
                    type:'get',
                    url:'/NewThreeSimultaneousController/selectById',
                    data:{id:paramValue},
                    success : function(data){
                        console.log("这里是查询出来的数据",data);
                        if(data.code==20000){
                            form.val("myForm", {
                                "v1": data.data.stage,
                                "v2":data.data.name,
                                "v3":data.data.entryName,
                                "v5":data.data.fileNames,
                                "v6":data.data.archiveNumber,
                                "v7":data.data.archiveYear?.substring(0, 4),
                                "v8":data.data.archiveTime?.substring(0, 10),

                            });
                            // if (treeInstance) {
                            //     treeInstance.checkNode('tree', data.data.orgCode); // 选中节点
                            //     $('#guishu').val(data.data.orgCode); // 更新表单输入值
                            // } else {
                            //     console.error("树形选择器尚未初始化完毕！");
                            // }

                            const pairsArr = JSON.parse(data.data.file1);

                            var fileTable = document.getElementById('file-table');


                            pairsArr.forEach(function(res) {
                                // 创建新的行元素
                                var newRow = document.createElement('tr');

                                // 创建新的单元格元素
                                var newCell = document.createElement('td');

                                // 设置单元格的 HTML 内容，包含文件名、隐藏的输入框、下载按钮和删除按钮
                                newCell.innerHTML = `
                                    <div class="file-row">
                                        <div class="file-info">
                                            <span>${res.v14}</span>
                                        </div>
                                        <div class="actions">
                                            <input type="text" style="display: none" class="input-full layui-input" name="v9" value="${res.v13}">
                                            <input type="text" style="display: none" class="input-full layui-input" name="v10" value="${res.v14}">
                                            <button title="修改" class="edit-btn" style="border: none; background: none; cursor: pointer;">
                                                <i class="layui-icon layui-icon-edit"></i>
                                            </button>
                                            <button title="预览" lay-submit="" lay-filter="preview" data-url="${res.v13}">&#128065;</button>
                                            <button title="下载" lay-submit=""  lay-filter="down" data-name="${res.v14}"  data-url="${res.v13}"  >&#8681;</button>
                                           <button title="删除" lay-submit=""  lay-filter="deleteRowBtn"  >&#10006;</button>
                                        </div>
                                    </div>
                                `;
                                newRow.appendChild(newCell);
                                fileTable.appendChild(newRow);
                                document.getElementById('file-table').appendChild(newRow);
                                newCell.querySelector('.edit-btn').onclick = function() {
                                    event.preventDefault();
                                    var currentName = res.name;
                                    layer.prompt({
                                        title: '修改文件名',
                                        value: currentName,
                                        formType: 0 // 输入框类型，0：单行文本
                                    }, function(value, index) {
                                        // 更新文件名逻辑
                                        newCell.querySelector('.file-info span').innerText = value; // 更新显示的文件名
                                        newCell.querySelector('input[name="v10"]').value = value; // 更新隐藏的文件名输入
                                        layer.close(index); // 关闭输入框
                                    });
                                };
                            });


                            $("#userCode").val(data.data.userCode);

                            form.render();
                        }

                    }
                })
            }


        }



        // 初始化表单
        form.render();
    });
