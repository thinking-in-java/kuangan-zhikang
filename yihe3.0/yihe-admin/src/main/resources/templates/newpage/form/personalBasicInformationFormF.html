<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" th:href="@{/assets/js/layui-v2.9.16/layui/css/layui.css}"/>

    <style>
        body{
            background:#F1F1F1
        }
        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
            border-color:rgb(144, 186, 221)
        }
        th, td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: rgb(231, 243, 252);
            font-size: 10pt;
            font-family: "Microsoft YaHei";
            word-break: break-word;
            overflow-wrap: break-word;
            text-align: center;
        }
        .section-title {
            text-align: center;
            font-weight: bold;
            background-color: #e6f7ff;
        }
        .input-full {
            width: 100%;
            box-sizing: border-box;
        }
        .radio-group {
            display: flex;
            align-items: center;
        }
        .radio-group label {
            margin-right: 10px;
        }
        .checkbox-group {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
        }
        .checkbox-group label {
            margin-right: 15px;
        }
        .heng{
            text-align: center;
            font-size: 10pt;
            font-family: "Microsoft YaHei";
            word-break: break-word;
            overflow-wrap: break-word;
        }
        .datainput{
            border-color: #eee !important;
            border-width: 1px;
        }

        .layui-form-checked[lay-skin=primary] i{
            border-color:#2d8cf0 !important;
            background-color:#FFF !important;
            color:#2d8cf0 !important;
            font-weight: bold;
        }

        .layui-form-checkbox[lay-skin=primary]:hover i{
            border-color:#2d8cf0 !important;
        }
        .layui-form-radio>i:hover, .layui-form-radioed>i{
            color: #2d8cf0 !important;
        }

        /* 覆盖 layui 的默认主题颜色 */
        .theme-colorful .layui-btn {
            height: 36px;
            line-height: 36px;
            border-radius: 4px;
            background-color: #2d8cf0;
            box-shadow: 0 1px 0 rgba(0, 0, 0, .03);
        }
        .layui-form-radio:hover>*, .layui-form-radioed, .layui-form-radioed>i{
            color: #2d8cf0 !important;
        }

        /*.layui-input {*/
        /*    border-color: #597FC0 !important;*/
        /*}*/

        /* ...其他元素样式 */
        /* 修改分页按钮的背景颜色和字体颜色 */
        .layui-laypage a {
            background-color: #f0f0f0; /* 设置按钮的背景颜色 */
            color: #333; /* 设置按钮的字体颜色 */
        }

        /* 鼠标悬停时按钮的背景颜色 */
        .layui-laypage a:hover {
            background-color: #fff;
            color: #2d8cf0;
        }

        /* 当前页的背景颜色和字体颜色 */
        .layui-laypage .layui-laypage-curr .layui-laypage-em {
            background-color: #2d8cf0; /* 当前页的背景颜色 */
            color: white; /* 当前页的字体颜色 */
        }

        @media print {
            .no-print {
                display: none !important;
            }
            @page {
                size: A4; /* 或者你可以指定其他页面大小 */
                margin: 1cm; /* 调整打印边距 */
            }
            body {
                width: 100%;
                height: 100%;
                zoom: 0.8; /* 缩小页面内容 */
            }
        }
        @page {
            /* 尝试去除默认的页眉和页脚 */
            margin: 0;
        }

</head>

<script type="text/javascript" th:src="@{/assets/js/jquery-1.11.1.js}"></script>
<script th:inline="javascript">
    layui.use(['form',"table",'treeSelect','notice'], function(){
        var form = layui.form;
        var $ = layui.jquery;
        var layer = layui.layer;
        var table = layui.table;
        var treeSelect= layui.treeSelect;
        var notice=layui.notice;
        layui.config({
            skin: 'blue'  // 设置主题为蓝色
        });
        var nations = [ "汉族", "蒙古族", "回族", "藏族", "维吾尔族", "苗族",
            "彝族", "壮族", "布依族", "朝鲜族", "满族", "侗族", "瑶族",
            "白族", "土家族", "哈尼族", "哈萨克族", "傣族", "黎族", "傈僳族",
            "佤族", "畲族", "高山族", "拉祜族", "水族", "东乡族", "纳西族",
            "景颇族", "柯尔克孜族", "土族", "达斡尔族", "仫佬族", "羌族",
            "布朗族", "撒拉族", "毛南族", "仡佬族", "锡伯族", "阿昌族",
            "普米族", "塔吉克族", "怒族", "乌孜别克族", "俄罗斯族", "鄂温克族",
            "德昂族", "保安族", "裕固族", "京族", "塔塔尔族", "独龙族",
            "鄂伦春族", "赫哲族", "门巴族", "珞巴族", "基诺族" ];

        var option = "";
        for (var i = 0; i < nations.length; i++) {
            option += '<option value="' + nations[i] + '">'
                + nations[i] + '</option>';
        }
        /*  console.log(option+"-----------");  */
        $(option).appendTo("#nation");

        form.on('submit(generatePDF)', function(data){
            window.print();
            return false;
        });
        //下拉框回显
        form.render("select");
        var params = new URLSearchParams(window.location.search);
        var paramValue = params.get('personalBasicInformation');

        $.ajax({
            type: "get",
            url: "/newRegController/searchForDoctors",
            dataType:"json",
            success: function(res){
                console.log(res,"------------------ddddddddddddddd------------------------");
                var option = "";
                for (var i = 0; i < res.data.length; i++) {
                    option += '<option value="' + res.data[i].userCode + '">'
                        + res.data[i].userName + '</option>';
                }
                $(option).appendTo("#responsibleHealthManager");
                form.render("select");
                selectForm(paramValue);
            }

        });
        // 添加行功能
        $('#add-disease-row').on('click', function() {
            var $lastRow = $('#disease-history-table').siblings('.disease-row').last();
            var rowCount = $('#disease-history-table').siblings('.disease-row').length;
            var $newRow = $('<tr class="disease-row"></tr>');

            $newRow.html(`
                <th colspan="1">序号</th>
                <td colspan="1">${rowCount + 1}</td>
                <th colspan="1">疾病</th>
                <td colspan="2"><input type="text" name="add1" class="input-full layui-input" placeholder="请输入疾病名称"></td>
                <th colspan="1">确诊时间</th>
                <td colspan="2"><input type="date" name="add2" class="input-full datainput layui-input"></td>
                <th colspan="1">其它</th>
                <td colspan="2"><input type="text" name="add3" class="input-full layui-input"></td>
                <td colspan="1"  style="text-align: center;" class="operation-btn"><i style="color: red;font-size: 30px;" class="layui-icon layui-icon-delete delete-btn"></i></td>
            `);

            if ($lastRow.length > 0) {
                $lastRow.after($newRow);
            } else {
                $('#disease-history-table').after($newRow);
            }

            bindDeleteEvents(); // 绑定删除事件
        });
        treeSelect.render({
            // 选择器
            elem: '#tree',
            // 数据
            data: '/YhUserMakeCard/showPullDownTree',
            // 异步加载方式：get/post，默认get
            type: 'get',
            // 占位符
            placeholder: '全部',
            // 是否开启搜索功能：true/false，默认false
            search: true,
            // 点击回调
            click: function(d){
                console.log($('#guishu').val(d.current.id));
            },
            // 加载完成后的回调函数
            success: function (d) {
                console.log(d);
            }

        });


        $('#add-disease-row1').on('click', function() {
            var $lastRow = $('#disease-history-table').siblings('.disease-row1').last();
            var rowCount = $('#disease-history-table').siblings('.disease-row1').length;
            var $newRow = $('<tr class="disease-row1"></tr>');

            $newRow.html(`

        function calculateAge(birthDate) {
            // 将传入的日期字符串转换为Date对象
            var birth = new Date(birthDate);
            var today = new Date();

            // 计算年份差
            var age = today.getFullYear() - birth.getFullYear();

            // 如果当前日期还没有到达出生月份和日期，则年龄减一
            var monthDifference = today.getMonth() - birth.getMonth();
            if (monthDifference < 0 || (monthDifference === 0 && today.getDate() < birth.getDate())) {
                age--;
            }

            return age;
        }
