<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport"
          content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>中医体质辨识</title>
    <link rel="stylesheet" th:href="@{/assets/libs/layui/css/layui.css}" />
    <link rel="stylesheet" th:href="@{/assets/module/admin.css}" />
    <!-- js部分 -->

    <style type="text/css">
        .layui-form-label {
            float: left;
            display: block;
            padding: 9px 15px;
            padding-top: 9px;
            padding-bottom: 9px;
            width: 43px;
            font-weight: 400;
            line-height: 20px;
            text-align: right;
        }

        .layui-form-item .layui-inline {
            margin-bottom: 1px;
            margin-right: 10px;
        }

        .layui-form-item {
            margin-bottom: 1px;
            clear: both;
            *zoom: 1;
        }

        .layui-table-box {
            min-height: 500px;
        }
    </style>

</head>
<body style="overflow-x: hidden; overflow-y: scroll">
<!-- 加载动画 -->
<div class="page-loading">
    <div class="ball-loader">
        <span></span><span></span><span></span><span></span>
    </div>
</div>


<div class="layui-row layui-col-space15" style="padding: 20px;">
    <div class="layui-card">

        <div class="layui-tab layui-tab-brief" lay-filter="indexTab">
            <div class="layui-tab-content">
                <input id="guishu" type="hidden" value="">
                <!-- 注册卡头部搜索 -->
                <div id="search-header">
                    <form id="regForm" lay-filter="regForm" class="layui-form queryForm">
                        <div class="layui-form-item">





                            <div class="layui-inline" style="margin-left: -3px;">
                                <label class="layui-form-label w-auto">姓名:</label>
                                <div class="layui-input-inline">
                                    <input id="name" class="layui-input" name="name" placeholder="姓名"
                                           style="width: 150px;" />
                                </div>
                            </div>

                            <div class="layui-inline">
                                <label class="layui-form-label" style="padding:9px 0px;text-align: left;">单位：</label>
                                <div class="layui-input-inline" style="width: 270px;">
                                    <input type="text" id="tree" lay-filter="tree"
                                           class="layui-input">
                                </div>
                            </div>


                            <div class="layui-inline" >
                                <label class="layui-form-label w-auto">部门:</label>
                                <div class="layui-input-inline">
                                    <input id="department" class="layui-input" name="department" placeholder="部门"
                                           style="width: 150px;" />
                                </div>
                            </div>


                            <div class="layui-inline" >
                                <label class="layui-form-label w-auto">性别:</label>
                                <div class="layui-input-inline mr0">

                                <select name="v25" id="gender">
                                    <option value="">全部</option>
                                    <option value="1">男</option>
                                    <option value="2">女</option>
                                </select>
                                </div>
                            </div>

                            <div class="layui-inline">
                                <label style="width: 80px" class="layui-form-label">建档时间：</label>
                                <div class="layui-input-inline" style="width: 297px;">
                                    <input type="text" class="layui-input" id="test10" name="startTime" placeholder=" - ">
                                </div>
                            </div>

                            <div class="layui-inline">
                                <label style="width: 85px" class="layui-form-label">健康管理师：</label>
                                <div class="layui-input-inline mr0">
                                    <select name="v22" id="responsibleHealthManager">
                                        <option value="">全部健康管理师</option>
                                    </select>
                                </div>
                            </div>



                            <div class="layui-inline" style="width: 0px;margin-top: -16px;/*! margin-right: 5px; */margin-right: 1px;">
                                <label class="layui-form-label"></label>
                                <div style="width: 300px" class="layui-input-inline">
                                    <button class="layui-btn icon-btn sousuoDN" lay-submit=""
                                            lay-filter="regManageQueryBtn">
                                        <i class="layui-icon"></i>搜索
                                    </button>
                                    <button class="layui-btn layui-btn-primary" id="symptoms" type="button">清除</button>
                                    <button  class="layui-btn icon-btn"  lay-submit=""  lay-filter="addregManageQueryBtn">
                                        <i class="layui-icon">&#xe654;</i>添加
                                    </button>

                                    <button  class="layui-btn icon-btn"  lay-submit=""  lay-filter="excelPort">
                                        导出
                                    </button>

                                </div>


                            </div>



                        </div>


                    </form>

                </div>
                <div id="piliang" class="layui-form toolbar" style="background-color: #e6f7ff;height: 50px;margin-top: 10px;margin-bottom: 10px;display: none;">
                    <span  style="line-height: 4;" id="xuanze">已选择**项</span>
                </div>
                <div class="layui-tab-item layui-show">
                    <table id="demo" lay-filter="demo"></table>
                </div>
            </div>
        </div>

    </div>
</div>
</body>

<script type="text/javascript" th:src="@{/assets/libs/layui/layui.js}"></script>
<script type="text/javascript" th:src="@{/assets/js/common.js}"></script>
<script type="text/javascript">

    // //搜索的方法
    // chaXun=function(){
    //     table.reload('suoyou', {
    //         where: { //设定异步数据接口的额外参数，任意设
    //             'name':$("#name1").val(),
    //             'reportLevel':$("#reportLevel1").val(),
    //             'qtime':$("#test10").val(),
    //             'userName':$("#userName").val(),
    //         }
    //     });
    // }

    layui.use(['laypage', 'layer','element', 'treeTable','table','form','treeSelect','laydate','util','upload'], function(){
        var laypage = layui.laypage;
        var layer = layui.layer;
        var element = layui.element;
        var table = layui.table;
        var form = layui.form;
        var $ = layui.jquery;
        var laydate = layui.laydate;
        var util = layui.util;
        var treeSelect= layui.treeSelect;
        var upload = layui.upload;
        var ids = new Array();// 勾选的id集合
        var table_data = new Array();// 表格数据缓存
        //初始化
        element.on('tab(indexTab)', function(data){
            table.reload('indexTab',{
                url: '/newRegController/selectRegInfo'  //数据接口
            })
        })


        var treeSelect = layui.treeSelect;
        var unitRootId = null;
        randtreesone();
        function randtreesone(){
            treeSelect.render({
                // 选择器
                elem : '#tree',
                // 数据
                data : '/YhOrgTree/showPullDownTree',
                // 异步加载方式：get/post，默认get
                type : 'get',
                // 占位符
                placeholder : '全部单位',
                // 是否开启搜索功能：true/false，默认false
                search : true,
                // 点击回调
                click : function(d) {
                    console.log(d,"---------------")
                    // 集团根节点代表全部单位，不把集团名称当作档案单位文本筛选。
                    $('#tree').val(String(d.current.id) === unitRootId ? '' : d.current.name);
                },
                // 加载完成后的回调函数
                success : function(d) {
                    console.log(d);
                    unitRootId = d.data && d.data.length ? String(d.data[0].id) : null;
                    // 保持首次查询不带单位限制；由用户主动选择具体煤矿/电厂。
                    // 不自动选中集团名称，也不触发第二次覆盖首次列表的查询。


                }
            });
        }

        $.ajax({
            type: "get",
            url: "/newRegController/searchForDoctors",
            dataType:"json",
            success: function(res){
                console.log(res,"------------------ddddddddddddddd------------------------");
                var option = "";
                for (var i = 0; i < res.data.length; i++) {
                    option += '<option value="' + res.data[i].userCode + '">'
                        + res.data[i].userName + '</option>';
                }
                $(option).appendTo("#responsibleHealthManager");
                form.render("select");
            }

        });
        laydate.render({
            elem: '#test10'
            ,type: 'datetime'
            ,range: true,
            trigger: 'click'
        });
        Date.prototype.getQuarter = function() {
            return Math.floor((this.getMonth() + 3) / 3);
        };

        //第一个实例
        var regManageTb = table.render({
            id : 'demo',
            elem: '#demo'
            ,url: '/newRegController/selectRegInfo'//数据接口
            ,method : 'get'
            ,where : {} // 你额外要携带数据，以键值对的方式存入
            ,page: true //开启分页
            ,limit : 20// 每页显示的条数
            ,limits : [ 5, 10, 20, 50, 100 ] // 每页条数的选择项
            ,loading : true // 是否显示加载条(切换分页的时候显示）
            ,scrollX: true
            ,sort:true
            ,cols: [ //表头
                [
                    {type: 'checkbox', fixed: 'left'},
                    {type:'numbers', title:'序号', align: 'center', style: 'white-space: nowrap;', width: 100}
                    ,{field: 'userCode', title: '用户编码', align: 'center', style: 'white-space: nowrap;', width: 150}
                    ,{field: 'name', title: '姓名', align: 'center', style: 'white-space: nowrap;', width: 150}
                    ,{field: 'sex', align: 'center', title: '性别', style: 'white-space: nowrap;', width: 100,templet:function (e) {
                        if(e.sex==1){
                            return '男'
                        }else{
                            return '女'
                        }
                    }}
                    ,{field: 'birth', align: 'center', title: '出生日期', style: 'white-space: nowrap;', width: 300}
                    ,{field: 'age', align: 'center', title: '年龄', style: 'white-space: nowrap;', width: 100},
                    {field: 'marriage', align: 'center', title: '婚姻', style: 'white-space: nowrap;', width: 100},
                    {field: 'idCard', align: 'center', title: '身份证号', style: 'white-space: nowrap;', width: 300},
                    {field: 'workUnit', align: 'center', title: '工作单位', style: 'white-space: nowrap;', width: 300},
                    {field: 'evaluationTime', align: 'center', title: '最近体检', style: 'white-space: nowrap;', width: 200,
                        templet: function (row)  {
                            const currentYear = new Date().getFullYear();
                            const evaluationTime = row.evaluationTime;
                            if (!evaluationTime || new Date(evaluationTime).getFullYear() !== currentYear) {
                                return '<span style="color: red;">今年未体检</span>';
                            } else {
                                return evaluationTime;
                            }
                        }},

                    {field: 'qtime', align: 'center', title: '最近评估', style: 'white-space: nowrap;', width: 200,
                        templet: function (row) {
                            const currentYear = new Date().getFullYear();
                            const currentQuarter = Math.floor((new Date().getMonth() + 3) / 3);

                            let latestDate = row.qtime ? new Date(row.qtime) : null; // 初始化 latestDate 为 qtime

                            // 检查 v1, v2, v3, v4，获取最新的 v15 时间
                            [row.v1, row.v2, row.v3, row.v4].forEach(v => {
                                if (v && v.length > 0) {
                                    try {
                                        const parsedArray = JSON.parse(v);
                                        parsedArray.forEach(item => {
                                            if (item.v15) {
                                                const itemDate = new Date(item.v15);
                                                if (!latestDate || itemDate > latestDate) {
                                                    latestDate = itemDate;
                                                }
                                            }
                                        });
                                    } catch (e) {
                                        console.error("JSON 解析失败:", e);
                                    }
                                }
                            });

                            // 判断最新时间是否为今年且是否属于本季度
                            if (!latestDate || latestDate.getFullYear() !== currentYear || Math.floor((latestDate.getMonth() + 3) / 3) !== currentQuarter) {
                                return '<span style="color: red;">本季度未评估</span>';
                            }

                            return latestDate.toLocaleString(); // 按需要调整时间格式
                        }

                    },
                    {field: 'interventionTime', align: 'center', title: '最近干预', style: 'white-space: nowrap;', width: 200,
                        templet: function (row) {
                            const interventionTime = row.interventionTime ? new Date(row.interventionTime) : null;
                            const currentYear = new Date().getFullYear();
                            const oneYearAgo = new Date();
                            oneYearAgo.setFullYear(currentYear - 1);

                            if (!interventionTime || interventionTime < oneYearAgo) {
                                return '<span style="color: red;">今年未干预</span>';
                            } else {
                                return interventionTime.toLocaleString(); // 可根据需要调整格式
                            }
                        }
                    },
                    {field: 'dfNames', align: 'center', title: '一般健康人群', style: 'white-space: nowrap;', width: 100,
                        templet: function (row) {
                            const isDfEmpty =row.dfNames;
                            const isSkEmpty =  row.skNames;
                            const qtime = row.qtime;

                            if(!qtime){
                                return "--"
                            }
                            if (isDfEmpty=='否' && isSkEmpty=='否') {
                                return '<span >是</span>'; // Both empty or "否"
                            } else if (isDfEmpty && isSkEmpty !== '否') {
                                return '<span style="color: red;">否</span>'; // dfNames is empty, skNames is "是"
                            } else if (!isDfEmpty && isSkEmpty) {
                                return '<span style="color: red;">否</span>'; // dfNames is "是", skNames is empty
                            } else {
                                return '<span style="color: red;">否</span>'; // Both are "是"
                            }
                        }},
                    {field: 'dfNames', align: 'center', title: '高危人群', style: 'white-space: nowrap;', width: 100,
                        templet: function (row) {
                            const isDfEmpty = row.dfNames;
                            const qtime = row.qtime;
                            if(!qtime){
                                return "--"
                            }
                            if (isDfEmpty=="是") {
                                return '<span style="color: red;">是</span>'; // Both empty or "否"
                            } else{
                                return '<span >否</span>'; // dfNames is empty, skNames is "是"
                            }
                        }},
                    {field: 'skNames', align: 'center', title: '患病人群', style: 'white-space: nowrap;', width: 100,
                        templet: function (row) {
                            const qtime = row.qtime;

                            if(!qtime){
                                return "--"
                            }
                            const isDfEmpty = row.skNames;
                            if (isDfEmpty=="是") {
                                return '<span style="color: red;">是</span>'; // Both empty or "否"
                            } else  {
                                return '<span >否</span>'; // dfNames is empty, skNames is "是"
                            }
                        }},
                    {field: 'dname', align: 'center', title: '责任健管师', style: 'white-space: nowrap;', width: 200},


                    {field: 'insertDate', align: 'center', title: '建档日期', style: 'white-space: nowrap;', width: 200},

                    {field: 'phone', align: 'center', title: '本人电话', style: 'white-space: nowrap;', width: 200}
                    ,{ title: '操作', toolbar : '#tableBar',align: 'center', style: 'white-space: nowrap;', width: 300,fixed: 'right' }
                ]
            ],
            response : {

                statusCode : 0
                //规定成功的状态码，默认：0

            },
            parseData : function(res) { //将原始数据解析成 table 组件所规定的数据
                if (!res || !res.data || !Array.isArray(res.data.data)) {
                    return {code: 1, msg: (res && (res.message || res.msg)) || '档案查询失败，请刷新或重新登录', count: 0, data: []};
                }
                return {
                    "code" : res.data.code, //解析接口状态
                    "msg" : res.data.msg, //解析提示文本
                    "count" : res.data.count, //解析数据长度
                    "data" : res.data.data
                    //解析数据列表
                }

            },
            done: function(res, curr, count){
                table_data = res.data;
                for(var i=0;i<res.data.length;i++){
                    for(var j=0;j<ids.length;j++){
                        if(res.data[i].id==ids[j]){
                            //这里才是真正的有效勾选
                            res.data[i]["LAY_CHECKED"]='true';
                            //找到对应数据改变勾选样式，呈现出选中效果
                            var index= res.data[i]['LAY_TABLE_INDEX'];
                            $('.layui-table tr[data-index=' + index + '] input[type="checkbox"]').prop('checked', true);
                            $('.layui-table tr[data-index=' + index + '] input[type="checkbox"]').next().addClass('layui-form-checked');
                        }
                    }
                }
                var checkStatus = table.checkStatus('test');

                if(count > 20) {
                    $(".layui-table-page").show();
                }else {
                    $(".layui-table-page").hide();
                }
            }
        });

        //清除按钮
        //清除按钮
        $("#symptoms").click(function(){
            window.location.reload()

        })

        table.on('checkbox(demo)', function (obj) {
            console.log("==========",obj);

            if(obj.checked==true){
                if(obj.type=='one'){
                    ids.push(obj.data.id);
                    console.log("点击一个复选框",ids)
                }else{
                    for(var i=0;i<table_data.length;i++){
                        ids.push(table_data[i].id);

                    }
                }
            }else{
                if(obj.type=='one'){
                    for(var i=0;i<ids.length;i++){
                        if(ids[i]==obj.data.id){
                            //ids.pop();
                            ids.splice(i,1);
                            console.log("------111-------",ids[i])

                        }
                    }
                }else{
                    var page = $("#demo .layui-laypage-curr").text();
                    let startIndex = (page - 1) * 20
                    let endIndex = page * 20
                    let curPageIds = table_data.map(function(item, index) {
                        if (startIndex <= index >= endIndex) {
                            return item.id
                        }
                    })
                    ids = ids.filter(item => !curPageIds.includes(item))
                }
            }

            //norepeat(ids);
            if(ids.length>0){
                $("#piliang").show();
                if(obj.type=="all"){
                    console.log("进入全选")
                    ids.sort();
                    for(var i = 0;i < ids.length-1;i++){
                        if(ids[i]==ids[i+1]){
                            ids.splice(i+1,1);
                            i--;
                        }
                    }
                }
                $("#xuanze").html("已选择"+ids.length+"项")
            }else{
                $("#piliang").hide();
            }
            console.log("所有id",ids);
        });

        //头部搜素表单提交
        form.on('submit(regManageQueryBtn)', function(data){
            regManageTb.reload({
                where : {
                    //这里注意一定要跟Bean 里面的属性对应
                    'name':$("#name").val(),
                    'workUnit':$("#tree").val(),
                    'department':$("#department").val(),
                    "regTime":$('#test10').val(),
                    "sex":$("#gender").val(),
                    "Times":$("#test10").val(),
                    "responsibleHealthManagerCode":$("#responsibleHealthManager").val()

                },
                page : {
                    curr : 1
                }
            });


            // 阻止表单跳转。如果需要表单跳转，去掉这段即可。
            return false;
        });

        form.on('submit(addregManageQueryBtn)', function(data){
            // console.log(data.elem, "1");//被执行事件的元素DOM对象，一般为button对象
            window.open("/manage/newpage/personalBasicInformationForm");


            // 阻止表单跳转。如果需要表单跳转，去掉这段即可。
            return false;
        });

        form.on('submit(excelPort)',function (){
            var checkStatus = table.checkStatus('demo');
            var selectedData = checkStatus.data;
            var selectedNumbers = selectedData.map(function(row) {
                console.log(row,"-----------------");
                return row.id; // Layui 从0开始，因此加1得到序号
            });
            if (ids.length === 0) {
                layer.msg('请至少选择一行数据'); // 提示用户
                return false;
            }
            const queryString = `/newRegController/exportXls?` +
                ids.map(type => `&u=${type}`).join('');
            window.location.href=queryString;
            console.log('选中的序号：', selectedNumbers);




            return false;
        });




        //查看跳转
        table.on('tool(demo)', function(obj) { //注：tool是工具条事件名，test是table原始容器的属性 lay-filter="对应的值"
            var data = obj.data;
            console.log(data)
            var layEvent = obj.event;
            if (layEvent === 'look') { //查看
                window.open("/manage/newpage/personalBasicInformationFormG?personalBasicInformation="+data.id+"");
            }else if(layEvent === 'edit'){
                window.open("/manage/newpage/personalBasicInformationForm?personalBasicInformation="+data.id+"");
            }else if(layEvent === 'delete'){
                layer.confirm('确定要删除“' + obj.data.name + '”吗？', {
                    skin: 'layui-layer-admin',
                    shade: .1
                }, function (i) {
                    layer.close(i);
                    layer.load(2);
                    $.get('/newRegController/delete', {
                        id: obj.data.id
                    }, function (res) {
                        layer.closeAll('loading');
                        if (res.code == 20000) {
                            layer.msg(res.msg, {icon: 1});
                            regManageTb.reload({
                                where : {
                                    //这里注意一定要跟Bean 里面的属性对应
                                    'name':$("#name").val(),
                                    'workUnit':$("#tree").val(),
                                    'department':$("#department").val(),
                                    "regTime":$('#test10').val(),
                                    "sex":$("#gender").val(),
                                    "Times":$("#test10").val(),
                                    "responsibleHealthManagerCode":$("#responsibleHealthManager").val()

                                }
                            });
                        } else {
                            layer.msg(res.msg, {icon: 2});
                        }
                    }, 'json');
                });
            }
        });
    });
</script>
<script type="text/html" id="tableBar">
    <a href="#" style="color:#36A4FF" lay-event="look">查看</a>
    <a href="#" style="color:#36A4FF" lay-event="edit">编辑</a>
    <a href="#" style="color:red" lay-event="delete">删除</a>
</script>
</html>
