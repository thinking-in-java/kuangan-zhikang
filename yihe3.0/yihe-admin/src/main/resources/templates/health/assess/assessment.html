	<script  th:inline="javascript">
		layui
				.use(
						[ 'layer', 'form', 'table', 'util', 'dropdown',
								'laypage', 'treeSelect', 'element','laydate' ,'upload'],
						function() {
							var $ = layui.jquery;
							var layer = layui.layer;
							var form = layui.form;
							var table = layui.table;
							var util = layui.util;
							var dropdown = layui.dropdown;
							var laypage = layui.laypage;
							var element = layui.element;
							 var laydate = layui.laydate;
							var upload = layui.upload;
							 //日期时间范围
							  laydate.render({
							    elem: '#test10'
							    ,type: 'datetime'
							    ,range: true,
								  trigger: 'click'
							  });
					        //下载导入模板
							$('#downloadpinggu').click(function(){
								window.open('/YhAssessmentcontroller/downloadExcel','_self');
								// window.location.href='/YhUserReginfo/downloadExcel';
							});
							//指定允许上传的文件类型
							upload.render({
								elem: '#uploadDatapinggu',
								url: '/YhAssessmentcontroller/import',
								exts : 'xls|xlsx',
								method:'post',
								accept: 'file', //普通文件
								choose:function(res){
									layer.msg("正在批量评估,请稍后...",{
										icon:16,
										shade: [0.8, '#f5f5f5'],
										time:-1
									});
								},
								done: function(res,index,upload){
									layer.closeAll();
									if(res.code==200){
										/* layer.alert("导入成功，"+res.msg); */
										layer.confirm("评估成功！", {
											btn : [ '确定']//按钮
										}, function(index) {
											layer.close(index);
											//此处调用刷新页面代码
											location.reload();//刷新页面
											//window.parent.location.reload();
										});

										/* table.reload('regManageTb',{
                                            url:'/YhUserMakeCard/page'
                                        })  */

									}else if(res.code==500){
										layer.alert("导入失败，"+res.msg);
									}

								},
								error : function(index,upload){
									layer.msg("文件上传异常！");
								}

							});
							//指定允许上传的文件类型
							upload.render({
								elem: '#uploadDatapinggu2',
								url: '/YhAssessmentcontroller/importTest',
								exts : 'xls|xlsx',
								method:'post',
								accept: 'file', //普通文件
								choose:function(res){
									layer.msg("正在批量评估,请稍后...",{
										icon:16,
										shade: [0.8, '#f5f5f5'],
										time:-1
									});
								},
								done: function(res,index,upload){
									layer.closeAll();
									if(res.code==200){
										/* layer.alert("导入成功，"+res.msg); */
										layer.confirm("评估成功！", {
											btn : [ '确定']//按钮
										}, function(index) {
											layer.close(index);
											//此处调用刷新页面代码
											location.reload();//刷新页面
											//window.parent.location.reload();
										});

										/* table.reload('regManageTb',{
                                            url:'/YhUserMakeCard/page'
                                        })  */

									}else if(res.code==500){
										layer.alert("导入失败，"+res.msg);
									}

								},
								error : function(index,upload){
									layer.msg("文件上传异常！");
								}

							});
							// 渲染表格
					        var insTb = table
							.render({
								elem : '#tableTbBas2',
								url : '../../template/IntelligentGrouping.json',
								 
								page : false,
								cols : [ [ {type: 'checkbox'},
							                {field: 'risk', align: 'center',width:203,   title: '风险等级'},
							                {field: 'grade', align: 'center',width:203,   title: '管理等级'}
							                ] ],done: function(res, page, count){
							                    //可以自行添加判断的条件是否选中
