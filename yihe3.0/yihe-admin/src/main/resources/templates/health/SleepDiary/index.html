<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
<meta name="viewport"
	content="width=device-width, initial-scale=1, maximum-scale=1">
<title>睡眠日记管理</title>
<link rel="stylesheet" th:href="@{/assets/libs/layui/css/layui.css}" />
<link rel="stylesheet" th:href="@{/assets/module/admin.css}" />
<style type="text/css">
	.layui-table-box {
 min-height:425px;
}
</style>
</head>
<body>
	<!-- 加载动画 -->
	<div class="page-loading">
		<div class="ball-loader">
			<span></span><span></span><span></span><span></span>
		</div>
	</div>
	 
	 

	<div class="layui-tab layui-tab-brief" style="margin:0">
		 
		<div class="layui-tab-content">
			<div class="layui-tab-item layui-show">
				<div class="layui-fluid" style="padding:0">
					<div class="layui-card">
						<div class="layui-card-body">

							<div class="layui-form toolbar" style="margin-left: -24px;">
								<div class="layui-form-item">
									 
									<div class="layui-inline">
						                        <label style="padding-right: 0px;" class="layui-form-label w-auto">解读结果：</label>
						                        <div class="layui-input-inline mr0"	>
						                           <select name="result" id="result" lay-filter="mySelect">
												      <option value="">全部</option>
												      <option value="入睡时间太晚">入睡时间太晚</option>
												      <option value="睡眠质量不佳">睡眠质量不佳</option>
												      <option value="睡眠不足">睡眠不足</option>
												      <option value="睡多了">睡多了</option>
												      <option value="良好">良好</option>
												   </select>
						                        </div>
						             </div>

									<div class="layui-inline">
										<label class="layui-form-label">姓&emsp;&emsp;名：</label>
										<div class="layui-input-inline">
											<input name="name" id="name" class="layui-input"
												type="text" placeholder="输入姓名" />
										</div>
									</div>
									<div class="layui-inline">
										<label class="layui-form-label">账&emsp;&emsp;号：</label>
										<div class="layui-input-inline">
											<input name="Username" id="Username" class="layui-input"
												type="text" placeholder="输入账号" />
										</div>
									</div>
									<div class="layui-inline">
										<label class="layui-form-label">时间：</label>
										<div class="layui-input-inline" style="width: 300px">
											<input type="text" class="layui-input" id="test10" placeholder=" - ">
										</div>
									</div>

									<div class="layui-inline" style="padding-left: 20px;">
										<button class="layui-btn sousuoDN" data-type="reload" onclick="solo()"><i class="layui-icon"></i>搜索</button>
										<button class="layui-btn layui-btn-primary" id="btnempty" lay-submit="" lay-filter="reset">清除</button>
								
									</div>
 

								</div>
							</div>
							 
							<table class="layui-hide" id="pinggu"  lay-filter="pinggu"></table>

						</div>
					</div>
				</div>

			</div>
			<!-- 评估记录 -->
			 

		</div>
	</div>
	<!-- 正文开始 -->


	<!-- 表格操作列 -->
	<script type="text/html" id="tableBar">
    <a class="layui-btn layui-btn-primary layui-btn-xs" lay-event="edit">查看</a>
</script>
	 


	<!-- js部分 -->
	<script type="text/javascript" th:src="@{/assets/libs/layui/layui.js}"></script>
	<script type="text/javascript" th:src="@{/assets/js/common.js}"></script>
	<script>
	layui.use(['layer', 'form', 'admin', 'util','treeSelect', 'table','laydate'], function () {
		   var $ = layui.jquery;
		      var layer = layui.layer;
		      var form = layui.form;
		      var admin = layui.admin;
		      var util = layui.util;
		      var treeSelect= layui.treeSelect;
				var table = layui.table;
				var laydate=layui.laydate;
							  
				
				   table.on('tool(pinggu)', function(obj) { //注：tool是工具条事件名，test是table原始容器的属性 lay-filter="对应的值"
						            var data = obj.data;
						            var layEvent = obj.event;
						            if (layEvent === 'edit') { // 查看
						            	window.open("/manage/register/userIndex?page=sleepDiary&userCode="+data.usercode+""); 
						            }
						        });
								
				 //清除按钮
			        $("#btnempty").click(function(){
			        	window.location.reload()
			         
			        })
							 //日期时间范围
							  laydate.render({
							    elem: '#test10'
							    ,type: 'datetime'
							    ,range: true,
								  trigger: 'click'
							  });
						 
							
							//搜索的方法
							   solo=function(){
							     table.reload('mealBank', {
							        where: { //设定异步数据接口的额外参数，任意设
							        'name':$("#name").val(),
							        'Username':$("#Username").val(),
							        'sleepDiarytime':$("#test10").val(),
							        'result':$("#result").val()
							       }
							      });
							     
							    }
							
							     //今天的时间
								  var day2 = new Date();
								  day2.setTime(day2.getTime());
								  var s2 = day2.getFullYear()+"-" + ((day2.getMonth()+1)>=10?(day2.getMonth()+1):"0"+(day2.getMonth()+1)) + "-" + ((day2.getDate())>=10?(day2.getDate()):"0"+(day2.getDate()))+" "+"00:00:00";
								  var s3 = day2.getFullYear()+"-" + ((day2.getMonth()+1)>=10?(day2.getMonth()+1):"0"+(day2.getMonth()+1)) + "-" + ((day2.getDate())>=10?(day2.getDate()):"0"+(day2.getDate()))+" "+"23:59:59";
						        var flagStr = '[[${strTime}]]'
						        var test10Value=null;
									if('1'==flagStr){
										$("#test10").val(s2+" - "+s3)
										test10Value=s2+" - "+s3;
									}
						        

							var insTb = table.render({
								elem : '#pinggu',
								url : '/YhSleepUserDiaryController/showSleepDiaryPor',
								method:'post',
								cellMinWidth : 50, //全局定义常规单元格的最小宽度，layui 2.2.1 新增
								page : true,
								where: {sleepDiarytime:test10Value},
								cols : [ [{
									type : 'numbers',
									title : '序号'
								},{
									field : 'username',
									title : '账号'
								}, {
									field : 'name',
									title : '姓名',
									width : 100

								} ,{field:'sleepDiarytime', title:'日期',sort : true,
									templet : "<div>{{layui.util.toDateString(d.sleepDiarytime, 'yyyy-MM-dd')}}</div>"}
								 
							      ,{field:'duration', title:'睡眠时长', sort: true}
							      ,{field:'result', title:'解读结果', sort: true}
							      , {
									align : 'center',
									toolbar : '#tableBar',
									title : '操作',
									minWidth : 200
								} ] ],
								id : 'mealBank',
						  		page : true,
						  		done: function(res, curr, count){
						  	         if(count > 20) {
						  	          $(".layui-table-page").show();
						  	         }else {
						  	          $(".layui-table-page").hide();
						  	         }
						  	       }
							});
							
						
							
 
						});
		
		

	</script>
</body>

</html>
