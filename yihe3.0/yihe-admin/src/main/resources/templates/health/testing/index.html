<div class="layui-card">

									<div class="layui-inline">
										<label class="layui-form-label">账&emsp;&emsp;号：</label>

												type="text" placeholder="输入账号" />

	<!-- js部分 -->
	<script type="text/javascript" th:src="@{/assets/libs/layui/layui.js}"></script>
	<script type="text/javascript" th:src="@{/assets/js/common.js}"></script>
	<script>
		layui
				.use(
						[ 'layer', 'form', 'table',
								'laypage', 'treeSelect', 'admin','element','laydate'
								 ],
						function() {
							var $ = layui.jquery;
							var layer = layui.layer;
							var form = layui.form;
							var table = layui.table;
							var laypage = layui.laypage;
							var element = layui.element;
							var admin = layui.admin;
							var form = layui.form;
							var treeSelect = layui.treeSelect;
							 var laydate = layui.laydate;

							 //日期时间范围
							  laydate.render({
							    elem: '#test10'
							    ,type: 'datetime'
							    ,range: true,
								  trigger: 'click'
							  });

							//监听Tab切换
							element.on('tab(demo)', function(data) {
								/* layer.tips('切换了 ' + data.index + '：'
										+ this.innerHTML, this, {
									tips : 1
								}); */
							});


							treeSelect.render({
								// 选择器
								elem : '#tree',
								// 数据
								data : '/YhUserMakeCard/showPullDownTree',
								// 异步加载方式：get/post，默认get
								type : 'get',
								// 占位符
								placeholder : '全部',
								// 是否开启搜索功能：true/false，默认false
								search : true,
								// 点击回调
								click : function(d) {

									console.log($('#tree').val(d.current.id));
								},
								// 加载完成后的回调函数
								success : function(d) {
									console.log(d);
								}
							});
							  table.on('tool(pinggu)', function(obj) { //注：tool是工具条事件名，test是table原始容器的属性 lay-filter="对应的值"
						            var data = obj.data;
						            var layEvent = obj.event;
						            if (layEvent === 'edit') { // 查看
						            	window.open("/manage/register/userIndex?page=health&userCode="+data.usercode+"&type2=healthy");
						            }
						        });


							//这是Layui 给 后台添加的映射  映射controller 的实体类
							var $ = layui.$, active2 = {
								reload : function() {
									//获取 上面input 值

									var username = $('#username').val();
									var usernameLike = $('#usernameLike').val();
									var tree = $('#tree').val();

									//执行重载
									table.reload('pinggu', {
										page : {
											curr : 1
										//重新从第 1 页开始
										},
										where : {
											//这里注意一定要跟Bean 里面的属性对应
											orgid : tree,
											username : username,
											usernameLike:usernameLike

										}
									});
								}
							};


							//这个是搜索按钮事件， 找到你的搜索按钮 获取搜索按钮点击事件。只需要把$(’’)这里面的内容修改了就可以了。
							$('.sousuoDN').on('click', function() {

								var type = $(this).data('type');
								active2[type] ? active2[type].call(this) : '';

							});
							  //清除按钮
					        $("#btnempty").click(function(){
					        	window.location.reload()

					        })
					          //清除按钮
					        $("#btnempty2").click(function(){

					        	var index = layer.load(1); //添加laoding,0-2两种方式


									 $('#usernameLike2').val("");
										  $('#nameLike2').val("");
									 $("#infoType").val("体温");
									 $('#test10').val("");
									 form.render('select');

										var index = layer.load(1); //添加laoding,0-2两种方式
							        	 //返回数据关闭loadin
							        	 table.reload('fenzu', {
							        		 url:'/testIng/findTestingListRecord',
							        		 page: {curr:1},
							        		 where: {
							        			 typename : "体温",
													usernameLike : "",
													nameLike:"",
													infoTime:null,
							        		 }

							        		 },'data')
							        		 layer.close(index);


					        })


							//这是Layui 给 后台添加的映射  映射controller 的实体类
							var $ = layui.$, active = {
								reload : function() {
									//获取 上面input 值

									var usernameLike2 = $('#usernameLike2').val();
									var nameLike2 = $('#nameLike2').val();
									var infoType = $('#infoType').val();
									var infoTime = $('#test10').val();

									//执行重载
									table.reload('fenzu', {
										page : {
											curr : 1
										//重新从第 1 页开始
										},
										where : {
											//这里注意一定要跟Bean 里面的属性对应
											typename : infoType,
											usernameLike : usernameLike2,
											nameLike:nameLike2,
											infoTime:infoTime,

										}
									});
								}
							};


							//这个是搜索按钮事件， 找到你的搜索按钮 获取搜索按钮点击事件。只需要把$(’’)这里面的内容修改了就可以了。
							$('.sousuo2').on('click', function() {

								var type = $(this).data('type');
								active[type] ? active[type].call(this) : '';

							});

							var insTb = table.render({
								elem : '#pinggu',

								url : '/testIng/findTestingListInfo',
								autoSort: false, 	//关闭前端排序 使用后端排序
								cellMinWidth : 50, //全局定义常规单元格的最小宽度，layui 2.2.1 新增
								page : true,
								cols : [ [{
									type : 'numbers',
									title : '序号'
								}, {
									field : 'usercode',
									title : '用户编号',
									width : 140
								},{
									field : 'username',
									title : '账号',
									width : 200
								}, {
									field : 'name',
									title : '姓名',
									width : 100

								}, {
									field : 'sex',
									title : '性别',
									width : 80
								}, {
									field : 'testTime',
									title : '最新检测时间',
									sort : true
								}, {
									field : 'testNum',
									title : '检测项'

								},{

									toolbar : '#demoYCInfo',
									title : '异常项'

								}, {
									align : 'center',
									toolbar : '#tableBar',
									title : '操作',
									minWidth : 200
								} ] ],
								response : {

									statusCode : 0
								//规定成功的状态码，默认：0

								},

								parseData : function(res) { //将原始数据解析成 table 组件所规定的数据
									return {
										"code" : res.data.code, //解析接口状态
										"msg" : res.data.msg, //解析提示文本
										"count" : res.data.count, //解析数据长度
										"data" : res.data.data
									}

								},
								 done: function (res, curr, count) {
									 if(count > 10) {
								        	$("#tiwen2 .layui-table-page").show();
								        }else {
								        	$("#tiwen2 .layui-table-page").hide();
								        }
								 }
							});




							table.on('sort(pinggu)', function(obj){ //注：tool是工具条事件名，test是table原始容器的属性 lay-filter="对应的值"
								//尽管我们的 table 自带排序功能，但并没有请求服务端。
								//有些时候，你可能需要根据当前排序的字段，重新向服务端发送请求，从而实现服务端排序，如：
								var username = $('#username').val();
								var usernameLike = $('#usernameLike').val();
								var tree = $('#tree').val();


								table.reload('pinggu', {
									initSort: obj, //记录初始排序，如果不设的话，将无法标记表头的排序状态。 layui 2.1.1 新增参数
									page : {
										curr : 1
										//重新从第 1 页开始
									}

									,where: { //请求参数（注意：这里面的参数可任意定义，并非下面固定的格式）
										//这里注意一定要跟Bean 里面的属性对应
										orgid : tree,
										username : username,
										usernameLike:usernameLike,

										field: obj.field //排序字段
										,order: obj.type //排序方式
									}
								});
							});


						      //今天的时间
							  var day2 = new Date();
							  day2.setTime(day2.getTime());
							  var s2 = day2.getFullYear()+"-" + ((day2.getMonth()+1)>=10?(day2.getMonth()+1):"0"+(day2.getMonth()+1)) + "-" + ((day2.getDate())>=10?(day2.getDate()):"0"+(day2.getDate()))+" "+"00:00:00";
							  var s3 = day2.getFullYear()+"-" + ((day2.getMonth()+1)>=10?(day2.getMonth()+1):"0"+(day2.getMonth()+1)) + "-" + ((day2.getDate())>=10?(day2.getDate()):"0"+(day2.getDate()))+" "+"23:59:59";
					        var flagStr = '[[${strTime}]]'
					        var test10Value=null;
								if('1'==flagStr){
									element.tabChange('demo', 2);
									$("#test10").val(s2+" - "+s3)
									test10Value=s2+" - "+s3;
								}

							var insTb2 = table.render({
								elem : '#fenzu',
								url : '/testIng/findTestingListRecord',
								cellMinWidth : 50, //全局定义常规单元格的最小宽度，layui 2.2.1 新增
								page : true,
								where: {infoTime:test10Value},
								cols : [ [ {
									type : 'numbers',
									title : '序号'
								}, {
									field : 'usercode',
									title : '用户编号',
									width : 160
								},{
									field : 'username',
									title : '账号',
									width : 240
								}, {
									field : 'name',
									title : '姓名',
									width : 240

								}, {
									field : 'sex',
									title : '性别',
									width : 110
								}, {
									field : 'infoName',
									title : '检测项',
									sort : true,
									width : 280
								}, {
									field : 'result',
									title : '结果',
									sort : true,
									width : 280
								}, {
									field : 'infoTime',
									title : '检测时间',
									sort : true,
									width : 230
								}] ],
								response : {

									statusCode : 0
								//规定成功的状态码，默认：0

								},

								parseData : function(res) { //将原始数据解析成 table 组件所规定的数据
									return {
										"code" : res.data.code, //解析接口状态
										"msg" : res.data.msg, //解析提示文本
										"count" : res.data.count, //解析数据长度
										"data" : res.data.data
									//解析数据列表
									}

								},
								 done: function (res, curr, count) {
									 if(count > 10) {
								        	$("#tiwen3 .layui-table-page").show();
								        }else {
								        	$("#tiwen3 .layui-table-page").hide();
								        }
								 }
							});

						});
	</script>
</body>
