																					type : "post",
																					url : "/intervene/addGroupInfo",
																					contentType : 'application/json;charset=UTF-8', //发送信息至服务器时内容编码类型
																					traditional : true, //传统的方式来序列化数据
																					data : JSON
																							.stringify(data.field),
																					success : function(
																							data) {

																					}
																				});

																	}
																	insTb2
																			.reload(
																					'fenzu',
																					{
																						url : '/intervene/findGroupListInfo',
																						where : {}
																					});
																	layer
																			.close(dIndex);
																 
																});
											}
										});
							}

							// 工具条点击事件
							table
									.on(
											'tool(fenzu)',
											function(obj) {
												var data = obj.data;
												var id = data.uDocgroupId;
												var layEvent = obj.event;
												if (layEvent === 'edit') { // 修改
													showEditModel(data);
												} else if (layEvent === 'del') { // 删除
													layer
															.confirm(
																	'真的删除行么',
																	function(
																			index) {
																		obj
																				.del(); //删除对应行（tr）的DOM结构
																		layer
																				.close(index);
																		//向服务端发送删除指令
																		$
																				.post(
																						"/intervene/delGroupInfo",
																						{
																							uDocgroupId : id
																						},
																						function(
																								result) {
																							insTb2
																									.reload(
																											'fenzu',
																											{
																												url : '/intervene/findGroupListInfo',
																												where : {}
																											});
																						});
																	});

												}

											});

						 
							 table.on('tool(pinggu)', function(obj) {  
						            var data = obj.data;
						            var layEvent = obj.event;
						            console.log(obj)
						            if (layEvent === 'edit') { // 查看
						            	window.open("/manage/register/userIndex?page=summary&userCode="+data.usercode+"&type2=2");
						            }
						        });

							var insTb2 = table.render({
								elem : '#fenzu',
								url : '/intervene/findGroupListInfo',
							 
								page : true,
								cols : [ [ {
									type : 'numbers',
									title : '序号'
								}, {
									field : 'gname',
									title : '分组名'
								}, {
									field : 'userCount',
									title : '组员数量',
									sort : true,
									width : 160
								}, {
									field : 'establishTime',
									title : '创建时间',
									sort : true,
									width : 260
								}, {
									align : 'center',
									toolbar : '#tableBar',
									title : '操作',
									width : 160
								} ] ],
								response : {

									statusCode : 0
								//规定成功的状态码，默认：0

								},

								parseData : function(res) { //将原始数据解析成 table 组件所规定的数据
									return {
										"code" : res.data.code, //解析接口状态
										"msg" : res.data.msg, //解析提示文本
										"count" : res.data.count, //解析数据长度
										"data" : res.data.data
									//解析数据列表
									}

								}
							});

						});
	</script>
