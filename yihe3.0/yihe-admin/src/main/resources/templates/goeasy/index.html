<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
<meta name="viewport"
	content="width=device-width, initial-scale=1, maximum-scale=1">
<title>聊天记录管理</title>
	<style>
		/*.layui-table-cell{
			height: auto!important;
			white-space: normal;
		}*/
	</style>
<link rel="stylesheet" th:href="@{/assets/libs/layui/css/layui.css}" />
<link rel="stylesheet" th:href="@{/assets/module/admin.css}" />
</head>
<body>
	<!-- 加载动画 -->
	<div class="page-loading">
		<div class="ball-loader">
			<span></span><span></span><span></span><span></span>
		</div>
	</div>
	 
	 

	<div class="layui-tab layui-tab-brief" style="margin:0">
		 
		<div class="layui-tab-content">
			<div class="layui-tab-item layui-show">
				<div class="layui-fluid" style="padding:0">
					<div class="layui-card">
						<div class="layui-card-body">

							<div class="layui-form toolbar" style="    margin-left: -24px;">
								<div class="layui-form-item">
									 
									<div class="layui-inline">
										<label class="layui-form-label">查看状态：</label>
										<div class="layui-input-inline">
											<select name="read" id="read">
												<option value="">请选择</option>
												<option value="1">已读</option>
												<option value="0">未读</option>
											</select>
										</div>
									</div>

									<div class="layui-inline">
										<label class="layui-form-label">姓&emsp;&emsp;名：</label>
										<div class="layui-input-inline">
											<input name="name" id="name" class="layui-input"
												type="text" placeholder="输入姓名" />
										</div>
									</div>
									 
									 

									<div class="layui-inline" style="padding-left: 20px;">
										<button class="layui-btn icon-btn sousuoDN" data-type="reload"><i class="layui-icon"></i>搜索</button>
										<button class="layui-btn layui-btn-primary" id="btnempty" lay-submit="" lay-filter="reset">清除</button>
								

									</div>
 

								</div>
							</div>
							<div id="piliang" class="layui-form toolbar" style="background-color: #e6f7ff;height: 40px;margin-top: 10px;margin-bottom: 10px;line-height: 40px;">
								<p><i style="padding-left: 15px;" class="layui-icon layui-icon-about"></i>若系统已开启即时消息提醒功能，可以通知用户关注公众号，或者在个人中心-更多服务-订阅消息中开启订阅，以便即时收到您的消息提醒</p>
							</div>
							<table class="layui-hide" id="pinggu" lay-filter="pinggu"></table>

						</div>
					</div>
				</div>

			</div>
			<!-- 评估记录 -->
			 

		</div>
	</div>
	<!-- 正文开始 -->


	<!-- 表格操作列 -->
	<script type="text/html" id="tableBar">
		<a href="#" style="color:#8c999e;padding-right: 55px" lay-event="del">重新微信授权</a>
    <a href="#" style="color:#36A4FF" lay-event="edit">查看</a>
   <!-- <a href="#" style="color:#36A4FF" lay-event="play">play</a>-->
</script>
	<script type="text/html" id="imgTpl">
		{{#  if(d.messageType == 2){ }}
		<img  onclick="openImg('{{d.message}}');" src="{{ d.message }}">

		{{# }else if(d.messageType == 1){ }}
		<p>{{ d.message}}</p>
		{{# }  }}

	</script>




	<!-- js部分 -->
	<script type="text/javascript" th:src="@{/assets/libs/layui/layui.js}"></script>
	<script type="text/javascript" th:src="@{/assets/js/common.js}"></script>
	<script>
		function openImg(url) {
			layer.open({
				type: 1,
				title: ['列表图片展示'],
				shadeClose: true,
				area: ['300px', 'auto'], //宽高width: 100px;height: 100%;
				content: '<img src="' + url + '" height="100%" width="300px">'
			});
		}

		layui
				.use(
						[ 'layer', 'form', 'table',  
								'laypage', 'treeSelect', 'admin','element','laydate'
								 ],
						function() {
							var $ = layui.jquery;
							var layer = layui.layer;
							var form = layui.form;
							var table = layui.table;
							var laypage = layui.laypage;
							var element = layui.element;
							var admin = layui.admin;
							var form = layui.form;
							 
							 var laydate = layui.laydate;
							  //清除按钮
						        $("#btnempty").click(function(){
						        	window.location.reload()
						         
						        })






							table.on('tool(pinggu)', function(obj) { //注：tool是工具条事件名，test是table原始容器的属性 lay-filter="对应的值"
						            var data = obj.data;
							   console.log(data)
						            var layEvent = obj.event;
							   if(layEvent === 'play'){
								   var i = document.createElement("audio");
								   i.src = "http://localhost/assets/js/layui/css/modules/layim/voice/default.mp3", i.play()
							   }
						            if (layEvent === 'edit') { // 查看
						            	//window.open("/manage/goeasy/chatback?usercode="+data.userCode+"&username="+data.name);
										//iframe层

										layer.open({
											type: 2,
											title: '聊天',
											shadeClose: true,
											shade: 0.8,
											area:  ['100%', '100%'],
											content: "/manage/goeasy/test1?usercode="+data.userCode //iframe的url
										});
										//window.open("/manage/goeasy/test1?usercode="+data.userCode);
						            }
								   if(layEvent === 'del'){
									   console.log("重新授权")
									   layer.confirm('将清除用户已经绑定的微信号，用户需在小程序端清除缓存后重新登录授权，方能通过微信接收即时消息提醒', function(index){
										   //do something

										   layer.close(index);
										   $.ajax({
											   type:"post",
											   url:"/instantChat/delWxUserInfo",
											   data:{usercode:data.userCode},
											   async:false,
											   success:function(data){
												   console.log(data)
												   if(data.data>0){
													   layer.msg("删除授权成功");
												   }

											   }
										   });
									   });

								   }
						        });
							

							//这是Layui 给 后台添加的映射  映射controller 的实体类
							var $ = layui.$, active2 = {
								reload : function() {
									//获取 上面input 值

									var read = $('#read').val();
									var name = $('#name').val();
									//执行重载
									table.reload('pinggu', {
										page : {
											curr : 1
										//重新从第 1 页开始
										},
										where : {
											//这里注意一定要跟Bean 里面的属性对应
											read:read,
											name:name,
											
											
										}
									});
								}
							};
							
							
							//这个是搜索按钮事件， 找到你的搜索按钮 获取搜索按钮点击事件。只需要把$(’’)这里面的内容修改了就可以了。
							$('.sousuoDN').on('click', function() {

								var type = $(this).data('type');
								active2[type] ? active2[type].call(this) : '';

							});
							
							 
							  
							var insTb = table.render({
								elem : '#pinggu',
								url : '/instantChat/findChatListInfo',
								cellMinWidth : 50, //全局定义常规单元格的最小宽度，layui 2.2.1 新增
								page : true,
								 
								cols : [ [{
									type : 'numbers',
									title : '序号'
								}, {
									field : 'name',
									title : '姓名',
									width : 100

								}, {
									field : 'message',
									title : '消息',
									templet:'#imgTpl'
								}, {
									field : 'addtimeinfo',
									title : '时间'
									
								}, {
									align : 'center',
									toolbar : '#tableBar',
									title : '操作',
									minWidth : 200
								} ] ],
								response : {

									statusCode : 0
								//规定成功的状态码，默认：0

								},

								parseData : function(res) { //将原始数据解析成 table 组件所规定的数据
									return {
										"code" : res.data.code, //解析接口状态
										"msg" : res.data.msg, //解析提示文本
										"count" : res.data.count, //解析数据长度
										"data" : res.data.data
									}

								}
							});
 
						});
	</script>
</body>

</html>
