background-color: white;

<body >
<div id="search-header" style="margin-top: 7px;">
		<form id="regForm" lay-filter="regForm" class="layui-form queryForm">
			<div class="layui-form-item" style="margin-bottom: 0px;">
				<div class="layui-inline">
					<div class="layui-input-inline" style="width: 110px">
						<select id="type" name="type" >
							<option value="">全部类型</option>
							<option value="1">每日任务</option>
							<option value="2">每月任务</option>
						</select>
					</div>
				</div>
				
				
				<div class="layui-inline">
					<div class="layui-input-inline" style="width: 110px">
						<select id="putaway" name="putaway" >
							<option value="">全部状态</option>
							<option value="1">已上架</option>
							<option value="2">未上架</option>
						</select>
					</div>
				</div>
				
				
				 <div class="layui-inline" >
                        <label class="layui-form-label w-auto">任务名称:</label>
                        <div class="layui-input-inline">
                            <input id="eventName" name="eventName" class="layui-input" placeholder="请输入" style="width: 124px;"/>
                        </div>
                 </div>

				<div class="layui-inline" >
					<label class="layui-form-label w-auto">集团名称:</label>
					<div class="layui-input-inline">
					<input  type="text" id="tree" lay-filter="tree" style="width: 240px" class="layui-input">
					</div>
				</div>
                    		
		 <div class="layui-inline" style="margin-left: 39px;">
				<button class="layui-btn icon-btn sousuoDN" lay-submit="" lay-filter="regManageQueryBtn"><i class="layui-icon"></i>搜索</button>
				<button class="layui-btn layui-btn-primary" lay-submit=""
							lay-filter="reset">清除</button>
		
			</div> 
			
				

			</div>

		</form>
	</div>
<table id="demo" lay-filter="demo"></table>

<script type="text/javascript">
	//关闭修改积分弹窗
	function modelClose() {
		layer.close(layer.index);
	}
</script>

</body>	
<form class="layui-form" id="addfolder" lay-filter="folderForm" style="display: none;">
	
			  <div class="layui-form-item" style="display: block;margin-top: 38px;margin-left: 33px;">
	  			  <label class="layui-form-label">奖励积分</label>
	    			<div class="layui-input-inline" style="width: 150px;">
	     				 <input type="number" name="score" lay-verify="folderName"  lay-reqtext="不能为空"  placeholder="请输入" autocomplete="off" class="layui-input">
	    			</div>
	    				<div class="layui-inline">
							<label class="layui-form-label"  style="width: 61px;margin-left: -55px;">分</label>
						</div>
	 		 </div>
	 		 
	 		 <div class="layui-form-item">
						<div class="layui-input-block" style="text-align: center;margin-left: 1px;">
							<button style="width: 70px;" class="layui-btn layui-btn-normal"
								lay-submit='' lay-filter="folderSubmit" type="button">保存</button>
							<button style="width: 70px;" type="reset" id="cancel" onclick="modelClose()" class="layui-btn layui-btn-primary">取消</button>
						</div>
				</div>
	</form>

<script type="text/html" id="tableBar">

{{# if(d.putaway == 1) { }}
  <a href="#" style="color:rgba(166, 166, 166, 1)" lay-event="soldOut">下架</a>
    	<a href="#" style="color:#36A4FF" lay-event="lookOver">修改</a>
{{# } else { }}
<a href="#" style="color:rgba(166, 166, 166, 1)" lay-event="soldOut">上架</a>
    	<a href="#" style="color:#36A4FF" lay-event="lookOver">修改</a>
{{# } }}


		
	</script>
	
<script type="text/html" id="switchTpl">
{{# if(d.type == 1) { }}
  <input type="checkbox" name="scoreeventId" value="{{d.scoreeventId}}" lay-skin="switch" lay-text="开启|关闭" lay-filter="sexDemo" {{ d.continuousStatus == 1 ? 'checked' : '' }}>
{{# } else { }}
<div style="margin-left: 21px;">--</div>
{{# } }}
 
</script>
	
<script type="text/javascript" th:src="@{/assets/libs/layui/layui.js}"></script>
<script type="text/javascript" th:src="@{/assets/js/common.js}"></script>
<script type="text/javascript" th:src="@{/assets/js/jquery-1.11.1.js}"></script>
<script th:src="@{/assets/libs/echarts/echarts.min.js}"></script>
<script type="text/javascript" th:inline="javascript">
	var scoreeventId="";
	layui.use(['laypage', 'layer','element','admin', 'treeTable','table','form','treeSelect','laydate','util','upload'], function(){
		  var laypage = layui.laypage;
		  var layer = layui.layer;
		  var element = layui.element;
		  var table = layui.table;
		  var form = layui.form;
		  var $ = layui.jquery;
		  var laydate = layui.laydate;
		  var util = layui.util;
		  var treeSelect= layui.treeSelect;
		  var upload = layui.upload;
		  var admin = layui.admin;
		  var orgCode="";
			randtreesone();
		function randtreesone(){
			treeSelect.render({
				// 选择器
				elem: '#tree',
				// 数据
				data: '/YhOrgTree/showPullDownTree',
				// 异步加载方式：get/post，默认get
				type: 'get',
				// 占位符
				placeholder: '全部',
				// 是否开启搜索功能：true/false，默认false
				search: true,
				// 点击回调
				click: function(d){
					$('#user').val(d.current.id);
					orgCode=orgCode=d.current.id;
				},
				// 加载完成后的回调函数
				success: function (d) {
					console.log(d);
//                选中节点，根据id筛选
					treeSelect.checkNode('tree', d.data[0].id);
				orgCode=orgCode=d.data[0].id;
					getShopp()
//                获取zTree对象，可以调用zTree方法
//                var treeObj = treeSelect.zTree('tree');
//                console.log(treeObj);

//                刷新树结构
//                treeSelect.refresh();
				}
			});
		}
		  //第一个实例
			var shoppingTab = null;

		function getShopp(){
			shoppingTab=table.render({
				id : 'shoppingTab',
				elem: '#demo'
				,url: '/YhScoreEventCategoryWeb/YhScoreEventCategoryPage'  //数据接口
				,method : 'get'
				,where : {orgCode:orgCode} // 你额外要携带数据，以键值对的方式存入
				,page: true //开启分页
				,limit : 20// 每页显示的条数
				,limits : [ 5, 10, 20, 50, 100 ] // 每页条数的选择项
				,loading : true // 是否显示加载条(切换分页的时候显示）
				,cellMinWidth : 80 // 全局定义所有常规单元格的最小宽度（默认：60）
				,sort:true
				,cols: [ //表头
					[
						{type:'numbers', title:'序号', align: 'center',width: 50}
						,{field:'eventName', title:'任务名称', align: 'center',templet:function(d){
							return d.eventName;

						}
					}
						,{field: 'score', title: '奖励积分', align: 'center',templet:function(d){
							return "<font color='#FF5511'>"+ d.score +"</font>";

						}
					}
						,{field:'continuousStatus', title: '连续奖励<i class="layui-icon alone-tips" style="color: rgba(24, 144, 255, 1);margin-left: 4px;" id="help"></i>',
						width:150, templet: '#switchTpl', unresize: true}
						,{field: 'type', title: '分类', align: 'center',templet:function(d){
							var type = '';
							if(d.type == 1){
								type = '每日任务';
							}else{
								type = '每月任务';
							}
							return type;
						}
					}
						,{field:'putaway', title:'状态', align: 'center',templet:function(d){
							var putaway = '';
							if(d.putaway == 1){
								putaway = '已上架';
							}else{
								putaway = '未上架';
							}
							return putaway;
						}
					}
						,{field: 'updateDate', title: '更新时间', align: 'center'}
						,{ title: '操作', toolbar : '#tableBar',align: 'center', width:100}

					]
				],
				done: function(res, curr, count){
					if(count > 20) {
						$(".layui-table-page").show();
					}else {
						$(".layui-table-page").hide();
					}
					//Tips
					var tip_index;
					$("#help").hover(function(){
						tip_index =  layer.tips('每日任务连续完成，奖励逐日递增1积分，7天为上限', this,{
							tips: [2, 'rgba(0, 0, 0, 1)'],
							time:0
						});
					},function(){
						layer.close(tip_index);
					});
				}
			});
		}
		    
		  form.on('switch(sexDemo)', function(obj){
		  console.log(obj.elem.checked);
		  var continuousStatus;
		  if(obj.elem.checked){
			  continuousStatus = 1
		  }else{
			  continuousStatus = 2
		  }
			$.ajax({
        		url: '/YhScoreEventCategoryWeb/updateContinuousStatus',
        		data:{continuousStatus:continuousStatus,scoreeventId:this.value},
        		success: function (data) {
					console.log(data,"状态")
					if(data.code==20000){
						 layer.msg('操作成功');
					}else{
						layer.msg('操作失败');
					}
				}
        	})
			   //layer.tips(this.value + ' ' + this.name + '：'+ obj.elem.checked, obj.othis);
	 });
		  
		
			   
		  table.on('tool(demo)', function(obj) { //注：tool是工具条事件名，test是table原始容器的属性 lay-filter="对应的值"
			  var data = obj.data;
	          var layEvent = obj.event;
	          scoreeventId = obj.data.scoreeventId;
	          var score = obj.data.score;
	          var putaway = obj.data.putaway;
	          var falg;
	          if(putaway == 1){
	        	  falg = 2;
	          }else{
	        	  falg = 1;
	          }
	          console.log(scoreeventId)
	          if(layEvent === 'soldOut'){
	        	  	layer.confirm( putaway==1?'是否确认下架？':'是否确认上架？', {
	  	    		  btn: [ '确认', '取消'] //可以无限个按钮
	  	    		  ,btn3: function(index, layero){
	  	    		    //按钮【按钮三】的回调
	  	    		  }
	  	    		},function(index){
	  	  			$.ajax({
	  	  				url: '/YhScoreEventCategoryWeb/updateContinuousStatus',
						data: {
							scoreeventId : scoreeventId,
							putaway : falg
						},
	  	          		success: function (data) {
	  	  					console.log(data,"删除")
	  	  					if(data.code==20000){
	  	  					layer.msg("操作成功");
							   setTimeout(function () {
					                layer.closeAll();
					            }, 2000);
	  	  				
	  	  				 table.reload('shoppingTab',{
	  	  				    	url: '/YhScoreEventCategoryWeb/YhScoreEventCategoryPage'//数据接口
	  	  					}) 
	  	  					}else{
	  	  					layer.msg("操作失败");
	  	  					}
	  	  				}
	  	          	})
	  	    	
	  	    });
	           }
	           if(layEvent === 'lookOver'){
	        	   form.val('folderForm', {
	        		      "score": score // "name": "value"
	        		    });
	        	   Modal();
	           }
	          
	     
	     });
		  	
			//监听提交
			form.on('submit(folderSubmit)', function (dataYh) {
				var score = $("input[name=score]").val();
				console.log("输入框的值"+score)
				if(score<=0){
					parent.layer.msg('不能为空并且必须大于0');	
				}else{
					$.ajax({
						type: 'get',
						url: '/YhScoreEventCategoryWeb/updateContinuousStatus',
						data: {
							scoreeventId : scoreeventId,
							score : score
						},
						success: function (data) {
							console.log(data,"fhui")
							if(data.code ==  20000){
								layer.msg("操作成功");
								   setTimeout(function () {
									   location.reload(); 
						            }, 2000);
							}else{
								layer.msg("操作失败");
							}
						}

					}); 
					return false;
				}
				
			});
		  
		  function Modal(){
				//页面层
				layer.open({  
				  title:'修改积分',
				  type: 1,
				  skin: 'layui-layer-rim', //加上边框
				  area: ['420px', '200px'], //宽高
				  content: $("#addfolder"),
				});
			}
		  

		  
		
		//头部搜素表单提交1
		  form.on('submit(regManageQueryBtn)', function(data){
			 /*   console.log(data.elem);//被执行事件的元素DOM对象，一般为button对象
			  console.log(data.form); //被执行提交的form对象，一般在存在form标签时才会返回
			 console.log(data.field); //当前容器的全部表单字段，名值对形式：{name: value} */
			 shoppingTab.reload({
				  where : {
						//这里注意一定要跟Bean 里面的属性对应
					 type:$('#type').val(), 
					 putaway:$('#putaway').val(), 
					 eventName:$('#eventName').val(),
					  orgCode:orgCode
					},
				  page : {
					  curr : 1
				  }
				  
			  });
			// 阻止表单跳转。如果需要表单跳转，去掉这段即可。
			  return false;
		  });
		    
	

});
</script>
