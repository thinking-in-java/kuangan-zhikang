<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8" />
<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
<meta name="viewport"
	content="width=device-width, initial-scale=1, maximum-scale=1">
<title>用户积分</title>
<link rel="stylesheet" th:href="@{/assets/libs/layui/css/layui.css}" />
<link rel="stylesheet" th:href="@{/assets/module/admin.css}" />
<style type="text/css">
.theme-colorful{
background-color: white;
}
.layui-form-label {

    float: left;
    display: block;
    padding: 9px 5px;
    width: 80px;
    font-weight: 400;
    line-height: 20px;
    text-align: right;

}
.layui-form-onswitch {

    border-color: rgba(24, 144, 255, 1);
    background-color: rgba(24, 144, 255, 1);

}
.theme-colorful{
	margin: 20px;
}
.layui-table-box {
	min-height:500px;
}
</style>
</head>
<body style="margin: 20px;">
<input id="guishu" type="hidden" value="">
<div id="search-header">
		<form id="regForm" lay-filter="regForm" class="layui-form queryForm">
			<div class="layui-form-item">
						<div class="layui-inline" style="margin-left: -59px;">
					<label class="layui-form-label">归属</label>
					<div class="layui-input-block" style="width: 270px;">
						<input type="text" id="tree" lay-filter="tree" class="layui-input">
					</div>
				</div>
			
				
				 <div class="layui-inline" style="margin-left: 3px;">
                        <label class="layui-form-label w-auto">姓名:</label>
                        <div class="layui-input-inline">
                            <input id="name" class="layui-input" placeholder="请输入" style="width: 124px;"/>
                        </div>
                    </div>
                    

				  <div class="layui-inline" style="margin-left: -103px;">
				    <label class="layui-form-label">积分值：</label>
				    <div class="layui-input-inline" style="width: 100px;">
				      <input type="text" id="priceMin" placeholder="" autocomplete="off" class="layui-input">
				    </div>
				    <div class="layui-form-mid">-</div>
				    <div class="layui-input-inline" style="width: 100px;">
				      <input type="text" id="priceMax" placeholder="" autocomplete="off" class="layui-input">
				    </div>
				  </div>
				
				
		 <div class="layui-inline" style="padding-left: 20px;">
				<button class="layui-btn icon-btn sousuoDN" lay-submit="" lay-filter="regManageQueryBtn"><i class="layui-icon"></i>搜索</button>
				<button class="layui-btn layui-btn-primary" lay-submit=""
							lay-filter="reset">清除</button>

			</div>
				<button style="float: right;position: inherit;" class="layui-btn" type="button" id="exportIntegralData">导出</button>
				

			</div>

		</form>
	</div>
<table id="demo" lay-filter="demo"></table>


</body>	

<script type="text/html" id="tableBar">

	{{#if(d.roletype == 1) { }}
	<span>- -</span>
	{{# }else { }}
	<a href="#" style="color:#36A4FF" lay-event="lookOver">查看</a>
	{{# } }}

</script>

	
<script type="text/javascript" th:src="@{/assets/libs/layui/layui.js}"></script>
<script type="text/javascript" th:src="@{/assets/js/common.js}"></script>
<script type="text/javascript" th:src="@{/assets/js/jquery-1.11.1.js}"></script>
<script th:src="@{/assets/libs/echarts/echarts.min.js}"></script>
<script type="text/javascript" th:inline="javascript">
	var userCode = [[${userCode}]]; 
	
	layui.use(['laypage', 'layer','element', 'treeTable','table','form','treeSelect','laydate','util','upload'], function(){
		  var laypage = layui.laypage;
		  var layer = layui.layer;
		  var element = layui.element;
		  var table = layui.table;
		  var form = layui.form;
		  var $ = layui.jquery;
		  var laydate = layui.laydate;
		  var util = layui.util;
		  var treeSelect= layui.treeSelect;
		  var upload = layui.upload;
		  
		  
		  treeSelect.render({
		      // 选择器
		      elem: '#tree',
		      // 数据 
		     data: '/YhOrgTree/showPullDownTree',
		      // 异步加载方式：get/post，默认get
		      type: 'get',
		      // 占位符
		      placeholder: '全部',
		      // 是否开启搜索功能：true/false，默认false
		      search: true,
		      // 点击回调
		      click: function(d){
		          console.log($('#guishu').val(d.current.id));
		      },
		      // 加载完成后的回调函数
		      success: function (d) {
		          console.log("机构",d);
		      }
		      
		  }); 
		

			
		 
		  //第一个实例
			var YhUserFolderTab = table.render({
			  id : 'YhUserFolderTab',
		    elem: '#demo'
		    ,url: '/YhHealthStarweb/YhHealthStarPage'  //数据接口
		     ,method : 'get'
		    ,where : {} // 你额外要携带数据，以键值对的方式存入
		    ,page: true //开启分页
		    ,limit : 20// 每页显示的条数
			,limits : [ 5, 10, 20, 50, 100 ] // 每页条数的选择项
			,loading : true // 是否显示加载条(切换分页的时候显示）
			,cellMinWidth : 80 // 全局定义所有常规单元格的最小宽度（默认：60）
			 ,sort:true
		    ,cols: [ //表头  
		    	[
		    	{type:'numbers', title:'序号', align: 'center',width: 50}
		        ,{field:'userCode', title:'用户编码', align: 'center',templet:function(d){
			      	//console.log("积分数据",d)
			      	return d.userCode
	        	}
		        }
		        ,{field: 'usernmae', title: '用户账号', align: 'center'}
		        ,{field: 'name', title: '姓名', align: 'center'}
		        ,{field: 'income', title: '积分收入', align: 'center'}
		        ,{field: 'expenditure', title: '积分支出', align: 'center'}
		        ,{field: 'healthstarsEvents', title: '总积分', align: 'center',templet:function(d){
		        	console.log(d)
			      	//console.log("积分数据",d)
			      	if(d.healthstarsEvents == null){
			      		return "--"
			      	}else{
			      		return d.healthstarsEvents
			      	}
			      	
	        	} }
		        ,{ title: '操作', toolbar : '#tableBar',align: 'center', width:100}
		        
		      ]
		      ],
		      done: function(res, curr, count){
			        if(count > 20) {
			        	$(".layui-table-page").show();
			        }else {
			        	$(".layui-table-page").hide();
			        }
			      }
		  });
		    
		  $("#exportIntegralData").click(function(){
				 window.location.href="/YhHealthStarweb/exportIntegralData";
			  })
		    
		  table.on('tool(demo)', function(obj) { //注：tool是工具条事件名，test是table原始容器的属性 lay-filter="对应的值"
			  var data = obj.data;
	          var layEvent = obj.event;
	          var userCode = obj.data.userCode;
	           if(layEvent === 'lookOver'){
	        	    
	        	   window.open("/manage/register/userIndex?page=IntegralRecord&userCode="+userCode+"");
	           }
	     });
		//头部搜素表单提交1
		  form.on('submit(regManageQueryBtn)', function(data){
			 /*   console.log(data.elem);//被执行事件的元素DOM对象，一般为button对象
			  console.log(data.form); //被执行提交的form对象，一般在存在form标签时才会返回
			 console.log(data.field); //当前容器的全部表单字段，名值对形式：{name: value} */
			 YhUserFolderTab.reload({
				  where : {
						//这里注意一定要跟Bean 里面的属性对应
					 orgCode:$('#guishu').val(),
					 name:$('#name').val(), 
					 priceMin:$('#priceMin').val(),
					 priceMax:$('#priceMax').val()
					},
				  page : {
					  curr : 1
				  }
				  
			  });
			// 阻止表单跳转。如果需要表单跳转，去掉这段即可。
			  return false;
		  });
		    
	

});
</script>
