<script type="text/javascript" th:src="@{/assets/libs/layui/layui.js}"></script>
<script type="text/javascript" th:src="@{/assets/js/common.js}"></script>
<script type="text/javascript" th:src="@{/assets/js/jquery-1.11.1.js}"></script>
<script th:src="@{/assets/libs/echarts/echarts.min.js}"></script>
<script type="text/javascript" th:inline="javascript">
var siteId ='';
var orderNumber = '';
	layui.use(['laypage', 'layer','element','admin', 'treeTable','table','form','treeSelect','laydate','util','upload'], function(){
		  var laypage = layui.laypage;
		  var layer = layui.layer;
		  var element = layui.element;
		  var table = layui.table;
		  var form = layui.form;
		  var $ = layui.jquery;
		  var laydate = layui.laydate;
		  var util = layui.util;
		  var treeSelect= layui.treeSelect;
		  var upload = layui.upload;
		  var admin = layui.admin;
		  
			//日期时间范围
			laydate.render({
				elem: '#conversionTime',
				type: 'datetime',
				range: true,
				trigger: 'click'
			});
			
		     selectAllGrouping();
		     function selectAllGrouping(){
		       	 $.ajax({
		 			type: 'get',
		 			url: '/IntegralShoppingGrouping/selectAllGrouping',
		 			success: function (data) {
		              $.each(data.data, function(index, item) {
		                  $('#groupingId')
		                      .append(new Option(item.name, item.groupingId));
		              });
		              layui.form.render("select");
		 			}
		 		});
		     }
		  
			  $("#orderExport").click(function(){
					 window.location.href="/YhUserOrderWeb/orderExport";
				  })
			  
			  //第一个实例
				var shoppingTab = table.render({
				  id : 'shoppingTab',
			    elem: '#demo'
			    ,url: '/YhUserOrderWeb/YhUserOrderWebPage'  //数据接口
			    ,method : 'get'
			    ,where : {} // 你额外要携带数据，以键值对的方式存入
			    ,page: true //开启分页
			    ,limit : 20// 每页显示的条数
				,limits : [ 5, 10, 20, 50, 100 ] // 每页条数的选择项
				,loading : true // 是否显示加载条(切换分页的时候显示）
				,cellMinWidth : 80 // 全局定义所有常规单元格的最小宽度（默认：60）
				 ,sort:true
			    ,cols: [ //表头  
			    	[
			    	 {type:'numbers', title:'序号', align: 'center',width: 50}
			    	 ,{field:'name', title:'兑换人', align: 'center',width: 100}
			        ,{field:'merchandiseName', title:'商品', align: 'center',width: 150}
			        ,{field: 'consumeIntegral', title: '消耗积分', align: 'center',width: 100,templet:function(d){
			        	  //console.log("订单",d)
				      	 return "<font color='#FF5511'>"+ d.consumeIntegral +"</font>"; 
				    
		        	  }
			        }
			        ,{field: 'inventory', title: '收货信息', align: 'center',width: 250,templet:function(d){
			        		var site = d.site.replace(/,/g, "");//取消字符串中出现的所有逗号 
				      	 return "<div style='float: inline-start;'>"+ '地址：'+ site + d.detailedSite +"</div><div style='float: inline-start;'>"+ '收件人：'+ d.consigneeName +"</div><div style='float: inline-start;'>"+'手机号：'+d.consigneePhone+"</div>"; 
			        	  }
			        }
			        ,{field: 'inventory', title: '物流单号', align: 'center',width: 150,templet:function(d){
			        	var orderStatus = d.orderStatus;
			        	if(d.logisticsOdd !=null && d.logisticsOdd!=''){
			        		return "<div style='float: inline-start;'>"+ d.logisticsCompany +"</div><div style='float: inline-start;'>"+ d.logisticsOdd +"</div>"; 	
			        	}else{
			        		return "--"; 
			        	}
				      	 
			        	  }
			        }
			        ,{field: 'orderStatus', title: '状态', align: 'center',width: 100,templet:function(d){
			        	var orderStatus = d.orderStatus;
			        	if(orderStatus == 1){
			        		return "已发货"; 
			        	}else{
			        		 return "未发货"; 
			        	}
				      	
					     
			        	  }
			        }
			        ,{field: 'addDate', title: '兑换时间', align: 'center'}
			        ,{ title: '操作', toolbar : '#tableBar',align: 'center', width:100}
			        
			      ]
			      ],
			      done:function(res,curr,count){
			    	   if(count > 20) {
				        	$(".layui-table-page").show();
				        }else {
				        	$(".layui-table-page").hide();
				        }
			    	 
			    	  }
			  
			  });

			 

			   

			   
		  table.on('tool(demo)', function(obj) { //注：tool是工具条事件名，test是table原始容器的属性 lay-filter="对应的值"
			  var data = obj.data;
	          var layEvent = obj.event;
	          merchandiseId = obj.data.merchandiseId;
	          var orderId = obj.data.orderId;
	          var standby = obj.data.standby;
	          var consumeIntegral = obj.data.consumeIntegral;
	          var userCode = obj.data.userCode;
	          orderNumber = obj.data.orderNumber;
	           siteId = obj.data.siteId;
	          console.log(orderNumber)
	          if(layEvent === 'revocation'){//撤销
	        	   	layer.confirm('将返还用户积分，删除该兑换记录，是否确认撤销本次兑换？', {
	            		  btn: [ '确认', '取消'] //可以无限个按钮
	            		  ,btn3: function(index, layero){
	            		    //按钮【按钮三】的回调
	            		  }
	            		},function(index){
	            		  //按钮【按钮二】的回调
	            	    $.ajax({
	            		url: '/YhUserOrderWeb/revocationUserOrder',
	            		data:{merchandiseId:merchandiseId,orderId:orderId,standby:standby,
	            			consumeIntegral:consumeIntegral,userCode:userCode},
	            		success: function (data) {
							console.log(data,"删除")
							if(data.code==20000){
								 parent.layer.msg('操作成功');
								layer.closeAll();
								 location.reload(); 
							}else{
								parent.layer.msg('操作失败');
							}
						}
	            	}) 
	            });
	           }
	           if(layEvent === 'lookOver'){
	        	   selectYhUserAddress(orderId);
	       		//页面层
					layer.open({  
					  title:'兑换处理',
					  type: 1,
					  skin: 'layui-layer-rim', //加上边框
					  area: ['550px', '400px'], //宽高
					  content: $("#addfolder"),
					  success: function (index, layero) {
							
					  },
						end : function(DOM){
							location.reload();//刷新页面
						}
					});
	           }
	     });
		  

		  function selectYhUserAddress(orderId){
			   $.ajax({
			    	type:'get',
	        		url: '/YhUserOrderWeb/selectYhUserAddress',
	        		data:{orderId:orderId},
	        		success: function (data) {
						console.log(data,"地址")
						var site = data.data.site.replace(/,/g, "");
						$('#site').html(site + "<i id='update' class='layui-icon layui-icon-edit' style='font-size: 25px; color: #1E9FFF;margin-left: 8px;'></i>");
						$('#detailedSite').html(data.data.detailedSite);
						$('#consigneeName').html(data.data.consigneeName);
						$('#consigneePhone').html(data.data.consigneePhone);
						if(data.data.ssm == 1){
							$("input[name='ssm']").attr("checked",true);
						}
						 
						
						  form.val('folderForm', {
							   'orderId':data.data.orderId,
							  	'siteId':data.data.siteId,
								'userCode':data.data.userCode,
				        	     'consigneeName':data.data.consigneeName,
				        	     'consigneePhone':data.data.consigneePhone,
				        	     'logisticsCompany':data.data.logisticsCompany,
				        	     'logisticsOdd':data.data.logisticsOdd,
				        	     'site':data.data.site.replace(/,/g, ""),
				        	     'detailedSite':data.data.detailedSite,
				        	    });
						
					}
	        	}) 
		  }
		 
		  
		
		//头部搜素表单提交1
		  form.on('submit(regManageQueryBtn)', function(data){
			 shoppingTab.reload({
				  where : {
						//这里注意一定要跟Bean 里面的属性对应
					 merchandiseType:$('#merchandiseType').val(), 
					 groupingId:$('#groupingId').val(), 
					 orderStatus:$('#putaway').val(), 
					 conversionTime:$('#conversionTime').val(),
					 merchandiseName:$('#merchandiseName').val(),
					 name:$('#name').val()
					},
				  page : {
					  curr : 1
				  }
				  
			  });
			// 阻止表单跳转。如果需要表单跳转，去掉这段即可。
			  return false;
		  });
		  $("body").delegate("#update","click", function(){
		    	$("#styleControl").hide();
		    	$("#stylenone").show();
		    })
		    $("#cancel").on('click',function(){
		    	location.reload();//刷新页面
		    })
			//监听提交
			form.on('submit(folderSubmit)', function (dataYh) {
				//var folderName = $("input[name=folderName]").val();
				if(dataYh.field.ssm == 'on'){
					dataYh.field.ssm = 1;
				}else{
					dataYh.field.ssm = 2;
				}
				dataYh.field.orderNumber = orderNumber;
				console.log("表单数据",dataYh.field) 
						$.ajax({
							type: 'get',
							url: '/YhUserOrderWeb/redactYhUserAddress',
							data:dataYh.field, 
							success: function (data) {
								console.log(data,"fhui")
								if(data.code == 20000){
									 parent.layer.msg('操作成功');
										layer.closeAll();
										 location.reload(); 
								}else{
									parent.layer.msg('操作失败');
								}
							}

						}); 
				return false;
			});

});
</script>
