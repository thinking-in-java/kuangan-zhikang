<script type="text/javascript" th:inline="javascript">
	var groupingId="";
	layui.use(['laypage', 'layer','element','admin', 'treeTable','table','form','treeSelect','laydate','util','upload'], function(){
		  var laypage = layui.laypage;

		    	      res.data[i]["LAY_CHECKED"]='true';
		    	      //找到对应数据改变勾选样式，呈现出选中效果
		    	      var index= res.data[i]['LAY_TABLE_INDEX'];
		    	      $('.layui-table tr[data-index=' + index + '] input[type="checkbox"]').prop('checked', true);
		    	      $('.layui-table tr[data-index=' + index + '] input[type="checkbox"]').next().addClass('layui-form-checked');
		    	     }
		    	    }
		    	   }
		    	   //设置全选checkbox的选中状态，只有改变LAY_CHECKED的值， table.checkStatus才能抓取到选中的状态
		    	   var checkStatus = table.checkStatus('test');
		    	   if(checkStatus.isAll){
		    	    $(' .layui-table-header th[data-field="0"] input[type="checkbox"]').prop('checked', true);
		    	    $('.layui-table-header th[data-field="0"] input[type="checkbox"]').next().addClass('layui-form-checked');
		    	   }
		    	   if(count > 20) {
			        	$(".layui-table-page").show();
			        }else {
			        	$(".layui-table-page").hide();
			        }
		    	 
		    	  }
		  
		  });
		    
			 //复选框选中监听,将选中的id 设置到缓存数组,或者删除缓存数组
			 table.on('checkbox(demo)', function (obj) {
				 console.log(obj);
				
			     const { type, checked } = obj

			      // 勾选全选复选框
			      if (type === 'all' && checked) {
			        table_data.forEach(item => {
			          const { merchandiseId: id, putaway: flag } = item
			          const findIndex = putaway.findIndex(x => x.id === id)
			          if (findIndex === -1) {
			        	ids.push(id);
			            putaway.push({
			              id,
			              flag
			            })
			          }
			        })
			      } else if (type === 'all' && !checked) { // 取消勾选全选复选框
			    	  table_data.forEach(item => {
			              const { merchandiseId: id } = item
			              const findIndex = putaway.findIndex(x => x.id === id)
			              if (findIndex !== -1) {
			            	ids.splice(findIndex, 1)
			                putaway.splice(findIndex, 1)
			              }
			            })
			      } else if (type === 'one' && checked) { // 勾选单行复选框
			    	  const { merchandiseId: id , putaway: flag} = obj.data
			          const findIndex = putaway.findIndex(x => x.id === id)
			          if (findIndex === -1) {
			        	ids.push(id);
			            putaway.push({
			              id,
			              flag
			            })
			          }
			      } else if (type === 'one' && !checked) { // 取消勾选单行复选框
			    	  const { merchandiseId: id } = obj.data
			          const findIndex = putaway.findIndex(x => x.id === id)
			          if (findIndex !== -1) {
			        	ids.splice(findIndex, 1)
			            putaway.splice(findIndex, 1)
			          }
			      }
				  if(ids.length>0){
						 $("#piliang").show();
						 $("#xuanze").html("已选择"+ids.length+"项")
					 }else{
						 $("#piliang").hide();
					 }
			  console.log("所有对象数组",putaway);
			  console.log("所有id",ids);
			 });
			 
			//全部全选
				form.on('switch(checkall)', function (data) {
				//先将存id的数组清空
				ids.length = 0;
					var checked = data.elem.checked;
					console.log("checked",data)
					if(this.checked){
						 console.log("进入 ",checked);
							$.ajax({
		                		url: '/YhUserCommodityData/selectAll',
		                		success: function (data) {
		    						table_data = data.data
		    						console.log(table_data,"所有商品")
		    						   for(var i=0;i<table_data.length;i++){
		    							     ids.push(table_data[i].merchandiseId);
		    							   }
		    						
		    				    	   for(var i=0;i<table_data.length;i++){
		    					    	    for(var j=0;j<ids.length;j++){
		    					    	     if(table_data[i].merchandiseId==ids[j]){
		    					    	      //这里才是真正的有效勾选
		    					    	      table_data[i]["LAY_CHECKED"]='true';
		    					    	      //找到对应数据改变勾选样式，呈现出选中效果
		    					    	      var index= table_data[i]['LAY_TABLE_INDEX'];
		    					    	      $('.layui-table tr[data-index=' + i + '] input[type="checkbox"]').prop('checked', true);
		    					    	      $('.layui-table tr[data-index=' + i + '] input[type="checkbox"]').next().addClass('layui-form-checked');
		    					    	     }
		    					    	    }
		    					    	   }
		    					    	   //设置全选checkbox的选中状态，只有改变LAY_CHECKED的值， table.checkStatus才能抓取到选中的状态
		    					    	   var checkStatus = table.checkStatus('test');
		    					    	   if(checkStatus.isAll){
		    					    	    $('.layui-table-header th[data-field="0"] input[type="checkbox"]').prop('checked', true);
		    					    	    $('.layui-table-header th[data-field="0"] input[type="checkbox"]').next().addClass('layui-form-checked');
		    					    	   }
		    						 console.log("所有id===",ids);
		    					}
		                	})
						 
					}else{
						ids.length = 0;
						 console.log("所有id--------",ids);
						for(var i = 0;i < table_data.length;i++){   //勾选行回显
							  table_data[i]["LAY_CHECKED"]='false';
							//找到对应数据改变勾选样式，呈现出选中效果
							 $('.layui-table tr[data-index=' + i + '] input[type="checkbox"]').prop('checked', false);
				    	     $('.layui-table tr[data-index=' + i + '] input[type="checkbox"]').next().removeClass('layui-form-checked');
						}
						form.render("checkbox");
					}
				});
			  
			//清空操作
			$("#clickxuan").on('click',function(){
				location.reload();//刷新页面 
			})
			
			var list = [];
			function isAllEqual(array) {
			    if (array.length > 0) {
			        return !array.some(function(value, index) {
			            return value !== array[0];
			        });
			    } else {
			        return true;
			    }
			}
			
			//下架
			$("#soldout").on('click',function(){
				list.length = 0;
				for(let i = 0;i< putaway.length;i++) {
				    list.push(putaway[i].flag)
				}
				console.log(isAllEqual(list));
				if(!isAllEqual(list)){
					layer.msg('不能同时操作已上架和未上架的商品');
					return;
				}
				var variable = false;
				for(let i = 0;i< list.length;i++) {
				    if(list[i] == 1){
				    	variable = true;
				    }
				}
		    	layer.confirm(variable?'是否确认下架？':'该商品未上架', {
          		  btn: [ '确认', '取消'] //可以无限个按钮
          		  ,btn3: function(index, layero){
          		    //按钮【按钮三】的回调
          		  } 
          		},function(index){
          			if(!variable){
          				layer.msg('该商品未上架');
          				return;
          			}
    				$.ajax({
                		url: '/YhUserCommodityData/soldoutCommodity',
                		data:{flag:2,ids:ids},
                		 traditional: true,//这里设置为true
                		success: function (data) {
    						console.log(data,"下架")
    						if(data.code==20000){
    							 parent.layer.msg('操作成功');
    							//layer.closeAll();
    							 location.reload(); 
    						}else{
    							parent.layer.msg('操作失败');
    						}
    					}
                	})
          	
          });

	})
	
	//批量删除
	$("#deleteAll").on('click',function(){
    	layer.confirm('是否确认删除？', {
  		  btn: [ '确认', '取消'] //可以无限个按钮
  		  ,btn3: function(index, layero){
  		    //按钮【按钮三】的回调
  		  }
  		},function(index){
			$.ajax({
        		url: '/YhUserCommodityData/soldoutCommodity',

        		success: function (data) {
					console.log(data,"删除")

						 parent.layer.msg('操作成功');
						//layer.closeAll();
						 location.reload(); 
					}else{
						parent.layer.msg('操作失败');
					}
				}
        	})
  	
  });

})
			//上架
			$("#putaway2").on('click',function(){
				list.length = 0;
				for(let i = 0;i< putaway.length;i++) {

          		},function(index){

            type: 1,

            area: ['450px', '400px'],
            success: function (layero, dIndex) {
               // var url = '/YhSportRecommendRecordController/insertSelective';

                form.on('submit(SubmitRole)', function (data) {
                    
                    var groupingId= $('#changedoctor input[name="like1"]:checked ').val()//获取选中的值
                    console.log(groupingId)
