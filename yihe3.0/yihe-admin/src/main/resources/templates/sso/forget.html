<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <link href="@{/assets/images/favicon.ico}" rel="icon">
    <title>重置密码-EasyWeb</title>
    <link rel="stylesheet"  th:href="@{/assets/libs/layui/css/layui.css}" />
    <link rel="stylesheet"  th:href="@{/assets/module/admin.css}"  />
        <link rel="stylesheet"  th:href="@{/assets/css/login.css}"  />
    <!--[if lt IE 9]>
    <script src="https://oss.maxcdn.com/html5shiv/3.7.3/html5shiv.min.js"></script>
    <script src="https://oss.maxcdn.com/respond/1.4.2/respond.min.js"></script>
    <![endif]-->
    <style>
        body {
            
            background-repeat: no-repeat;
            background-size: cover;
            min-height: 100vh;
        }

        body:before {
            content: "";
            
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
        }

        .login-wrapper {
            max-width: 420px;
            padding: 20px;
            margin: 0 auto;
            position: relative;
            box-sizing: border-box;
            z-index: 2;
        }

        .login-wrapper > .layui-form {
            padding: 25px 30px;
            background-color: #fff;
            box-shadow: 0 3px 6px -1px rgba(0, 0, 0, 0.19);
            box-sizing: border-box;
            border-radius: 4px;
        }

        .login-wrapper > .layui-form > h2 {
            color: #333;
            font-size: 18px;
            text-align: center;
            margin-bottom: 25px;
        }

        .login-wrapper > .layui-form > .layui-form-item {
            margin-bottom: 25px;
            position: relative;
        }

        .login-wrapper > .layui-form > .layui-form-item:last-child {
            margin-bottom: 0;
        }

        .login-wrapper > .layui-form > .layui-form-item > .layui-input {
            height: 46px;
            line-height: 1;
            border-radius: 2px !important;
        }

        .login-wrapper .layui-input-icon-group > .layui-input {
            padding-left: 46px;
        }

        .login-wrapper .layui-input-icon-group > .layui-icon {
            width: 46px;
            height: 46px;
            line-height: 46px;
            font-size: 20px;
            color: #909399;
            position: absolute;
            left: 0;
            top: 0;
            text-align: center;
        }

        .login-wrapper > .layui-form > .layui-form-item.login-captcha-group {
            padding-right: 135px;
        }

        .login-wrapper > .layui-form > .layui-form-item.login-captcha-group > .login-captcha {
            height: 46px;
            width: 120px;
            cursor: pointer;
            box-sizing: border-box;
            border: 1px solid #e6e6e6;
            border-radius: 2px !important;
            position: absolute;
            right: 0;
            top: 0;
        }

        .login-wrapper > .layui-form > .layui-form-item > .layui-form-checkbox {
            margin: 0 !important;
            padding-left: 25px;
        }

        .login-wrapper > .layui-form > .layui-form-item > .layui-form-checkbox > .layui-icon {
            width: 15px !important;
            height: 15px !important;
        }

        .login-wrapper > .layui-form .layui-btn-fluid {
            height: 48px;
            line-height: 48px;
            font-size: 16px;
            border-radius: 2px !important;
        }

        .login-wrapper > .layui-form > .layui-form-item.login-oauth-group > a > .layui-icon {
            font-size: 26px;
        }

        .login-copyright {
            color: #eee;
            padding-bottom: 20px;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        @media screen and () {
            .login-wrapper {
                margin: -250px auto 0;
                position: absolute;
                top: 50%;
                left: 0;
                right: 0;
                width: 100%;
            }

            .login-copyright {
                position: absolute;
                bottom: 0;
                right: 0;
                left: 0;
            }
        }

        .layui-btn {
            background-color: #5FB878;
            border-color: #5FB878;
        }

        .layui-link {
            color: #5FB878 !important;
        }

        .login-captcha-btn {
            line-height: 44px;
            text-align: center;
            background-color: transparent;
            outline: none;
            color: #666;
            padding: 0 !important;
        }

        /** 获取图形验证码弹窗 */
        .layer-get-code {
            padding: 25px 25px;
        }

        .layer-get-code > p {
            color: #666;
            font-size: 16px;
        }

        .layer-get-code > .lay-code-group {
            position: relative;
            padding-right: 135px;
            margin: 15px 0;
        }

        .layer-get-code > .lay-code-group > .layui-input {
            border-radius: 0;
            height: 46px;
            line-height: 1;
            background-color: transparent;
            border-color: rgba(111, 121, 122, 0.3);
        }

        .layer-get-code > .lay-code-group > img {
            position: absolute;
            right: 0;
            top: 0;
            height: 46px;
            width: 120px;
            box-sizing: border-box;
            cursor: pointer;
            border: 1px solid #e6e6e6;
        }

        .layer-get-code .layui-btn-fluid {
            line-height: 50px;
            height: 50px;
        }

        /** //获取图形验证码弹窗 */

        .layui-btn-disabled {
            cursor: not-allowed !important;
            color: #999 !important;
        }
    </style>
</head>
<body>
 <div class="login-header">
        <img th:src="@{/assets/images/logo.png}"> 
    </div>
<div class="login-wrapper layui-anim layui-anim-scale layui-hide">
    <form class="layui-form">
        <h2>重置密码</h2>
        <div class="layui-form-item layui-input-icon-group">
            <i class="layui-icon layui-icon-username"></i>
            <input id="username" class="layui-input" name="username" placeholder="请输入账号" autocomplete="off"
                   lay-verType="tips" />
                   <span id="usernametip" style="color: red;font-size: 10px;display: none">账号不存在</span>
        </div>
         <div class="layui-form-item layui-input-icon-group">
                   <i class="layui-icon layui-icon-cellphone"></i>
            <input class="layui-input" id="phone" name="phone"  placeholder="请输入手机号" 
                   lay-verType="tips" />
                   <span id="phonetip" style="color: red;font-size: 10px;display: none">手机号不正确</span>
        </div>
        <div class="layui-form-item layui-input-icon-group">
            <i class="layui-icon layui-icon-password"></i>
            <input id="password" class="layui-input" name="password" placeholder="请输入新的登录密码" type="password"
                   lay-verType="tips" />
                   
        </div>
        <div class="layui-form-item layui-input-icon-group">
            <i class="layui-icon layui-icon-key"></i>
            <input id="aginpassword" class="layui-input" name="password2" placeholder="请再次输入登录密码" type="password"
                   lay-verType="tips" lay-verify="equalTo" lay-equalTo="[name=password]" required/>
        </div>
        <div class="layui-form-item layui-input-icon-group login-captcha-group">
            <i class="layui-icon layui-icon-auz"></i>
            <input id="code" name="code" class="layui-input"  placeholder="请输入验证码" autocomplete="off"
                   lay-verType="tips" />
            <input type="button" id='btn' name="code" class="login-captcha login-captcha-btn layui-input" value="获取验证码" />
        </div>
        <div class="layui-form-item">
            <a href="/login" class="layui-link pull-right">返回登录</a>
        </div>
        <div class="layui-form-item" style="margin-bottom: 20px;">
            <input type="button" id="reset" class="layui-btn layui-btn-fluid" lay-filter="loginSubmit" lay-submit value="修改密码" />
        </div>
    </form>
    
</div>
 <div class="login-footer">
        <p>技术支持：陕西谷宜健康管理有限公司</p>
        <p>
            陕ICP备2021003626号-1
        </p>
    </div>

<!-- js部分 -->
<script type="text/javascript" src="../../../assets/libs/layui/layui.js"></script>
<script type="text/javascript" src="../../../assets/js/common.js?v=318"></script>
<script>
    layui.use(['layer', 'form', 'formX', 'notice'], function () {
        var $ = layui.jquery;
        var layer = layui.layer;
        var form = layui.form;
        $('.login-wrapper').removeClass('layui-hide');
        var notice = layui.notice;
        
        var wait=60;
        
		function time(o) {
	        if(wait==60){
	        	$.ajax({
					type : "get",
					url : "/forgot/sendsms",
					data : {phone:$("#phone").val()},
					success : function(data) {
						console.log(data)
						if(data=='OK'){
						            notice.msg('验证码发送成功', {icon: 1});
						}else{
					            notice.msg('验证码发送失败', {icon: 2});
						}
					}
				
				});
	        }
		 if (wait == 0) {
			  o.removeAttribute("disabled");  
			  o.value="发送验证码";
		 	  wait = 60;
		 	 	o.setAttribute("style","background-color:transparent");
			 } else { 
				 o.setAttribute("style","background-color:#F0F2F5");
				  o.setAttribute("disabled", true);
				  o.value="重新发送(" + wait + ")";
				  wait--;
			 	 setTimeout(function() {
				  time(o)
			 	 },
				 1000)
				 }
			 }
		document.getElementById("btn").onclick=function(){
			var phone = document.getElementById('phone').value;
			if(!(/^1[3456789]\d{9}$/.test(phone))){ 
				 notice.msg('手机号码有误', {icon: 2});
		        return false; 
		    }
			time(this);}
		
		$('#username').blur(function(){
			haveusernane();
		});
		function haveusernane(){
			var name=$('#username').val();
			var data="";
			var date={name:name}
			$.ajax({
				type : "get",
				url : "/forgot/selectishave",
				data : date,
				success : function(data) {
					if(name!=null && name!=""){
						if(data.data>0){
							$("#usernametip").css('display','none');
						}else{
							$("#usernametip").css('display','block');
							return false; 
						}
					}
				}
			
			});
		}
		$("#phone").blur(function(){
			havenameandphone();
		})
		function havenameandphone(){
			var name=$('#username').val();
			var phone=$("#phone").val();
			var data="";
			var date={name:name,phone:phone}
			$.ajax({
				type : "get",
				url : "/forgot/selectishave",
				data : date,
				success : function(data) {
					if(name!=null && name!="" && phone!=null && phone!=""){
						if(data.data>0){
							$("#phonetip").css('display','none');
						}else{
							$("#phonetip").css('display','block');
							return false; 
						}
					}
				}
			
			});
		}
		$("#reset").click(function(){
			var aginpassword= $("#aginpassword").val();
			var password=$("#password").val();
			var code=$("#code").val();
			var name=$('#username').val();
			var phone=$("#phone").val();
			if(name!=null && name!=''){
				if(phone!=null && phone!=''){

					if(aginpassword==password && aginpassword!=null && aginpassword!=''){
						if(aginpassword.length>=6){
							
							$.ajax({
								type : "get",
								url : "/forgot/selectishave",
								data : {name:name,phone:phone},
								success : function(data) {
									if(name!=null && name!="" && phone!=null && phone!=""){
										if(data.data>0){
											var date={userName:name,userCode:code,userPwd:password,mobile:phone}
											$.ajax({
												type : "post",
												url : "/forgot/reset",
												data : date,
												success : function(data) {
													if(data.code==20000){
														notice.msg('密码修改成功', {icon: 1});
														 setTimeout("tologin()","2000");
													}else{
														notice.msg(data.message, {icon: 2});
													}
													 
												}
											
											});
										}
									}
								}
							
							});
						
						}else{
							notice.msg('密码长度不能小于6位', {icon: 2});
						}
					}else{
						if(aginpassword==null || aginpassword==''){
							notice.msg('密码不能为空', {icon: 2});
						}else{
							notice.msg('两次密码不一致', {icon: 2});
						}
						
					}
				}else{
					notice.msg('手机号不能为空', {icon: 2});
				}

			}else{
				notice.msg('用户名不能为空', {icon: 2});
			}

			
			
			
			
		})
    });
    function tologin(){
		 window.location.href = '/login';
	}
</script>
</body>
</html>
