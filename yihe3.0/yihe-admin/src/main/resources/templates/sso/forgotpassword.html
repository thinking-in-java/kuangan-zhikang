<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>忘记密码</title>
    <link rel="stylesheet"  th:href="@{/assets/libs/layui/css/layui.css}" />
    <link rel="stylesheet"  th:href="@{/assets/module/admin.css}"  />
        <link rel="stylesheet"  th:href="@{/assets/css/login.css}"  />
</head>
<body>
	<div style="width: 28%;position: relative;left: 35%;top: 180px;background-color: #FFF">
	<div class="layui-card-header">
       <i class="layui-icon layui-icon-engine"></i>&nbsp;&nbsp;忘记密码
     </div>
	<form class="layui-card-body layui-form">
              <div class="layui-form-pane">
                <div class="layui-form-item">
                    <label class="layui-form-label"><i class="layui-icon layui-icon-username"></i></label>
                    <div class="layui-input-block">
                        <input id="username" name="username" type="text" placeholder="账号" class="layui-input"
                               lay-verType="tips" lay-verify="required" required/>
                             
                    </div>
                     <span id="usernametip" style="color: red;font-size: 10px;display: none">账号不存在</span>
                </div>
                 
                <div class="layui-form-item">
                    <label class="layui-form-label"><i class="layui-icon layui-icon-cellphone"></i></label>
                    <div class="layui-input-block">
                        <input id="phone" name="phone" type="text" placeholder="手机号" class="layui-input"
                               lay-verType="tips" lay-verify="required" required/>
                    </div>
                    <span id="phonetip" style="color: red;font-size: 10px;display: none">手机号不正确</span>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label"><i class="layui-icon layui-icon-password"></i></label>
                    <div class="layui-input-block">
                        <input id="password" name="password" type="password" placeholder="密码" class="layui-input"
                               lay-verType="tips" lay-verify="required" required/>
                    </div>
                </div>
                 <div class="layui-form-item">
                    <label class="layui-form-label"><i class="layui-icon layui-icon-password"></i></label>
                    <div class="layui-input-block">
                        <input id="aginpassword" name="aginpassword" type="password" placeholder="确认密码" class="layui-input"
                               lay-verType="tips" lay-verify="required" required/>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label"><i class="layui-icon layui-icon-vercode"></i></label>
                    <div class="layui-input-block">
                        <div class="layui-row inline-block">
                            <div class="layui-col-xs7">
                                <input id="code" name="code" type="text" placeholder="验证码" class="layui-input"
                                       autocomplete="off" lay-verType="tips" lay-verify="required" required/>
                                 
                            </div>
                            <input id='btn' type="button" style="width: 41%" class="layui-btn " onclick="settime(this)" value="发送验证码" />
                            <div class="layui-col-xs5" style="padding-left: 6px;">
                                <img class="login-captcha" src="">
                            </div>
                        </div>
                    </div>
                </div>
                </div>
                <div class="layui-form-item">
                    <input id="reset" lay-filter="login-submit" type="button" class="layui-btn layui-btn-fluid" value="重置密码"  />
                </div>
                <div class="layui-form-item">
                    <input id="cengt" lay-filter="login-submit" type="button" class="layui-btn layui-btn-fluid" value="取消" />
                </div>
            </form>
	</div>
 
</body>
<script type="text/javascript" th:src="@{/assets/libs/layui/layui.js}"></script>
<script type="text/javascript" th:src="@{/assets/js/common.js}"></script>
		<script type="text/javascript">
		layui.use(['layer', 'form', 'notice'], function () {
	        var $ = layui.jquery;
	        var layer = layui.layer;
	        var form = layui.form;
	        var notice = layui.notice;
	        var wait=60;
	        
			function time(o) {
		        if(wait==60){
		        	$.ajax({
						type : "get",
						url : "/forgot/sendsms",
						data : {phone:$("#phone").val()},
						success : function(data) {
							console.log(data)
							if(data=='OK'){
							            notice.msg('验证码发送成功', {icon: 1});
							}else{
						            notice.msg('验证码发送失败', {icon: 2});
							}
						}
					
					});
		        }
			 if (wait == 0) {
				  o.removeAttribute("disabled");  
				  o.value="发送验证码";
			 	  wait = 60;
			 	 	o.setAttribute("style","background-color:#009688");
				 } else { 
					 o.setAttribute("style","background-color:#F0F2F5");
					  o.setAttribute("disabled", true);
					  o.value="重新发送(" + wait + ")";
					  wait--;
				 	 setTimeout(function() {
					  time(o)
				 	 },
					 1000)
					 }
				 }
			document.getElementById("btn").onclick=function(){
				var phone = document.getElementById('phone').value;
				if(!(/^1[3456789]\d{9}$/.test(phone))){ 
					 notice.msg('手机号码有误', {icon: 2});
			        return false; 
			    }
				time(this);}
			
			$('#username').blur(function(){
				var name=$('#username').val();
				var data="";
				var date={name:name}
				$.ajax({
					type : "get",
					url : "/forgot/selectishave",
					data : date,
					success : function(data) {
						if(name!=null && name!=""){
							if(data.data>0){
								$("#usernametip").css('display','none');
							}else{
								$("#usernametip").css('display','block');
							}
						}
					}
				
				});
			});
			$("#phone").blur(function(){
				var name=$('#username').val();
				var phone=$("#phone").val();
				var data="";
				var date={name:name,phone:phone}
				$.ajax({
					type : "get",
					url : "/forgot/selectishave",
					data : date,
					success : function(data) {
						if(name!=null && name!="" && phone!=null && phone!=""){
							console.log(data);
							if(data.data>0){
								$("#phonetip").css('display','none');
							}else{
								$("#phonetip").css('display','block');
							}
						}
					}
				
				});
			})
			$("#cengt").click(function(){
				 window.location.href = '/login';
			})
			$("#reset").click(function(){
				
				var aginpassword= $("#aginpassword").val();
				var password=$("#password").val();
				var code=$("#code").val();
				var name=$('#username').val();
				var phone=$("#phone").val();
				
				if(aginpassword==password&& aginpassword!=null){
					if(aginpassword.length>=6){
					var date={userName:name,userCode:code,userPwd:password,mobile:phone}
					$.ajax({
						type : "post",
						url : "/forgot/reset",
						data : date,
						success : function(data) {
							if(data.code==20000){
								notice.msg('密码修改成功', {icon: 1});
								 setTimeout("tologin()","2000");
							}else{
								notice.msg(data.message, {icon: 2});
							}
							 
						}
					
					});
					}else{
						notice.msg('密码长度不能小于六位', {icon: 2});
					}
				}else{
					if(aginpassword==null){
						notice.msg('密码不能为空', {icon: 2});
					}else{
						notice.msg('两次密码不一致', {icon: 2});
					}
					
				}
				
			})
		});
		function tologin(){
			 window.location.href = '/login';
		}
		</script>
</html>
