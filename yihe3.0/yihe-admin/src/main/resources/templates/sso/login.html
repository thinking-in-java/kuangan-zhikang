                        <div class="layui-form-item">

            </div>


            <div class="login-footer">

        <!-- js部分 -->
        <script type="text/javascript" th:src="@{/assets/libs/layui/layui.js}"></script>
        <script type="text/javascript" th:src="@{/assets/js/common.js}"></script>

        <script>

            layui.use(['layer', 'form', 'notice','index', 'admin'], function () {
                var $ = layui.jquery;
                var index = layui.index;
                var admin = layui.admin;

                var dataList = ["0","1"];

                index.clearTabCache();
                admin.changeTheme("theme-colorful");
                admin.putSetting('tabAutoRefresh', true);
                admin.putSetting('pageTabs', false);
                var $mainTab = $('.layui-body>.layui-tab[lay-filter="admin-pagetabs"]');
                $mainTab.attr('lay-autoRefresh', 'true');

                var layer = layui.layer;
                var form = layui.form;
                var notice = layui.notice;
                function getCookie(cookie_name) {
                    var allcookies = document.cookie;
                    //索引长度，开始索引的位置
                    var cookie_pos = allcookies.indexOf(cookie_name);
                    // 如果找到了索引，就代表cookie存在,否则不存在
                    if (cookie_pos != -1) {
                        // 把cookie_pos放在值的开始，只要给值加1即可
                        //计算取cookie值得开始索引，加的1为“=”
                        cookie_pos = cookie_pos + cookie_name.length + 1;
                        //计算取cookie值得结束索引
                        var cookie_end = allcookies.indexOf(";", cookie_pos);
                        if (cookie_end == -1) {
                            cookie_end = allcookies.length;

                        }
                        //得到想要的cookie的值
                        var value = unescape(allcookies.substring(cookie_pos, cookie_end));
                    }
                    return value;
                }
                var username = getCookie('username');
                var password = getCookie('password');

                if(username!=null &&password!= null){
                    // console.log($.cookie('username'));
                    $.ajax({
                        type : "post",
                        url : "/login",
                        data : {username:username,password:password,rememberMe:true,logintype:"NOPASSWORD"},
                        success : function(responseTxt) {
                            if (responseTxt.code == 200) {
                                //location.reload(true);
                                window.location.href="register"
                            }
                        }
                    });
                }

                form.verify({
                    name:function(value){
                        if(value==null || value ==0){
                            return '账号不能为空';
                        }
                    },
                    password:function(value){
                        if(value==null || value ==0){
                            return '密码不能为空';
                        }
                    }
                });
                // 表单提交
                form.on('submit(login-submit)', function (obj) {

                    var damos=false;
                    var yan=layer.open({
                        type : 1,
                        title : "验证" //不显示标题栏
                        ,
                        area : [ '290px', '250px' ],
                        shade : 0.8,
                        id : 'LAY_layuipro' //设定一个id，防止重复弹出
                        ,
                        moveType : 1 //拖拽模式，0或者1
                        ,
                        content : $('#box3'),
                        success : function(layero) {
                            var options = {
                                dataList: dataList,
                                success:function(){
                                    console.log("show");
                                    $.ajax({
                                        type : "post",
                                        url : "/login",
                                        data : date,
                                        success : function(responseTxt) {
                                            if (responseTxt.code == 200) {
                                                //location.reload(true);
                                                window.location.href="/register"
                                            } else {
                                                notice.msg(responseTxt.msg, {icon: 2});
                                                $(".login-captcha").trigger('click');
                                                console.log("1254");
                                                layer.close(yan)
                                            }
                                        }
                                    });
                                },
                                fail: function(){
                                    console.log("fail");
                                }
                            };
                            SliderBar("slideBar", options);
                            return false ;
                        }
                    });
                    var date=obj.field;
                    date.code="123465";
                    console.log(date);
                    return false ;



                    /*  layer.msg('登录成功', {icon: 1, time: 1500}, function () {
                         location.replace('../../index.html')
                     }); */
                    return false;
                });
                var tishi= $("#prompt").val();

                if(tishi!=null && tishi!=""){
                    notice.msg(tishi, {icon: 2});
                    layer.close(yan)
                }
                // 图形验证码
                $('.login-captcha').click(function() {
                    var chart= Math.round(Math.random());
                    if(chart==0){
                        this.src = '/captcha/captchaImage?type=math';
                    }else{
                        this.src = '/captcha/captchaImage?type=char';
                    }
                });
                $(".login-captcha").trigger('click');

            });
        </script>
    </body>
