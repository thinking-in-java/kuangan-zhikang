<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>分割面板</title>
<link rel="stylesheet" th:href="@{/assets/libs/layui/css/layui.css}" />
    <!--[if lt IE 9]>
    <script src="https://oss.maxcdn.com/html5shiv/3.7.3/html5shiv.min.js"></script>
    <script src="https://oss.maxcdn.com/respond/1.4.2/respond.min.js"></script>
    <![endif]-->
    <style>
        /** 必须先给固定高度，否则无法计算分割的高度 */
        .split-group {
            height: 400px;
        }

        .split-group-vertical {
            height: 458px;
        }

        /** //end */

        .layui-card-body {
            padding: 0;
        }

        .split-item {
            padding: 15px;
        }

        #demoSplit8 {
            padding: 0;
        }

        .layui-card-header {
            border-color: #dcdee2;
        }
        .layui-form-select dl { max-width:160px; }
    </style>
</head>
<body>

<!-- 加载动画 -->
<div class="page-loading">
    <div class="ball-loader">
        <span></span><span></span><span></span><span></span>
    </div>
</div>

<!-- 正文开始 -->
<form class="layui-form" action="">
    <div class="layui-row">
        <div class="layui-col-md7">
            <div class="layui-card">
                <div class="layui-card-body">
                    <div class="split-group" style="height: 300px;">
                        <div class="split-item" id="demoSplit1" >
                            
                           <div class="layui-inline">
						      <label class="layui-form-label">选择模板:</label>
						      <div class="layui-input-inline" style="width: 140px;">
							       <select lay-filter="aihao" id="smsname">
									
							   	   </select>
						      </div>
						    
						  </div>
						    
						    <div class="layui-inline" style='background-color:#e6f7ff;width: 100%;height:160px;margin-top:20px;border-radius:4px;overflow:auto'>
									 <label class="layui-form-label">模板内容:</label>
									 <br>
									 <span id="templateText">
									</span>
								</div>
								
								
						    
                           
                        </div>
                        <div class="split-item" id="demoSplit2">
                        		
                         <div class="layui-inline" style="width: 98%;">
						  	 <label class="layui-form-label" style="float: left;width: 108px;">共接收<span id="ren" style="color: red;"></span>项</label>
						  	 <label class="layui-form-label">信息模版库:</label>
						  	 
                           <div class="layui-inline">
						      <div class="layui-input-inline">
						        <select lay-filter="tSmsid" id="tSmsid">
									
							   	   </select>
						      </div>
						    
						  </div>
						  
						  	 
						  	</div>
						  
						  
                         		<div class="layui-form-item layui-form-text" style="margin-top:30px;">
							      <textarea style="min-height: 160px;" id="tText" placeholder="请输入内容" class="layui-textarea"></textarea>
							  </div>
                        </div>
                    </div>
                </div>
            </div>
            
            
             <div class="layui-form-item" style="text-align: center;">
              <button  type="reset" class="layui-btn layui-btn-primary">取消</button>
			      <button type="submit" class="layui-btn" lay-submit="" lay-filter="demo1">提交</button>
			  </div>
			  
			  
        </div>
      
        
    </div>
    
     </form>


<!-- js部分 -->
<script type="text/javascript" th:src="@{/assets/libs/layui/layui.js}"></script>
<script type="text/javascript" th:src="@{/assets/js/common.js}"></script>
<script type="text/javascript" th:src="@{/assets/js/jquery-1.11.1.js}"></script>
<script>


    layui.use(['form','layer', 'Split', 'dropdown', 'element'], function () {
        var $ = layui.jquery;
        var layer = layui.layer;
        var Split = layui.Split;
        var form = layui.form;
        var dropdown = layui.dropdown;
        var element = layui.element;

        
        
        
        var checked = "[[${checked}]]";
        if(checked!=null){
        	var strArray=checked.split(",");
        	$("#ren").html(strArray.length-1);
        }
        
        // 水平分割
        Split(['#demoSplit1', '#demoSplit2'], {sizes: [40, 60], minSize: 100});
        
        
        
      //监听提交
  	  form.on('submit(demo1)', function(data){
  		  
  		 window.location.reload();
  	   var smsname = $("#smsname").val();
  		var tText = $("#tText").val();
  		var checked= "[[${checked}]]";
  	   
  		 			
  		// 阻止表单跳转。如果需要表单跳转，去掉这段即可。
  		return false;
  	  });
      
      
      
        $(function(){
			var url = "/TemplateSendController/showSysSmsAll";
			var data2 = {
				
			};
			$.post(url, data2, function(data) {
				var htmld;
		       	var item=data.data;
		        for (var i = 0; i < item.length; i++) {
		        	if(i==0){
		        		showtSmsid(item[i].smsId);
		        		$("#templateText").html(item[i].templateText);
		        	}
		        	htmld+="<option value="+item[i].smsId+">"+item[i].smsname+"</option>";
				}
		       	$('#smsname').append(htmld);
		        form.render();
			})
		})
		
		
		showtSmsid=function(smsId){
        	$('#tSmsid').html("");
        	var url = "/TemplateSendController/SysTextSelectByPrimaryKey";
			var data2 = {
					'smsId' : smsId
			};
			$.post(url, data2, function(data) {
				var htmld;
		       	var item=data.data;
		        for (var i = 0; i < item.length; i++) {
		        	if(i==0){
		        		$("#tText").html(item[i].tText);
		        	}
		        	htmld+="<option value="+item[i].tId+">"+item[i].tText+"</option>";
				}
		       	$('#tSmsid').append(htmld);
		        form.render();
			})
        }
		
		 form.on('select(aihao)', function(data){
	        //layui.layer.msg(data.value);//得到被选中的值
	       // layui.layer.msg(data.elem); //得到select原始DOM对象
	       showtSmsid(data.value);
	       $("#templateText").html("");
	         var url = "/TemplateSendController/SysSmsSelectByPrimaryKey";
				var data2 = {
    					'smsId' : data.value
    				};
				$.post(url, data2, function(data) {
			        $("#templateText").html(data.data.templateText);
			        form.render();
				})
    	 })
    	 
    	 form.on('select(tSmsid)', function(data){
	        //layui.layer.msg(data.value);//得到被选中的值
	       // layui.layer.msg(data.elem); //得到select原始DOM对象
	       $("#tText").html("");
	         var url = "/TemplateSendController/selectSmsId";
				var data2 = {
    					'tId' : data.value
    				};
				$.post(url, data2, function(data) {
					$("#tText").html(data.data.tText);
			        form.render();
				})
    	 })
    	 
    	 
    	 

    });
</script>
</body>
</html>
