        /**
         * @param { Array<Number> } arr 一组数据
         * @param { Boolean } needSign 返回值是否添加%
         * @param { Number } decimalCount 精度：最多保留多少位小数
         * @returns { Array<Number|String> }
         */
        const calcPercentage = (arr = [], needSign = true, decimalCount = 4) => {
            let sum = arr.reduce((a, b) => a + b, 0),
                D = decimalCount < 2 ? 2 : decimalCount,
                // E1, E2将小数转化成整数，解决因精度导致小数计算错误的问题
                E1 = Math.pow(10, D),
                E2 = Math.pow(10, D + 2);
            if(sum === 0) {
                return arr.map(_ => needSign ? '0%' : 0);
            }
            const perArr = arr.map((e, i) => ({
                index: i,
                percentage: Math.round((e / sum).toFixed(D) * E1)
            }));
            const all = perArr.reduce((a, b) => a + b.percentage, 0);
            // 比较计算出的百分比总和和实际总和
            if(all > E1) {
                // 根据误差大小排序
                perArr.sort((a, b) => {
                    const aCur = a.percentage * Math.pow(10, 2),
                        aReal = Number((arr[a.index] / sum).toFixed(D + 2)) * E2,
                        bCur = b.percentage * Math.pow(10, 2),
                        bReal = Number((arr[b.index] / sum).toFixed(D + 2)) * E2,
                        aError = aCur - aReal,
                        bError = bCur - bReal;
                    return  bError - aError < 0 ? -1 : bError - aError > 0 ? 1 : a.index - b.index; // 根据误差排序，如果误差一样，索引小的在前面
                });
                let sumError = all - E1, i = 0;
                // 百分比总和多的部分，从误差大的百分比依次扣除
                while(sumError) {
                    perArr[i].percentage = perArr[i].percentage - 1;
                    sumError--;
                    i++;
                }
            }
            if(all < E1) {

                // 根据误差大小排序
                perArr.sort((a, b) => {
                    const aCur = a.percentage * Math.pow(10, 2),
                        aReal = Number((arr[a.index] / sum).toFixed(decimalCount + 2)) * E2,
                        bCur = b.percentage * Math.pow(10, 2),
                        bReal = Number((arr[b.index] / sum).toFixed(decimalCount + 2)) * E2,
                        aError = aCur - aReal,
                        bError = bCur - bReal;
                    return  aError - bError < 0 ? -1 : aError - bError > 0 ? 1 : a.index - b.index;
                });
                let sumError = all - E1, i = 0;
                // 百分比总和少的部分，从误差大的百分比依次补上
                while(sumError) {
                    perArr[i].percentage = perArr[i].percentage + 1;
                    sumError++;
                    i++;
                }
            }
            return perArr.sort((a, b) => a.index - b.index).map(e => needSign ? (e.percentage / Math.pow(10, D - 2)).toFixed(D - 2) + '%' : e.percentage/E1);
        };

		Array.prototype.indexOf = function(val) { 
			for (var i = 0; i < this.length; i++) { 
			if (this[i] == val) return i; 
			} 
			return -1; 
		};

			}

        function getNowFormatDate() {
			var date = new Date();
			var seperator1 = "-";
			var seperator2 = ":";
			var month = date.getMonth() + 1;
			var strDate = date.getDate();
			if (month >= 1 && month <= 9) {
				month = "0" + month;
			}
			if (strDate >= 0 && strDate <= 9) {
				strDate = "0" + strDate;
			}
			var currentdate = date.getFullYear() + seperator1 + month
					+ seperator1 + strDate + " " + date.getHours() + seperator2
					+ date.getMinutes() + seperator2 + date.getSeconds();
			return currentdate;
		}
        function count_down(o){
            var datatime=/^[\d]{4}-[\d]{1,2}-[\d]{1,2}( [\d]{1,2}:[\d]{1,2}(:[\d]{1,2})?)?$/ig,str='',conn,s;
            if(!o.match(datatime)){
                    alert('参数格式为2020-01-01[ 01:01[:01]].\r其中[]内的内容可省略');
                    return false;
            }
            var sec=(new Date(o.replace(/-/ig,'/')).getTime() - new Date().getTime())/1000;
            if(sec > 0){
                conn='等待服务';
            }else{
                return conn='请立即服务';

            }
            s={'天':sec/24/3600,'小时':sec/3600%24,'分':sec/60%60,'秒':sec%60};
            for(i in s){
                    if(Math.floor(s[i])>0 ) str += Math.floor(s[i]) + i;
            }
            if(Math.floor(sec)==0){ str='0秒'; }
            return   conn+str ;
    		}

        	Date.prototype.toLocaleString = function() {

        	        var d = this.getDate();

        	        var h = this.getHours();

                 table.render({
                     elem: '#tableAuth'
                     ,url: '/YhGroupIntervention/selectplanbyuser' //数据接口
                     ,title: '分组人员'
                     ,page:true
                     ,where:gdata
                     ,parseData: function(res){
                         console.log(res);
                     }
                     ,cols: [[ //表头
                         {type: 'checkbox', fixed: 'left'},
                         {
                             title: '执行时间',
                             width : 200,
                             align : 'center',
                             templet:function (d) {
                                 console.log(d)
                                 return ""+d.executeDate.split(" 00:00:00")[0]+""
                             }
                         },

                         {field: 'servicenam', title: '服务方式', align: 'center',width:200},
                         {field: 'counts', title: '计划内容', align: 'center',width:200,
                             templet:function (d) {
                                 if(d.counts!=null){
                                     return d.counts;
                                 }else{
                                     return d.var_count;
                                 }

                             }},
                         {field: 'countPrompt', title: '内容提示', align: 'center'},
                     ]], done: function(res){

                         // 设置当前页全部数据id到全局变量
                         tableIds = res.data.map(function (value) {
                             return value.detailsId;
                         });
                         // 设置当前页选中项
                         $.each(res.data, function (idx, val) {
                             if (ids.indexOf(val.detailsId) > -1) {
                                 val["LAY_CHECKED"] = 'true';
                                 //找到对应数据改变勾选样式，呈现出选中效果
                                 let index = val['LAY_TABLE_INDEX'];
                                 $('tr[data-index=' + index + '] input[type="checkbox"]').click();
                                 form.render('checkbox'); //刷新checkbox选择框渲染
                             }
                         });
                         // 获取表格勾选状态，全选中时设置全选框选中
                         let checkStatus = table.checkStatus('test');
                         if (checkStatus.isAll) {
                             $('.layui-table-header th[data-field="0"] input[type="checkbox"]').prop('checked', true);
                             form.render('checkbox'); //刷新checkbox选择框渲染
                         }
                     }
                 });
             }


             $('#zhuanyizhuceka').click(function(){
                 layer.confirm('确认要删除吗？', {
                     btn : [ '确定', '取消' ]//按钮
                 }, function(index) {
                     $.ajax({
                         type: "POST",
                         traditional:true,
                         dataType: "json",
                         data:{deleteids:ids,userCode:$("#fenzuid").val()},
                         url: "/YhGroupIntervention/deletesplanbyid",
                         success:function(data){
                             notices.success({
                                 title: '消息通知',
                                 message: '删除成功'
                             });
                             getData();
                             $("#piliang2").hide();
                             ids=[];
                             table.reload('tableAuth');
                             tableReload();//重载表格的方法
                             ids=[];
                            
                             /* window.location.reload(); */
                         }
                     })
                     layer.close(index);
                     console.log(ids)

                 });
             })
             table.on('checkbox(tableAuth)', function (obj) {
                 console.log(obj)
                 if (obj.checked == true) {
                     if (obj.type == 'one') {
                         ids.push(obj.data.detailsId);
                     } else {
                         for (let i = 0; i < tableIds.length; i++) {
                             //当全选之前选中了部分行进行判断，避免重复
                             if (ids.indexOf(tableIds[i]) == -1) {
                                 ids.push(tableIds[i]);
                             }
                         }
                     }
                 } else {
                     if (obj.type == 'one') {
                         let i = ids.length;
                         while (i--) {
                             if (ids[i] == obj.data.detailsId) {
                                 ids.splice(i, 1);
                             }
                         }
                     } else {
                         let i = ids.length;
                         while (i--) {
                             if (tableIds.indexOf(ids[i]) != -1) {
                                 ids.splice(i, 1);
                             }
                         }
                     }
                 }
                 //干预批量id
                 if(ids.length>0){
                     $("#piliang2").show();
                     $("#xuanze").html("已选择"+ids.length+"项")
                 }else{
                     $("#piliang2").hide();
                 }
             });
             changeCooperate();
             function changeCooperate(){
                 $.ajax({
                     type:"POST",
                     url:'/YhAcceptserviceController/selectCooperate',
                     dataType:"json",
                     traditional:true,
                     data:{usercode:$('#fenzuid').val()},
                     success:function(res) {

                         /* $("#taidu").html("配合态度:"+(res.data*100)+"%"); */
                     }
                 });
             }
             function zhucefenpei(data){
                 $.ajax({
                     type: "post",
                     traditional:true,
                     dataType: "json",
                     data:{deleteids:ids},
                     url: "/YhGroupIntervention/updategroup",
                     success:function(data){
                         notices.success({
                             title: '消息通知',
                             message: '修改成功'
                         });
                         window.location.reload();
                     }
                 })
             }
             $('#clickxuan2').click(function(){
                 ids=[];
                 getData();
                 $("#piliang2").hide();

             });
             // 搜索
             $('#btnSearchAuth').click(function () {
                 var test6 = $('#test6').val();
                 var plans = $('#plans').val();
                 var usercode = $('#fenzuid').val();
                 gdata={times:test6,serviceWay:plans,userCode:usercode}
                 getData();
             });
             //iframe层-父子操作

             //清除按钮
             $("#btnempty").click(function(){
                 window.location.reload();
             })


    });
</script>
