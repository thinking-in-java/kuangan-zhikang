            var btime=$("#test6").val().substring(0,11);
            var etime=$("#test6").val().substring(13)+" 23:59:59";
            var orgcode=$('#user').val();
            var data={begintime:btime,endtime:etime,chhooeorgcode:orgcode}
            $.ajax({
                type:"POST",
                url:"/yhmanagetaskjgcontroller/selectfenxi",
                dataType:"json",

                success:function(res){
                    var allnumber=res.data.dengdai+res.data.zhengzai+res.data.wancheng+res.data.guanbi
                    console.log(allnumber)
                    var deng=Math.round(res.data.dengdai/allnumber*10000)/100+"%";
                    var zheng=Math.round(res.data.zhengzai/allnumber*10000)/100+"%";
                    var wan=Math.round(res.data.wancheng/allnumber*10000)/100+"%";
                    var guan=Math.round(res.data.guanbi/allnumber*10000)/100+"%";
                    var datas=[
                        {value: res.data.dengdai, name: '等待服务('+deng+")"},
                        {value: res.data.zhengzai, name: '正在服务('+zheng+")"},
                        {value: res.data.wancheng, name: '完成服务('+wan+")"},

        alldoctor()

        //查询所有的医生
        function alldoctor(){
            var btime=$("#test6").val().substring(0,11);
            var etime=$("#test6").val().substring(13)+" 23:59:59";
            var orgcode=$('#user').val();
            var data={begintime:btime,endtime:etime,chhooeorgcode:orgcode}
            $.ajax({
                type:"POST",
                url:"/yhmanagetaskjgcontroller/selectalldoctor",
                dataType:"json",
                data:data,
                success:function(res){
                    var html="";
                    console.log(res);
                    if(findcount==0){
                        findcount=res.data.length
                    }
                    if(res.data.length<3){
                        findcount=res.data.length
                    }
                    if(res.data!=null){
                        for(var i=0;i<findcount;i++){
                            if((i+1)%3==0&&i!=0){
                                html+="<div style='height: 150px;width: 100%'>";
                            }
                            html+=

                                "                            <div style=\"height: 45px;width: 100%;\">\n" +

                                "                                <span style=\"height: 45px;line-height: 45px;float: right;margin-right: 25px\">"+getbaifneshu(res.data[i].wancheng,res.data[i].zhengzai,res.data[i].dengdai,res.data[i].allshuliang)+"% </span>\n" +
                                "                                <span style=\"height: 45px;line-height: 45px;float: right;\">完成率：&nbsp;&nbsp;&nbsp;&nbsp;</span>\n" +
                                "                            </div>\n" +
                                "                            <!--短线-->\n" +
                                "                            <div style=\"width: 93%;margin-left: 2%;height: 10px\">\n" +
                                "                                <div style=\"width: 40%;float: left;background-color: rgba(67, 207, 124, 1);height: 10px\"></div>\n" +
                                "                                <div style=\"width: 30%;float: left;background-color: rgba(42, 130, 228, 1);height: 10px\"></div>\n" +
                                "                                <div style=\"width: 30%;float: left;background-color: rgba(240, 46, 24, 1);height: 10px\"></div>\n" +
                                "                            </div>\n" +
                                "\n" +
                                "                            <div style=\"height: 90px;width: 93%;margin-left: 2%;margin-top: 5px;\">\n" +
                                "                                <div style=\"float: left;height: 90px;width: 33%;\">\n" +
                                "                                    <div style=\"width: 100%;height: 50px;line-height: 50px;text-align: center;color:rgba(67, 207, 124, 1);font-size: 17px; \">"+(res.data[i].wancheng==null?0:res.data[i].wancheng)+"</div>\n" +
                                "                                    <div style=\"width: 100%;height: 40px;text-align: center;font-size: 14px\">完成处理</div>\n" +
                                "                                </div>\n" +
                                "                                <div style=\"float: left;height: 90px;width: 33%;\">\n" +
                                "                                    <div style=\"width: 100%;height: 50px;line-height: 50px;text-align: center;color: rgba(42, 130, 228, 1);font-size: 17px;\">"+(res.data[i].zhengzai==null?0:res.data[i].zhengzai)+"</div>\n" +
                                "                                    <div style=\"width: 100%;height: 40px;text-align: center;font-size: 14px\">正在处理</div>\n" +
                                "                                </div>\n" +
                                "                                <div style=\"float: left;height: 90px;width: 34%;\">\n" +
                                "                                    <div style=\"width: 100%;height: 50px;line-height: 50px;text-align: center;color:rgba(240, 46, 24, 1);font-size: 17px; \">"+(res.data[i].dengdai==null?0:res.data[i].dengdai)+"</div>\n" +
                                "                                    <div style=\"width: 100%;height: 40px;text-align: center;font-size: 14px\">等待处理</div>\n" +
                                "                                </div>\n" +
                                "                            </div>\n" +
                                "\n" +
                                "\n" +
                                "                        </div>\n" +
                                "\n" ;
                                if((i+1)%3==0&&i!=0){
                                    console.log(i)
                                    html+="</div><div style='height: 20px;width: 100%'></div>";
                                    html+="<div style='height: 20px;width: 100%'></div>";

                        }
                        $("#counts").empty().append(html);
                    }
                    // layer.close(loading);
                    $("#zhezhao").hide();
                    $("#zhe").hide();
                }
            });
        }
        $(document).on("click", "#quanbu", function () {
            findcount=0;
            alldoctor();

        })

        function getbaifneshu(wancheng,zhengzai,dengta,all) {
            if(wancheng==null){
                wancheng=0;
            }
            if(zhengzai==null){
                zhengzai=0;
            }
            if(dengta==null){
                dengta=0;
            }
            return toDecimal(wancheng/all);
        }

        function toDecimal(x) {
            var f = parseFloat(x);
            if (isNaN(f)) {
                return;
            }
            f = Math.round(x*10000)/100;
            return f;
        }




        $("#daochu").click(function(){
            var btime=$("#test6").val().substring(0,11);
            var etime=$("#test6").val().substring(13)+" 23:59:59";
            var orgcode=$('#user').val();
            var hrefs="/yhmanagetaskjgcontroller/exportalldoctor?begintime="+btime+"&endtime="+etime+"&chhooeorgcode="+orgcode;
            console.log(hrefs)
            layer.msg("正在导出,请稍后...",{
                icon:16,
                shade: [0.5, '#f5f5f5'],
                time:-1
            });
            fetch(hrefs, {
                method: 'GET',
                headers: {'Content-Type': 'application/json'},
                //body: '<请求参数：json字符串>',
            }).then(res => res.blob()).then(data => {
                var blobUrl = window.URL.createObjectURL(data);
                downloads(blobUrl);

            });
        });
        function downloads(blobUrl) {
            //关闭提示框
            layer.closeAll();
            const a = document.createElement('a');
            a.style.display = 'none';
            a.download ='服务管理 统计分析导出-'+ getFormatDate()+'.xls';
            a.href = blobUrl;
            a.click();
            document.body.removeChild(a);

        }
        function getFormatDate() {
            var date = new Date();
            var month = date.getMonth() + 1;
            var strDate = date.getDate();
            if (month >= 1 && month <= 9) {
                month = "0" + month;
            }
            if (strDate >= 0 && strDate <= 9) {
                strDate = "0" + strDate;
            }
            var currentDate = date.getFullYear() + "" + month + "" + strDate
                + "" + date.getHours() + "" + date.getMinutes() + "" + date.getSeconds();
            return currentDate;
        }

        function randtreesone(){
            treeSelect.render({
                // 选择器
                elem: '#tree',

                    $('#user').val(d.current.id);

                    console.log(d);
//                选中节点，根据id筛选
              treeSelect.checkNode('tree', d.data[0].id);

//                获取zTree对象，可以调用zTree方法
//                var treeObj = treeSelect.zTree('tree');
//                console.log(treeObj);

//                刷新树结构
//                treeSelect.refresh();
                }
            });
        }

                if(value==null || value == ""){

        form.verify({
            isbunber: function(value, item){ //value：表单的值、item：表单的DOM对象
                if(value<0){

                }

        });
