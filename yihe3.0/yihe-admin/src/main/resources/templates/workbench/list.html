<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="${workbenchPage == 'todos' ? '我的待办 · 矿安智康' : '预警中心 · 矿安智康'}">工作台</title>
<link rel="stylesheet" th:href="@{/assets/css/health-workbench.css(v=20261123b)}"><link rel="stylesheet" th:href="@{/assets/css/workbench-lists.css(v=20261123b)}"><link rel="stylesheet" th:href="@{/assets/css/digital-worker-dispatch.css(v=worker-independent-v1)}">
<script defer th:src="@{/assets/js/digital-worker-service.js(v=worker-independent-v1)}"></script><script defer th:src="@{/assets/js/digital-worker-task-results.js(v=worker-independent-v1)}"></script><script defer th:src="@{/assets/js/digital-worker-dispatch.js(v=worker-independent-v1)}"></script><script defer th:src="@{/assets/js/health-workbench-data.js(v=20261123b)}"></script><script defer th:src="@{/assets/js/workbench-lists.js(v=20261124r2)}"></script><link rel="stylesheet" th:href="@{/assets/css/workspace-layout.css(v=20261124r4)}"></head>
<body class="workspace-page workbench-list" th:attr="data-base=@{/},data-page=${workbenchPage},data-user=${displayName}">
<header class="hero"><div class="hero-top"><span class="brand">✦ 矿安智康 <small>OCCUPATIONAL HEALTH</small></span><div class="tools"><span class="live-dot"></span>健康管理工作台<button id="fullscreen" aria-label="全屏展示">⛶</button></div></div><div class="hero-title"><div><h1>煤矿职业健康 AI 管理平台</h1><span>AI 赋能 · 精准评估 · 主动干预 · 守护矿工健康</span></div><div class="clock"><strong id="clock">--:--:--</strong><span id="date"></span></div></div></header>
<main class="list-shell"><div class="list-heading"><h1 id="page-title"></h1><a th:href="@{/manage/workbench}">工作台 / <span id="breadcrumb"></span></a></div><section class="panel list-panel"><div class="panel-head"><h2 id="section-title"></h2><button id="create-task" class="wb-button primary" hidden>＋ 新建任务</button></div>
<div id="alert-kpis" class="alert-kpis" hidden></div><div id="task-tabs" class="task-tabs" role="group" aria-label="任务类型筛选" hidden></div>
<form id="filters" class="filters"></form><div class="list-status"><span id="list-status" role="status" aria-live="polite">正在读取数据…</span><div><button class="text-button" id="reset">重置筛选</button><button class="text-button" id="reload">↻ 刷新</button></div></div>
<div class="table-scroll" tabindex="0" aria-label="数据表格，可横向滚动"><table><thead id="table-head"></thead><tbody id="table-body"></tbody></table></div>
<div class="pagination"><span id="total"></span><label>每页<select id="page-size" aria-label="每页显示条数"><option value="10">10条/页</option><option value="20">20条/页</option><option value="50">50条/页</option></select></label><nav id="pages" aria-label="列表分页"></nav></div></section><footer>矿安智康 · 高效协作，主动守护<span>健康管理，从每一天开始</span></footer></main></body></html>
