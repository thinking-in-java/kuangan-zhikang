<script style="display: none">
    layui.use(['layer', 'form', 'laydate'], function () {
        var $ = layui.jquery;
        var layer = layui.layer;
        var form = layui.form;
        var laydate = layui.laydate;

        // 渲染laydate
        laydate.render({
            elem: '#edtDateFormBas',
            range: true,
			trigger: 'click'
        });
        //查询一级机构的名字
        $.ajax({
          	 type: "get",
               url: "/YhUserSetting/selectorgname",
               dataType:"json",
               success: function(data){
					if(data.code==20000){
						
						$("#orgname").html(data.data);
					}
               }
          	
          });
      	form.verify({
      	  //数组的两个值分别代表：[正则匹配、匹配不符时的提示文字]
      			  count:function(value){
      				  if(value==null || value ==0 || value==""){
      					  return "AppKey不能为空";
      				  }
      			  },
      			accesskeysecret:function(value){
    				  if(value==null || value ==0 || value==""){
    					  return "AppSecret不能为空";
    				  }
    			  },
    			  AppCode:function(value){
      				  if(value==null || value ==0 || value==""){
      					  return "AppCode不能为空";
      				  }
      			  },
      				ID:function(value){
      				  if(value==null || value ==0 || value==""){
      					  return "签名ID不能为空";
      				  }
      			  },
      			});
        // 监听表单提交
        form.on('submit(formSubmitBas)', function (data) {
        	 
            $.ajax({
           	 type: "post",
             url: "/YhJzSysSmsWebController/WxInfoAdd",
                dataType: "json",
                data:data.field,
                success: function(data){
                	if(data.data==1){
						layer.msg("保存成功", {icon: 1});
						//quxiao();
					}else{
						layer.msg("保存失败", {icon: 2}); 
					}
                }
           	
           });
            return false;
        });
		
        var rObj = document.getElementsByName('type');
     
        $.ajax({
        	 type: "POST",
             url: "/YhJzSysSmsWebController/selectbyWxINfo",
             dataType: "json",
             success: function(data){
            	 $('[name="gzAppid"]').attr("value",data.data.gzAppid);
            	 $('[name="gzAppsecret"]').attr("value",data.data.gzAppsecret);
            	 $('[name="xcAppid"]').attr("value",data.data.xcAppid);
            	 $('[name="xcAppsecret"]').attr("value",data.data.xcAppsecret);
            	 
            	 $('[name="taskboardId"]').attr("value",data.data.taskboardId);
            	 $('[name="taskvariate1"]').attr("value",data.data.taskvariate1);
            	 $('[name="taskvariate2"]').attr("value",data.data.taskvariate2);
            	 
            	 $('[name="replyboardId"]').attr("value",data.data.replyboardId);
            	 $('[name="replyvariate1"]').attr("value",data.data.replyvariate1);
            	 $('[name="replyvariate2"]').attr("value",data.data.replyvariate2);
            	 
            	 
            	 $('[name="gzhboardId"]').attr("value",data.data.gzhboardId);
            	 $('[name="gzhvariate1"]').attr("value",data.data.gzhvariate1);
            	 $('[name="gzhvariate2"]').attr("value",data.data.gzhvariate2);
            	 $('[name="gzhvariate3"]').attr("value",data.data.gzhvariate3);
            	 $('[name="gzhvariate4"]').attr("value",data.data.gzhvariate4);
            	 
            	 
            	 $('[name="gzhreplyboardId"]').attr("value",data.data.gzhreplyboardId);
            	 $('[name="gzhreplyvariate1"]').attr("value",data.data.gzhreplyvariate1);
            	 $('[name="gzhreplyvariate2"]').attr("value",data.data.gzhreplyvariate2);
            	 $('[name="gzhreplyvariate3"]').attr("value",data.data.gzhreplyvariate3);
            	 $('[name="gzhreplyvariate4"]').attr("value",data.data.gzhreplyvariate4);
            	 $('[name="gzhreplyvariate5"]').attr("value",data.data.gzhreplyvariate5);
            	 layui.form.render('radio');
             }
        	
        });
        quxiao=function(){
        	document.getElementById("clicksetting").click();
        }
        
    });
