<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>文件储存配置</title>
    <link rel="stylesheet"  th:href="@{/assets/libs/layui/css/layui.css}" />
    <link rel="stylesheet"  th:href="@{/assets/module/admin.css}"  />
    <!--[if lt IE 9]>
    <script src="https://oss.maxcdn.com/html5shiv/3.7.3/html5shiv.min.js"></script>
    <script src="https://oss.maxcdn.com/respond/1.4.2/respond.min.js"></script>
    <![endif]-->
</head>
<body>
<!-- 页面加载loading -->
<div class="page-loading">
    <div class="ball-loader">
        <span></span><span></span><span></span><span></span>
    </div>
</div>
<a id="clicksetting" target="_self" style="display: none" href="/manage/setting/clientservice" lay-text="客户服务配置">"客户服务配置"</a>
<!-- 正文开始 -->
	<div style="width: 100%;height: 468px;background-color: #FFF; position:relative;">
    <div style="position: absolute;width: 120px;height: 30px;margin-top:25px; margin-left: 34px;font-size: 20px;line-height: 150%;text-align: left;font-weight: bold;">文件储存配置</div>
    <test id="orgname" style="position: absolute;width: 196px;height: 22px;margin-top:70px; margin-left: 34px;font-size: 14px;line-height: 160%;text-align: left;">福建XX健康养老发展有限公司</test>
    <div style="position: absolute;margin-top: 110px;margin-left: 20px">
    	<div style="width: 160px;height: 24px; margin-left: 14px;">
    		<div style="background-color: #1890ff;width: 3px;height: 24px;float: left">
    		</div>
    		<span>&nbsp;&nbsp;&nbsp;文件储存</span>
    	</div>
    	 <div class="layui-card-body" style="width: 900px;">
            <form class="layui-form" style="max-width: 800px;">
			 <div class="layui-form-item">
                    <label class="layui-form-label">服务商:</label>
                    <div class="layui-input-inline" style="display: block;width: auto;float: none;height: 40px">
                        <input type="radio" name="type" value="1" title="阿里云" checked>
                        <!-- <input type="radio" name="type" value="2" title="腾讯云">
                        <input type="radio" name="type" value="3" title="云片网">
                        <input type="radio" name="type" value="4" title="网易云信"> -->
                        <input type="radio" name="type" value="5" title="七牛">
                    </div>
                </div>
				
				<div class="layui-form-item" style="display: none">
                    <label style="width: 80px" class="layui-form-label layui-form-required">id:</label>
                    <div class="layui-input-block">
                        <input type="text" name="id" placeholder="请填写" class="layui-input"
                               lay-verType="tips"/>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label style="width: 80px" class="layui-form-label ">域名:</label>
                    <div class="layui-input-block">
                        <input type="text" name="Domain" placeholder="请填写" class="layui-input"
                              lay-verify="yuming" required/>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label style="width: 80px" class="layui-form-label ">空间名:</label>
                    <div class="layui-input-block">
                        <input type="text" name="BucketName" placeholder="请填写" class="layui-input"
                               lay-verify="kongjianming" required/>
                    </div>
                </div>
                  <div class="layui-form-item">
                    <label   class="layui-form-label">AccessKey:</label>
                    <div class="layui-input-block">
                        <input type="text" name="AccessKey" placeholder="请填写" class="layui-input"
                               lay-verify="AccessKey" required/>
                    </div>
                </div>
                  <div class="layui-form-item">
                    <label  class="layui-form-label">SecretKey:</label>
                    <div class="layui-input-block">
                        <input type="text" name="SecretKey" placeholder="请填写" class="layui-input"
                               lay-verify="SecretKey" required  />
                    </div>
                </div>
		           <div class="layui-form-item">
                    <div class="layui-input-block">
                        <button style="background-color:#2a9ce4" type="button" class="layui-btn" lay-filter="formSubmitBas" lay-submit>&emsp;保存&emsp;</button>
                      <!-- onclick="quxiao()" -->
                        <button type="reset"  class="layui-btn layui-btn-primary">&emsp;取消&emsp;</button>
                    </div>
                </div>
            </form>

        </div>
    </div>
    </div>

<script type="text/javascript" th:src="@{/assets/libs/layui/layui.js}" ></script>
<script type="text/javascript" th:src="@{/assets/js/common.js}" ></script>
<script>
    layui.use(['layer', 'form', 'laydate'], function () {
        var $ = layui.jquery;
        var layer = layui.layer;
        var form = layui.form;
        var laydate = layui.laydate;
        var newdata=null;
        var calldata=null;
        // 渲染laydate
        laydate.render({
            elem: '#edtDateFormBas',
            range: true,
            trigger: 'click'
        });
    	form.verify({
        	  //数组的两个值分别代表：[正则匹配、匹配不符时的提示文字]
        			  	yuming:function(value){
        				  if(value==null || value ==0 || value==""){
        					  return "域名不能为空";
        				  }
        			  },
	        			kongjianming:function(value){
	      				  if(value==null || value ==0 || value==""){
	      					  return "空间名不能为空";
	      				  }
	      			  },
      					AccessKey:function(value){
        				  if(value==null || value ==0 || value==""){
        					  return "AccessKey不能为空";
        				  }
        			  },
        			 	SecretKey:function(value){
        				  if(value==null || value ==0 || value==""){
        					  return "SecretKey不能为空";
        				  }
        			  }
        			});
        $.ajax({
         	 type: "get",
              url: "/YhUserSetting/selectorgname",
              dataType:"json",
              success: function(data){
					if(data.code==20000){
						      
						$("#orgname").html(data.data);
					}
              }
         	
         });

        // 监听表单提交
        form.on('submit(formSubmitBas)', function (data) {
            if(newdata.type==1){
            	newdata.aliyunDomain=data.field.Domain
            	newdata.aliyunBucketName=data.field.BucketName
            	newdata.aliyunAccessKeyId=data.field.AccessKey
            	newdata.aliyunAccessKeySecret=data.field.SecretKey
            	newdata.type=data.field.type
            }else if(newdata.type==2){
            	
            }else if(newdata.type==3){
            	
            }else if(newdata.type==4){
            	
            }else if(newdata.type==5){
            	newdata.qiniuDomain=data.field.Domain
            	newdata.qiniuBucketName=data.field.BucketName
            	newdata.qiniuAccessKey=data.field.AccessKey
            	newdata.aliyunAccessKeySecret=data.field.SecretKey
            	newdata.type=data.field.type
            }
            var last=JSON.stringify(newdata);
            calldata.value=JSON.stringify(newdata);
           var cast={};
           cast.id=calldata.id;
           cast.key=calldata.key;
           cast.remark=calldata.remark;
           cast.status=calldata.status;
           cast.value=calldata.value;
           
            //calldata.yhjzsyssms=null;
            $.ajax({
           	 type: "post",
                url: "/YhUserSetting/insertstore",
                dataType:"json",
                data:cast,
                success: function(data){
					if(data.code==20000){
						layer.msg("保存成功", {icon: 1});
						//quxiao();
					}else{
						layer.msg("保存失败", {icon: 2}); 
					}
                }
           	
           });
            return false;
        });
        var rObj = document.getElementsByName('type');
        
        $.ajax({
        	 type: "GET",
             url: "/YhUserSetting/selectallsms",
             dataType: "json",
             success: function(data){
            	 calldata=data.data[0];
            	 newdata= JSON.parse(data.data[0].value);
            	 console.log(newdata);
            	 for(var i = 0;i < rObj.length;i++){
                     if(rObj[i].value == newdata.type){
                         rObj[i].checked =  'checked';
                     }
                 }
            	 $('[name="id"]').attr("value",data.data[0].id);
            	 if(newdata.type==1){
                	 $('[name="Domain"]').attr("value",newdata.aliyunDomain);
                	 $('[name="BucketName"]').attr("value",newdata.aliyunBucketName);
                	 $('[name="AccessKey"]').attr("value",newdata.aliyunAccessKeyId);
                	 $('[name="SecretKey"]').attr("value",newdata.aliyunAccessKeySecret);
            	 }else if(newdata.type==2){
            		 
            	 }else if(newdata.type==3){
            		 
            	 }else if(newdata.type==4){
            		 
            	 }else if(newdata.type==5){
                	 $('[name="Domain"]').attr("value",newdata.qiniuDomain);
                	 $('[name="BucketName"]').attr("value",newdata.qiniuBucketName);
                	 $('[name="AccessKey"]').attr("value",newdata.qiniuAccessKey);
                	 $('[name="SecretKey"]').attr("value",newdata.qiniuSecretKey);
            	 }
            	 
            	 layui.form.render('radio');
             }
        	
        });
        quxiao=function(){
        	document.getElementById("clicksetting").click();
        }
        
    });
</script>
</body>
</html>
