<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>短信配置</title>
    <link rel="stylesheet"  th:href="@{/assets/libs/layui/css/layui.css}" />
    <link rel="stylesheet"  th:href="@{/assets/module/admin.css}"  />
    <!--[if lt IE 9]>
    <script src="https://oss.maxcdn.com/html5shiv/3.7.3/html5shiv.min.js"></script>
    <script src="https://oss.maxcdn.com/respond/1.4.2/respond.min.js"></script>
    <![endif]-->
    
</head>
<body>
<!-- 页面加载loading -->
<div class="page-loading">
    <div class="ball-loader">
        <span></span><span></span><span></span><span></span>
    </div>
</div>
<a id="clicksetting" target="_self" style="display: none" href="/manage/setting/clientservice" lay-text="客户服务配置">"客户服务配置"</a>
<!-- 正文开始 -->

	<div style="width: 100%;height: 800px;background-color: #FFF; position:relative;">
    <div style="position: absolute;width: 80px;height: 30px;margin-top:25px; margin-left: 34px;font-size: 20px;line-height: 150%;text-align: left;font-weight: bold;">短信配置</div>
    <test id="orgname" style="position: absolute;width: 196px;height: 22px;margin-top:70px; margin-left: 34px;font-size: 14px;line-height: 160%;text-align: left;">福建XX健康养老发展有限公司</test>
    <div style="position: absolute;margin-top: 110px;margin-left: 20px">
    	<div style="width: 160px;height: 24px; margin-left: 14px;">
    		<div style="background-color: #1890ff;width: 3px;height: 24px;float: left">
    		</div>
    		<span>&nbsp;&nbsp;&nbsp;短信服务</span>
    	</div>
    	 <div class="layui-card-body">
            <form class="layui-form" >
			 <div class="layui-form-item">
                    <label class="layui-form-label">服务商:</label>
                    <div class="layui-input-inline" style="display: block;width: auto;float: none;height: 40px">
                        <input type="radio" name="type" value="1" title="阿里云" checked>
                        <!-- <input type="radio" name="type" value="2" title="腾讯云">
                        <input type="radio" name="type" value="3" title="云片网">
                        <input type="radio" name="type" value="4" title="网易云信">
                        <input type="radio" name="type" value="5" title="七牛"> -->
                    </div>
                </div>
				
                <div class="layui-form-item">
                    <label style="width: 80px" class="layui-form-label ">AppKey:</label>
                    <div class="layui-input-block">
                        <input type="text" name="accesskey" placeholder="请填写" class="layui-input"
                                lay-verify="count" required/>
                    </div>
                </div>
                  <div class="layui-form-item">
                    <label   class="layui-form-label">AppSecret:</label>
                    <div class="layui-input-block">
                        <input type="text" name="accesskeysecret" placeholder="请填写" class="layui-input"
                                lay-verify="accesskeysecret" required/>
                    </div>
                </div>
                
                 <div class="layui-form-item">
                    <label  class="layui-form-label">签名ID:</label>
                    <div class="layui-input-block">
                        <input type="text" name="signname" placeholder="请填写" class="layui-input inline-block"
                               style="width: 160px;" lay-verify="ID" required/>
                    </div>
                </div>
                <div style="margin-top: 50px;margin-left: 20px;">模板ID配置</div>
                
                <div class="layui-form-item">
                    <label  class="layui-form-label" style="width: 100px;">验证码:</label>
                    <div class="layui-input-block">
                        <input type="text" name="templateId" placeholder="请填写" class="layui-input inline-block"
                               style="width: 160px;"/>
                    </div>
                </div>
                
                
                <div class="layui-form-item">
					    <div class="layui-inline">
					      <label class="layui-form-label" style="width: 100px;">计划任务提醒:</label>
					      <div class="layui-input-inline">
					       <input type="text" name="tasktemplateId" placeholder="请填写" class="layui-input inline-block"
	                               style="width: 160px;"/>
					      </div>
					    </div>
					    <div class="layui-inline">
					      <label class="layui-form-label">模板type:</label>
					      <div class="layui-input-inline">
					        <input type="text" name="tasktemplateType" placeholder="请填写" class="layui-input inline-block"
	                               style="width: 160px;"/>
					      </div>
					    </div>
					    <div class="layui-inline">
					      <label class="layui-form-label">模板内容:</label>
					      <div class="layui-input-inline">
					        <input type="tel" name="tasktemplateText"  autocomplete="off" style="width: 300px;" class="layui-input">
					      </div>
					    </div>
				  </div>
				  
				  <div class="layui-form-item">
					    <div class="layui-inline">
					      <label class="layui-form-label" style="width: 100px;">饮食指导:</label>
					      <div class="layui-input-inline">
					       <input type="text" name="foodtemplateId" placeholder="请填写" class="layui-input inline-block"
	                               style="width: 160px;"/>
					      </div>
					    </div>
					    <div class="layui-inline">
					      <label class="layui-form-label">模板type:</label>
					      <div class="layui-input-inline">
					        <input type="text" name="foodtemplateType" placeholder="请填写" class="layui-input inline-block"
	                               style="width: 160px;"/>
					      </div>
					    </div>
					    <div class="layui-inline">
					      <label class="layui-form-label">模板内容:</label>
					      <div class="layui-input-inline">
					        <input type="tel" name="foodtemplateText"  autocomplete="off" style="width: 300px;" class="layui-input">
					      </div>
					    </div>
				  </div>
				  
				  
				  <div class="layui-form-item">
					    <div class="layui-inline">
					      <label class="layui-form-label" style="width: 100px;">运动指导:</label>
					      <div class="layui-input-inline">
					       <input type="text" name="sportstemplateId" placeholder="请填写" class="layui-input inline-block"
	                               style="width: 160px;"/>
					      </div>
					    </div>
					    <div class="layui-inline">
					      <label class="layui-form-label">模板type:</label>
					      <div class="layui-input-inline">
					        <input type="text" name="sportstemplateType" placeholder="请填写" class="layui-input inline-block"
	                               style="width: 160px;"/>
					      </div>
					    </div>
					    <div class="layui-inline">
					      <label class="layui-form-label">模板内容:</label>
					      <div class="layui-input-inline">
					        <input type="tel" name="sportstemplateText"  autocomplete="off" style="width: 300px;" class="layui-input">
					      </div>
					    </div>
				  </div>
				  
				  <div class="layui-form-item">
					    <div class="layui-inline">
					      <label class="layui-form-label" style="width: 100px;">健康知识:</label>
					      <div class="layui-input-inline">
					       <input type="text" name="knowledgetemplateId" placeholder="请填写" class="layui-input inline-block"
	                               style="width: 160px;"/>
					      </div>
					    </div>
					    <div class="layui-inline">
					      <label class="layui-form-label">模板type:</label>
					      <div class="layui-input-inline">
					        <input type="text" name="knowledgetemplateType" placeholder="请填写" class="layui-input inline-block"
	                               style="width: 160px;"/>
					      </div>
					    </div>
					    <div class="layui-inline">
					      <label class="layui-form-label">模板内容:</label>
					      <div class="layui-input-inline">
					        <input type="tel" name="knowledgetemplateText"  autocomplete="off" style="width: 300px;" class="layui-input">
					      </div>
					    </div>
				  </div>
				  
				  <div class="layui-form-item">
					    <div class="layui-inline">
					      <label class="layui-form-label" style="width: 100px;">发货提醒:</label>
					      <div class="layui-input-inline">
					       <input type="text" name="logisticsId" placeholder="请填写" class="layui-input inline-block"
	                               style="width: 160px;"/>
					      </div>
					    </div>
					    <div class="layui-inline">
					      <label class="layui-form-label">模板type:</label>
					      <div class="layui-input-inline">
					        <input type="text" name="logisticsType" placeholder="请填写" class="layui-input inline-block"
	                               style="width: 160px;"/>
					      </div>
					    </div>
					    <div class="layui-inline">
					      <label class="layui-form-label">模板内容:</label>
					      <div class="layui-input-inline">
					        <input type="tel" name="logisticsText"  autocomplete="off" style="width: 300px;" class="layui-input">
					      </div>
					    </div>
				  </div>
				  
				  
                
                   <div class="layui-form-item">
                    <div class="layui-input-block">
                        <button style="background-color:#2a9ce4" class="layui-btn" lay-filter="formSubmitBas" lay-submit>&emsp;保存&emsp;</button>
                       <!-- onclick="quxiao()" -->
                        <button type="reset"  class="layui-btn layui-btn-primary">&emsp;取消&emsp;</button>
                    </div>
                </div>
            </form>

        </div>
    </div>
    </div>

<script type="text/javascript" th:src="@{/assets/libs/layui/layui.js}"></script>
<script type="text/javascript" th:src="@{/assets/js/common.js}" ></script>
<script style="display: none">
    layui.use(['layer', 'form', 'laydate'], function () {
        var $ = layui.jquery;
        var layer = layui.layer;
        var form = layui.form;
        var laydate = layui.laydate;

        // 渲染laydate
        laydate.render({
            elem: '#edtDateFormBas',
            range: true,
			trigger: 'click'
        });
        //查询一级机构的名字
        $.ajax({
          	 type: "get",
               url: "/YhUserSetting/selectorgname",
               dataType:"json",
               success: function(data){
					if(data.code==20000){
						
						$("#orgname").html(data.data);
					}
               }
          	
          });
      	form.verify({
      	  //数组的两个值分别代表：[正则匹配、匹配不符时的提示文字]
      			  count:function(value){
      				  if(value==null || value ==0 || value==""){
      					  return "AppKey不能为空";
      				  }
      			  },
      			accesskeysecret:function(value){
    				  if(value==null || value ==0 || value==""){
    					  return "AppSecret不能为空";
    				  }
    			  },
    			  AppCode:function(value){
      				  if(value==null || value ==0 || value==""){
      					  return "AppCode不能为空";
      				  }
      			  },
      				ID:function(value){
      				  if(value==null || value ==0 || value==""){
      					  return "签名ID不能为空";
      				  }
      			  },
      			});
        // 监听表单提交
        form.on('submit(formSubmitBas)', function (data) {
        	 
            $.ajax({
           	 type: "post",
             url: "/YhJzSysSmsWebController/SmsAdd",
                dataType: "json",
                data:data.field,
                success: function(data){
                	if(data.data==1){
						layer.msg("保存成功", {icon: 1});
						//quxiao();
					}else{
						layer.msg("保存失败", {icon: 2}); 
					}
                }
           	
           });
            return false;
        });
		
        var rObj = document.getElementsByName('type'); 
     
        $.ajax({
        	 type: "POST",
             url: "/YhJzSysSmsWebController/selectSmsNull",
             dataType: "json",
             success: function(data){
            	 console.log("模板",data)
            	 $('[name="accesskey"]').attr("value",data.data.accesskey);
            	 $('[name="accesskeysecret"]').attr("value",data.data.accesskeysecret);
            	 $('[name="signname"]').attr("value",data.data.signname);
            	 $('[name="templateId"]').attr("value",data.data.templateId);
            	 
            	 $('[name="tasktemplateId"]').attr("value",data.data.tasktemplateId);
            	 $('[name="tasktemplateType"]').attr("value",data.data.tasktemplateType);
            	 $('[name="tasktemplateText"]').attr("value",data.data.tasktemplateText);
            	 
            	 $('[name="foodtemplateId"]').attr("value",data.data.foodtemplateId);
            	 $('[name="foodtemplateType"]').attr("value",data.data.foodtemplateType);
            	 $('[name="foodtemplateText"]').attr("value",data.data.foodtemplateText);
            	 
            	 $('[name="sportstemplateId"]').attr("value",data.data.sportstemplateId);
            	 $('[name="sportstemplateType"]').attr("value",data.data.sportstemplateType);
            	 $('[name="sportstemplateText"]').attr("value",data.data.sportstemplateText);
            	 
            	 $('[name="knowledgetemplateId"]').attr("value",data.data.knowledgetemplateId);
            	 $('[name="knowledgetemplateType"]').attr("value",data.data.knowledgetemplateType);
            	 $('[name="knowledgetemplateText"]').attr("value",data.data.knowledgetemplateText);
            	 
            	 $('[name="logisticsId"]').attr("value",data.data.logisticsId);
            	 $('[name="logisticsType"]').attr("value",data.data.logisticsType);
            	 $('[name="logisticsText"]').attr("value",data.data.logisticsText);
            	 layui.form.render('radio');
             }
        	
        });
        quxiao=function(){
        	document.getElementById("clicksetting").click();
        }
        
    });
</script>
</body>
</html>
