<!-- 表格操作列 -->
<script type="text/html" id="tableBarAuth" th:inline="none">
<a  lay-href="${basePath}/yihe-upms-server/manage/setting/WeChatwx" class="layui-btn layui-btn-primary layui-btn-xs" lay-event="WeChat">微信消息配置</a>
    <a  lay-href="${basePath}/yihe-upms-server/manage/setting/changeclientservice" class="layui-btn layui-btn-primary layui-btn-xs" lay-event="SmsSetting">短信配置</a>
	<a lay-href="${basePath}/yihe-upms-server/manage/setting/changeclientservice" class="layui-btn layui-btn-primary layui-btn-xs" lay-event="StorageSetting">储存配置</a>
</script>
<!-- js部分 -->
<script type="text/javascript" th:src="@{/assets/libs/layui/layui.js}"></script>
<script type="text/javascript" th:src="@{/assets/js/common.js}"></script>
<script th:inline="none">
    layui.use(['layer', 'form','element', 'admin', 'treeTable', 'util', 'table','index'], function () {
        var $ = layui.jquery;
        var layer = layui.layer;
        var form = layui.form;
        var admin = layui.admin;
        var treeTable = layui.treeTable;
        var util = layui.util;
        var table = layui.table;
        var index = layui.index;
        var element = layui.element;
     
      

        element.on('tab(indexTab)', function(data){
        	var url='/manage/setting/changeclientservice';
        	var id = $(this).attr("lay-id");
        	  console.log(id); //当前Tab标题所在的原始DOM元素
        	  console.log(data.index); //得到当前Tab的所在下标
        	  console.log(data.elem); //得到当前的Tab大容器
   	    })
   	 
   	   
        var insTb = treeTable.render({
            elem:'#tableAuth',
            tree: {
                iconIndex: 1,  // 折叠图标显示在第几列
                idName: 'id'  // 自定义id字段的名称
            },
            cellMinWidth: 100,
            cols: [
            	 {field: 'yhjzsyssms',sort: true, title: '短信服务', width: 300},
                 {field: 'value', sort: true,title: '文件储存', align: 'center'},
                 {templet: '#tableBarAuth', title: '操作', align: 'center', width: 260}
            ],
            reqData: function (data, callback) {
            	//$.get('${basePath}/yihe-upms-server/resources/yihe-static-file/json/authorities.json', function (res) {
               $.get('/YhUserSetting/selectallsms', function (res) {
            	   console.log(res.data)
            	   if(res.data[0].yhjzsyssms.type==1){
                		res.data[0].yhjzsyssms="阿里云"
                	}else if(res.data[0].yhjzsyssms.type==2){
                		res.data[0].yhjzsyssms="腾讯云"
                	}else if(res.data[0].yhjzsyssms.type==3){
                		res.data[0].yhjzsyssms="云片网"
                	}else if(res.data[0].yhjzsyssms.type==4){
                		res.data[0].yhjzsyssms="网易云信"
                	}else if(res.data[0].yhjzsyssms.type==5){
                		res.data[0].yhjzsyssms="七牛"
                	}else{
                		res.data[0].yhjzsyssms="未配置"
                	}
                	var obj = JSON.parse(res.data[0].value);
                	if(obj.type==1){
                		res.data[0].value="阿里云"
                	}else if(obj.type==2){
                		res.data[0].value="腾讯云"
                	}else if(obj.type==3){
                		res.data[0].value="云片网"
                	}else if(obj.type==4){
                		res.data[0].value="网易云信"
                	}else if(obj.type==5){
                		res.data[0].value="七牛"
                	}else{
                		res.data[0].value="未配置"
                	}
                    callback(res.data);
                });
            }
        });



        // 工具条点击事件
        treeTable.on('tool(tableAuth)', function (obj) {
            var data = obj.data;
            var layEvent = obj.event;
            if (layEvent === 'SmsSetting') { //短信配置
               document.getElementById("Sms").click();
            } else if (layEvent === 'StorageSetting') { //储存配置
            	 document.getElementById("Storage").click();
            }else if(layEvent === 'WeChat'){
            	 document.getElementById("WeChatwx").click();
            }
        });

    });
</script>
</body>
</html>
