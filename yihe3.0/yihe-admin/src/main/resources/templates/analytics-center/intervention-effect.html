<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>干预效果分析</title><link rel="stylesheet" th:href="@{/assets/css/intervention-effect.css(v=20261125r2)}"><script defer th:src="@{/assets/js/echarts.min.js}"></script><script defer th:src="@{/assets/js/intervention-effect.js(v=20261125r2)}"></script></head>
<body th:attr="data-base=@{/}"><main>
<header><h1><span>▥</span> 干预效果分析 <small>评估健康干预措施的实施情况与主要健康指标的变化，为优化干预策略提供参考</small></h1><form id="filters"><label>统计范围：<select id="scope"><option value="all">全公司</option></select></label><label>时间范围：<select id="period"><option value="12">近12个月</option><option value="6">近6个月</option><option value="3">近3个月</option></select></label><button id="refresh">⟳ 刷新</button></form></header>
<p id="status" role="status" hidden></p><section id="metrics" class="metrics" aria-label="干预效果关键指标"></section>
<div class="top-grid"><section><h2>主要健康指标干预前后对比 <small>（干预人群，n = <span id="cohort">3,276</span>）</small></h2><div id="comparison" class="chart" role="img" aria-label="健康指标干预前后对比"></div><div id="comparison-deltas" class="comparison-deltas"></div></section><section><h2>高风险人数变化趋势</h2><div id="high-trend" class="chart" role="img" aria-label="高风险人数及占比变化趋势"></div></section><section><h2>干预方案执行情况</h2><div class="execution"><div id="execution-chart" class="chart" role="img" aria-label="干预方案执行情况环图"></div><div id="execution-legend"></div></div></section></div>
<div class="bottom-grid"><section class="group-panel"><h2>分人群干预效果分析</h2><nav id="tabs" role="tablist" aria-label="人群维度"><button role="tab" data-tab="age" aria-selected="true">按年龄</button><button role="tab" data-tab="gender" aria-selected="false">按性别</button><button role="tab" data-tab="job" aria-selected="false">按岗位</button><button role="tab" data-tab="unit" aria-selected="false">按单位</button><button role="tab" data-tab="team" aria-selected="false">按班组</button></nav><div class="table-wrap" tabindex="0" role="region" aria-label="分人群干预效果，可上下滚动"><table><thead><tr><th>人群</th><th>干预人数</th><th>血压异常率<br>变化</th><th>血糖异常率<br>变化</th><th>血脂异常率<br>变化</th><th>高风险占比<br>变化</th></tr></thead><tbody id="group-table"></tbody></table></div><div id="pagination" class="pagination"></div></section><section><h2>干预参与率与方案执行率趋势</h2><div id="participation-chart" class="chart" role="img" aria-label="干预参与率与方案执行率趋势"></div></section><section class="evaluation"><h2>干预效果综合评估</h2><div id="evaluation"></div></section></div>
<footer><h2>▤ 统计说明</h2><div class="notes"><p id="definition"></p><p class="caution"><span>▲</span><b>重要提示：</b>本页展示的是干预前后指标的统计变化，统计改善不等于证明干预产生因果效果。</p></div></footer>
</main></body></html>
