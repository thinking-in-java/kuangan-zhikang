<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>企业健康总览</title><link rel="stylesheet" th:href="@{/assets/css/analytics-center.css(v=20261125b)}"><script defer th:src="@{/assets/js/echarts.min.js}"></script><script defer th:src="@{/assets/js/digital-worker-service.js}"></script><script defer th:src="@{/assets/js/analytics-center.js(v=20261125)}"></script></head>
<body th:attr="data-base=@{/}"><main><header><h1><span>▥</span> 企业健康总览 <small>企业职工健康管理的总体情况、关键指标与风险概览</small></h1><form id="filters"><label>统计范围：<select id="scope"><option value="all">全公司</option></select></label><label>时间范围：<select id="year"></select></label><button id="refresh">⌕ 刷新</button></form></header><div id="status" role="status" aria-live="polite">正在同步企业健康数据…</div>
<div id="metrics" class="metrics"></div>
<div class="middle"><section><h2>健康档案与体检完成情况</h2><div class="split"><div id="archive" class="chart" role="img" aria-label="档案建档率"></div><div id="completion" class="legend"></div></div></section><section><h2>关键指标趋势（近12个月）</h2><div id="trend" class="chart" role="img" aria-label="体检、评估完成率和高风险占比趋势"></div></section><section><h2>健康风险人群分布</h2><div class="split"><div id="risk" class="chart" role="img" aria-label="健康风险分布"></div><div id="risk-legend" class="legend"></div></div></section></div>
<div class="bottom"><section><h2>职工基本情况</h2><div class="demographics"><div><h3>性别分布</h3><div id="gender" class="chart" role="img" aria-label="性别分布"></div><div id="gender-legend" class="legend"></div></div><div><h3>年龄分布</h3><div id="ages"></div></div></div></section><section><h2>各单位 / 矿区健康风险情况（高风险占比）</h2><div class="table-wrap"><table><thead><tr><th>排名</th><th>单位 / 矿区</th><th>在职人数</th><th>高风险人数</th><th>高风险占比</th></tr></thead><tbody id="units"></tbody></table></div></section><section class="tips"><h2>◉ 总体健康管理提示</h2><div id="tips"></div><aside id="note"></aside></section></div></main></body></html>
