<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>随访效果分析</title><link rel="stylesheet" th:href="@{/assets/css/intervention-effect.css(v=20261125r2)}"><link rel="stylesheet" th:href="@{/assets/css/followup-effect.css(v=20261125r1)}"><script defer th:src="@{/assets/js/echarts.min.js}"></script><script defer th:src="@{/assets/js/followup-effect.js(v=20261125r3)}"></script></head>
<body class="follow-effect-page" th:attr="data-base=@{/}"><main>
<header><h1><span>▥</span> 随访效果分析 <small>分析职业健康随访工作的完成情况、健康指标变化与风险改善效果，评估随访的管理成效</small></h1><form id="filters"><label>随访类型：<select id="type"><option value="all">全部类型</option><option value="plan">干预方案随访</option><option value="risk">高风险定期随访</option><option value="exam">体检异常随访</option><option value="priority">重点人群随访</option></select></label><label>时间范围：<select id="period"><option value="12">近12个月</option><option value="6">近6个月</option><option value="3">近3个月</option></select></label><button id="refresh">⟳ 刷新</button></form></header>
<p id="status" role="status" hidden></p><section class="metrics" id="metrics" aria-label="随访效果统计"></section>
<div class="top-grid"><section><h2>随访完成情况（按随访类型）</h2><div class="type-content"><div id="type-chart" class="chart" role="img" aria-label="各随访类型应随访人数占比"></div><div class="type-table"><table><thead><tr><th>随访类型</th><th>应随访</th><th>已完成</th><th>完成率</th></tr></thead><tbody id="type-table"></tbody></table></div></div></section><section><h2>随访完成趋势（近<span id="months">12</span>个月）</h2><div id="completion-chart" class="chart" role="img" aria-label="累计随访完成人数及完成率趋势"></div></section><section><h2>随访人群健康状态变化</h2><div class="outcome-content"><div id="outcome-chart" class="chart" role="img" aria-label="已随访人群健康改善分布"></div><div id="outcome-legend"></div></div></section></div>
<div class="bottom-grid"><section><h2>主要健康指标随访前后变化 <small>（随访人群，n = <span id="cohort">976</span>）</small></h2><div id="comparison-chart" class="chart" role="img" aria-label="主要健康指标随访前后变化"></div><div class="comparison-deltas" id="comparison-deltas"></div></section><section class="risk-panel"><h2>风险等级变化（随访前 vs 随访后）</h2><div class="risk-heading"><b>风险等级</b><span><i class="before-key"></i> 随访前占比 <i class="after-key"></i> 随访后占比</span><b>变化</b></div><div id="risk-levels"></div></section><section class="unit-panel"><div class="ranking-heading"><h2 id="ranking-title">各单位 / 矿区随访完成率（Top 5）</h2><button id="unit-toggle" type="button">查看全部</button></div><div class="table-wrap" tabindex="0" role="region" aria-label="单位随访完成率排名，可上下滚动"><table class="ranking-table"><thead><tr><th>排名</th><th>单位 / 矿区</th><th>应随访</th><th>已完成</th><th>完成率</th></tr></thead><tbody id="unit-table"></tbody></table></div></section></div>
<footer><h2>▤ 分析结论与建议</h2><div class="notes" id="conclusions"></div></footer>
</main></body></html>
