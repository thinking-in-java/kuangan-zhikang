<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>疾病风险统计</title><link rel="stylesheet" th:href="@{/assets/css/disease-risk.css(v=20261125)}"><script defer th:src="@{/assets/js/echarts.min.js}"></script><script defer th:src="@{/assets/js/digital-worker-service.js}"></script><script defer th:src="@{/assets/js/disease-risk.js(v=20261125)}"></script></head><body th:attr="data-base=@{/}"><main><header><h1><span>▥</span> 疾病风险统计 <small>统计主要疾病和健康风险人群规模、特征分布与变化趋势，支持风险分层管理与干预决策</small></h1><form id="filters"><label>统计范围：<select id="scope"><option value="all">全公司</option><option value="0">一矿</option><option value="1">二矿</option><option value="2">三矿</option><option value="3">选煤厂</option><option value="4">机电厂</option></select></label><label>时间范围：<select id="period"><option value="12">近12个月</option><option value="6">近6个月</option><option value="3">近3个月</option></select></label><button id="refresh">⟳ 刷新</button></form></header><div id="status" role="status" aria-live="polite">正在同步统计范围…</div><div class="metrics" id="metrics"></div>
<div class="middle"><section><h2>各类风险人群占比对比</h2><div class="risk-split"><div id="risk-chart" class="chart" role="img" aria-label="各类风险占比环形示意"></div><div id="risk-legend"></div></div><small class="note">各风险可重叠；环图展示风险指标构成，不代表互斥人群划分。</small></section><section><h2>主要风险人群规模趋势（近<span id="months">12</span>个月）</h2><div id="trend-chart" class="chart" role="img" aria-label="疾病风险人群占比历史趋势"></div></section><section><h2>高风险人群重叠分析 <small>（人数 · 示意图）</small></h2><div class="overlap"><div class="venn" role="img" aria-label="高血压、血脂异常、肥胖风险重叠示意，面积不代表人数"><div id="venn-a"></div><div id="venn-b"></div><div id="venn-c"></div><div id="venn-center"></div></div><div><h3>重叠人群统计</h3><div id="overlap-stats"></div></div></div></section></div>
<div class="bottom"><section><h2>按人群特征的疾病风险分布</h2><div id="tabs" role="tablist" aria-label="人群特征"><button role="tab" aria-selected="true" data-tab="age">按年龄</button><button role="tab" aria-selected="false" data-tab="gender">按性别</button><button role="tab" aria-selected="false" data-tab="job">按岗位</button><button role="tab" aria-selected="false" data-tab="unit">按单位</button><button role="tab" aria-selected="false" data-tab="team">按班组</button></div><div id="group-chart" class="chart" role="tabpanel" aria-label="按年龄的疾病风险分布"></div></section><section><h2>各单位 / 矿区疾病风险情况（Top 5）</h2><div class="table-scroll" tabindex="0" aria-label="单位疾病风险统计，可滚动"><table><thead><tr><th>排名</th><th>单位 / 矿区</th><th>高血压人数<br>（占比）</th><th>高血糖人数<br>（占比）</th><th>血脂异常人数<br>（占比）</th><th>肥胖人数<br>（占比）</th><th>心理风险人数<br>（占比）</th><th>综合高风险人数<br>（占比）</th></tr></thead><tbody id="unit-table"></tbody></table></div></section></div><footer><h2>▤ 统计结论与提示</h2><div id="conclusions"></div></footer></main></body></html>
