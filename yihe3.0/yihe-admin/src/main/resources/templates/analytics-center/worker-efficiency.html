<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>数字员工效率分析</title><link rel="stylesheet" th:href="@{/assets/css/worker-efficiency.css(v=20261125r2)}"><script defer th:src="@{/assets/js/echarts.min.js}"></script><script defer th:src="@{/assets/js/worker-efficiency.js(v=20261125r2)}"></script></head>
<body th:attr="data-base=@{/}"><main>
<header><div><h1><span>▥</span> 数字员工效率分析</h1><p>统计五个数字员工的任务产能、处理质量、资源消耗与人工节省价值</p></div><form id="filters"><label>统计周期：<select id="period"><option value="7">近7天</option><option value="30" selected>近30天</option><option value="90">近90天</option></select></label><span id="date-range"></span><button id="refresh" type="submit" aria-label="刷新统计">⟳</button><button id="export" type="button">⇩ 导出报表</button></form></header>
<p id="status" role="status" hidden></p><section class="metrics" id="metrics" aria-label="数字员工效率关键指标"></section><section class="workers" id="workers" aria-label="五个数字员工的工作情况"></section>
<div class="charts"><section class="task-trend"><h2>近<span id="days">30</span>天数字员工任务量趋势</h2><div id="task-chart" class="chart" role="img" aria-label="数字员工每日完成任务趋势"></div></section><section><h2>各数字员工平均处理耗时对比</h2><div id="duration-chart" class="chart" role="img" aria-label="平均处理耗时对比"></div></section><section><h2>任务失败率 / 人工接管率</h2><div id="quality-chart" class="chart" role="img" aria-label="任务失败率和人工接管率"></div></section><section><h2>API Token 使用量分布</h2><div id="token-chart" class="chart" role="img" aria-label="Token使用量环形图"></div></section><section><h2>人工节省工时估算</h2><div id="saved-chart" class="chart" role="img" aria-label="人工节省工时对比"></div></section></div>
<div class="bottom"><section class="detail-panel"><h2>▥ 数字员工效率明细</h2><div class="table-wrap" tabindex="0" role="region" aria-label="数字员工效率明细，可滚动"><table><thead><tr><th>数字员工</th><th>完成任务数</th><th>平均耗时</th><th>成功率</th><th>失败率</th><th>人工接管率</th><th>API Token</th><th>节省工时</th><th>最近活跃时间</th><th>状态</th></tr></thead><tbody id="details"></tbody><tfoot id="totals"></tfoot></table></div></section><section class="insights"><h2>♧ 分析结论与优化建议</h2><div id="insights"></div></section></div>
<footer><p>ⓘ 统计口径：完成任务按统计周期内的任务创建日期归集；失败率按已结束任务统计；人工节省工时为估算值。</p><time id="updated"></time></footer>
</main></body></html>
