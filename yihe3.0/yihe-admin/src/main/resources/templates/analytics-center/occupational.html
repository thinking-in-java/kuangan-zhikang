<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>职业健康数据分析</title><link rel="stylesheet" th:href="@{/assets/css/occupational-analysis.css(v=20261125b)}"><script defer th:src="@{/assets/js/echarts.min.js}"></script><script defer th:src="@{/assets/js/digital-worker-service.js}"></script><script defer th:src="@{/assets/js/occupational-analysis.js(v=20261125b)}"></script></head>
<body th:attr="data-base=@{/}"><main><header><h1><span>▥</span> 职业健康数据分析</h1><p>分析岗位、班组、职业危害因素、体检异常指标及历史趋势，识别重点风险，支撑精准防控。</p></header><div class="metrics" id="metrics"></div><form id="filters"><label>单位：<select name="unit"><option value="">全公司</option><option>一矿</option><option>二矿</option><option>三矿</option></select></label><label>岗位：<select name="job"><option value="">全部岗位</option></select></label><label>班组：<select name="team"><option value="">全部班组</option></select></label><label>接害因素：<select name="exposure"><option value="">全部</option><option>粉尘</option><option>噪声</option></select></label><label>时间范围：<select name="months"><option value="12">最近12个月</option><option value="6">最近6个月</option><option value="3">最近3个月</option></select></label><label>风险等级：<select name="risk"><option value="">全部</option><option>低风险</option><option>中风险</option><option>高风险</option></select></label><button type="submit">⌕ 查询</button><button type="button" id="oa-reset">重置</button></form><div id="status" role="status" aria-live="polite"></div>
<div class="dashboard"><section class="jobs"><h2>♧ 各岗位健康风险分布</h2><div class="job-scroll" tabindex="0" aria-label="岗位风险分布，可上下滚动"><div id="job-chart" class="chart" role="img" aria-label="各岗位低中高风险比例"></div></div></section><section class="teams"><h2>▣ 各班组健康情况 <button type="button" id="sort">按异常人数 ↓</button></h2><div class="table-wrap"><table><thead><tr><th>排名</th><th>班组</th><th>职工人数</th><th>已体检</th><th>异常人数</th><th>高风险人数</th><th>建档率</th><th>评估完成率</th></tr></thead><tbody id="teams"></tbody></table></div></section><section class="warnings"><h2>◎ 重点风险提示</h2><div id="warnings"></div></section><section class="ranking"><h2>♜ 高风险岗位 TOP10</h2><div class="ranking-scroll" tabindex="0" aria-label="高风险岗位排名，可上下滚动"><table><thead><tr><th>排名</th><th>岗位</th><th>高风险人数</th><th>高风险占比</th></tr></thead><tbody id="ranking"></tbody></table></div></section>
<section class="dust"><h2>♧ 粉尘相关风险分布</h2><div class="risk-split"><div id="dust-chart" class="chart" role="img" aria-label="粉尘暴露人数"></div><div id="dust-detail"></div></div></section><section class="noise"><h2>◉ 噪声相关风险分布</h2><div class="risk-split"><div id="noise-chart" class="chart" role="img" aria-label="噪声暴露人数"></div><div id="noise-detail"></div></div></section><section class="indicators"><h2>▤ 各项体检指标异常率</h2><table><thead><tr><th>检查指标</th><th>异常率</th><th>异常人数（在职占比）</th></tr></thead><tbody id="indicators"></tbody></table></section><section class="history"><h2>♧ 历史趋势（近<span id="month-count">12</span>个月职业健康异常率变化）</h2><div id="history-chart" class="chart" role="img" aria-label="职业健康异常率历史趋势"></div></section><section class="summary"><h2>▣ AI 分析摘要</h2><div id="summary"></div><small>模拟分析摘要 · 非实时 AI 生成</small></section></div></main></body></html>
