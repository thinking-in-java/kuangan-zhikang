<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>人群健康趋势</title><link rel="stylesheet" th:href="@{/assets/css/population-trend.css(v=20261125r4)}"><script defer th:src="@{/assets/js/echarts.min.js}"></script><script defer th:src="@{/assets/js/population-trend.js(v=20261125r4)}"></script></head>
<body th:attr="data-base=@{/}"><main>
<header><h1><span>▥</span> 人群健康趋势 <small>从年龄、性别、岗位、单位、班组等维度，分析职工健康水平的变化趋势，支持重点人群识别与管理</small></h1><form id="filters"><label>统计指标：<select id="metric"><option value="score">健康综合指数</option><option value="risk">高风险人群占比</option></select></label><label>时间范围：<select id="period"><option value="12">近12个月</option><option value="6">近6个月</option><option value="3">近3个月</option></select></label><button id="refresh">⟳ 刷新</button></form></header>
<p id="status" role="status" hidden></p><section class="metrics" id="metrics" aria-label="人群健康指标"></section>
<div class="overview"><section class="overall"><h2>总体健康趋势（近<span id="months">12</span>个月）</h2><div id="overall-chart" class="chart" aria-label="健康指数及高风险占比趋势"></div></section><section class="distribution"><h2>当前人群健康状态分布</h2><div class="risk-content"><div id="risk-chart" class="chart" aria-label="人群健康状态分布"></div><div id="risk-legend"></div></div></section><section class="changes"><h2>较上期变化（环比）</h2><div id="changes"></div></section></div>
<section class="analysis"><div class="analysis-head"><h2>分人群健康趋势分析</h2><nav id="tabs" role="tablist" aria-label="人群分类"><button data-tab="age" role="tab" aria-selected="true">按年龄</button><button data-tab="gender" role="tab" aria-selected="false">按性别</button><button data-tab="job" role="tab" aria-selected="false">按岗位</button><button data-tab="unit" role="tab" aria-selected="false">按单位</button><button data-tab="team" role="tab" aria-selected="false">按班组</button></nav><div class="analysis-filters"><label>分析指标：<select id="analysis-metric"><option value="risk">高风险人群占比</option><option value="score">健康综合指数</option></select></label><label>展示方式：<select id="display"><option value="line">趋势图</option><option value="bar">柱状图</option></select></label></div></div>
<div class="analysis-grid"><section><h3 id="group-title">按年龄：高风险人群占比趋势</h3><div id="group-chart" class="chart" aria-label="分人群健康趋势"></div></section><section><h3 id="job-title">按岗位：高风险人群占比（当前）</h3><div id="job-chart" class="chart" aria-label="岗位风险占比排名"></div></section><section class="units"><h3>按单位：健康指标趋势对比</h3><div class="table-wrap" tabindex="0" role="region" aria-label="单位健康指标对比，可上下滚动"><table><thead><tr><th>单位</th><th>在职人数</th><th>高风险占比<br>（本期）</th><th>高风险占比<br>（上期）</th><th>变化</th></tr></thead><tbody id="unit-table"></tbody></table></div><div class="pagination" id="pagination"></div></section></div></section>
<footer><h2>▤ 分析结论与提示</h2><div id="conclusions"></div></footer>
</main></body></html>
