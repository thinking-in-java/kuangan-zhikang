<!DOCTYPE html>
<html  lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>用户管理</title>
    <link rel="stylesheet" th:href="@{/assets/libs/layui/css/layui.css}"/>
    <link rel="stylesheet" th:href="@{/assets/module/admin.css}"/>
</head>
<body>
<!-- 页面加载loading -->
<div class="page-loading">
    <div class="ball-loader">
        <span></span><span></span><span></span><span></span>
    </div>
</div>
<!-- 正文开始 -->
<div class="layui-fluid">
    <div class="layui-card">
        <div class="layui-card-body table-tool-mini full-table">
            <div class="layui-form toolbar">
                <div class="layui-form-item">
                    <div class="layui-inline">
                        <label class="layui-form-label w-auto">登录名称：</label>
                        <div class="layui-input-inline mr0">
                            <input name="loginName" class="layui-input" type="text" placeholder="登录名称"/>
                        </div>
                    </div>
                    <div class="layui-inline">
                        <button class="layui-btn icon-btn" lay-filter="formSubSearchJob" lay-submit>
                            <i class="layui-icon">&#xe615;</i>查询
                        </button>
                    </div>
                  
                </div>
            </div>

            <table id="tableUser" lay-filter="tableUser"></table>
        </div>
    </div>
</div>

<!-- 表格操作列 -->
<script type="text/html" id="tableBarUser">
    <a class="layui-btn layui-btn-primary layui-btn-xs" lay-event="del">强退</a>
</script>
<!-- 表格状态列 -->
<script type="text/html" id="tableStateUser">

   {{# if(d.status=="on_line"){ }}
		 <span class="text-success">正常</span>
	{{# }else{ }}
          <span class="text-danger">锁定</span>                  
    {{# } }}
                      
                       
</script>

<!-- js部分 -->
<script type="text/javascript" th:src="@{/assets/libs/layui/layui.js}"></script>
<script type="text/javascript" th:src="@{/assets/js/common.js}"></script>
<script th:inline="none">
    layui.use(['layer', 'form', 'table', 'util', 'admin'], function () {
        var $ = layui.jquery;
        var layer = layui.layer;
        var form = layui.form;
        var table = layui.table;
        var util = layui.util;
        var admin = layui.admin;
        // 渲染表格
        var insTb = table.render({
            elem: '#tableUser',
            url: '/online/user/list',
            request: {     
                pageName: 'pageNum' //页码的参数名称，默认：page
               ,limitName: 'pageSize' //每页数据量的参数名，默认：limit
            },
            page: true,
            method:'post',
            toolbar: true,
            cellMinWidth: 50,
            cols: [[
            	{type: 'numbers'},
            	{
		            field: 'sessionId',
		            title: '会话编号',
		            minWidth: 200
		        },
                {field: 'loginName', sort: true, title: '登录名称 '},
                {field: 'ipaddr', sort: true, title: ''},
                {field: 'loginLocation', sort: true, title: '登录地址'},
                {field: 'browser', sort: true, title: '浏览器类型'},
                {field: 'os', sort: true, title: '操作系统'},
                {field: 'status', sort: true, templet: '#tableStateUser',title: '会话状态'},
                {
		            field: 'startTimestamp',
		            title: '登录时间',
		            sort: true,
		            minWidth: 200
		        },
		        {
		            field: 'lastAccessTime',
		            title: '最后访问时间',
		            sort: true,
		            minWidth: 200
		        },
                {align: 'center', toolbar: '#tableBarUser', title: '操作', minWidth: 100}
            ]]
        });
        
        // 搜索
        form.on('submit(formSubSearchJob)', function (data) {
            insTb.reload({where: data.field}, 'data');
        });

        // 工具条点击事件
        table.on('tool(tableUser)', function (obj) {
            var data = obj.data;
            var layEvent = obj.event;
            if (layEvent === 'edit') { // 修改
                showEditModel(data);
            } else if (layEvent === 'del') { // 删除
                doDel(data.sessionId,data.loginName);
            } else if (layEvent === 'reset') { // 执行一次
            	resetJob(data);
            }
        });

      
        // 删除
        function doDel(sessionId,loginName) {
            layer.confirm('确定要强退“' + loginName + '”吗？', {
                skin: 'layui-layer-admin',
                shade: .1
            }, function (i) {
                layer.close(i);
                layer.load(2);
                $.post('/online/user/forceLogout', {
                	sessionId: sessionId
                }, function (res) {
                    layer.closeAll('loading');
                    if (res.code == 200) {
                        layer.msg(res.msg, {icon: 1});
                        insTb.reload({}, 'data');
                    } else {
                        layer.msg(res.msg, {icon: 2});
                    }
                }, 'json');
            });
        }

       
     
      
    });
</script>
</body>
</html>
