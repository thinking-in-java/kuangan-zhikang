<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>企业组织管理 · 矿安智康</title><link rel="stylesheet" th:href="@{/assets/css/organization-center.css(v=20261125a)}"><script defer th:src="@{/assets/js/organization-center.js(v=20261125a)}"></script></head><body th:attr="data-base=@{/}"><main><header class="heading"><span class="heading-icon">♧</span><h1>企业组织管理</h1><p>统一管理企业、部门、班组、岗位与人员归属关系</p><span id="sync" role="status">正在同步…</span></header><div id="notice" role="status" hidden></div><section id="metrics" class="metrics"></section><nav id="tabs" class="tabs" aria-label="组织管理分类"></nav><div class="workspace"><aside class="panel tree-panel"><h2>组织树 <button data-act="expand" class="text-button" title="展开或收起组织树">•••</button></h2><input id="tree-query" type="search" placeholder="搜索企业、部门、班组" aria-label="搜索组织树"><div id="tree" class="tree"></div><div class="tree-footer"><button data-act="new-enterprise" class="primary">＋ 新增企业</button><button data-act="new-department">＋ 新增部门</button><button data-act="new-team">＋ 新增班组</button></div></aside><section class="center"><article class="panel list-panel"><div class="list-title"><h2>▤ 组织与岗位列表</h2><div class="actions"><button data-act="new-position" class="primary">＋ 新增岗位</button><button data-act="batch">⇄ 批量调整</button><button data-act="import">↥ 导入</button><button data-act="export">⇩ 导出</button></div></div><form id="filters" class="filters"></form><div class="table-wrap"><table><thead><tr><th><input id="check-all" type="checkbox" aria-label="选择本页"></th><th>编码</th><th>组织名称</th><th>类型</th><th>上级组织</th><th>负责人</th><th><button data-act="sort" class="text-button">职工人数 ↕</button></th><th>岗位数</th><th>状态</th><th>最近更新</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div><div id="pager" class="pager"></div></article><article class="panel exposures"><h2>◈ 接害因素关联配置 <small>配置岗位与职业接害因素的对应关系，用于职业健康风险评估与监测预警</small><button data-act="exposures" class="text-button">配置管理 ›</button></h2><div id="exposures" class="exposure-list"></div></article></section><aside class="right"><article class="panel detail-panel"><nav class="right-tabs"><button data-detail="info" class="active">♧ 组织详情</button><button data-detail="scope">♙ 权限范围</button></nav><div id="detail"></div></article><article class="panel scope-panel"><h2>▤ 数据权限范围</h2><div id="scope"></div></article></aside></div></main><dialog id="dialog"><header><h2 id="dialog-title"></h2><button data-act="close" aria-label="关闭">×</button></header><div id="dialog-body"></div></dialog><div id="toast" hidden role="status"></div></body></html>
