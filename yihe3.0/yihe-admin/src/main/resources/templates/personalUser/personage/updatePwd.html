<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="utf-8" />
	<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
	<title>修改密码</title>
	<link rel="stylesheet" th:href="@{/assets/libs/layui/css/layui.css}" />
	<link rel="stylesheet" th:href="@{/assets/module/admin.css}" />
	<style type="text/css">
		/* .layui-btn-primary:hover, .layui-btn-group .layui-btn-primary:hover {

    color: rgb(64, 174, 252);
    border-color: rgb(64, 174, 252);

} */
	</style>
</head>

<body style="margin: 7px;">
	<!-- 页面加载loading -->
	<div class="page-loading">
		<div class="ball-loader">
			<span></span><span></span><span></span><span></span>
		</div>
	</div>
	<div class="layui-fluid">
		<div class="layui-card">
			<div class="layui-card-body">
				<form class="layui-form" style="max-width: 468px; margin: 40px auto;" action="" id="userForm"
					lay-filter="userForm">
					<div class="layui-form-item">
						<input type="hidden" name="userCode">
						<label style="width: 72px;" class="layui-form-label layui-form-required">原始密码</label>
						<div class="layui-input-block">
							<div class="layui-row">
								<input style="margin-left: -89px; width: 450px;" type="password" id="original"
									lay-verify="required"  lay-reqText="不能为空" placeholder="请输入账号原始密码"
									autocomplete="off" class="layui-input">
							</div>
						</div>
					</div>

					<div class="layui-form-item">
						<label style="width: 58px;" class="layui-form-label layui-form-required">新密码 </label>
						<div class="layui-input-block">
							<div class="layui-row">
								<input style="margin-left: -89px; width: 450px;" type="password" name="userPwd" required
									lay-verify="userPwd" lay-reqText="不能为空"
									placeholder="请输入新登录密码，6~20位任意字符" autocomplete="off" class="layui-input">
							</div>
						</div>
					</div>

					<div class="layui-form-item">
						<label style="width: 72px;" class="layui-form-label layui-form-required">确认密码 </label>
						<div class="layui-input-block">
							<div class="layui-row">
								<input style="margin-left: -89px; width: 450px;" type="password"
									lay-verify="required|confirmPass" lay-reqText="不能为空" placeholder="请再次输入新密码"
									autocomplete="off" class="layui-input">
							</div>
						</div>
					</div>
					<div class="layui-form-item" style="margin-left: -88px; padding-bottom: 40px;">
						<div class="layui-input-block" style="margin-left: 95px;">
							<button style="width: 100px; margin-left: 14px;" class="layui-btn layui-btn-normal"
								lay-submit='' lay-filter="saveSubmit">保存</button>
							<button style="width: 100px;" type="reset" id="cancel"  class="layui-btn layui-btn-primary">取消</button>
						</div>
					</div>
				</form>

			</div>
		</div>
	</div>


</body>
<!-- js部分 -->
<script type="text/javascript" th:src="@{/assets/js/jquery-1.11.1.js}"></script>
<script type="text/javascript" th:src="@{/assets/libs/layui/layui.js}"></script>
<script type="text/javascript" th:src="@{/assets/js/common.js}"></script>



<script type="text/javascript" th:inline="javascript">
var userCode = [[${userCode}]]; 
	var pwd = "";

	//导航栏
	layui.use('element', function () {
		var $ = layui.jquery,
			element = layui.element; //Tab的切换功能，切换事件监听等，需要依赖element模块

		$('.site-demo-active').on('click', function () {
			var othis = $(this),
				type = othis.data('type');
			active[type] ? active[type].call(this, othis) : '';
		});

	});

	layui.use(['layer', 'form', 'laydate', 'notice'], function () {
		var $ = layui.jquery;
		var layer = layui.layer;
		var form = layui.form;
		var laydate = layui.laydate;
		var notice = layui.notice;

		// 校验两次密码是否一
		form.verify({
			confirmPass: function (value) {
				if ($('input[name=userPwd]').val() !== value)
					return '两次密码输入不一致！';
			}
		});


	
			//输入框的属性事件
			$('#original').blur(function () {
				var original = $("#original").val(); 
				//debugger
				console.log(original + "输入")
				if(original == null || original == ""){
					return
				}
				$.ajax({
					type: 'GET',
					url: '/YhUserReginfo/yhUserPwd',
					data: {
						userCode: userCode,
						original: original
					},
					success: function (data) {
						console.log("后台返回的对象：", data)
						//debugger
						if (data == "") {
							//小tips
							layer.msg('原始密码错误', {icon: 5});
						}
					}

				});
			});
	
		
			  $("#cancel").click(function(){
/* 					$.ajax({
						type: 'GET',
						url: '/YhUserReginfo/yhUserReginfo2',
						success: function (data) {
							console.log("后台返回的对象：", data)
							if(data.userType == 4){
								window.location.href='/manage/doctor/comtroller';
							}else if(data.userType == 1){
								window.location.href='/manage/organization/console';
							}
						
						
						}

					}); */
				  window.history.back(-1);
				  
			    })  
	





		//监听提交
		form.on('submit(saveSubmit)', function (dataYh) {
			var original = $("#original").val();
			$.ajax({
				type: 'GET',
				url: '/YhUserReginfo/yhUserPwd',
				 async: false,
				data: {
					userCode: userCode,
					original: original
				},
				success: function (data) {
					console.log("后台返回的对象：", data)
					//debugger
					if (data == "") {
						/* //小tips
						layer.tips('原始密码错误', '#original', {
							  tips: [1, 'black']
							}); */
							layer.msg('原始密码错误', {icon: 5});
							return 
					}
					/*  layer.msg(JSON.stringify(data.field)); */
					console.log(JSON.stringify(dataYh.field))
					$.ajax({
						type: 'post',
						url: '/YhUserReginfo/updatepwd',
						data: dataYh.field,
						success: function (data) {
							console.log(data)
							if (data == 1) {
								notice.success({
									title : '消息通知',
									message : '操作成功!'
								});
							} else {
								notice.error({
									title : '消息通知',
									message : '操作失败!'
								});
							}
						}

					});
				}

			});
			
			
		
			// 阻止表单跳转。如果需要表单跳转，去掉这段即可。
			return false;
		});

		

		//自定义验证规则

		form.verify({
			userPwd: function(value){
				if(value==null || value==""){
					return '不能为空';
				}else if(value.length < 6){
			        return '密码长度不能低于6位字符';
			      }else if(value.length > 20){
			    	  return '密码长度不能超过20位字符';
			      }
			    },
			userName: [
				/^.{4,10}$/, '账号必须是4到10位字符'
			],
			
		});
	});
</script>

</html>
