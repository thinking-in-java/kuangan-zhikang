<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>用户查看膳食管理</title>
   <link rel="stylesheet"  th:href="@{/assets/libs/layui/css/layui.css}" />
    <link rel="stylesheet"  th:href="@{/assets/module/admin.css}"  />
    <style type="text/css">
.layui-elem-quote {
    margin-bottom: 10px;
    padding: 9px;
    line-height: 3px;
    border-left: 5px solid #009688;
    border-radius: 0 2px 2px 0;
    background-color: white;
    margin-top: 20px;
    float: left;
    margin-left: 20px;
}

.layui-card {
    margin-bottom: 15px;
    border-radius: 2px;
    background-color: #fff;
    box-shadow: 0 0px 0px 0 rgba(0,0,0,.05);
}
h2,h3,h4{
	font-weight:bold;
}
</style>
</head>
<body style="margin: 7px;">
 <!-- 页面加载loading -->
<div class="page-loading">
    <div class="ball-loader">
        <span></span><span></span><span></span><span></span>
    </div>
</div>

<div class="layui-fluid" style="height: 100%">
		<div class="layui-row">
		<div style="width: 100%; height:100%; background-color: #FFF; position: relative;padding-top: 20px;">
		
		<fieldset class="layui-elem-field layui-field-title" style="">
		  <legend>饮食套餐</legend>
		</fieldset>   		
		
	<!-- 内容开始 -->
	<div style="padding-left: 32px;padding-right: 20px;">
	
		<div class="layui-row">
		    <div class="layui-col-xs6" style="height: 10px">
		      <div class="grid-demo grid-demo-bg1"> <div id="packagename"></div> </div>
		    </div>
		    <div class="layui-col-xs6" style="text-align: right;">
		      <div class="grid-demo" ><a href="javascript:history.back(-1)">返回上一页</a></div>
		    </div>
		  </div>
		  
		  <br/>
		 
		  
		  <br>
		  <div class="layui-row">
		    <div class="layui-col-xs3">
		      <div class="grid-demo grid-demo-bg1"><h3 >适用人群</h3></div>
		    </div>
		    <div class="layui-col-xs3">
		      <div class="grid-demo"><h3 >推荐摄入能量</h3></div>
		    </div>
		   </div>
		   <br>
		   <div class="layui-row">
		    <div class="layui-col-xs3">
		      <div class="grid-demo grid-demo-bg1" id="tryout"></div>
		    </div>
		    <div class="layui-col-xs3">
		      <div class="grid-demo" name="kilocalorie"> </div>
		    </div>
		   </div>
		    <br>
		   <h2>套餐描述</h2>
		   <br>
		   <p id="describe">
		
		   </p>
		   <br>
		   <h2>食物日荐方案<span id="number"></span>天</h2>
		   <br>
		   <div id="scheme">
		   	
		   </div>
		   
		  
		   
	</div>
	<!-- 内容结束 -->			
			
			</div> 
		</div>
	</div>
</div>

</body>
<script type="text/javascript" th:src="@{/assets/libs/layui/layui.js}"></script>
<script type="text/javascript" th:src="@{/assets/js/common.js}"></script>
<script type="text/javascript" th:src="@{/assets/js/jquery-1.11.1.js}"></script>

<script type="text/javascript"  th:inline="javascript">
layui.use([ 'layer'], function() {
	layer.closeAll()
	layer.msg("加载中",{
		icon:16,
		time:-1
	})
	
	var id = [[${id}]];
	 $.ajax({
  		 type:'post',
  		 url:'/YhFoodSrecipeRecordContriller/recordfoodshow',
  		 data:{id:id},
  		success : function(data){
			$("#packagename").html(data.data.packagename);
  			$("[name=kilocalorie]").html(data.data.kilocalorie+"千卡/天");
  			$("#tryout").html(data.data.tryout);
  			$("#describe").html(data.data.describe);
  			$("#number").html(data.data.number);
  			var vojo=data.data.vojo;
  			
  			for(var i=0;i<vojo.length;i++){
  				var breakfast="";
  				var lunch="";
  				var supper="";
  				var extra="";
  				for(var j=0;j<vojo[i].breakfast.length;j++){//早
  					breakfast+="<br><dt><div style='float: left;width: 50%;'>"+vojo[i].breakfast[j].fCName+"</div><div>"+vojo[i].breakfast[j].energyKcal+"克</div></dt>"
  				}
  				for(var j=0;j<vojo[i].lunch.length;j++){//中
  					lunch+="<br><dt><div style='float: left;width: 50%;'>"+vojo[i].lunch[j].fCName+"</div><div>"+vojo[i].lunch[j].energyKcal+"克</div></dt>"
  				}
  				for(var j=0;j<vojo[i].supper.length;j++){//晚
  					supper+="<br><dt><div style='float: left;width: 50%;'>"+vojo[i].supper[j].fCName+"</div><div>"+vojo[i].supper[j].energyKcal+"克</div></dt>"
  				}
  				for(var j=0;j<vojo[i].extra.length;j++){//加
  					extra+="<br><dt><div style='float: left;width: 50%;'>"+vojo[i].extra[j].fCName+"</div><div>"+vojo[i].extra[j].energyKcal+"克</div></dt>"
  				}
  				
  				$("#scheme").append("<p>第"+(i+1)+"天 <span>("+data.data.kilocalorie+"千卡)</span></p><br><div class='layui-row'><div class='layui-col-xs3'><div class='grid-demo grid-demo-bg1'>早餐("+vojo[i].breakfastkilocalorie+" 千卡)"+
  						"<dl>"+breakfast+"</dl> </div></div><div class='layui-col-xs3'><div class='grid-demo'>中餐("+vojo[i].lunchkilocalorie+" 千卡)<dl>"+lunch+"</dl> </div></div><div class='layui-col-xs3'><div class='grid-demo grid-demo-bg1'>晚餐("+vojo[i].bsupperkilocalorie+"千卡)"+
  						"<dl>"+supper+"</dl> </div></div><div class='layui-col-xs3'><div class='grid-demo grid-demo-bg1'>加餐("+vojo[i].extrakilocalorie+"千卡)<dl>"+extra+"</dl></div></div></div><hr>");
  				
  			}
  			layer.closeAll();
  			
  		}
  	 })
})

 

</script>


</html>
