<body style="margin: 20px;">
<h2>附件管理</h2>
		<div style="text-align: right;margin-top: -27px;">
			<button type="button" id="newFolder" class="layui-btn layui-btn-radius layui-btn-normal">新建文件夹</button>

<table id="demo" lay-filter="demo"></table>

<script type="text/html" id="tableBar">
 		<a href="#" style="color:#36A4FF" lay-event="delete">删除</a>

	</script>

	<form class="layui-form" id="addfolder" lay-filter="folderForm" style="display: none;">
	
			  <div class="layui-form-item" style="display: block;margin-top: 38px;">

	    			<div class="layui-input-inline" style="width: 250px;">
	     				 <input type="text" name="folderName" lay-verify="folderName"  lay-reqtext="不能为空"  placeholder="请输入名称，最大限制10个字符" autocomplete="off" class="layui-input">
	    			</div>
	 		 </div>
	 		 
	 		 <div class="layui-form-item">
						<div class="layui-input-block">
							<button style="width: 100px; margin-left: 14px;" class="layui-btn layui-btn-normal"
								lay-submit='' lay-filter="folderSubmit" type="button">保存</button>
							<button style="width: 100px;" type="reset" id="cancel"  class="layui-btn layui-btn-primary">取消</button>
						</div>
				</div>
	</form>
<script type="text/javascript" th:src="@{/assets/libs/layui/layui.js}"></script>
<script type="text/javascript" th:src="@{/assets/js/common.js}"></script>

<script type="text/javascript" th:inline="javascript">
	var userCode = [[${userCode}]]; 
	var folderId="";
	layui.use([ 'layer', 'form', 'laydate', 'notice','table' ],function() {
		var $ = layui.jquery;
		var layer = layui.layer;
		var form = layui.form;
		var laydate = layui.laydate;
		var notice = layui.notice;
		var table = layui.table;
		
		
		$("#cancel").on('click',function(){
			layer.closeAll();
		})
		
		$("#newFolder").on('click',function(){
			$("input[name=folderName]").val('');
			folderId="";
			Modal(folderId);
		})
		
		function Modal(folderId){
			//页面层
			
			layer.open({
			  title:folderId==""?'新建':'重命名',
			  type: 1,
			  skin: 'layui-layer-rim', //加上边框
			  area: ['420px', '200px'], //宽高
			  content: $("#addfolder"),
			});
		}
		
			
		 
		  //第一个实例
			var YhUserFolderTab = table.render({
			  id : 'YhUserFolderTab',
		    elem: '#demo'
		    ,url: '/YhUserFolderWeb/FolderPage?userCode='+userCode  //数据接口
		     ,method : 'get'
		    ,where : {} // 你额外要携带数据，以键值对的方式存入
		    ,page: true //开启分页
		    ,limit : 20// 每页显示的条数
			,limits : [ 5, 10, 20, 50, 100 ] // 每页条数的选择项
			,loading : true // 是否显示加载条(切换分页的时候显示）
			,cellMinWidth : 80 // 全局定义所有常规单元格的最小宽度（默认：60）
			 ,sort:true
		    ,cols: [ //表头
		    	[
		        {field:'folderName', title:'名称', align: 'center'}
		        ,{field: 'folderCreationDate', title: '修改时间', align: 'center'}
		        
		        ,{ title: '操作', toolbar : '#tableBar',align: 'center', width:300}
		        
		      ]
		      ],
		      done: function(res, curr, count){
			        if(count > 20) {
			        	$(".layui-table-page").show();
			        }else {
			        	$(".layui-table-page").hide();
			        }
			      }
		  });
		    
		    
		  table.on('tool(demo)', function(obj) { //注：tool是工具条事件名，test是table原始容器的属性 lay-filter="对应的值"
			  var data = obj.data;
	           folderId = obj.data.folderId;
	           folderName = obj.data.folderName;
	           form.val('folderForm', {
	        	     'folderName':folderName
	        	    });
	        	  
	          console.log(folderId)
	            var layEvent = obj.event;
	            if (layEvent === 'delete') { //删除
	            	layer.confirm('是否确认删除？', {
	            		  btn: [ '确认', '取消'] //可以无限个按钮
	            		  ,btn3: function(index, layero){
	            		    //按钮【按钮三】的回调
	            		  }
	            		},function(index){
	            		  //按钮【按钮二】的回调
	            		$.ajax({
	            		url: '/YhUserFolderWeb/deleteFolder',
	            		data:{folderId:folderId},
	            		success: function (data) {
							console.log(data,"删除")
							if(data.code==20000){
								parent.layer.msg('操作成功');
								layer.closeAll();
								 location.reload();
							}else{
								parent.layer.msg('操作失败');
							}
						}
	            	})
	            });
	            	
	           
	         }
	           if(layEvent === 'updateName'){
	        	   Modal(folderId);
	           }
	           if(layEvent === 'lookOver'){
	        	    
	        	   window.location.href="/manage/look/File?folderId=" + folderId +"&userCode="+userCode+"";
	           }
	     });
		    
		//监听提交
		form.on('submit(folderSubmit)', function (dataYh) {
			var folderName = $("input[name=folderName]").val();
			
			console.log("输入框的值"+folderName)
			$.ajax({
				type: 'GET',
				url: '/YhUserFolderWeb/selectFolderName',
				 async: false,
				data: {
					userCode: userCode,
					folderName: folderName
				},
				success: function (data) {
					console.log("后台返回的对象：", data)
					//debugger
					if (data.data != null) {
							layer.msg('文件夹已存在');
							return 
					}
					dataYh.field.userCode = userCode;
					dataYh.field.folderId = folderId;
					console.log(JSON.stringify(dataYh.field))
				 	$.ajax({
						type: 'post',
						url: '/YhUserFolderWeb/addYhUserFolder',
						data: dataYh.field,
						success: function (data) {
							console.log(data,"fhui")
							if(data.code==20000){
								parent.layer.msg('操作成功');
								layer.closeAll();
								 location.reload();
							}else{
								parent.layer.msg('操作失败');
							}
						}

					});  
				}

			});
			return false;
		});
		 form.verify({
			 folderName: function(value){
				 
				 var userName2 = $("input[name=folderName]").val();
				 
				 if(value.length<=0){
					  return '不能为空'; 
				  }
				  
		    	    if (userName2.indexOf(" ") == -1) {
		    	       // alert("没有空格");
		    	    } else {
		    	    	 return '文件名存在非法字符';
		    	    }
				 
				 console.log(value+"值")
				
					  if(value.length>10){
						  return '最大限制10个字符'; 
					  }
				  
			/* 	 var name = 0;
				  for(var i = 0; i<value.length;i++){
					  if (escape(value[i]).indexOf("%u")!=-1) {
						  name = name + 2;
					  }else{
						  name = name + 1;
					  }
				  }
				 if(name<=0){
					 return '不能为空';
				  }else if(name>20){
					  return '最大限制10个字符'; 
				  }  */
			 },
			 
		 })

});
</script>
