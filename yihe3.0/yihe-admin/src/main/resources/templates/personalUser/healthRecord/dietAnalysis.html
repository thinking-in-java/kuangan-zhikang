		layui.use(['layer', 'form', 'admin', 'table','laydate', 'util'], function () {
			var table = layui.table;
			var anaid=[[${id}]] 
			console.log("anaid",anaid)
			
			//第一个实例
			function table1(dayNum){
				var insTb2 =   table.render({
				    elem: '#demo',
				    method:'post',
				    url: '/system/diary/pagodaAnalysis?id='+anaid,
				    cols: [ [ 
				      {field: 'foodCategoryName', title: '食物类别'}
				      ,{title: '实际摄入(克)',
				    	  templet:function(d){
				    		   if(d.value>0){
				    			   var num=d.value/dayNum;
				    			   num = num.toFixed(2);
				    			   return num;
				    		   }else{
				    			   return 0;
				    		   }
				    		 
				    	  }  
				      }
				      ,{
				    	  title: '推荐摄入(克)',
				    	  templet:function(d){
				    		  if(null!=d.everydaymax){
				    			  return d.everydaymin+"~"+d.everydaymax
				    		  }else{
				    			  return ">"+d.everydaymin;
				    		  }
				    		 
				    	  }
				    	  
				      }
				      ,{field: 'status', title: '评价'} 
				    ] ],
				    response : {

						statusCode : 0
					//规定成功的状态码，默认：0

					},

					parseData : function(res) { //将原始数据解析成 table 组件所规定的数据
						console.log("table",res)
						baotaInfo(res.data);
						return {
							"code" : res.code, //解析接口状态
							"msg" : res.msg, //解析提示文本
							"count" : res.count, //解析数据长度
							"data" : res.data
						//解析数据列表
						}

					} 
				  });
			}
			
			threeMeals();
		nutrition();
		$(function(){
			var id = [[${id}]];
			 $.ajax({
		   		 type:'post',
		   		 url:'/system/diary/showRecordAnalyze',
		   		 data:{id:id},
		   		success : function(data){
		   			console.log("data",data)
							
		   			$("#age").html(data.yhUserReginfo.birthtime);
					$("#userCode").html(data.yhUserReginfo.userCode);
					$("#userName").html(data.yhUserReginfo.userName);
					$("#startTime").html(data.selectByPrimaryKey.starttime);
					$("#endTime").html(data.selectByPrimaryKey.endtime);
					if(data.yhUserReginfo.gender=="1"){
						$("#gender").html("男");
					}else{
						$("#gender").html("女");
					}
				
					 
					
					
					var mycars = new Array()
					mycars[0]=['product', '推荐摄入', '摄入未超标', '摄入超标'];
					 for(var j=0;j<data.array.length;j++){
							mycars[j+1]=[''+data.array[j].time+'', data.array[j].recommend, data.array[j].notoverweight,data.array[j].beenoverweight];
					}
					intake(mycars);
					//记录天数
					$("#ecordDays").html(data.selectByPrimaryKey.ecorddays);
					table1(data.selectByPrimaryKey.ecorddays)
					var good='<img src="http://qiniuyun.yhy.ren/wxicon/%E5%BE%AE%E4%BF%A1%E5%9B%BE%E7%89%87_20200917172242.png" class="layui-nav-img">赞';
					var nogood='<img src="http://qiniuyun.yhy.ren/wxicon/%E5%BE%AE%E4%BF%A1%E5%9B%BE%E7%89%87_20200917172250.png" class="layui-nav-img">踩';
					if(data.selectByPrimaryKey.ecorddays>=4){
						$("#ecordDaysFlag").html('<img src="http://qiniuyun.yhy.ren/wxicon/%E5%BE%AE%E4%BF%A1%E5%9B%BE%E7%89%87_20200917172242.png" class="layui-nav-img">优秀')
					}else if(data.selectByPrimaryKey.ecorddays>=2){
						$("#ecordDaysFlag").html('<img src="http://qiniuyun.yhy.ren/wxicon/%E5%BE%AE%E4%BF%A1%E5%9B%BE%E7%89%87_20200917172250.png" class="layui-nav-img">一般')
					}else{
						$("#ecordDaysFlag").html('<img src="http://qiniuyun.yhy.ren/wxicon/%E5%BE%AE%E4%BF%A1%E5%9B%BE%E7%89%87_20200917172250.png" class="layui-nav-img">差')
					}
					
					
					
					$("#exceedingDays").html(data.selectByPrimaryKey.exceedingdays);
					if(data.selectByPrimaryKey.exceedingdays==0){
						$("#exceedingDaysFlag").html('<img src="http://qiniuyun.yhy.ren/wxicon/%E5%BE%AE%E4%BF%A1%E5%9B%BE%E7%89%87_20200917172242.png" class="layui-nav-img">未超标')
					}else{
						$("#exceedingDaysFlag").html('<img src="http://qiniuyun.yhy.ren/wxicon/%E5%BE%AE%E4%BF%A1%E5%9B%BE%E7%89%87_20200917172250.png" class="layui-nav-img">超标')
					}
					$("#noRepetition").html(data.selectByPrimaryKey.norepetition)
					if(data.selectByPrimaryKey.norepetition>=25){
						$("#noRepetitionFlag").html('<img src="http://qiniuyun.yhy.ren/wxicon/%E5%BE%AE%E4%BF%A1%E5%9B%BE%E7%89%87_20200917172242.png" class="layui-nav-img">优秀')
					}else if(data.selectByPrimaryKey.norepetition>=20&&data.selectByPrimaryKey.norepetition<25){
						$("#noRepetitionFlag").html('<img src="http://qiniuyun.yhy.ren/wxicon/%E5%BE%AE%E4%BF%A1%E5%9B%BE%E7%89%87_20200917172242.png" class="layui-nav-img">良好')
					}else{
						$("#noRepetitionFlag").html('<img src="http://qiniuyun.yhy.ren/wxicon/%E5%BE%AE%E4%BF%A1%E5%9B%BE%E7%89%87_20200917172250.png" class="layui-nav-img">一般')
					}
					
					$("#averageIntake7").html(parseFloat(data.selectByPrimaryKey.averageintake7).toFixed(2))
					$("#averageIntake").html(parseFloat(data.selectByPrimaryKey.averageintake).toFixed(2))
					
					if(data.selectByPrimaryKey.averageintake<=data.selectByPrimaryKey.averageintake7){
						$("#averageIntakeFlag").html('<img src="http://qiniuyun.yhy.ren/wxicon/%E5%BE%AE%E4%BF%A1%E5%9B%BE%E7%89%87_20200917172242.png" class="layui-nav-img">未超标')
					}else{
						$("#averageIntakeFlag").html('<img src="http://qiniuyun.yhy.ren/wxicon/%E5%BE%AE%E4%BF%A1%E5%9B%BE%E7%89%87_20200917172250.png" class="layui-nav-img">超标')
					}
					var eatbfb=parseFloat(data.selectByPrimaryKey.zao)+parseFloat(data.selectByPrimaryKey.wu)+parseFloat(data.selectByPrimaryKey.wan)+parseFloat(data.selectByPrimaryKey.jia);
					var zaoeat=data.selectByPrimaryKey.zao/eatbfb*100;					
					var wueat=data.selectByPrimaryKey.wu/eatbfb*100;					
					var waneat=data.selectByPrimaryKey.wan/eatbfb*100;					
					var jiaeat=data.selectByPrimaryKey.jia/eatbfb*100;					
					
					$("#zaocan").html(zaoeat.toFixed(2)+"%")
					$("#wucan").html(wueat.toFixed(2)+"%")
					$("#wancan").html(waneat.toFixed(2)+"%")
					$("#jiacan").html(jiaeat.toFixed(2)+"%")

					var piangao='<img src="http://qiniuyun.yhy.ren/wxicon/%E5%BE%AE%E4%BF%A1%E5%9B%BE%E7%89%87_20200917172250.png" class="layui-nav-img">偏高';

					if(zaoeat<25){
						$("#zaocanFlag").html(piandi)
					}else if(zaoeat>30){
						$("#zaocanFlag").html(piangao)
					}else{
						$("#zaocanFlag").html(heshi)
					}
					
					if(wueat<30){
						$("#wucanFlag").html(piandi)
					}else if(wueat>40){
						$("#wucanFlag").html(piangao)
					}else{
						$("#wucanFlag").html(heshi)
					}
					
					if(waneat<20){
						$("#wancanFlag").html(piandi)
					}else if(wueat>30){
						$("#wancanFlag").html(piangao)
					}else{
						$("#wancanFlag").html(heshi)
					}
					
					if(jiaeat<5){
						$("#jiacanFlag").html(piandi)
					}else if(jiaeat>15){
						$("#jiacanFlag").html(piangao)
					}else{
						$("#jiacanFlag").html(heshi)
					}
					
					
					
					
					
					var food=[{value:data.selectByPrimaryKey.zao, name: '早餐(实际)'}, {value: data.selectByPrimaryKey.wu, name: '中餐(实际)'}, {value: data.selectByPrimaryKey.wan, name: '晚餐(实际)'},{value: data.selectByPrimaryKey.jia, name: '加餐(实际)'}]
					
					threeMeals(food);
					var nutrition1=[{value: data.selectByPrimaryKey.carbohydrate, name: '碳水化合物'},{value: data.selectByPrimaryKey.protein, name: '蛋白质'},{value: data.selectByPrimaryKey.fat, name: '脂肪'}]

					var ss=data.selectByPrimaryKey.carbohydrate+data.selectByPrimaryKey.protein+data.selectByPrimaryKey.fat;//总数
					var cho=data.selectByPrimaryKey.carbohydrate/ss*100;//碳水化合物百分比
					$("#tanshui").html(cho.toFixed(2)+"%")
					var protein=data.selectByPrimaryKey.protein/ss*100;//蛋白质百分比
					$("#danbaizhi").html(protein.toFixed(2)+"%")
					var fat=data.selectByPrimaryKey.fat/ss*100;//脂肪百分比
					$("#zhifang").html(fat.toFixed(2)+"%")
					$("#tanshui").html(data.selectByPrimaryKey.carbohydrate+"%")
					$("#danbaizhi").html(data.selectByPrimaryKey.protein+"%")
					$("#zhifang").html(data.selectByPrimaryKey.fat+"%")

					if(data.tnb){
						if(cho<45){
							$("#tanshuiFlag").html(piandi)
						}else if(cho>60){
							$("#tanshuiFlag").html(piangao)
						}else{
							$("#tanshuiFlag").html(heshi)
						}

						if(protein<15){
							$("#danbaizhiFlag").html(piandi)
						}else if(protein>20){
							$("#danbaizhiFlag").html(piangao)
						}else{
							$("#danbaizhiFlag").html(heshi)
						}
						if(fat<20){
							$("#zhifangFlag").html(piandi)
						}else if(fat>30){
							$("#zhifangFlag").html(piangao)
						}else{
							$("#zhifangFlag").html(heshi)
						}
					}else{
						if(cho<50){
							$("#tanshuiFlag").html(piandi)
						}else if(cho>65){
							$("#tanshuiFlag").html(piangao)
						}else{
							$("#tanshuiFlag").html(heshi)
						}

						if(protein<10){
							$("#danbaizhiFlag").html(piandi)
						}else if(protein>15){
