//统计图
function show(cTime,energyLevel,energyKcal){
	//指定图表的配置项和数据
	option = {
title : {
    text: '运动日记统图',
},
tooltip : {
    trigger: 'axis'
},
legend: {
    data:['推荐能耗','实际能耗']
},
toolbox: {
    show : true,
    feature : {
        dataView : {show: true, readOnly: false},
        magicType : {show: true, type: ['line', 'bar']},
        restore : {show: true},
        saveAsImage : {show: true}
    }
},
color:["rgba(222, 250, 250, 1)","rgba(0, 186, 173, 1)"],
calculable : true,
xAxis : [
    {
        type : 'category',
        data : cTime,
    }
],
yAxis : [
    {
        type : 'value'
    }
],
series : [
    {
        name:'推荐能耗',
        type:'bar',
        data:energyLevel,
    },
    {
        name:'实际能耗',
        type:'bar',
        data:energyKcal,
    }
],
dataZoom : [
    //1.横向使用滚动条
      {
        type: 'slider',//有单独的滑动条，用户在滑动条上进行缩放或漫游。inside是直接可以是在内部拖动显示
        show: true,//是否显示 组件。如果设置为 false，不会显示，但是数据过滤的功能还存在。
        start: 0,//数据窗口范围的起始百分比0-100
        end: 50,//数据窗口范围的结束百分比0-100
        xAxisIndex: [0],// 此处表示控制第一个xAxis，设置 dataZoom-slider 组件控制的 x轴 可是已数组[0,2]表示控制第一，三个；xAxisIndex: 2 ，表示控制第二个。yAxisIndex属性同理
        bottom:-10 //距离底部的距离
      },
  //2.在内部可以横向拖动
     {
         type: 'inside',// 内置于坐标系中
         start: 0,
         end: 30,
         xAxisIndex: [0]
      }
    ]
};

      // 设置宽度自适应
		 myChart.resize();
}
