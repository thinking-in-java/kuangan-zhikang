<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<html>
<head>
    <meta charset="utf-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>用户查看膳食管理</title>
   <link rel="stylesheet"  th:href="@{/assets/libs/layui/css/layui.css}" />
    <link rel="stylesheet"  th:href="@{/assets/module/admin.css}"  />
    <style type="text/css">
.layui-elem-quote {
    margin-bottom: 10px;
    padding: 9px;
    line-height: 3px;
    border-left: 5px solid #009688;
    border-radius: 0 2px 2px 0;
    background-color: white;
    margin-top: 20px;
    float: left;
    margin-left: 20px;
}

.layui-card {
    margin-bottom: 15px;
    border-radius: 2px;
    background-color: #fff;
    box-shadow: 0 0px 0px 0 rgba(0,0,0,.05);
}
h2,h3,h4{
	font-weight:bold;
}
</style>
</head>
<body style="margin: 7px;">
 <!-- 页面加载loading -->
<div class="page-loading">
    <div class="ball-loader">
        <span></span><span></span><span></span><span></span>
    </div>
</div>

<div class="layui-fluid" style="height: 100%">
		<div class="layui-row">
		<div style="width: 100%; height:100%; background-color: #FFF; position: relative;padding-top: 20px;">
		
		<fieldset class="layui-elem-field layui-field-title" style="">
		  <legend>饮食套餐</legend>
		</fieldset>   		
		
	<!-- 内容开始 -->
	<div style="padding-left: 32px;padding-right: 20px;">
	
		<div class="layui-row">
		    <div class="layui-col-xs6">
		      <div class="grid-demo grid-demo-bg1"><h3>名称</h3></div>
		    </div>
		    <div class="layui-col-xs6" style="text-align: right;">
		      <div class="grid-demo">返回上一页</div>
		    </div>
		  </div>
		  
		  <br/>
		  <div id="packagename"></div>
		  
		  <br>
		  <div class="layui-row">
		    <div class="layui-col-xs3">
		      <div class="grid-demo grid-demo-bg1"><h3 >适用人群</h3></div>
		    </div>
		    <!-- <div class="layui-col-xs3">
		      <div class="grid-demo"><h3 >推荐摄入能量</h3></div>
		    </div> -->
		   </div>
		   <br>
		   <div class="layui-row">
		    <div class="layui-col-xs3">
		      <div class="grid-demo grid-demo-bg1" id="tryout"></div>
		    </div>
		   <!--  <div class="layui-col-xs3">
		      <div class="grid-demo" name="kilocalorie">123 </div>
		    </div> -->
		   </div>
		    <br>
		   <h2>套餐描述</h2>
		   <br>
		   <p id="describe">

		   </p>
		   <br>
		   <h2>课程阶段</h2>
		   <br>
		   <div id="scheme">
		   	
		   	
		     
		   	
		   	
		   </div>
		   
		  
		   
	</div>
	<!-- 内容结束 -->			
			
			</div> 
		</div>
	</div>

</body>
<script type="text/javascript" th:src="@{/assets/libs/layui/layui.js}"></script>
<script type="text/javascript" th:src="@{/assets/js/common.js}"></script>
<script type="text/javascript" th:src="@{/assets/js/jquery-1.11.1.js}"></script>

<script type="text/javascript">
$(function(){
	var id = [[${id}]];
	 $.ajax({
   		 type:'post',
   		 url:'/YhSportRecommendRecordController/selectexerciseshow',
   		 data:{id:id},
   		success : function(data){
			$("#packagename").html(data.data.name);
   			$("#tryout").html(data.data.apply);
   			$("#describe").html(data.data.describe);
   			var vojo=data.data.vojo;
   			
   			for(var i=0;i<vojo.length;i++){
   				
   				var sport="";
   			    for(var j=0;j<vojo[i].sport.length;j++){
   			    		sport+="<div class='layui-col-md4'><p><h4>动作"+(j+1)+"</h4></p><div class='grid-demo grid-demo-bg1'><div style='float: left;width: 50%;'>"+vojo[i].sport[j].sportName+"</div><div>"+vojo[i].sport[j].followSecond+"秒</div></div></div><br>"
   			    	}
   			 $("#scheme").append("<p>第"+(i+1)+"阶段</p><br>"+sport+"<hr>");
   			    }
   		
   	
   			}
   			
   	 })
})
</script>


</html>
