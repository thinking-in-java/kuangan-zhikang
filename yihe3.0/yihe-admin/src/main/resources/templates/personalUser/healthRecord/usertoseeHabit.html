function statistics(food,motion,sleep,elsew){
	let bgColor = '#fff';
	let title = '今日打卡';
	let color = ['#0E7CE2', '#FF8352', '#E271DE', '#F8456B', '#00FFFF', '#4AEAB0'];
	let echartData = [{
	        name: "饮食",
	        value: food
	    },
	    {
	        name: "运动",
	        value: motion
	    },
	    {
	        name: "睡眠",
	        value: sleep
	    },
	    {
	        name: "其它",
	        value: elsew
	    }
	];

	let formatNumber = function(num) {
	    let reg = /(?=(\B)(\d{3})+$)/g;
	    return num.toString().replace(reg, ',');
	}
	let total = echartData.reduce((a, b) => {
	    return a + b.value * 1
	}, 0);

	option = {
	    color: color,
	    // tooltip: {
	    //     trigger: 'item'
	    // },
	    title: [{
	        text: '{name|' + title + '}\n{val|' + formatNumber(total) + '}',
	        top: 'center',
	        left: 'center',
	        textStyle: {
	            rich: {
	                name: {
	                    fontSize: 14,
	                    fontWeight: 'normal',
	                    color: '#666666',
	                    padding: [10, 0]
	                },
	                val: {
	                    fontSize: 30,
	                    fontWeight: 'bold',
	                    color: '#333333',
	                }
	            }
	        }
	    }],
	    series: [{
	        type: 'pie',
	        radius: ['40%', '50%'],
	        center: ['50%', '50%'],
	        data: echartData,
	        hoverAnimation: false,
	        itemStyle: {
	            normal: {
	                borderColor: bgColor,
	                borderWidth: 2
	            }
	        },
	        labelLine: {
	            normal: {
	                length: 20,
	                length2: 120,
	                lineStyle: {
	                    color: '#e6e6e6'
	                }
	            }
	        },
	        label: {
	            normal: {
	                formatter: params => {
	                    return (
	                        '{icon|●}{name|' + params.name + '}{value|' +
	                        formatNumber(params.value) + '次}'
	                    );
	                },
	                padding: [0 , -100, 25, -100],
	                rich: {
	                    icon: {
	                        fontSize: 16
	                    },
	                    name: {
	                        fontSize: 14,
	                        padding: [0, 10, 0, 4],
	                        color: '#666666'
	                    },
	                    value: {
	                        fontSize: 18,
	                        fontWeight: 'bold',
	                        color: '#333333'
	                    }
	                }
	            }
	        },
	    }]
	};
	/* var chartmain1width = $("#chartmain2width").width();
	$("#chartmain2").css('width',$("#chartmain2width").width()); //给图设置固定宽度，div chart是第一个tab页面上面的某个图，宽度布局与map一致				   
	 */
	//获取dom容器
	var myChart = echarts.init(document.getElementById('chartmain2'));
	// 使用刚指定的配置项和数据显示图表。
	myChart.setOption(option);
	
	myChart.resize();
}

//统计图
function show(cTime,energyLevel,energyKcal){
	option = {
		    color: ['#ed7a2c', '#5b9bd5', '#a5a5a5'],
		    grid: {
		        bottom: 60,
		    },
		   
		    tooltip: {
		        trigger: 'axis',
		        confine: true,
		        textStyle: {
		            fontSize: 12
		        }
		    },
		    xAxis: {
		        type: "category",
		        data: cTime,
		    },
		    yAxis: {
		        type: "value"
		    },
		    series: [{
		        name: "计划打卡项",
		        type: "line",
		      
		        data: energyLevel
		    }, {
		        name: "完成打卡项",
		        type: "line",
		        data: energyKcal
		    }],
		     dataZoom : [
				    //1.横向使用滚动条
				      {
				        type: 'slider',//有单独的滑动条，用户在滑动条上进行缩放或漫游。inside是直接可以是在内部拖动显示
				        show: true,//是否显示 组件。如果设置为 false，不会显示，但是数据过滤的功能还存在。
				        start: 0,//数据窗口范围的起始百分比0-100
				        end: 50,//数据窗口范围的结束百分比0-100
				        xAxisIndex: [0],// 此处表示控制第一个xAxis，设置 dataZoom-slider 组件控制的 x轴 可是已数组[0,2]表示控制第一，三个；xAxisIndex: 2 ，表示控制第二个。yAxisIndex属性同理
				        bottom:-10 //距离底部的距离
				      },
				  //2.在内部可以横向拖动
				     {
				         type: 'inside',// 内置于坐标系中
				         start: 0,
				         end: 30,
				         xAxisIndex: [0]
				      }
				    ],
		};
	/* var width = $("#table").width();
	$("#chartmain").css('width',$("#table").width()); //给图设置固定宽度，div chart是第一个tab页面上面的某个图，宽度布局与map一致				   
	 */
		//获取dom容器
		var myChart = echarts.init(document.getElementById('chartmain'));
		// 使用刚指定的配置项和数据显示图表。
		myChart.setOption(option);
		
		myChart.resize();
}
