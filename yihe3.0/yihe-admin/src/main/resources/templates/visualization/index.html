        $.ajax({
            type: 'post',
            url: '/newRegController/personalInformation',
            data: {},
            success: function (res) {
                var ul = $('<ul style="color: #FFFFFF"></ul>');
                ul.css({
                    padding: '0',
                    margin: '0',
                    listStyle: 'none',
                    color: '#fff' // 全局字体颜色为白色
                });
                $.each(res.data, function (index, item) {
                    var li = $('<li></li>');
                    li.css({
                        display: 'grid',
                        gridTemplateColumns: '10% 20% 20% 50%', // 控制每列宽度
                        gap: '10px',
                        marginBottom: '10px',
                        textAlign: 'left' // 全部靠左对齐
                    });

                    var id = $('<span style="color: #FFFFFF !important; "></span>').text(item.id + '：');
                    var name = $('<span style="color: #FFFFFF !important; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;"></span>').text(item.name);
                    var department = $('<span style="color: #FFFFFF !important; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; "></span>').text(item.department);

                    var insertDate = $('<span style="color: #FFFFFF !important;"></span>')
                        .text(item.insertDate)
                        .css({
                            whiteSpace: 'normal', // 允许换行，确保时间显示完整
                            overflow: 'visible' // 防止截断
                        });

                    li.append(id).append(name).append(department).append(insertDate);
                    ul.append(li);
                });

                // 将ul添加到指定的div中
                $('#dynamic-list').empty().append(ul);


                var html = $(".wrap ul").html(); // 获取列表的HTML内容
                console.log(html,"456789",$(".wrap").html());
                $(".wrap ul").append(html); // 复制内容以实现无缝滚动

                var ls = $(".wrap li").length ; // 实际滚动的总项数（去掉重复部分）
                var i = 0; // 初始化滚动索引

                setInterval(function () {
                    i++; // 滚动索引增加
                    if (i === ls) { // 如果到达列表的最后一个元素
                        i = 0; // 复位索引
                        $(".wrap ul").css({ marginTop: 0 }); // 立即复位到初始位置
                    }
                    if (i > ls) { // 如果到达最后一个可见项
                        i = 1; // 重置到第一项
                        $(".wrap ul").css({ marginTop: 0 }); // 立即复位到初始位置
                    }
                    $(".wrap ul").animate({ marginTop: -0.52 * i + "rem" }, 1000); // 滚动到下一项
                }, 2400);

            }
        });

        function calculateAge(birthDateString) {
            // 解析日期字符串
            const birthDate = new Date(birthDateString);
            const today = new Date();

            // 计算初步的年龄差
            let age = today.getFullYear() - birthDate.getFullYear();

            // 检查今年生日是否过了
            const isBirthdayPassed =
                today.getMonth() > birthDate.getMonth() ||
                (today.getMonth() === birthDate.getMonth() && today.getDate() >= birthDate.getDate());

            // 如果今年生日还没过，年龄减一
            if (!isBirthdayPassed) {
                age--;
            }

            return age;
        }
