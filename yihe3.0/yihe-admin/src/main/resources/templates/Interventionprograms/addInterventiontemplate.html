<script type="text/javascript" th:src="@{/assets/libs/layui/layui.js}"></script>
<script type="text/javascript" th:src="@{/assets/js/common.js}"></script><script>
    var  userCode="";
    layui
        .use(
            ['layer', 'form', 'table',
                'laypage', 'treeSelect', 'admin', 'element', 'laydate', 'index','notice'
            ],
            function () {
                var $ = layui.jquery;
                var layer = layui.layer;
                var form = layui.form;
                var table = layui.table;
                var laypage = layui.laypage;
                var element = layui.element;
                var admin = layui.admin;
                var form = layui.form;
                var treeSelect = layui.treeSelect;
                var laydate = layui.laydate;
                var notice=layui.notice;
                var bianjiid=$("#bianjiid").val();
                selectplantop();
                //如果有id的话查出干预计划模块的上半部
                function selectplantop(){
                    var templateid=$("#bianjiid").val();
                    if(templateid!=null){
                        $.ajax({
                            type:"POST",
                            url:'/YhInterventionTemplateController/selectinterventionId?interventionId='+templateid,
                            dataType:"json",
                            success:function(res){
                                console.log(res);
                                $("#username").val(res.templateName);
                                $("#dis").val(res.templateDiseases);
                                $("#infoType").val(res.templateRisk);
                                $("#souce").val(res.applySex);
                                $("#agemin").val(res.applyAgeMin);
                                $("#agemax").val(res.applyAgeMax);
                                $("#bmimin").val(res.applyBimMin);
                                $("#bmimax").val(res.applyBimMax);
                                $("#describe").val(res.templateDescribe);
                                form.render();
                            }
                        });
                    }
                }
                //点击保存时有id时就更改，没有id就添加
                    $("#baocun").click(function(){
                        baocunone();
                    });
                function baocunone(){
                    var username=$("#username").val();
                    var dis=$("#dis").val();
                    var infoType=$("#infoType").val();
                    var souce=$("#souce").val();
                    var agemin=$("#agemin").val();
                    var agemax=$("#agemax").val();
                    var bmimin=$("#bmimin").val();
                    var bmimax=$("#bmimax").val();
                    var describe=$("#describe").val();
                    if(username==null || username ==''){
                        notice.warning({
                            title: '消息通知',
                            message: '模板名不能为空'
                        });
                        return
                    }
                    if(byteCount(username)>30){
                        notice.warning({
                            title: '消息通知',
                            message: '最大字符不能超过30个'
                        });
                        return
                    }
                    if(( agemin!="")&&( agemax!="")) {
                        console.log(agemin=='')
                        console.log(agemax=='')
                        if(agemin>agemax){
                            notice.warning({
                                title: '消息通知',
                                message: '最小年龄不能大于最大年龄'
                            });
                            return
                        }
                    }
                    if(( bmimin!="")&&( bmimax!="")) {
                        console.log(bmimin)
                        console.log(bmimax)
                        if(bmimin>bmimax){
                            notice.warning({
                                title: '消息通知',
                                message: '最小BMI不能大于最大BMI'
                            });
                            return
                        }
                    }
                    if(dis==null || dis ==''){
                        return
                    }

                    var data={interventionId:bianjiid,templateDiseases:dis,templateRisk:infoType,templateName:username,applySex:souce,applyAgeMin:agemin,applyAgeMax:agemax,applyBimMin:bmimin,applyBimMax:bmimax,templateDescribe:describe};
                    $.ajax({
                        type:"GET",
                        url:'/YhInterventionTemplateController/selectcountbyname',
                        dataType:"json",
                        data:{templateName:username},
                        success:function(res){
                           if(res.data>0 && bianjiid==""){
                               notice.warning({
                                   title: '消息提醒',
                                   message: '模板名称不能重复'
                               });
                               return;
                           }else{
                               insertname(data);
                           }
                        }
                    });
                }
                function insertname(data){

                    $.ajax({
                        type:"GET",
                        url:'/YhInterventionTemplateController/selectcountdata',
                        dataType:"json",
                        success:function(res){
                            if(res.data==0){
                                notice.warning({
                                    title: '消息提醒',
                                    message: '计划数量不能为0'
                                });
                            }else{
                                $.ajax({
                                    type:"POST",
                                    url:'/YhInterventionTemplateController/changetempdate',
                                    dataType:"json",
                                    data:data,
                                    success:function(res){
                                        var strr= document.referrer;
                                        if(strr.substr(strr.length-34)=='/division/divisionInterventionplan'){
                                            window.location.href=document.referrer+"?type=3"
                                        }else{
                                            window.history.back();
                                        }

                                    }
                                });
                            }
                        }
                    })
                }
                function byteCount(str) {

                    return str && str.replace(/[^\x00-\xff]/g,"xx").length || 0;

                }
                //点击取消时清除临时表的数据
                    $("#quxiao").click(function(){
                        $.ajax({
                            type:"POST",
                            url:'/YhInterventionTemplateController/removetemporary?interventionId='+bianjiid,
                            dataType:"json",
                            success:function(res){
                                var strr= document.referrer;
                                if(strr.substr(strr.length-34)=='/division/divisionInterventionplan'){
                                    window.location.href=document.referrer+"?type=3"
                                }else{
                                    window.history.back();
                                }
                            }
                        });
                    });
                //转移数据到临时表
                $.ajax({
                    type:"GET",
                    url:'/YhInterventionTemplateController/turntomove?interventionId='+bianjiid,
                    dataType:"json",
                    success:function(res){
                        lode();
                    }
                });

                //加载任务列表
                function lode(){
                    var insTb = table.render({
                        elem: '#pinggu',
                        url: "/YhInterventionTemplateController/selectyhprograms?interventionId="+bianjiid,
                        limit:50,
                        page: true,
                        cols: [
                            [ {type:'checkbox'},
                                {
                                    title: '执行时间',
                                    width : 200,
                                    align : 'center',
                                    templet:function (d) {
                                        return "第"+d.programsWeeks+"周第"+d.programsDays+"天"
                                    }
                                }, {
                                title: '服务方式',
                                width : 200,
                                align : 'center',
                                templet:function(d){
                                    if(d.serviceWay==1){
                                        return "电话回访"
                                    }else if(d.serviceWay==2){
                                        return "微信回访"
                                    }else if(d.serviceWay==3){
                                        return "小程序聊天回访"
                                    }else if(d.serviceWay==4){
                                        return "上门回访"
                                    }else if(d.serviceWay==5){
                                        return "不限"
                                    }else if(d.serviceWay==6){
                                        return "小程序订阅回访"
                                    }else if(d.serviceWay==7){
                                        return "公众号通知回访"
                                    }
                                }
                            }, {
                                field: 'plan_count',
                                title: '计划内容',
                                width : 200,
                                align : 'center'
                            }, {
                                field: 'contentPrompt',
                                title: '内容提示',

                            }]
                        ],
                        response: {

                            statusCode:20000
                            //规定成功的状态码，默认：0

                        },

                        parseData: function (res) { //将原始数据解析成 table 组件所规定的数据
                            console.log(res);
                            // return {

              //点击编辑
                $("#bianji").click(function(){
                    selectservicecount(2);
                    var checkStatus = table.checkStatus('pinggu')
                        ,data = checkStatus.data;
                    layer.msg('选中了：'+ data.length + ' 个');
                    if(data.length==0){
                        notice.warning({
                            title: '提示',
                            message: '请选择数据后再操作'
                        });
                    }else if(data.length==1){
                        console.log(data);
                        $("#updateweek").val(data[0].programsWeeks);
                        $("#updateday").val(data[0].programsDays);
                        $("#updateway").val(data[0].serviceWay);
                        //$("#updatecount").val(data[0].planContent);
                        $("#updatecount").find("option[value="+data[0].planContent+"]").attr("selected","true");
                        $("#updatetishi").val(data[0].contentPrompt);
                        form.render();
                        var index=layer.open({
                            type:1,
                            area:['700px','400px'],
                            title: '完成服务任务',
                            content:$("#test2"),
                            shade: 0.5,
                            btn: ['保存', '取消']
                            ,btn1: function(index, layero){
                                $.ajax({
                                    type:"POST",
                                    url:'/YhInterventionTemplateController/updateplan',
                                    dataType:"json",
                                    data:{interventionId:$("#bianjiid").val(),programsWeeks:$("#updateweek").val(),programsDays:$("#updateday").val(),serviceWay:$("#updateway").val(),planContent:$("#updatecount").val(),contentPrompt:$("#updatetishi").val(),programsId:data[0].programsId},
                                    success:function(res){
                                        layer.close(index);
                                        lode();
                                    }
                                });
                            },
                            btn2: function(index, layero){
                                layer.close(index);
                                return false;
                            },
                            cancel: function(layero,index){
                                layer.closeAll();
                            }
                        });
                    }else if(data.length>1){
                        notice.warning({
                            title: '提示',
                            message: '多条数据不能一起编辑'
                        });
                    }

                });

                //点击删除
                $("#btnempty").click(function(){
                    var checkStatus = table.checkStatus('pinggu')
                        ,date = checkStatus.data;
                    console.log(date);
                    $.ajax({
                        type:"POST",
                        url:'/YhInterventionTemplateController/deleteplan',
                        dataType:"json",
                        contentType:"application/json",
                        data:JSON.stringify(date),
                        success:function(res){
                            lode();
                        }
                    });
                });

                //添加任务计划
                $("#addplan").click(function(){

                    selectservicecount(1);

                    var index=layer.open({
                        type:1,
                        area:['700px','400px'],
                        title: '添加计划',
                        content:$("#test1"),
                        shade: 0.5,
                        btn: ['保存', '取消']
                        ,btn1: function(index, layero){
                            console.log($("#week").val());

                            console.log($("#way").val());
                            console.log($("#count").val());
                            console.log($("#tishi").val());
                            $.ajax({
                                type:"POST",
                                url:'/YhInterventionTemplateController/insertplan',
                                dataType:"json",
                                data:{interventionId:$("#bianjiid").val(),programsWeeks:$("#week").val(),programsDays:$("#day").val(),serviceWay:$("#way").val(),planContent:$("#count").val(),contentPrompt:$("#tishi").val()},

                        cancel: function(layero,index){

                        }
                    });
                });
                //查询计划内容（下拉框）
                function selectservicecount(serviceid){
                    $.ajax({
                        type:"GET",
                        url:'/YhInterventionTemplateController/selectcount',
                        dataType:"json",
                        success:function(res){
                            var html="";
                            for(var i=0;i<res.length;i++){
                                html+="<option value="+res[i].plancount_id+">"+res[i].plan_count+"</option>";
                            }
                            if(serviceid==1){
                                $("#count").empty().append(html);
                            }else if(serviceid==2){
                                $("#updatecount").empty().append(html);
                            }


                            form.render('select');
                        }
                    });
                }


            });
