<!DOCTYPE html>
<html>

<head>
	<meta charset="utf-8" />
	<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
	<title>干预计划模板</title>
	<link rel="stylesheet" th:href="@{/assets/libs/layui/css/layui.css}" />
	<link rel="stylesheet" th:href="@{/assets/module/admin.css}" />
	<style type="text/css">
		.layui-card-body {
			padding: 10px 0px;
		}

		.layui-fluid {
			padding: 15px 0px;
		}

		.toolbar {
			margin-left: -23px;
		}
		.layui-table-box {
			min-height:400px;
		}
	</style>
</head>
<!-- 弹出模态框 -->


<body style="overflow-x: hidden">
	<!-- 加载动画 -->
	<div class="page-loading">
		<div class="ball-loader">
			<span></span><span></span><span></span><span></span>
		</div>
	</div>






	<div class="layui-row layui-col-space15" style="padding: 20px;">
		<div class="layui-card">
			<div class="layui-tab layui-tab-brief" lay-filter="demo">

				<div class="layui-tab-content">
					<div class="layui-tab-item layui-show">
						<div class="layui-fluid">
							<div class="layui-card">
								<div class="layui-card-body">

									<div class="layui-form toolbar">
										<div class="layui-form-item">


											<div  class="layui-inline">
												<label class="layui-form-label">模板来源：</label>
												<div  class="layui-input-inline">
												<select name="infoType" id="souce">
													<option value="">全部</option>
													<option value="1">系统提供的模板</option>
													<option value="2">我创建的模板</option>
													<option value="3">其他人创建的模板</option>
												</select>
												</div>
											</div>


											<div class="layui-inline">
												<label class="layui-form-label">模板条件：</label>
												<div class="layui-input-inline">
													<select name="infoType" id="dis">
														<option value="">不限</option>
														<option value="1">冠心病</option>
														<option value="2">脑卒中</option>
														<option value="3">高血压</option>
														<option value="4">糖尿病</option>
														<option value="5">痛风</option>
														<option value="6">血脂异常</option>
														<option value="7">骨质疏松症</option>
														<option value="8">肺癌</option>
														<option value="9">前列腺癌</option>
														<option value="10">乳腺癌</option>
														<option value="11">肥胖症</option>
														<option value="13">健康</option>
													</select>
												</div>
												<div style="margin-left: 20px" class="layui-input-inline">
													<select name="infoType" id="infoType">
														<option value="">不限</option>
														<option value="1">一级</option>
														<option value="2">二级</option>
														<option value="3">三级</option>
														<option value="4">四级</option>
													</select>
												</div>
											</div>
											<div class="layui-inline">
												<label class="layui-form-label">模板名称：</label>
												<div class="layui-input-inline">

													<input name="username" id="username" class="layui-input" type="text"
														placeholder="输入账号" />
												</div>

											</div>


											<div class="layui-inline" style="padding-left: 20px;">
												<button class="layui-btn icon-btn sousuoDN" id="selectbyconditions" data-type="selectby"><i
														class="layui-icon"></i>搜索</button>
												<button class="layui-btn layui-btn-primary" id="btnempty" lay-submit=""
													lay-filter="reset">清除</button>

											</div>
											<div id="addplan" class="layui-inline" style="float: right">
												<button class="layui-btn icon-btn " data-type="reloadd"><i
														class="layui-icon layui-icon-addition"></i>添加</button>
											</div>

										</div>
									</div>

									<table class="layui-hide" id="pinggu" lay-filter="pinggu"></table>

								</div>
							</div>
						</div>

					</div>
				</div>
			</div>
		</div>
	</div>
	<!-- 正文开始 -->




	<script type="text/html" id="tableBar">
		{{#if (d.operation == 0) { }}
		<span>- -</span>
		{{# }else if(d.roleid == 20 || d.nowusercode==d.operation){ }}
		<a class="layui-btn layui-btn-xs" lay-event="edit">修改</a> 	<a class="layui-btn layui-btn-danger layui-btn-xs" lay-event="del">删除</a>
		{{# } }}
	</script>
	<!-- js部分 -->
	<script type="text/javascript" th:src="@{/assets/libs/layui/layui.js}"></script>
	<script type="text/javascript" th:src="@{/assets/js/common.js}"></script>
	<script>
	var  userCode="";
		layui
			.use(
				['layer', 'form', 'table',
					'laypage', 'treeSelect', 'admin', 'element', 'laydate', 'index'
				],
				function () {
					var $ = layui.jquery;
					var layer = layui.layer;
					var form = layui.form;
					var table = layui.table;
					var laypage = layui.laypage;
					var element = layui.element;
					var admin = layui.admin;
					var form = layui.form;
					var treeSelect = layui.treeSelect;
					var laydate = layui.laydate;
					var  data={};
                    selectdate(data);
					function selectdate(data){
                        var insTb = table.render({
                            elem: '#pinggu',
                            url: '/YhInterventionTemplateController/selectByPrimaryKey',
                            page: true,
							where:data,
							limit:10,
                            cols: [
                                [{
                                    field: 'insertTime',
                                    title: '创建时间',

                                }, {
                                    field: 'templateName',
                                    title: '模板名称',

                                }, {
                                    field: 'planCount',
                                    title: '计划数',

                                }, {
                                    field: 'disease_name',
                                    title: '适用病种',


                                }, {
                                    templet:function (d) {
                                        console.log(d);
                                        var biaofenji='';
                                        var  s=d.templateRisk+"";
                                        var fenji=s.split(',');
                                        for(var i=0;i<fenji.length;i++){
                                            if(fenji[i]=='1'){
                                                biaofenji=biaofenji+" 一级";
                                            }else if(fenji[i]=='2'){
                                                biaofenji=biaofenji+" 二级";
                                            }else if(fenji[i]=='3'){
                                                biaofenji=biaofenji+" 三级";
                                            }else if(fenji[i]=='4'){
                                                biaofenji=biaofenji+" 四级";
                                            }else if(fenji[i]=='5'){
                                                biaofenji=biaofenji+" 五级";
                                            }
                                        }
                                        return biaofenji;
                                    },
                                    title: '适用分级',

                                }, {
                                    title: '性别',
                                    templet: function (d) {
                                        if(d.applySex==1){
                                            return "男";
                                        }else if(d.applySex==2){
                                            return "女";
                                        }else{
                                            return "不限";
                                        }

                                    }

                                }, {
                                    field: 'applyAgeMin',
                                    title: '年龄',
                                    templet:function (d) {
                                        if(d.applyAgeMin!=null && d.applyAgeMax!=null){
                                            return d.applyAgeMin+"至"+ d.applyAgeMax+"岁"
                                        }else if(d.applyAgeMin==null && d.applyAgeMax!=null){
                                            return "小于"+ d.applyAgeMax+"岁"
                                        }else if(d.applyAgeMin!=null && d.applyAgeMin==null){
                                            return "大于"+ d.applyAgeMin+"岁"
                                        }else{
                                            return "不限"
                                        }
                                    }
                                }, {
                                    field: 'applyBimMin',
                                    title: 'BMI',
                                    templet:function (d) {
                                        if(d.applyBimMin!=null && d.applyBimMax!=null){
                                            return d.applyBimMin+"至"+ d.applyBimMax
                                        }else if(d.applyBimMin==null && d.applyBimMax!=null){
                                            return "小于"+ d.applyBimMax
                                        }else if(d.applyBimMin!=null && d.applyBimMax==null){
                                            return "大于"+ d.applyBimMin
                                        }else{
                                            return "不限"
                                        }
                                    }
                                }, {
                                    field: 'souceName',
                                    title: '来源',

                                }, {
                                    align: 'center',
                                    toolbar: '#tableBar',
                                    title: '操作',

                                }]
                            ],
                            response: {

                                statusCode:20000
                                //规定成功的状态码，默认：0

                            },

                            parseData: function (res) { //将原始数据解析成 table 组件所规定的数据

                                // return {
                                //     "code": res.data.code, //解析接口状态
                                //     "msg": res.data.msg, //解析提示文本
                                //     "count": res.data.count, //解析数据长度
                                //     "data": res.data.data
                                // }

                            },done: function(res, curr, count){
								console.log(curr);
                                if(count > insTb.config.limit) {
                                    $(".layui-table-page").show();
                                }else {
                                    $(".layui-table-page").hide();
                                }
                            }

                        });
					}

						table.on('tool(pinggu)', function (obj) { //注：tool是工具条事件名，test是table原始容器的属性 lay-filter="对应的值"
                        var data = obj.data;

                        var layEvent = obj.event;
                        userCode = data.usercode;

                        if (layEvent === 'edit') { // 查看
                            console.log(data);
                            window.location.href="/manage/Intervention/addtemplate?interventionId="+data.interventionId;
                        }
                        if (layEvent === 'modification') { //编辑
                            console.log(data);
                        }
                        if(layEvent === 'del'){//删除
							console.log(data);
                            layer.confirm('你确定要删除吗?', {icon: 3, title:'提示'}, function(index){
                                $.ajax({
                                    type:"POST",
                                    url:'/YhInterventionTemplateController/deletetempdate?interventionId='+data.interventionId,
                                    dataType:"json",
                                    success:function(res){
                                        selectdate();
                                        form.render();
                                    }
                                });
                                layer.close(index);
                            });



						}
                    });

					$("#selectbyconditions").click(function(){
					    data={sourceType:$("#souce").val(),templateDiseases:$("#dis").val(),templateRisk:$("#infoType").val(),templateName:$("#username").val()};
                        selectdate(data);
					});
					$("#btnempty").click(function(){
                        data={};
                        $("#souce").val("");
                        $("#dis").val("");
                        $("#infoType").val("");
                        $("#username").val("");
                        form.render();
                        selectdate(data);
					})
                    $("#addplan").click(function(){
                        window.location.href="/manage/Intervention/addtemplate";
					})
				});
	</script>
</body>

</html>
