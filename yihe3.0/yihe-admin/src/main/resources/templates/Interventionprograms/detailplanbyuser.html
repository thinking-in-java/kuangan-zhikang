<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>干预分组管理</title>


    <link rel="stylesheet"  th:href="@{/assets/libs/layui/css/layui.css}" />
    <link rel="stylesheet"  th:href="@{/assets/module/admin.css}"  />
    <link rel="stylesheet" th:href="@{/assets/css/registramanage.css}"/>
    <!--[if lt IE 9]>
    <script src="https://oss.maxcdn.com/html5shiv/3.7.3/html5shiv.min.js"></script>
    <script src="https://oss.maxcdn.com/respond/1.4.2/respond.min.js"></script>
    <![endif]-->
    <style type="text/css">
        .layui-table-box {
            min-height:500px;
        }
        .ztree{
            max-height:150px !important;
        }
    </style>
</head>
<body>
<!-- 页面加载loading -->
<div class="page-loading">
    <div class="ball-loader">
        <span></span><span></span><span></span><span></span>
    </div>
</div>

<!-- 正文开始 -->
<input id="fenzuming" type="hidden" th:value="${groupname}" >
<input id="fenzuid" type="hidden" th:value="${userCode}" >
<input id="guishu" type="hidden" value="">
<div class="layui-fluid" >
    <div class="layui-card">
        <div class="layui-card-body">
            <div class="layui-form toolbar">
                <div class="layui-form-item">
                    <div class="layui-inline" style="width: 25%">
                    <label style="padding-left: 0px;padding-right: 0px;height:20px" class="layui-form-label w-auto">健康干预计划</label>
                        <div class="layui-input-block" >
                                <input name="times" type="text"
                                       class="layui-input" id="test6" placeholder=" - ">
                        </div>
                    </div>
                    <div class="layui-inline" style="width: 10%;">
                        <div class="layui-input-inline mr0" lay-filter="myDivs" style="width: 100%;">
                            <select   lay-verify="required" id="plans">
                                <option value="">全部</option>
                                <option value="1">电话回访</option>
                                <option value="2">微信聊天回访</option>
                                <option value="3">小程序聊天回访</option>
                                <option value="4">上门回访</option>
                            </select>
                        </div>
                    </div>
                    <div class="layui-inline">
                        <button id="btnSearchAuth" style="background-color: #1890ff" class="layui-btn icon-btn"><i class="layui-icon">&#xe615;</i>搜索
                        </button>
                        <button id="btnempty" style="background-color: #fff;width: 69px;color: black;border: 1px solid #e5e5e5;" class="layui-btn icon-btn"></i>清除</button>
                    </div>
                    <span style="font-size: 15px;float: right;margin-right: 5%;margin-top: 5px" id="taidu">配合态度</span>
                </div>
            </div>
            <!-- 批量操作 -->
            <div id="piliang" class="layui-form toolbar" style="background-color: #e6f7ff;height: 50px;margin-top: 10px;margin-bottom: 10px;display: none">
                <span style="font-size: 14px;color: #505050;line-height: 50px;margin-left: 9px;">批量操作</span>
                <img alt="" src="">
                <span  id="xuanze">已选择**项</span>
                <span id="clickxuan" style="color: #1890ff;margin-left: 15px;">清空</span>
                <button id="zhuanyizhuceka" style="width: 120px;float: right;margin-right: 16px;text-align: center;margin-top: 7px;"  class="layui-btn layui-btn-primary">删除</button>
            </div>
            <table id="tableAuth" lay-filter="tableAuth"></table>
            <div id="page2"></div>
        </div>
    </div>
</div>
<div style=" "></div>
<!-- js部分 -->
<script type="text/html" id="tableBar">
    <a class="layui-btn layui-btn-xs" lay-event="edit">查看</a>
</script>
<script type="text/javascript" th:src="@{/assets/libs/layui/layui.js}"></script>
<script type="text/javascript" th:src="@{/assets/js/common.js}"></script>
<script type="text/html" id="zizeng" th:inline="none">
    {{d.LAY_TABLE_INDEX+1}}
</script>
<script th:inline="none">
    layui.use(['layer', 'form', 'admin', 'treeTable', 'util', 'table','treeSelect','laypage', 'notice', 'laydate'], function () {
        var $ = layui.jquery;
        var layer = layui.layer;
        var form = layui.form;
        var admin = layui.admin;
        var table = layui.table;
        var treeTable = layui.treeTable;
        var util = layui.util;
        var treeSelect= layui.treeSelect;
        var laypage = layui.laypage;
        var notices = layui.notice;
        var laydate = layui.laydate;
        var objs={field: "123", type: "desc"};
        randtreesone();
        function randtreesone(){
            treeSelect.render({
                // 选择器
                elem : '#trees',
                // 数据
                data : '/YhUserMakeCard/showPullDownTree',
                // 异步加载方式：get/post，默认get
                type : 'get',
                // 占位符
                placeholder : '全部',
                // 是否开启搜索功能：true/false，默认false
                search : true,
                // 点击回调
                click : function(d) {
                },
                // 加载完成后的回调函数
                success : function(d) {
                }
            });
        }
        //定义接收本月的第一天和最后一天
        var startDate1=new Date(new Date().setDate(1));
        var endDate1=new Date(new Date(new Date().setMonth(new Date().getMonth()+1)).setDate(0));
        //定义接收上个月的第一天和最后一天
        var startDate2=new Date(new Date(new Date().setMonth(new Date().getMonth()-1)).setDate(1));
        var endDate2=new Date(new Date().setDate(0));
        laydate.render({
            elem : '#test6',
            range : true,
            trigger: 'click',
            extrabtns: [
                {id:'today', text:'今天', range:[new Date(), new Date()]},
                {id:'lastday-7', text:'过去7天', range:[new Date(new Date().setDate(new Date().getDate()-7)),
                        new Date(new Date().setDate(new Date().getDate()-1))]},
                {id:'lastday-30', text:'过去30天', range:[new Date(new Date().setDate(new Date().getDate()-30)),
                        new Date(new Date().setDate(new Date().getDate()-1))]},
                {id:'yesterday', text:'昨天', range:[new Date(new Date().setDate(new Date().getDate()-1)),
                        new Date(new Date().setDate(new Date().getDate()-1))]},
                {id:'thismonth', text:'本月', range:[startDate1,endDate1]},
                {id:'lastmonth', text:'上个月', range:[startDate2,endDate2]}],
            done: function(val, stdate, ovdate){
                //当确认选择时间后调用这里
            }
        });
        table.on('tool(tableAuth)', function (obj) { //注：tool是工具条事件名，test是table原始容器的属性 lay-filter="对应的值"
            var data = obj.data;
            var layEvent = obj.event;
            userCode = data.usercode;
            if (layEvent === 'edit') { // 查看
                window.open("../register/userIndex?page=summary&userCode="+obj.data.user_code+"");
                console.log(obj)
            }
        });
        // 设置全局变量以保存选中行信息
        let ids = new Array();
        // 保存当前页全部数据id，点击全选时使用
        let tableIds = new Array();
        var gdata={userCode:$("#fenzuid").val()}
        getData();
        function getData() {
            table.render({
                elem: '#tableAuth'
                ,url: '/YhGroupIntervention/selectplanbyuser' //数据接口
                ,title: '分组人员'
                ,page:true
                ,where:gdata
                ,parseData: function(res){
                    console.log(res);
                }
                ,cols: [[ //表头
                    {type: 'checkbox', fixed: 'left'},
                    {
                        title: '执行时间',
                        width : 200,
                        align : 'center',
                        templet:function (d) {
                            console.log(d)
                            return ""+d.executeDate.split(" 00:00:00")[0]+""
                        }
                    },

                    {field: 'servicenam', title: '服务方式', align: 'center',width:200},
                    {field: 'counts', title: '计划内容', align: 'center',width:200,
                        templet:function (d) {
                            if(d.counts!=null){
                                return d.counts;
                            }else{
                                return d.var_count;
                            }

                        }},
                    {field: 'countPrompt', title: '内容提示', align: 'center'},
                ]], done: function(res){

                    // 设置当前页全部数据id到全局变量
                    tableIds = res.data.map(function (value) {
                        return value.detailsId;
                    });
                    // 设置当前页选中项
                    $.each(res.data, function (idx, val) {
                        if (ids.indexOf(val.detailsId) > -1) {
                            val["LAY_CHECKED"] = 'true';
                            //找到对应数据改变勾选样式，呈现出选中效果
                            let index = val['LAY_TABLE_INDEX'];
                            $('tr[data-index=' + index + '] input[type="checkbox"]').click();
                            form.render('checkbox'); //刷新checkbox选择框渲染
                        }
                    });
                    // 获取表格勾选状态，全选中时设置全选框选中
                    let checkStatus = table.checkStatus('test');
                    if (checkStatus.isAll) {
                        $('.layui-table-header th[data-field="0"] input[type="checkbox"]').prop('checked', true);
                        form.render('checkbox'); //刷新checkbox选择框渲染
                    }
                }
            });
        }


        $('#zhuanyizhuceka').click(function(){
            layer.confirm('确认要删除吗？', {
                btn : [ '确定', '取消' ]//按钮
            }, function(index) {
                $.ajax({
                    type: "POST",
                    traditional:true,
                    dataType: "json",
                    data:{deleteids:ids,userCode:$("#fenzuid").val()},
                    url: "/YhGroupIntervention/deletesplanbyid",
                    success:function(data){
                        notices.success({
                            title: '消息通知',
                            message: '删除成功'
                        });
                        window.location.reload();
                    }
                })
                layer.close(index);
                console.log(ids)

            });
        })
        table.on('checkbox(tableAuth)', function (obj) {
            console.log(obj)
            if (obj.checked == true) {
                if (obj.type == 'one') {
                    ids.push(obj.data.detailsId);
                } else {
                    for (let i = 0; i < tableIds.length; i++) {
                        //当全选之前选中了部分行进行判断，避免重复
                        if (ids.indexOf(tableIds[i]) == -1) {
                            ids.push(tableIds[i]);
                        }
                    }
                }
            } else {
                if (obj.type == 'one') {
                    let i = ids.length;
                    while (i--) {
                        if (ids[i] == obj.data.detailsId) {
                            ids.splice(i, 1);
                        }
                    }
                } else {
                    let i = ids.length;
                    while (i--) {
                        if (tableIds.indexOf(ids[i]) != -1) {
                            ids.splice(i, 1);
                        }
                    }
                }
            }
            if(ids.length>0){
                $("#piliang").show();
                $("#xuanze").html("已选择"+ids.length+"项")
            }else{
                $("#piliang").hide();
            }
        });
        changeCooperate();
        function changeCooperate(){
            $.ajax({
                type:"POST",
                url:'/YhAcceptserviceController/selectCooperate',
                dataType:"json",
                traditional:true,
                data:{usercode:$('#fenzuid').val()},
                success:function(res) {

                    $("#taidu").html("配合态度:"+(res.data*100)+"%");
                }
            });
        }
        function zhucefenpei(data){
            $.ajax({
                type: "post",
                traditional:true,
                dataType: "json",
                data:{deleteids:ids},
                url: "/YhGroupIntervention/updategroup",
                success:function(data){
                    notices.success({
                        title: '消息通知',
                        message: '修改成功'
                    });
                    window.location.reload();
                }
            })
        }
        $('#clickxuan').click(function(){
            ids=[];
            getData();
            $("#piliang").hide();

        });
        // 搜索
        $('#btnSearchAuth').click(function () {
            var test6 = $('#test6').val();
            var plans = $('#plans').val();
            var usercode = $('#fenzuid').val();
            gdata={times:test6,serviceWay:plans,userCode:usercode}
            getData();
        });
        //iframe层-父子操作

        //清除按钮
        $("#btnempty").click(function(){
            window.location.reload();
        })

    });
</script>
</body>
</html>
