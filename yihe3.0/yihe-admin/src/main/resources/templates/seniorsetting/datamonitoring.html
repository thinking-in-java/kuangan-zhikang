<script type="text/javascript" th:src="@{/assets/libs/layui/layui.js}"></script>

<script>
    layui.use(['layer', 'form', 'laydate', 'notice'], function () {
        var $ = layui.jquery;
        var layer = layui.layer;
        var form = layui.form;
        var laydate = layui.laydate;
        var newdata=null;
        var calldata=null;
        var notice = layui.notice;

        $("#datamonitoring").click(function() {
        	$("#datamonitoring").addClass("tabclick");
        	$("#datamonitoring").removeClass("tab");
        	$("#jindu").addClass("lineclick")
        	$("#jindu2").removeClass("lineclick")
            $("#jindu3").removeClass("lineclick")
        	$("#smalltool").addClass("tab");
        	$("#smalltool").removeClass("tabclick");
            $("#Logo").addClass("tab");
            $("#Logo").removeClass("tabclick");
        	$(".one").removeClass("noclickthistab");
        	$(".two").addClass("noclickthistab");
            $(".three").addClass("noclickthistab");
        });
        $("#smalltool").click(function() {
        	$("#datamonitoring").addClass("tab");
        	$("#datamonitoring").removeClass("tabclick");
        	$("#jindu2").addClass("lineclick")
        	$("#jindu").removeClass("lineclick")
            $("#jindu3").removeClass("lineclick")
        	$("#smalltool").addClass("tabclick");
        	$("#smalltool").removeClass("tab");
            $("#Logo").addClass("tab");
            $("#Logo").removeClass("tabclick");
        	$(".two").removeClass("noclickthistab");
        	$(".one").addClass("noclickthistab");
            $(".three").addClass("noclickthistab");
        });
        $("#Logo").click(function() {
            $("#Logo").addClass("tabclick");
            $("#Logo").removeClass("tab");
            $("#jindu3").addClass("lineclick")
            $("#jindu").removeClass("lineclick")
            $("#jindu2").removeClass("lineclick")
            $("#smalltool").addClass("tab");
            $("#smalltool").removeClass("tabclick");
            $("#datamonitoring").addClass("tab");
            $("#datamonitoring").removeClass("tabclick");
            $(".three").removeClass("noclickthistab");
            $(".one").addClass("noclickthistab");
            $(".two").addClass("noclickthistab");
        });
        // 渲染laydate
        laydate.render({
            elem: '#edtDateFormBas',
            range: true,
            trigger: 'click'
        });

        // 监听表单提交
        form.on('submit(formSubmitBas)', function (data) {
            $.ajax({
           	 type: "post",
                url: "/pagesetting/updatatalldicintro",
                dataType:"json",
                data:data.field,
                success: function(data){
					if(data.code==20000){
						notice.success({
			                title: '提示',
			                message: '操作成功!'
			            });
					}else{
						  notice.error({
				                title: '提示',
				                message: '非常抱歉，修改失败！'
				            });
					}
                }
           	
           });
            return false;
        });

        upload=function(obj){
            console.log(obj.parentNode.children[0].click())
            console.log(1)
        }

         setImg=function(obj){//用于进行图片上传，返回地址
            var f=$(obj).val();
             console.log(obj.parentNode.children[1].dataset.id)
            if(f == null || f ==undefined || f == ''){
                return false;
            }
            if(!/\.(?:png|jpg|bmp|gif|PNG|JPG|BMP|GIF)$/.test(f))
            {
                alertLayel("类型必须是图片(.png|jpg|bmp|gif|PNG|JPG|BMP|GIF)");
                $(obj).val('');
                return false;
            }
            var data = new FormData();
            $.each($(obj)[0].files,function(i,file){
                data.append('file', file);
            });
            $.ajax({
                type: "POST",
                url: "/Uploading/upload2",
                data: data,
                cache: false,
                contentType: false,    //不可缺
                processData: false,    //不可缺
                dataType:"json",
                success: function(suc) {
                    console.log(suc);
                    if(suc.code==0){
                        console.log(obj.parentNode.children[1].src=suc.data.src)
                        var datess={"code":obj.parentNode.children[1].dataset.id,"explain":suc.data.src,"type":3}
                        changeimg(datess)
                        $("#thumbUrl").val(suc.message);//将地址存储好
                        $("#thumburlShow").attr("src",suc.message);//显示图片
                    }else{
                        alertLayel("上传失败");
                        $("#url").val("");
                        $(obj).val('');
                    }
                },
                error: function(XMLHttpRequest, textStatus, errorThrown) {
                    alertLayel("上传失败，请检查网络后重试");
                    $("#url").val("");
                    $(obj).val('');
                }
            });
        }

        function changeimg(date){
            $.ajax({
                type: "POST",
                url: "/pagesetting/updatatalldicintro",
                data: date,
                dataType:"json",
                success: function(suc) {
                    console.log(suc);

                }
            });
        }
    });
</script>
