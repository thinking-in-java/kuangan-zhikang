<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>制卡</title>
    <link rel="stylesheet"  th:href="@{/assets/libs/layui/css/layui.css}" />
    <link rel="stylesheet"  th:href="@{/assets/module/admin.css}"  />
    <!--[if lt IE 9]>
    <script src="https://oss.maxcdn.com/html5shiv/3.7.3/html5shiv.min.js"></script>
    <script src="https://oss.maxcdn.com/respond/1.4.2/respond.min.js"></script>
    <![endif]-->
</head>
<body>
<!-- 页面加载loading -->
<div class="page-loading">
    <div class="ball-loader">
        <span></span><span></span><span></span><span></span>
    </div>
</div>
<a id="clicksetting" target="_self" style="display: none" href="/manage/register/makecard" lay-text="制卡信息管理">"制卡信息管理"</a>
<!-- 正文开始 -->
<input id="guishu" type="hidden" value="">
<div class="layui-fluid">
	<div style="width: 98%;height: 590px;background-color: #FFF; position:relative;">
    <div style="position: absolute;width: 120px;height: 30px;margin-top:25px; margin-left: 34px;font-size: 20px;line-height: 150%;text-align: left;font-weight: bold;">制卡</div>
    <div style="position: absolute;margin-top: 110px;margin-left: 20px">
    	 <div class="layui-card-body" style="width: 900px;">
            <form class="layui-form" style="max-width: 800px;">
			 <div class="layui-form-item">
                    <label style="padding-right: 0px;" class="layui-form-label w-auto layui-form-required">数量:</label><br/><br/>
                    <div id="xianzhi" class="layui-input-block" style="margin-left:65px;width: 250px;">
                    <input id="count" type="number" value="100" class="layui-input" lay-verify="count" required/>
                    </div>
              </div>



                    <div class="layui-form-item">
                        <label style="padding-right: 0px;" class="layui-form-label w-auto layui-form-required">健管师</label><br/><br/>
                <div class="layui-input-inline mr0" lay-filter="myDivs" style="margin-left:65px;">
                    <select id="doctors"    lay-search="">

                    </select>
                </div>
                    </div>


                   <div class="layui-inline">
                         <div class="layui-form-item">
                          <label style="padding-right: 0px;" class="layui-form-label w-auto layui-form-required">归属：</label><br/><br/>
         				 	 <div class="layui-input-block" style="margin-left:65px;width: 250px;">
               					<input  type="text" id="tree" lay-filter="tree" class="layui-input"  required/>
          					 </div>
      					 </div>
                    </div>
                  <div class="layui-form-item">
                    <label  style="padding-right: 0px;" class="layui-form-label w-auto">描述:</label><br/><br/>
                    <div class="layui-input-block" style="margin-left:65px;width: 1050px;height: 125px;">
                        <textarea id="miaoshu" style="height: 123px"  name="miaoshu" placeholder="填写制卡描述信息，最大限制500个字符" class="layui-input"></textarea>
                    </div>
                </div>
		           <div class="layui-form-item">
                    <div class="layui-input-block" >
                        <button style="background-color:#2a9ce4" class="layui-btn" lay-filter="formSubmitBas" lay-submit>&emsp;保存&emsp;</button>
                        <button type="reset" onclick="quxiao()" class="layui-btn layui-btn-primary">&emsp;取消&emsp;</button>
                    </div>
                </div>
            </form>

        </div>
    </div>
    </div>
</div>
<script type="text/javascript" th:src="@{/assets/libs/layui/layui.js}"></script>
<script type="text/javascript" th:src="@{/assets/js/common.js}"></script>
<script th:inline="none">
    layui.use(['layer', 'form', 'laydate','treeSelect', 'notice'], function () {
        var $ = layui.jquery;
        var layer = layui.layer;
        var form = layui.form;
        var laydate = layui.laydate;
        var treeSelect= layui.treeSelect;
        var notice = layui.notice;
        var newdata=null;
        var calldata=null;
        quxiao=function(){
        	document.getElementById("clicksetting").click();
        }
        randedoctor();
        function randedoctor(){
            $.ajax({
                type: "GET",
                url: "/YhUserSetting/selectalldoc",
                dataType: "json",
                success:function(data){
                    console.log(data);
                    var htmld="";
                    htmld+="<option value=''>请选择</option>";
                    var item=data.data;
                    for (var i = 0; i < item.length; i++) {
                        htmld+="<option value="+item[i].id+">"+item[i].name+"("+item[i].username+")</option>";
                    }
                    $('#doctors').append(htmld);
                    form.render();
                }

            })
        }
        // 渲染laydate
        laydate.render({
            elem: '#edtDateFormBas',
            range: true,
            trigger: 'click'
        });
        treeSelect.render({
            // 选择器
            elem: '#tree',
            // 数据
            data: '/YhOrgTree/showPullDownTree',
            // 异步加载方式：get/post，默认get
            type: 'get',
            // 占位符
            placeholder: '全部',
            // 是否开启搜索功能：true/false，默认false
            search: true,
            // 点击回调
            click: function(d){
                $('#guishu').val(d.current.id);
            },
            // 加载完成后的回调函数
            success: function (d) {
                console.log(d);
            }
        });
        $("#xianzhi").click(function(){
     	   var count=$("#count").val();
     	   if(count<0){
     		   $("#count").val(0);
     	   }
        })
      	$("#count").blur(function(){
      		 var count=$("#count").val();
       	   if(count<0){
       		   $("#count").val(0);
       	   }
      	})
      	form.verify({
  //数组的两个值分别代表：[正则匹配、匹配不符时的提示文字]
		  count:function(value){
			  if(value==null || value ==0){
				  return '数量不能为空';
			  }
		  }
		});
        // 监听表单提交
        form.on('submit(formSubmitBas)', function (data) {
           var count=$("#count").val();
           var guishu=$("#guishu").val();
           var miaoshu=$("#miaoshu").val();
           var doctors=$("#doctors").val();
           if($("#guishu").val()==""){
        	   notice.msg('归属不能为空', {icon: 3});
           }else if(miaoshu.length>500){
        	   notice.msg('描述信息不能大于500个字', {icon: 3});
           }else{

        	   var loading = layer.msg('正在制卡，请稍后', {icon: 16, shade: 0.3, time:0});
               var cast={"count":count,"Org_code":guishu,"miaoshu":miaoshu,"doctor":doctors}
               //calldata.yhjzsyssms=null;
               $.ajax({
              	 type: "post",
                   url: "/yhmakecardinfo/makecard",
                   dataType:"json",
                   data:cast,
                   success: function(data){
                	   layer.close(loading);
   					if(data.code==20000){
   						layer.msg("制卡成功", {icon: 1});
   						quxiao();
   					}else{
   						layer.msg("制卡失败", {icon: 2}); 
   					}
                   }   	
              });
           }
  
            return false;
        });
        var rObj = document.getElementsByName('type');
        quxiao=function(){
        	document.getElementById("clicksetting").click();
        }
        
    });
</script>
</body>
</html>
