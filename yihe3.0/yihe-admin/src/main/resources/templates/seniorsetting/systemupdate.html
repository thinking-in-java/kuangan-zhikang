<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>文件储存配置</title>
    <link rel="stylesheet"  th:href="@{/assets/libs/layui/css/layui.css}" />
    <link rel="stylesheet"  th:href="@{/assets/module/admin.css}"  />
    <!--[if lt IE 9]>
    <script src="https://oss.maxcdn.com/html5shiv/3.7.3/html5shiv.min.js"></script>
    <script src="https://oss.maxcdn.com/respond/1.4.2/respond.min.js"></script>
    <![endif]-->
    <style type="text/css">
    	
    .layui-form-labels{
		   	float: left;
		    display: block;
		    font-weight: 400;
		    line-height: 20px;
		    text-align: right;
		    padding: 9px 15px;
    	}
    	
    </style>
</head>
    <style type="text/css">
        display{
        	display: none;
        }
        displayblo{
        	display: block;
        }
    </style>
<body>
<!-- 页面加载loading -->
<div class="page-loading">
    <div class="ball-loader">
        <span></span><span></span><span></span><span></span>
    </div>
</div>
<a id="clicksetting" target="_self" style="display: none" href="/manage/setting/systemupdate" lay-text="系统升级通知">"系统升级通知"</a>
<!-- 正文开始 -->
<div class="layui-fluid">
	<div style="width: 1252px;height: 598px;background-color: #FFF; position:relative;">
    <div style="position: absolute;margin-left: 20px">
    	 <div class="layui-card-body" style="width: 900px;">
            <form class="layui-form" style="max-width: 800px;">
				<div class="layui-form-item" style="display: none">
                    <label style="width: 80px" class="layui-form-label layui-form-required">id:</label>
                    <div class="layui-input-block">
                        <input type="text" id="update_id" name="update_id" placeholder="请填写" class="layui-input"
                               lay-verType="tips"/>
                    </div>
                </div>
                <div class="layui-form-item" style="margin-top: 20px">
                        <div class="layui-inline" style="width: 900px">
      						<label  class="layui-form-labels layui-form-required">开始时间：</label>
      						<div class="layui-input-inline" style="width: 300px;">
        						<input type="text" name="date1" class="layui-input" id="test1" placeholder="yyyy-MM-dd HH:mm:ss" style="float: left;"   lay-verify="kaishi" required>
      						</div>
      						
   					 	</div>
                </div>
                 <div class="layui-form-item" style="margin-top: 20px">
                        <div class="layui-inline " style="width: 900px">
      						<label class="layui-form-labels layui-form-required">结束时间：</label>
      						<div class="layui-input-inline " style="width: 300px;">
        						<input type="text" name='date2' class="layui-input" id="test3" placeholder="yyyy-MM-dd" style="float: left;" lay-verify="jieshu" required>
      						</div>
      						
   					 	</div>
                </div>
                  <div class="layui-form-item" style="margin-top: 20px;">
                    <label   class="layui-form-label layui-form-required">标题：</label>
                    <div class="layui-input-block">
                        <input type="text" id="update_title" name="update_title" placeholder="请填写" class="layui-input"
                               lay-verify="biaoti" required/>
                    </div>
                </div>
                 <div class="layui-form-item" style="margin-top: 20px;">
                    <label  class="layui-form-label layui-form-required">内容：</label>
                    <div class="layui-input-block">
                        <textarea id="update_content"  name="update_content" placeholder="请填写" class="layui-input"
                                style="height: 170px;width: 700px;" lay-verify="neirong" required></textarea>
                    </div>
                </div>
		           <div class="layui-form-item">
                    <div class="layui-input-block">
                        <input id="baocun" type="button" style="background-color:#2a9ce4" class="layui-btn " value="保存草稿" >
                        <button type="reset" onclick="quxiao()" class="layui-btn layui-btn-primary">&emsp;取消&emsp;</button>
                         <button id="liji" style="background-color:#2a9ce4;float: right;" class="layui-btn" lay-filter="formSubmitBasfabu" lay-submit>&emsp;立即发布&emsp;</button>
                         <button id="chexiao" style="background-color:#a6a6a6;float: right;" class="layui-btn " lay-filter="formSubmitBaschexiao" lay-submit>&emsp;撤销发布&emsp;</button>
                    </div>
                </div>
            </form>

        </div>
    </div>
    </div>
</div>
<script type="text/javascript" th:src="@{/assets/libs/layui/layui.js}" ></script>
<script type="text/javascript" th:src="@{/assets/js/common.js}" ></script>
<script>
    layui.use(['layer', 'form', 'laydate'], function () {
        var $ = layui.jquery;
        var layer = layui.layer;
        var form = layui.form;
        var laydate = layui.laydate;
        var newdata=null;
        var calldata=null;
        
        // 监听表单提交
        form.on('submit(formSubmitBaschexiao)', function (data) {
          var date={"update_id":data.field.update_id}
          $.ajax({
         	 type: "post",
              url: "/YhSystemUpdateController/updatechexiao",
              dataType:"json",
              data:date,
              success: function(data){
             	   window.location.reload();
              }
         	
         });
        });
    	form.verify({
      	  //数组的两个值分别代表：[正则匹配、匹配不符时的提示文字]
      			  	kaishi:function(value){
      				  if(value==null || value ==0 || value==""){
      					  return "开始时间不能为空";
      				  }
      			  },
	        			jieshu:function(value){
	      				  if(value==null || value ==0 || value==""){
	      					  return "结束时间不能为空";
	      				  }
	      			  },
    					biaoti:function(value){
      				  if(value==null || value ==0 || value==""){
      					  return "标题不能为空";
      				  }
      			  },
      			 	neirong:function(value){
      				  if(value==null || value ==0 || value==""){
      					  return "内容不能为空";
      				  }
      			  }
      			});
        // 监听表单提交
        form.on('submit(formSubmitBasfabu)', function (data) {
        	console.log(data);
        		
        	  var date1=data.field.date1
              date1 = new Date(date1);
              var date2=data.field.date2
               date2 = new Date(date2);
              var date={"update_begintime":date1,"update_endtime":date2,"update_title":data.field.update_title,"update_content":data.field.update_content,"update_id":data.field.update_id}
          $.ajax({
         	 type: "post",
              url: "/YhSystemUpdateController/formSubmitBasfabu",
              dataType:"json",
              data:date,
              success: function(data){
             	   window.location.reload();
              }
         	
         });
        });
        $("#baocun").click(function(){
        	var date={"update_begintime":new Date($("#test1").val()),"update_endtime":new Date($("#test3").val()),"update_title":$("#update_title").val(),"update_content":$("#update_content").val(),"update_id":$("#update_id").val()}
        	$.ajax({
           	 type: "post",
                url: "/YhSystemUpdateController/updatedate",
                dataType:"json",
                data:date,
                success: function(data){
               	   window.location.reload();
                }
           	
           });
        })
        // 监听表单提交
        form.on('submit(formSubmitBasbaocun)', function (data) {
          var date1=data.field.date1
          date1 = new Date(date1);
          var date2=data.field.date2
           date2 = new Date(date2);
          var date={"update_begintime":date1,"update_endtime":date2,"update_title":data.field.update_title,"update_content":data.field.update_content,"update_id":data.field.update_id}
          $.ajax({
            	 type: "post",
                 url: "/YhSystemUpdateController/updatedate",
                 dataType:"json",
                 data:date,
                 success: function(data){
                	   window.location.reload();
                 }
            	
            });
          function getDates(strDate) { 
        	  var st = strDate; 
        	  var a = st.split(" "); 
        	  var b = a[0].split("-"); 
        	  var c = a[1].split(":"); 
        	  var date = new Date(b[0], b[1], b[2], c[0], c[1], c[2]);
        	  return date; 
        	} 
        });
        $.ajax({
       	 type: "post",
            url: "/YhSystemUpdateController/selectsystemupdate",
            dataType:"json",
            success: function(data){
            	if(data.data!=null){
            	var time1=data.data.update_begintime.trim().split(" ");
            	var time2=data.data.update_endtime.trim().split(" ");
				console.log(data);
                // 渲染laydate
                var startTime=laydate.render({
                    elem: '#test1',
                    type:'datetime',
                    trigger: 'click',
                    btns:['clear','confirm'],
                    max:data.data.update_endtime,
                  	value:data.data.update_begintime,
                  	done: function(value,date){
                		        //当确认选择时间后调用这里
                		 endTime.config.min={    	    		
                    	    	year:date.year,
                    	    	month:date.month-1,//关键
                                date:date.date,
                                hours:date.hours,
                                minutes:date.minutes,
                                seconds:date.seconds
                    	    };
               		}
                });
    
                var endTime =laydate.render({
                    elem: '#test3',
                    type:'datetime',
                    trigger: 'click',
                    min: data.data.update_begintime,
                	value:data.data.update_endtime,
                	  done: function(value,date){
                  		   startTime.config.max={
                	    		year:date.year,
                    	    	month:date.month-1,//关键
                                date:date.date,
                                hours:date.hours,
                                minutes:date.minutes,
                                seconds:date.seconds
                	    }
                 		}
                });
                
                $("#update_title").val(data.data.update_title)
                 $("#update_content").val(data.data.update_content)
                  $("#update_id").val(data.data.update_id)
				if(data.data.state==1){
            		
            		$("#liji").css("display","none");
            		$("#chexiao").css("display","block");
            		
            	}else {
            		$("#liji").css("display","block");
            		$("#chexiao").css("display","none");
            	}
            }else{
            	$("#liji").css("display","block");
        		$("#chexiao").css("display","none");
            }
            
            }
       	
       });
       
        quxiao=function(){
        	document.getElementById("clicksetting").click();
        }
        
    });
</script>
</body>
</html>
