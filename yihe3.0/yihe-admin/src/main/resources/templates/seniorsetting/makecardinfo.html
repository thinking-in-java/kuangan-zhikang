<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>制卡信息管理</title>
    <link rel="stylesheet"  th:href="@{/assets/libs/layui/css/layui.css}" />
    <link rel="stylesheet"  th:href="@{/assets/module/admin.css}"  />
    <link rel="stylesheet" th:href="@{/assets/css/registramanage.css}"/>
    <!--[if lt IE 9]>
    <script src="https://oss.maxcdn.com/html5shiv/3.7.3/html5shiv.min.js"></script>
    <script src="https://oss.maxcdn.com/respond/1.4.2/respond.min.js"></script>
    <![endif]-->
    
    <style type="text/css">
    	.layui-table-box {
		 	min-height:500px;
		}
    </style>
</head>
<body>
<!-- 页面加载loading -->
<div class="page-loading">
    <div class="ball-loader">
        <span></span><span></span><span></span><span></span>
    </div>
</div>
<a id="clicksetting" target="_self" style="display: none" href="/manage/register/tomakecard" lay-text="制卡">"制卡"</a>
<!-- 正文开始 -->
<input id="guishu" type="hidden" value="">
<div class="layui-fluid" >
    <div class="layui-card">
        <div class="layui-card-body">
            <div class="layui-form toolbar">
                <div class="layui-form-item">
                    <div class="layui-inline">
                         <div class="layui-form-item">
                          <label style="padding-right: 0px;padding-left: 0px;margin-left: 0px;" class="layui-form-label w-auto">归属：</label>
         				 	 <div class="layui-input-block" style="margin-left:45px;width: 300px;">
               					<input  type="text" id="tree" lay-filter="tree" class="layui-input">
          					 </div>
      					 </div>
                    </div>
                    <div class="layui-inline">
                        <label style="padding-left: 0px;padding-right: 0px;" class="layui-form-label w-auto">制卡日期：</label>
                        <div class="layui-input-inline mr0" lay-filter="myDivs" style="width: 300px;">
                            <input id="test10"  type="text"  lay-filter="tree" class="layui-input">
                        </div>
                    </div>


                    <div class="layui-inline">
                        <button   data-type="reload" onclick="solo()" style="background-color: #1890ff" class="layui-btn icon-btn"><i class="layui-icon">&#xe615;</i>搜索</button>
                        <button id="btnAddAuth"  onclick="qingchu()" style="background-color: #fff;width: 69px;color: black;border: 1px solid #e5e5e5;" class="layui-btn icon-btn">清除</button>
                       
                    </div>
                     <button id="btnSearchAuth" onclick="zhika()" style="float: right;margin-left: 15px;" class="layui-btn icon-btn"><i class="layui-icon">&#xe654;</i>制卡</button>
                </div>
            </div>
            <table id="tableAuth" lay-filter="member"></table>
            <div id="page2"></div>
        </div>
    </div>
</div>
<div style=" "></div>
<!-- js部分 -->
<script type="text/javascript" th:src="@{/assets/libs/layui/layui.js}"></script>
<script type="text/javascript" th:src="@{/assets/js/common.js}"></script>

<script th:inline="none">
    layui.use(['layer', 'form', 'admin', 'treeTable', 'util', 'table','treeSelect','laypage', 'notice','laydate'], function () {
        var $ = layui.jquery;
        var layer = layui.layer;
        var form = layui.form;
        var laydate = layui.laydate;
        var admin = layui.admin;
        var table = layui.table;
        var treeTable = layui.treeTable;
        var util = layui.util;
        var treeSelect= layui.treeSelect;
        var laypage = layui.laypage;
        var notices = layui.notice;
        //时间控件

        	laydate.render({
        		  elem: '#test10'
        		  ,type: 'datetime'
        		  ,range: true,
                trigger: 'click'
        		}); 
		//清除
		qingchu=function(){
			$("#guishu").val("");
			$("#test10").val("");
			$('#tree').siblings().remove();
			randtreesone();
		    table.reload('finde', {
	               where: { //设定异步数据接口的额外参数，任意设
	               'guishu':$("#guishu").val(),
	               'dates':$("#test10").val()
	              }
	             });
		}
        //查询
        solo= function(){
            table.reload('finde', {
               where: { //设定异步数据接口的额外参数，任意设
               'guishu':$("#guishu").val(),
               'dates':$("#test10").val()
              }
             });
            
           }
        zhika=function(){
        	document.getElementById("clicksetting").click();
        }
        randtreesone();
        function randtreesone(){
            treeSelect.render({
                // 选择器
                elem: '#tree',
                // 数据
                data: '/YhOrgTree/showPullDownTree',
                // 异步加载方式：get/post，默认get
                type: 'get',
                // 占位符
                placeholder: '全部',
                // 是否开启搜索功能：true/false，默认false
                search: true,
                // 点击回调
                click: function(d){
                    $('#guishu').val(d.current.id);
                },
                // 加载完成后的回调函数
                success: function (d) {
                    console.log(d);
                }
            });
        }

   
        table.render({
            elem: '#tableAuth'
            ,url: '/yhmakecardinfo/usermakecardlog' //数据接口
            ,title: '制卡信息'
            ,id:'finde'
            ,page: true
            ,limit:20
            ,limits:[5,10,20,50,100]
            ,count:10
            ,cols: [[ //表头
            	{type:'numbers', title:'序号', align: 'center'},
              {field: 'marke_Ttime', title: '制卡时间', width: 250, align: 'center',templet:function(d){return util.toDateString(d.commPosttime*1000, "yyyy-MM-dd HH:mm:ss");}},
              {field: 'org_Name', title: '归属客户', width: 300},
              {field: 'marke_Amount', title: '制卡数量', width: 100},
              {field: 'remaining', title: '剩余数量', align: 'center', width: 150},
              {field: 'begin_Number', title: '编码始于', align: 'center'},
              {field: 'end_Number', title: '编码止于', align: 'center'}
            ]], done: function(res, curr, count){
          	        if(count > 20) {
          	        	$(".layui-table-page").show();
          	        }else {
          	        	$(".layui-table-page").hide();
          	        }
          	      
            }
          });
    });
</script>
</body>
</html>
