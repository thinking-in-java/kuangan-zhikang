        function getData(page,guishu,yishi,state,name,paixuming,fangfa,states) {

            elem: '#tableAuth'
            ,url: '/YhUserSetting/selectrefincard' //数据接口

            ,initSort:objs
            ,where:{

            	 limit:20,
            	 guishu:guishu,
            	 yishi:yishi,
            	 state:state,
            	 name:name,
            	 paixuming:paixuming,
            	 fangfa:fangfa,
                states:states
            },parseData: function(res){
				var boolenhave=false;
				nowpagedata= res.data;
				if(fenyeshuju==null){
					fenyeshuju= res.data;
				}else{
					for (var i = 0; i < res.data.length; i++) {
						for (var j = 0; j < fenyeshuju.length; j++) {
							if(fenyeshuju[j].enrolCardId==res.data[i].enrolCardId){
								boolenhave=true
							}
						}
					}
					if(boolenhave==false){
						for (var i = 0; i < res.data.length; i++) {
							fenyeshuju.push(res.data[i]);
						}
					}else{
						for (var i = 0; i < fenyeshuju.length; i++) {
							for (var j = 0; j < res.data.length; j++) {
								if(fenyeshuju[i].enrolCardId==res.data[j].enrolCardId){
									res.data[j]['LAY_CHECKED']=fenyeshuju[i].checked;
								}
							}
						}
					}
				}

                          '<span class="layui-badge layui-badge-gray">未用</span>',
                          '<span class="layui-badge layui-badge-gray">待激活</span>',
                      ];
                      if((d.userName==null||d.userName=="")&&(d.key==null||d.key=="")){

                      }else{
