<!DOCTYPE html>

<html lang="zh" xmlns:th="http://www.thymeleaf.org"
      xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
    <head>
        <meta charset="utf-8"/>
        <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
        <meta name="viewport"
              content="width=device-width, initial-scale=1, maximum-scale=1">
        <title>医生控制台</title>
        <link rel="stylesheet" th:href="@{/assets/libs/layui/css/layui.css}"/>
        <link rel="stylesheet" th:href="@{/assets/module/admin.css}"/>
        <!--[if lt IE 9]>
                <script src="https://oss.maxcdn.com/html5shiv/3.7.3/html5shiv.min.js"></script>
                <script src="https://oss.maxcdn.com/respond/1.4.2/respond.min.js"></script>
        <![endif]-->
                <style>

                    .layui-layout-admin .layui-body{
                        bottom: 0px;
                    }
                    .layui-show {
                        height: 100%;
                    }
                    .layui-fluid{
                        padding: 0px;
                    }
                </style>
            </head>
            <body>
                <div class="layui-tab layui-tab-brief" lay-filter="docDemoTabBrief">
                    <ul class="layui-tab-title">


                    </ul>
                    <div class="layui-tab-content">

                    </div>
                </div>
            </body>
            <!-- js部分 -->
    <script type="text/javascript" th:src="@{/assets/libs/layui/layui.js}"></script>
    <script type="text/javascript" th:src="@{/assets/js/common.js}"></script>
    <script th:src="@{/assets/libs/echarts/echarts.min.js}"></script>
    <script th:src="@{/assets/libs/echarts/echartsTheme.js}"></script>
    <script th:inline="javascript">


        /*<![CDATA[*/
        layui.use(['element', 'layer'], function () {
            var element = layui.element;
            var $ = layui.jquery;
            var layer = layui.layer;

            // element.render('docDemoTabBrief');
            var tabblist=[[${yhUserPermissions}]]
            console.log(tabblist);
            //触发事件
            var active = {
                //在这里给active绑定几项事件，后面可通过active调用这些事件
                tabAdd: function(url,id,name) {
                    //新增一个Tab项 传入三个参数，分别对应其标题，tab页面的地址，还有一个规定的id，是标签中data-id的属性值
                    //关于tabAdd的方法所传入的参数可看layui的开发文档中基础方法部分
                    element.tabAdd('docDemoTabBrief', {
                        title: name,
                        content: '<iframe data-frameid="'+id+'"  style="border: 0px #fff;" src="'+url+'" height="100%" width="100%"></iframe>',
                        id: id //规定好的id
                    })
                    element.render('tab');

                },
                tabChange: function(id) {
                    //切换到指定Tab项
                    element.tabChange('demo', id); //根据传入的id传入到指定的tab项
                },



            };

            //账号管理联动跳转
            $(document).ready(function (){
                var parent$ = window.layui.jquery;
                var query = window.location.search.substring(1);
                var vars = query.split("?");

                if(vars == "id=1031&tianzhuan=2"){
                    setTimeout(function(){
                        parent$(".layui-tab-title li").each(function() {
                            var li = $(this).text();

                            // var spa = $(this).html();
                            if(li=="账号管理"){
                                $(this).click();
                            }
                        })
                        // $(".layui-tab-title li:nth-of-type(2)").click()
                    },1);


                }
                if(vars == "id=1020&xuanze=2"){
                    setTimeout(function(){
                        parent$(".layui-tab-title li").each(function() {
                            var li = $(this).text();
                            // var spa = $(this).html();
                            if(li=="沟通管理"){
                                $(this).click();
                            }
                        })
                        // $(".layui-tab-title li:nth-of-type(2)").click()
                    },1);


                }

            });



            $.each(tabblist,function (a,b) {

                active.tabAdd(b.uri, b.permissionId,b.name);
            });
            FrameWH();
            function FrameWH() {
                var h = $(window).height() - 100;
                $("iframe").css("height", h + "px");
            }
            $(window).resize(function () {
                FrameWH();
            });
            element.tabChange('docDemoTabBrief',tabblist[0].permissionId)
            element.render('nav')

        });
        /*]]>*/
    </script>

</html>
