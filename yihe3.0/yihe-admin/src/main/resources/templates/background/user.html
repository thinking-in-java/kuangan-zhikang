<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>用户管理</title>
    <link rel="stylesheet"  th:href="@{/assets/libs/layui/css/layui.css}" />
    <link rel="stylesheet"  th:href="@{/assets/module/admin.css}"  />
    
</head>
<body>
<!-- 页面加载loading -->
<div class="page-loading">
    <div class="ball-loader">
        <span></span><span></span><span></span><span></span>
    </div>
</div>
<!-- 正文开始 -->
<div class="layui-fluid">
    <div class="layui-card">
        <div class="layui-card-body table-tool-mini full-table">
            <div class="layui-form toolbar">
                <div class="layui-form-item">
                    <div class="layui-inline">
                        <label class="layui-form-label w-auto">编&emsp;号：</label>
                        <div class="layui-input-inline mr0">
                            <input id="userCode" name="username" class="layui-input" type="text" placeholder="输入账号"/>
                        </div>
                    </div>
                    <div class="layui-inline">
                        <label class="layui-form-label w-auto">账号：</label>
                        <div class="layui-input-inline mr0">
                            <input id="username" name="nickName" class="layui-input" type="text" placeholder="输入用户名"/>
                        </div>
                    </div>
                    <div class="layui-inline">
                        <label class="layui-form-label w-auto">性&emsp;别：</label>
                        <div class="layui-input-inline mr0">
                            <select id="sex" name="sex">
                                <option value="">选择性别</option>
                                <option value="1">男</option>
                                <option value="2">女</option>
                            </select>
                        </div>
                    </div>
                    <div class="layui-inline" style="padding-right: 110px;">
                        <button class="layui-btn icon-btn" data-type="reload" lay-submit>
                            <i class="layui-icon">&#xe615;</i>搜索
                        </button>
                       <!--  <button id="btnAddUser" class="layui-btn icon-btn"><i class="layui-icon">&#xe654;</i>添加</button> -->
                    </div>
                </div>
            </div>

            <table id="tableUser" lay-filter="tableUser"></table>
        </div>
    </div>
</div>

<!-- 表格操作列 -->
<script type="text/html" id="tableBarUser"  th:inline="none">
    <a class="layui-btn layui-btn-primary layui-btn-xs" lay-event="edit">修改</a>
    <a class="layui-btn layui-btn-danger layui-btn-xs" lay-event="del">删除</a>
    
</script>
<!-- <a class="layui-btn layui-btn-xs" lay-event="reset">重置密码</a> -->
<!-- 表格状态列 -->
<script type="text/html" id="tableStateUser"  th:inline="none">
    <input type="checkbox" lay-filter="ckStateUser" value="{{d.userCode}}" lay-skin="switch"
           lay-text="正常|锁定" {{d.state==0?'checked':''}}/>
</script>
<!-- 表单弹窗 -->
<script type="text/html" id="modelUser"  th:inline="none">
    <form id="modelUserForm" lay-filter="modelUserForm" class="layui-form model-form">
        <input name="userCode" type="hidden"/>

        <div class="layui-form-item">
            <label class="layui-form-label layui-form-required">账号</label>
            <div class="layui-input-block">
                <input name="userName" placeholder="请输入账号" type="text" class="layui-input" maxlength="20"
                       lay-verType="tips" lay-verify="required" required/>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label layui-form-required">性别</label>
            <div class="layui-input-block">
                <input type="radio" name="gender" value="1" title="男" checked/>
                <input type="radio" name="gender" value="2" title="女"/>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label layui-form-required">角色</label>
            <div class="layui-input-block">
                <select name="roleId" lay-verType="tips" lay-verify="required">
                    <option value="1">管理员</option>
					<option value="20">机构管理员</option>
 					<option value="19">健管师</option>
 					<option value="17">普通用户</option>
                </select>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label layui-form-required">生日</label>
            <div class="layui-input-block">
                <input id="birthDate" name="ber"  type="text" class="layui-input test-item"   maxlength="20"
                       lay-verType="tips" lay-verify="required" required/>
            </div>
        </div>
			
        <div class="layui-form-item">
            <label class="layui-form-label layui-form-required">邮件</label>
            <div class="layui-input-block">
                <input name="email"  type="text" class="layui-input"   maxlength="20"
                       lay-verType="tips" lay-verify="required" required/>
            </div>
        </div>	
        <div class="layui-form-item text-right">
            <button class="layui-btn layui-btn-primary" type="button" ew-event="closePageDialog">取消</button>
            <button class="layui-btn" lay-filter="modelSubmitUser" lay-submit>保存</button>
        </div>
    </form>
</script>

<!-- js部分 -->
<script type="text/javascript" th:src="@{/assets/libs/layui/layui.js}"></script>
<script type="text/javascript" th:src="@{/assets/js/common.js}"></script>
<script th:inline="none">
    layui.use(['layer', 'form', 'table', 'util', 'admin', 'laydate'], function () {
        var $ = layui.jquery;
        var layer = layui.layer;
        var form = layui.form;
        var table = layui.table;
        var util = layui.util;
        var admin = layui.admin;
        var laydate = layui.laydate;
        
        // 渲染表格
        var insTb = table.render({
            elem: '#tableUser',
            url: '/manage/user/selectuser',
            page: true,
            toolbar: true,
            cellMinWidth: 100,
            id:'textload',
            
            cols: [[
                {type: 'numbers'},
                {field: 'userCode', sort: true, title: '编号'},
                {field: 'userName', sort: true, title: '账号'},
                {field: 'role', sort: true, templet: function (d) {
                	console.log(d);
                    return d.yhuserrole.roleName==null?"无":d.yhuserrole.roleName;
                },title: '角色名'},
                {field: 'gender', sort: true,templet: function (d) {
                    return d.gender==1?"男":"女";
                }, title: '性别'},
                {
                    field: 'reg_time', sort: true, templet: function (d) {
                        return util.toDateString(d.reg_time);
                    }, title: '注册时间'
                },
                {align: 'center', toolbar: '#tableBarUser', title: '操作', minWidth: 200}
            ]]
            
          
       
        });



        // 添加
        $('#btnAddUser').click(function () {
            showEditModel();
        });

        // 搜索
        form.on('submit(formSubSearchUser)', function (data) {
        	console.log(data.field)
            
        });
        var   active = {
        	    reload: function(){
        	      var userCode = $('#userCode');
        	      var username= $('#username');
        	      var sex=$('#sex');
        	      //执行重载
        	      table.reload('textload', {
        	        page: {
        	          curr: 1 //重新从第 1 页开始
        	        }
        	        ,where: {
        	          //key: {
        	        	  userCode: userCode.val(),
        	        	  userName:username.val(),
        	        	  gender:sex.val()
        	         // }
        	        }
        	      }, 'data');
        	    }
        	  };

        // 工具条点击事件
        table.on('tool(tableUser)', function (obj) {
            var data = obj.data;
            var layEvent = obj.event;
            if (layEvent === 'edit') { // 修改
                showEditModel(data);
            } else if (layEvent === 'del') { // 删除
                doDel(data.userCode, data.userName);
            } else if (layEvent === 'reset') { // 重置密码
                resetPsw(data.userCode, data.userName);
            }
        });
        function getNowFormatDate() {
			var date = new Date();
			var seperator1 = "-";
			var seperator2 = ":";
			var month = date.getMonth() + 1;
			var strDate = date.getDate();
			if (month >= 1 && month <= 9) {
				month = "0" + month;
			}
			if (strDate >= 0 && strDate <= 9) {
				strDate = "0" + strDate;
			}
			var currentdate = date.getFullYear() + seperator1 + month
					+ seperator1 + strDate + " " + date.getHours() + seperator2
					+ date.getMinutes() + seperator2 + date.getSeconds();
			return currentdate;
		}

        // 显示表单弹窗
        function showEditModel(mUser) {
        	console.log(mUser);
            admin.open({
                type: 1,
                title: (mUser ? '修改' : '添加') + '用户',
                content: $('#modelUser').html(),
                success: function (layero, dIndex) {
                    $(layero).children('.layui-layer-content').css('overflow', 'visible');
                    var url = mUser ? '/manage/user/updateuser' : '${basePath}/resources/yihe-static-file/json/ok.json';      
                    mUser && (mUser.roleId = mUser.yhuserrole.roleId);
                    // 回显数据
                    form.val('modelUserForm', mUser);
                    // 表单提交事件
                    form.on('submit(modelSubmitUser)', function (data) {
                    	console.log(data);
                        layer.load(2);
                        $.get(url, data.field, function (res) {
                            layer.closeAll('loading');
                            if (res.code == 20000) {
                                layer.close(dIndex);
                                layer.msg(res.msg, {icon: 1});
                                insTb.reload({}, 'data');
                            } else {
                                layer.msg(res.msg, {icon: 2});
                            }
                        }, 'json');
                        return false;
                    });
                }
            });
            laydate.render({
                elem : "#birthDate"
               ,format:'yyyy-MM-dd HH:mm:ss'
               ,value: createTime($("#birthDate").val())
                ,trigger: 'click'
                ,max :getNowFormatDate()
            });
        }

        // 删除
        function doDel(userCode, userName) {
            layer.confirm('确定要删除“' + userName + '”吗？', {
                skin: 'layui-layer-admin',
                shade: .1
            }, function (i) {
                layer.close(i);
                layer.load(2);
                console.log(userCode);
                $.get('/manage/user/deleteuser', {
                	userCode: userCode
                }, function (res) {
                    layer.closeAll('loading');
                    if (res.code == 20000) {
                        layer.msg(res.msg, {icon: 1});
                        insTb.reload({}, 'data');
                    } else {
                        layer.msg(res.msg, {icon: 2});
                    }
                }, 'json');
            });
        }

        // 重置密码
        function resetPsw(userCode, userName) {
            layer.confirm('确定要重置“' + nickName + '”的登录密码吗？', {
                skin: 'layui-layer-admin',
                shade: .1
            }, function (i) {
                layer.close(i);
                layer.load(2);
                $.get('${basePath}/yihe-upms-server/resources/yihe-static-file/json/ok.json', {
                	userCode: userCode
                }, function (res) {
                    layer.closeAll('loading');
                    if (res.code == 200) {
                        layer.msg(res.msg, {icon: 1});
                    } else {
                        layer.msg(res.msg, {icon: 2});
                    }
                }, 'json');
            });
        }
        
        //时间戳转时间
        function createTime(v){  
        	    return new Date(parseInt(v)).toLocaleString()
        	}
        	/**重写toLocaleString方法*/
        	Date.prototype.toLocaleString = function() {
        	         var y = this.getFullYear();  
        	        var m = this.getMonth()+1;  
        	        m = m<10?'0'+m:m;  
        	        var d = this.getDate();  
        	        d = d<10?("0"+d):d;  
        	        var h = this.getHours();  
        	        h = h<10?("0"+h):h;  
        	        var M = this.getMinutes();  
        	        M = M<10?("0"+M):M;  
        	        var S=this.getSeconds();
        	        S=S<10?("0"+S):S;  
        	        return y+"-"+m+"-"+d+" "+h+":"+M+":"+S; 
        	};
        	$(' .layui-btn').on('click', function(){
        	    var type = $(this).data('type');
        	    active[type] ? active[type].call(this) : '';
        	  });
    });
</script>

</body>
</html>
