<script>

        function() {

                },

            $('#times9').on({

                },
                mouseleave:function(){

                }
            });
            $('#times29').on({

                mouseenter:function(){
                    tips=layer.tips("用户在指定时间范围内有多条数据，取最新数据","#times29",{time:0});
                },
                mouseleave:function(){
                    layer.close(tips);
                }
            });
            //定义接收本月的第一天和最后一天
            var startDate1=new Date(new Date().setDate(1));
            var endDate1=new Date(new Date(new Date().setMonth(new Date().getMonth()+1)).setDate(0));
            //定义接收上个月的第一天和最后一天
            var startDate2=new Date(new Date(new Date().setMonth(new Date().getMonth()-1)).setDate(1));
            var endDate2=new Date(new Date().setDate(0));
            laydate.render({
                elem : '#test69',
                max:"date",
                range : true,
                extrabtns: [
                    {id:'today', text:'今天', range:[new Date(), new Date()]},
                    {id:'lastday-7', text:'过去7天', range:[new Date(new Date().setDate(new Date().getDate()-7)),
                            new Date(new Date().setDate(new Date().getDate()-1))]},
                    {id:'lastday-30', text:'过去30天', range:[new Date(new Date().setDate(new Date().getDate()-30)),
                            new Date(new Date().setDate(new Date().getDate()-1))]},
                    {id:'yesterday', text:'昨天', range:[new Date(new Date().setDate(new Date().getDate()-1)),
                            new Date(new Date().setDate(new Date().getDate()-1))]},
                    {id:'thismonth', text:'本月', range:[startDate1,endDate1]},
                    {id:'lastmonth', text:'上个月', range:[startDate2,endDate2]}],
                done: function(val, stdate, ovdate){
                    //当确认选择时间后调用这里
                }
            });
            laydate.render({
                elem : '#test79',
                max:"date",
                range : true,
                extrabtns: [
                    {id:'today', text:'今天', range:[new Date(), new Date()]},
                    {id:'lastday-7', text:'过去7天', range:[new Date(new Date().setDate(new Date().getDate()-7)),
                            new Date(new Date().setDate(new Date().getDate()-1))]},
                    {id:'lastday-30', text:'过去30天', range:[new Date(new Date().setDate(new Date().getDate()-30)),
                            new Date(new Date().setDate(new Date().getDate()-1))]},
                    {id:'yesterday', text:'昨天', range:[new Date(new Date().setDate(new Date().getDate()-1)),
                            new Date(new Date().setDate(new Date().getDate()-1))]},
                    {id:'thismonth', text:'本月', range:[startDate1,endDate1]},
                    {id:'lastmonth', text:'上个月', range:[startDate2,endDate2]}],
                done: function(val, stdate, ovdate){
                    //当确认选择时间后调用这里
                }
            });

            step.render({
                elem : '#stepForm9',
                filter : 'stepForm9',
                width : '100%', //设置容器宽度
                stepWidth : '750px',
                height : '500px',
                stepItems : [ {
                    title : '选择数据源'
                }, {
                    title : '选择数据'
                }, {
                    title : '导出数据'
                } ]
            });

            form.on('submit(formDemo9)', function(data) {
                console.log(data);
                if(data.field.select==""|| data.field.select == null || data.field.select == undefined){
                    notice.msg('请选择客户', {icon: 3});
                }else if(data.field.ageStart=="" || data.field.ageEnd==""){
                    notice.msg('请选择年龄范围', {icon: 3});
                }else{

                    date1={select1:data.field.select,sex:data.field.sex,ageStart:data.field.ageStart,ageEnd:data.field.ageEnd};
                    step.next('#stepForm9');
                }
                return false;
            });
            function getIntervalMonth(date1,date2){
                date1 = date1.split('-');
                 // 得到月数
                date1 = parseInt(date1[0]) * 12 + parseInt(date1[1]);
                // 拆分年月日
                date2 = date2.split('-');
                // 得到月数
                date2 = parseInt(date2[0]) * 12 + parseInt(date2[1]);
                var m = Math.abs(date1 - date2);
                return m+1;
            }
            form.on('submit(formDemo29)', function(data) {

                if(data.field.befortime==""|| data.field.befortime == null || data.field.befortime == undefined){
                    notice.msg('请选择干预前数据时间段', {icon: 3});
                }else if(data.field.endtime==""|| data.field.endtime == null || data.field.endtime == undefined){
                    notice.msg('请选择干预后数据时间段', {icon: 3});
                }else{
                    if(CompareDate(data.field.befortime.substring(13),data.field.endtime.substring(0,10))){
                        notice.msg('干预前后数据时间段不正确', {icon: 3});
                        return false;
                    }
                    console.log(data.field.befortime.substring(13));
                    console.log(data.field.endtime.substring(0,10));

                    date2=$.extend(date1,data.field);


                    var hrefs='/YhPeriodComparisonController/returnname?'
                    for(var item in date2){
                        hrefs+=item+'='+date2[item]+"&"
                    }
                  //sleep(2000)
                    hrefss(hrefs);

                    // fetch(hrefs, {
                    //     method: 'GET',
                    //     headers: {'Content-Type': 'application/json'},
                    //     //body: '<请求参数：json字符串>',
                    // }).then(res => res.blob()).then(data => {
                    //     var blobUrl = window.URL.createObjectURL(data);
                    //    // step.next('#stepForm');
                    //     downloads(blobUrl);
                    //
                    // });
                    //window.open(hrefs);

                }

                return false;
            });
            function CompareDate(d1,d2)
            {
                return ((new Date(d1.replace(/-/g,"\/"))) > (new Date(d2.replace(/-/g,"\/"))));
            }
            function hrefss(hrefs){
                $.ajax({
                    url:hrefs,
                    data:{},
                    type:"post",
                    dataType:"json",
                    beforeSend:beforeSend,
                    success: function(data){

                        window.location.href="/YhPeriodComparisonController/download?fileName="+data.data+".pdf";
                        sleep(1000);
                        layer.closeAll();
                        step.next('#stepForm9');
                    },
                    error: function(data){
                        console.log("error")
                    }
                })
            }
            function beforeSend(){
                layer.msg("正在导出,请稍后...",{
                    icon:16,
                    shade: [0.5, '#f5f5f5'],
                    time:-1
                });
            }
            function sleep(n) {

                var start = new Date().getTime();

                while(true)  if(new Date().getTime()-start > n) break;

            }
            function downloads(blobUrl) {
                //关闭提示框
                layer.closeAll();
                const a = document.createElement('a');
                a.style.display = 'none';
                a.download ='高级数据分析 因素对比-'+ getFormatDate()+'.pdf';
                a.href = blobUrl;
                a.click();
                document.body.removeChild(a);

            }
            function getFormatDate() {
                var date = new Date();
                var month = date.getMonth() + 1;
                var strDate = date.getDate();
                if (month >= 1 && month <= 9) {
                    month = "0" + month;
                }
                if (strDate >= 0 && strDate <= 9) {
                    strDate = "0" + strDate;
                }
                var currentDate = date.getFullYear() + "" + month + "" + strDate
                    + "" + date.getHours() + "" + date.getMinutes() + "" + date.getSeconds();
                return currentDate;
            }
            $('.pre').click(function() {
                step.pre('#stepForm9');
            });

            $('.next').click(function() {
               step.next('#stepForm9');
            });
            sum=function(data1,data2){
                var data={};

            }
        });
