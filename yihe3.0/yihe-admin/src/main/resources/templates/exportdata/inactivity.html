<script type="text/javascript">

	
layui.use([ 'layer', 'form', 'step', 'xmSelect', 'laydate', 'notice' ],
		function() {
			var $ = layui.jquery;
			var layer = layui.layer;
			var form = layui.form;
			var step = layui.step;
			var laydate = layui.laydate;
			var notice = layui.notice;
			var date1=null;
			var date2=null;
		  
			
			$("#jkang").hide();
			
			
			form.on('radio(ChoiceRadio)', function(data){
				  console.log(data.elem); //得到 radio 原始 DOM 对象
				  console.log(data.value); //被点击的 radio 的 value 值
				  if(data.value=='健康检测'){
					  $("#jkang").show();
					  $("#wnejuan").hide();
					  
				  }else if(data.value=='问卷评估'){
					  $("#wnejuan").show();
					  $("#jkang").hide();
				  }
				}); 
			
			
			
		  $.ajax({
	        	 type: "GET",
	             url: "/Exprot/selectorg",
	             dataType: "json",
	             success: function(data){
	            	 
	            	// 渲染多选下拉

							el : '#demoXmSelect',
							data :data.data,
							filterable:true
						});
	             }
	        	
	        });
		  
		});
