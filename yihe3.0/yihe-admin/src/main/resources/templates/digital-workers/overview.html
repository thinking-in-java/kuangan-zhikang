<div xmlns:th="http://www.thymeleaf.org" th:fragment="overview">
<div class="app">
<header class="topbar">
  <div class="brand"><div class="logo"><svg viewBox="0 0 48 48" fill="none"><rect x="7" y="13" width="34" height="27" rx="10" stroke="white" stroke-width="2.5"/><path d="M24 8v5" stroke="white" stroke-width="3" stroke-linecap="round"/><circle cx="24" cy="6" r="3" fill="#80F4D0"/><circle cx="17" cy="25" r="3" fill="white"/><circle cx="31" cy="25" r="3" fill="white"/><path d="M18 33c4 3 8 3 12 0" stroke="white" stroke-width="2.5" stroke-linecap="round"/></svg></div><div><div class="eyebrow">MINE HEALTH · AI WORKFORCE</div><h1>矿安智康 · 数字员工调度中心</h1><p>五位 AI 数字员工协同作业，让健康档案管理、智能评估与精准服务高效运转</p></div></div>
  <div class="bar-actions"><span class="live-indicator"><i></i> <span id="dataStatus" role="status">正在读取正式数据…</span></span><span class="top-time" id="clock">--</span><button class="btn btn-top" id="logBtn">☰ 运行日志</button><button class="btn btn-top primary" id="refreshBtn">刷新数据</button></div>
</header>
<section class="kpis section-pad" id="kpis">
  <div class="kpi" style="--color:#426feb;--tint:#edf2ff"><div class="kpi-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="8" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M2 19v-2c0-3 3-5 6-5s6 2 6 5v2H2Zm13-5c3 0 6 2 6 5h-6"/></svg></div><div><div class="kpi-num" id="archiveTotal">—</div><div class="kpi-label">职工健康档案</div></div></div>
  <div class="kpi" style="--color:#21af88;--tint:#e8faf3"><div class="kpi-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><path d="M12 4v16M4 12h16"/></svg></div><div><div class="kpi-num" id="archiveMonth">—</div><div class="kpi-label">本月新建档案</div></div></div>
  <div class="kpi" style="--color:#e99b37;--tint:#fff5e8"><div class="kpi-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 9h6M9 13h6M9 17h4"/></svg></div><div><div class="kpi-num" id="pendingKpi">—</div><div class="kpi-label">全部员工活跃任务</div></div></div>
  <div class="kpi" style="--color:#ef6a70;--tint:#fff0f0"><div class="kpi-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="m12 3 9 16H3L12 3Z"/><path d="M12 9v4M12 16h.01"/></svg></div><div><div class="kpi-num" id="alertTotal">—</div><div class="kpi-label">当前账号指标预警</div></div></div>
  <div class="kpi" style="--color:#705cf3;--tint:#f1efff"><div class="kpi-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M3 5h18v14H3zM7 9h10M7 13h6"/></svg></div><div><div class="kpi-num" id="ocrDone">—</div><div class="kpi-label">全部员工已完成任务</div></div></div>
</section>
<section class="team section-panel">
  <div class="section-heading"><div class="section-title"><span class="heading-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1.3"/><rect x="14" y="3" width="7" height="7" rx="1.3"/><rect x="3" y="14" width="7" height="7" rx="1.3"/><rect x="14" y="14" width="7" height="7" rx="1.3"/></svg></span><div><h2>五位数字员工 · 智能协作工作台</h2><p>查看已接入岗位的正式业务数据</p></div></div></div>
  <div class="flow-stage"><button type="button" class="engine" id="engineButton" aria-expanded="false" aria-controls="taskHub"><span class="engine-entry"><span class="engine-symbol"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2v4m0 12v4M2 12h4m12 0h4M5 5l3 3m8 8 3 3M19 5l-3 3M8 16l-3 3"/><circle cx="12" cy="12" r="5"/></svg></span><span class="engine-copy"><span class="engine-title">五位数字员工 · 任务总览</span><span class="engine-sub">派活任务 / OCR / 指标预警 · 点击查看全部</span></span></span><span class="engine-badges"><span><b id="engineTotal">—</b> 全部任务</span><span><b id="enginePending">—</b> 活跃任务</span><span><b id="engineReview">—</b> 待审核</span></span><span class="engine-open">查看总览 <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg></span></button>
  <svg class="flow-lines" viewBox="0 0 1000 70" preserveAspectRatio="none" aria-hidden="true"><path d="M500 0 V10 C500 35 100 21 100 69"/><path d="M500 0 V10 C500 29 300 27 300 69"/><path class="primary" d="M500 0 V69"/><path d="M500 0 V10 C500 29 700 27 700 69"/><path d="M500 0 V10 C500 35 900 21 900 69"/><circle cx="100" cy="69" r="3.3"/><circle cx="300" cy="69" r="3.3"/><circle class="pulse" cx="500" cy="69" r="4"/><circle cx="700" cy="69" r="3.3"/><circle cx="900" cy="69" r="3.3"/></svg>
  <div class="worker-grid" id="workerGrid"></div></div>

</section>
<section id="taskHub" class="section-panel task-hub" aria-labelledby="taskHubTitle" hidden></section>
<section class="bottom-grid">
  <div class="widget section-panel"><div class="widget-head"><div class="widget-heading"><span class="mini-icon">⚑</span><span class="widget-title">异常预警中心</span><span class="widget-sub">分级响应与安全提示</span></div></div><div class="widget-body"><div class="alert-track"><i></i><i></i><i></i></div><div class="alert-list" id="alertList"></div></div><div class="widget-footer"><button class="footer-action" id="alertsAll">查看全部预警记录 →</button></div></div>
  <div class="widget section-panel"><div class="widget-head"><div class="widget-heading"><span class="mini-icon">▣</span><span class="widget-title">全部员工活跃任务</span><span class="widget-sub">数字员工处理进度</span></div><div class="widget-header-right"><button type="button" class="hub-text-button" data-hub-shortcut="active">查看全部</button></div></div><div class="widget-body"><div class="overview-stats"><div class="ov-stat"><b id="taskTotal">—</b><small>活跃任务</small></div><div class="ov-stat"><b id="taskActive">—</b><small>处理中</small></div></div><div class="tasks" id="taskList"></div></div></div>
  <div class="widget section-panel activity-widget"><div class="widget-head"><div class="widget-heading"><span class="mini-icon">◉</span><span class="widget-title">近期任务执行结果</span><span class="widget-sub">数字员工执行轨迹</span></div><div class="widget-header-right"><span class="live-indicator" style="background:#eaf9f2;border:0;color:#22a771;padding:5px 8px;font-size:10px"><i style="width:6px;height:6px"></i> 正式记录</span></div></div><div class="widget-body" style="padding-top:4px;padding-bottom:4px"><div class="activity-list" id="activityList"></div></div></div>
</section>
<footer class="page-foot">矿安智康 · 数据按当前登录账号的权限展示</footer>
</div>
