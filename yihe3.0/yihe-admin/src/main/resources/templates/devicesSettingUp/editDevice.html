<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>基础表单</title>
 <link rel="stylesheet" th:href="@{/assets/libs/layui/css/layui.css}" />
<link rel="stylesheet" th:href="@{/assets/module/admin.css}" />
    <!--[if lt IE 9]>
    <script src="https://oss.maxcdn.com/html5shiv/3.7.3/html5shiv.min.js"></script>
    <script src="https://oss.maxcdn.com/respond/1.4.2/respond.min.js"></script>
    <![endif]-->
    <style>
        .layui-form-item {
            margin-bottom: 25px;
        }

        label .layui-icon {
            font-size: 14px;
        }
    </style>
</head>
<body>
<!-- 加载动画 -->
<div class="page-loading">
    <div class="ball-loader">
        <span></span><span></span><span></span><span></span>
    </div>
</div>
<!-- 正文开始 -->

<div class="layui-fluid">
    <div class="layui-card">
        <div class="layui-card-body">
<button id="btnSubmit" class="layui-btn icon-btn">
								<i class="layui-icon">&#xe609;</i>返回
							</button>
            <form class="layui-form" style="max-width: 700px;margin: 40px auto;" lay-filter="example">
            <input type="hidden"    name="tid" th:value="${yhUserDevice.tid}"  lay-verify="required"   class="layui-input"/>
                    
                <div class="layui-form-item">
                    <label class="layui-form-label layui-form-required">类型:</label>
                    <div class="layui-input-block">
                        <select name="terminaltype" th:value="${yhUserDevice.terminaltype}" th:field="${yhUserDevice.terminaltype}" lay-verify="required">
                               <option value=""></option>
                               <option th:selected="${yhUserDevice.terminaltype==1}" value="1">血压计</option>
                               <option th:selected="${yhUserDevice.terminaltype==2}" value="2">血糖仪</option>
                             </select>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">序列号:</label>
                    <div class="layui-input-block">
                        <input type="text"    name="terminalid" th:value="${yhUserDevice.terminalid}"  lay-verify="required" placeholder="请输入序列号" class="layui-input"/>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">姓名:</label>
                    <div class="layui-input-block">
                       <select name="usercode" disabled="disabled" th:value="${yhUserDevice.usercode}" th:field="${yhUserDevice.usercode}" lay-verify="required" lay-search="">
						 <option value="">直接选择或搜索选择</option>
                        <option th:each="glist:${namelist}"
							th:value="${glist.usercode}" th:selected="${yhUserDevice.usercode==glist.usercode}">[[${glist.username}]]</option>
                       </select>     
                    </div>
                </div>
				
               <div class="layui-form-item">
                   <label class="layui-form-label">备注:</label>
                   <div class="layui-input-block">
                       <input type="text" name="note" th:value="${yhUserDevice.note}" placeholder="请输入备注" class="layui-input"/>
                   </div>
               </div>
                <div class="layui-form-item">
                    <div class="layui-input-block">
                        <button class="layui-btn" lay-filter="formSubmitBas" lay-submit>&emsp;提交&emsp;</button>
                        <button type="reset" class="layui-btn layui-btn-primary">&emsp;重置&emsp;</button>
                    </div>
                </div>
            </form>

        </div>
    </div>
</div>

<!-- js部分 -->
<script type="text/javascript" th:src="@{/assets/libs/layui/layui.js}"></script>
	<script type="text/javascript" th:src="@{/assets/js/common.js}"></script>
<script>
layui.use(['layer', 'form', 'table', 'util', 'laydate','notice'], function() {
	var $ = layui.jquery;
	var layer = layui.layer;
	var form = layui.form;
	var table = layui.table;
	var util = layui.util;
	var laydate = layui.laydate;
	var notice = layui.notice;
        // 渲染laydate
        laydate.render({
            elem: '#edtDateFormBas',
            range: true,
            trigger: 'click'
        });

        // 监听表单提交
        form.on('submit(formSubmitBas)', function (data) {
           // layer.msg(JSON.stringify(data.field));
      	  $.ajax({
				type:"post",
				url:"/system/device/editInfo",
				contentType:'application/json;charset=UTF-8',	//发送信息至服务器时内容编码类型
				traditional:true,	//传统的方式来序列化数据
				data:JSON.stringify(data.field),
				success:function(data){
					  if(data.flag){
						  window.location.href="/manage/equipment/setup"
					  }else{
						  layer.msg('设备序列号已被绑定用户');
					  }
					
				} 
			}); 
            return false;
        });
		//给表单赋值
		form.val("example", { //formTest 即 class="layui-form" 所在元素属性 lay-filter="" 对应的值
		  
		   
		  
		});
		
		$('#btnSubmit')
		.click(
				function() {
					window.history.back(); //返回上一页
				});

    });
</script>
</body>
</html>
