<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>健康检查告警配置</title>
    <link rel="stylesheet"  th:href="@{/assets/libs/layui/css/layui.css}" />
    <link rel="stylesheet"  th:href="@{/assets/module/admin.css}"  />
    <!--[if lt IE 9]>
    <script src="https://oss.maxcdn.com/html5shiv/3.7.3/html5shiv.min.js"></script>
    <script src="https://oss.maxcdn.com/respond/1.4.2/respond.min.js"></script>
    <![endif]-->
</head>
<body>
<style>

    .nowinput{
        width: 100%
    }

</style>
<!-- 页面加载loading -->
<div class="page-loading">
    <div class="ball-loader">
        <span></span><span></span><span></span><span></span>
    </div>
</div>
<a id="clicksetting" target="_self" style="display: none" href="/manage/setting/clientservice" lay-text="客户服务配置">"健康检查告警配置"</a>
<!-- 正文开始 -->
<form class="layui-form" >
    <div class="layui-fluid">
        <div id="topheight" style="width: 100%;height:450px;background-color: #FFF; position:relative;">
            <div class="layui-tab" lay-filter="fiter">

                <div class="layui-tab-content">
                    <div class="layui-tab-item layui-show">
                        <div style="position: absolute;margin-left: 20px;width: 100%">
                            <div style="width: 100%;height: 40px; float: left;"  class="xuanran">
                                <h2>久未记录 检测项设置</h2>
                            </div>
                            <div style="width: 33%;float: left;">
                                <span style="display:inline-block;position: relative;top:5px;width: 120px">饮食日记：</span>
                                <div style="display: inline-block;margin-left: 8%">
                                    <input  type="checkbox" name="healthrisks_switch" lay-skin="switch"
                                            lay-text="开启|关闭" class='temperature tiwen_close' >
                                </div>
                                <div style="width: 40%;margin-top: 15px;margin-left: 38%">
                                    <input name='healthrisks_day' type="number"   required lay-verify="required"  class="layui-input	day" style="width: 80%;display: inline-block;"> <span style="position: relative;top: 8px;">天</span>
                                </div>
                            </div>
                            <div style="width: 33%;float: left;">
                                <span style="display:inline-block;position: relative;top:5px;width: 120px">运动日记：</span>
                                <div style="display: inline-block;margin-left: 8%">
                                    <input  type="checkbox" name="qualitysleep_switch" lay-skin="switch"
                                            lay-text="开启|关闭" class='temperature tiwen_close' >
                                </div>
                                <div style="width: 40%;margin-top: 15px;margin-left: 38%">
                                    <input name='qualitysleep_day' type="number"  required lay-verify="required"  class="layui-input	day" style="width: 80%;display: inline-block;"> <span style="position: relative;top: 8px;">天</span>
                                </div>
                            </div>
                            <div style="width: 33%;float: left;">
                                <span style="display:inline-block;position: relative;top:5px;width: 120px">睡眠日记：</span>
                                <div style="display: inline-block;margin-left: 8%">
                                    <input  type="checkbox" name="healthyhabits_switch" lay-skin="switch"
                                            lay-text="开启|关闭" class='temperature tiwen_close' >
                                </div>
                                <div style="width: 40%;margin-top: 15px;margin-left: 38%">
                                    <input	name='healthyhabits_day' type="number"  required lay-verify="required"  class="layui-input	day" style="width: 80%;display: inline-block;"> <span style="position: relative;top: 8px;">天</span>
                                </div>
                            </div>
                            <div style="width: 33%;float: left;margin-top: 40px; ">
                                <span style="display:inline-block;position: relative;top:5px;width: 120px">习惯日记：</span>
                                <div style="display: inline-block;margin-left: 8%">
                                    <input  type="checkbox" name="acharacter_switch" lay-skin="switch"
                                            lay-text="开启|关闭" class='temperature tiwen_close' >
                                </div>
                                <div style="width: 40%;margin-top: 15px;margin-left: 38%">
                                    <input	name='acharacter_day' type="number"  required lay-verify="required"  class="layui-input	day" style="width: 80%;display: inline-block;"> <span style="position: relative;top: 8px;">天</span>
                                </div>
                            </div>

                            <!--<div style="width: 33%; float: left;margin-top:120px;">-->
                            <!--<span style="display:inline-block;position: relative;top:5px;width: 200px">健管师的微信消息提醒：</span>-->
                            <!--<div style="display: inline-block;margin-left: 8%">-->
                            <!--<input  type="checkbox" name="wechat_switch" lay-skin="switch"-->
                            <!--lay-text="开启|关闭" class='temperature tiwen_close' >-->
                            <!--</div>	-->
                            <!---->
                            <!---->
                            <!--</div>	-->


                        </div>


                    </div>
                </div>
            </div>

        </div>
        <div class="layui-input-block">
            <button type="button" style="background-color:#2a9ce4;color:#FFF" class="layui-btn layui-btn-primary" lay-filter="formSubmitBas" lay-submit >&emsp;保存&emsp;</button>
            <button type="reset" id="quxiao" class="layui-btn layui-btn-primary">&emsp;取消&emsp;</button>
        </div>
</form>

<script type="text/javascript" th:src="@{/assets/libs/layui/layui.js}"></script>
<script type="text/javascript" th:src="@{/assets/js/common.js}"></script>
<script th:inline="none">
    layui.use(['layer', 'form', 'laydate','element'], function () {
        var $ = layui.jquery;
        var layer = layui.layer;
        var form = layui.form;
        var laydate = layui.laydate;
        var element = layui.element;
        laydate.render({
            elem: '#test4'
            ,type: 'time',
            trigger: 'click'
        });
        $.ajax({
            url: '/YhDivisionsetting/selectassessmentswitch',
            type: 'post',
            dataType:'json',
            contentType:'application/json;charset=utf-8',
            success: function (res) {
                console.log(res);
                for(var i=0;i<res.data.length;i++){
                    if(res.data[i].long_time_no_switch==0 && res.data[i].name=='饮食日记'){
                        $(".tiwen_close").eq(0).prop("checked",false);
                        $(".day").eq(0).val(res.data[i].long_time_no_intervaltime);
                    }else if(res.data[i].long_time_no_switch==1 && res.data[i].name=='饮食日记'){
                        $(".tiwen_close").eq(0).prop("checked",true);
                        $(".day").eq(0).val(res.data[i].long_time_no_intervaltime);
                    }
                    if(res.data[i].long_time_no_switch==0 && res.data[i].name=='运动日记'){
                        $(".tiwen_close").eq(1).prop("checked",false)
                        $(".day").eq(1).val(res.data[i].long_time_no_intervaltime);;
                    }else if(res.data[i].long_time_no_switch==1 && res.data[i].name=='运动日记'){
                        $(".tiwen_close").eq(1).prop("checked",true);
                        $(".day").eq(1).val(res.data[i].long_time_no_intervaltime);
                    }
                    if(res.data[i].long_time_no_switch==0 && res.data[i].name=='睡眠日记'){
                        $(".tiwen_close").eq(2).prop("checked",false);
                        $(".day").eq(2).val(res.data[i].long_time_no_intervaltime);
                    }else if(res.data[i].long_time_no_switch==1 && res.data[i].name=='睡眠日记'){
                        $(".tiwen_close").eq(2).prop("checked",true);
                        $(".day").eq(2).val(res.data[i].long_time_no_intervaltime);
                    }
                    if(res.data[i].long_time_no_switch==0 && res.data[i].name=='习惯日记'){
                        $(".tiwen_close").eq(3).prop("checked",false);
                        $(".day").eq(3).val(res.data[i].long_time_no_intervaltime);
                    }else if(res.data[i].long_time_no_switch==1 && res.data[i].name=='习惯日记'){
                        $(".tiwen_close").eq(3).prop("checked",true);
                        $(".day").eq(3).val(res.data[i].long_time_no_intervaltime);
                    }

                }
                form.render();
            }
        });
        form.on('submit(formSubmitBas)', function (data) {
            console.log(data);
            var YhJzServiceBodydataSwitch= new Array();
            if(data.field.healthrisks_switch=='on'){
                YhJzServiceBodydataSwitch.push({id:8,long_time_no_switch:1,long_time_no_intervaltime:data.field.healthrisks_day})
            }else{
                YhJzServiceBodydataSwitch.push({id:8,long_time_no_switch:0,long_time_no_intervaltime:data.field.healthrisks_day})
            }
            if(data.field.qualitysleep_switch=='on'){
                YhJzServiceBodydataSwitch.push({id:9,long_time_no_switch:1,long_time_no_intervaltime:data.field.qualitysleep_day})
            }else{
                YhJzServiceBodydataSwitch.push({id:9,long_time_no_switch:0,long_time_no_intervaltime:data.field.qualitysleep_day})
            }
            if(data.field.healthyhabits_switch=='on'){
                YhJzServiceBodydataSwitch.push({id:10,long_time_no_switch:1,long_time_no_intervaltime:data.field.healthyhabits_day})
            }else{
                YhJzServiceBodydataSwitch.push({id:10,long_time_no_switch:0,long_time_no_intervaltime:data.field.healthyhabits_day})
            }
            if(data.field.acharacter_switch=='on'){
                YhJzServiceBodydataSwitch.push({id:11,long_time_no_switch:1,long_time_no_intervaltime:data.field.acharacter_day})
            }else{
                YhJzServiceBodydataSwitch.push({id:11,long_time_no_switch:0,long_time_no_intervaltime:data.field.acharacter_day})
            }

            $.ajax({
                url: '/YhDivisionsetting/updateassessmentswitch',
                type: 'post',
                data: JSON.stringify(YhJzServiceBodydataSwitch),
                dataType:'json',
                contentType:'application/json;charset=utf-8',
                success: function (data) {
                    history.go(0);
                }
            });
            return;

        });
        $("#quxiao").click(function(){
            window.location.href="/manage/service/division?type=1";
        })

    });
</script>
</body>
</html>
