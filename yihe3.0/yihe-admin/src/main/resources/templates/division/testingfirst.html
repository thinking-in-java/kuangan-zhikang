<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>健康检查告警配置</title>
    <link rel="stylesheet"  th:href="@{/assets/libs/layui/css/layui.css}" />
    <link rel="stylesheet"  th:href="@{/assets/module/admin.css}"  />
    <!--[if lt IE 9]>
    <script src="https://oss.maxcdn.com/html5shiv/3.7.3/html5shiv.min.js"></script>
    <script src="https://oss.maxcdn.com/respond/1.4.2/respond.min.js"></script>
    <![endif]-->
</head>
<body>
<style>

.nowinput{
width: 100%
}

</style>
<!-- 页面加载loading -->
<div class="page-loading">
    <div class="ball-loader">
        <span></span><span></span><span></span><span></span>
    </div>
</div>
<a id="clicksetting" target="_self" style="display: none" href="/manage/setting/clientservice" lay-text="客户服务配置">"健康检查告警配置"</a>
<!-- 正文开始 -->
<form class="layui-form" >
<div class="layui-fluid">
	<div id="topheight" style="width: 100%;height:450px;background-color: #FFF; position:relative;">
		<div class="layui-tab" lay-filter="fiter">
		
		  <div class="layui-tab-content">
		    <div class="layui-tab-item layui-show">
		     	<div style="position: absolute;margin-left: 20px;width: 100%">
		    	<div style="width: 100%;height: 40px; margin-left: 14px;float: left;"  class="xuanran">
		    		<h2>首次检测 检测项设置</h2>		
			    </div>
								<div style="width: 33%;float: left;">
									<span style="display:inline-block;position: relative;top:5px;width: 80px">血压：</span>
									<div style="display: inline-block;margin-left: 8%">
									<input  type="checkbox" name="bloodpressure_switch" lay-skin="switch"
										lay-text="开启|关闭" class='temperature tiwen_close' >
									</div>	
								</div>		
								<div style="width: 33%;float: left;">
									<span style="display:inline-block;position: relative;top:5px;width: 80px">血糖：</span>
									<div style="display: inline-block;margin-left: 8%">
									<input  type="checkbox" name="bloodsugar_switch" lay-skin="switch"
										lay-text="开启|关闭" class='temperature tiwen_close' >
									</div>	
								</div>		
								<div style="width: 33%;float: left;">
									<span style="display:inline-block;position: relative;top:5px;width: 80px">血脂四项：</span>
									<div style="display: inline-block;margin-left: 8%">
									<input  type="checkbox" name="bloodfat_switch" lay-skin="switch"
										lay-text="开启|关闭" class='temperature tiwen_close' >
									</div>	
								</div>		
								<div style="width: 33%;float: left;margin-top: 20px; ">
									<span style="display:inline-block;position: relative;top:5px;width: 80px">体重：</span>
									<div style="display: inline-block;margin-left: 8%">
									<input  type="checkbox" name="weight_switch" lay-skin="switch"
										lay-text="开启|关闭" class='temperature tiwen_close' >
									</div>	
								</div>	
								
						<div style="width: 33%;margin-top: 400px; ">
							<!--<span style="display:inline-block;position: relative;top:5px;width: 200px">健管师的微信消息提醒：</span>-->
							<!--<div style="display: inline-block;margin-left: 8%">-->
							<!--<input  type="checkbox" name="wechat_switch" lay-skin="switch"-->
								<!--lay-text="开启|关闭" class='temperature tiwen_close' >-->
							<!--</div>	-->
						</div>			
				</div>
				
		    </div>
		
		
		  </div>
		</div>
    </div>
    
</div>
 <div class="layui-input-block">
                        <button type="button" style="background-color:#2a9ce4;color:#FFF" class="layui-btn layui-btn-primary" lay-filter="formSubmitBas" lay-submit >&emsp;保存&emsp;</button>
                        <button type="reset" id="quxiao" class="layui-btn layui-btn-primary">&emsp;取消&emsp;</button>
 </div>
</form>

<script type="text/javascript" th:src="@{/assets/libs/layui/layui.js}"></script>
<script type="text/javascript" th:src="@{/assets/js/common.js}"></script>
<script th:inline="none">
    layui.use(['layer', 'form', 'laydate','element'], function () {
        var $ = layui.jquery;
        var layer = layui.layer;
        var form = layui.form;
        var laydate = layui.laydate;
        var element = layui.element;
		 $.ajax({
	         url: '/YhDivisionsetting/selectbodyswitch',
	         type: 'post',
	         dataType:'json',
	         contentType:'application/json;charset=utf-8',
	         success: function (res) {
	        	 console.log(res);
     			for(var i=0;i<res.data.length;i++){
    				if(res.data[i].first_switch==0){
    					$(".tiwen_close").eq(i).prop("checked",false);
    				}else if(res.data[i].first_switch==1){
    					$(".tiwen_close").eq(i).prop("checked",true);
    				}
    				
    			}
    			form.render();
	         }
	     });
	        form.on('submit(formSubmitBas)', function (data) {
				 var YhJzServiceBodydataSwitch= new Array();
				 if(data.field.bloodpressure_switch=='on'){
					 YhJzServiceBodydataSwitch.push({id:1,first_switch:1})
				 }else{
					 YhJzServiceBodydataSwitch.push({id:1,first_switch:0})
				 }
				 if(data.field.bloodsugar_switch=='on'){
					 YhJzServiceBodydataSwitch.push({id:2,first_switch:1})
				 }else{
					 YhJzServiceBodydataSwitch.push({id:2,first_switch:0})
				 }
				 if(data.field.bloodfat_switch=='on'){
					 YhJzServiceBodydataSwitch.push({id:3,first_switch:1})
				 }else{
					 YhJzServiceBodydataSwitch.push({id:3,first_switch:0})
				 }
				 if(data.field.weight_switch=='on'){
					 YhJzServiceBodydataSwitch.push({id:4,first_switch:1})
				 }else{
					 YhJzServiceBodydataSwitch.push({id:4,first_switch:0})
				 }
				 if(data.field.wechat_switch=='on'){
					 YhJzServiceBodydataSwitch.push({id:5,first_switch:1})
				 }else{
					 YhJzServiceBodydataSwitch.push({id:5,first_switch:0})
				 }
				 
				 $.ajax({
			         url: '/YhDivisionsetting/updatebodyswitch',
			         type: 'post',
			         data: JSON.stringify(YhJzServiceBodydataSwitch),
			         dataType:'json',
			         contentType:'application/json;charset=utf-8',
			         success: function (data) {
			        	 history.go(0);
			         }
			     });
				 return;
				 
	      });
	      $("#quxiao").click(function(){
	    	  window.location.href="/manage/service/division?type=1";
	      })
        
    });
</script>
</body>
</html>
