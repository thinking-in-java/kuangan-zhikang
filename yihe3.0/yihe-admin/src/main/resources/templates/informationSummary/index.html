/** 应用快捷块样式 */
.console-app-group {
	padding: 16px;
	border-radius: 4px;
	text-align: center;
	background-color: #fff;
	cursor: pointer;
}

.console-app-group .console-app-icon {
	width: 32px;
	height: 32px;
	line-height: 32px;
	margin-bottom: 6px;
	display: inline-block;
	-webkit-box-sizing: border-box;
	-moz-box-sizing: border-box;
	box-sizing: border-box;
	font-size: 32px;
	color: #69c0ff;
}

.console-app-group:hover {
	box-shadow: 0 0 15px rgba(0, 0, 0, .08);
}

/** //应用快捷块样式 */

/** 小组成员 */
.console-user-group {
	position: relative;
	padding: 10px 0 10px 60px;
}

.console-user-group .console-user-group-head {
	width: 32px;
	height: 32px;
	position: absolute;
	top: 50%;
	left: 12px;
	margin-top: -16px;
}

.console-user-group .layui-badge {
	position: absolute;
	top: 50%;
	right: 8px;
	margin-top: -10px;
}

.console-user-group .console-user-group-name {
	line-height: 1.2;
}

.console-user-group .console-user-group-desc {
	color: #8c8c8c;
	line-height: 1;
	font-size: 12px;
	margin-top: 5px;
}

/** 卡片轮播图样式 */
.admin-carousel .layui-carousel-ind {
	position: absolute;
	top: -41px;
	text-align: right;
}

.admin-carousel .layui-carousel-ind ul {
	background: 0 0;
}

.admin-carousel .layui-carousel-ind li {
	background-color: #e2e2e2;
}

.admin-carousel .layui-carousel-ind li.layui-this {
	background-color: #999;
}

/** 广告位轮播图 */
.admin-news .layui-carousel-ind {
	height: 45px;
}

.admin-news a {
	display: block;
	line-height: 60px;
	text-align: center;
	border-radius: 4px;
}

.basicInfo-left {
	width: 60px;
	height: 60px;
}

.basicInfo-left img {
	width: 100%;

	border-radius: 50px;
}

.juzhong {

.layui-form-switch {

}

.layui-col-space1>* {
