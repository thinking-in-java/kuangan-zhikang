<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<html>
<head>
<meta charset="utf-8" />
<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
<meta name="viewport"
	content="width=device-width, initial-scale=1, maximum-scale=1">
<title>食物库管理</title>
<link rel="stylesheet" th:href="@{/assets/libs/layui/css/layui.css}" />
<link rel="stylesheet" th:href="@{/assets/module/admin.css}" />
<link rel="stylesheet" th:href="@{/assets/css/formSelects-v4.css}" />
</head>
<body>
	<!-- 页面加载loading -->
	<div class="page-loading">
		<div class="ball-loader">
			<span></span><span></span><span></span><span></span>
		</div>
	</div>

	<a id="cancel" target="_self" style="display: none"
		href="/manage/content/foodl" lay-text="食物管理">"食物管理"</a>
	<div class="layui-fluid">
		<div class="layui-row">
			<div
				style="width: 100%; height: 100%; background-color: #FFF; position: relative;">
				<div th:if="${id==0}"
					style="font-size: 20px; font-weight: bold; margin-left: 20px; padding-top: 30px;">新建菜肴</div>
				<div th:if="${id!=0}"
					style="font-size: 20px; font-weight: bold; margin-left: 20px; padding-top: 30px;">修改菜肴</div>
				<form class="layui-form" id="express">

					<input id="fCId" name="fCId" type="hidden" th:value="${id}">

					<div class="layui-form-item">
						<div class="layui-inline">
							<label class="layui-form-label layui-form-required" style="    width: 8%;">名称</label>
							<div class="layui-input-block">
								<div class="layui-row">

									<input style="margin-left: -89px; width: 550px;" type="text"
										name="fCName" id="fCName" lay-verify="required"
										lay-reqtext="名称是必填项，岂能为空？" maxlength="16"
										placeholder="请输入名称，最大限制16个字符" autocomplete="off"
										class="layui-input">
								</div>
							</div>
						</div>
					</div>
					
					 
					 <div class="layui-form-item">
						<div class="layui-inline">
							<label style="width: 16%"
								class="layui-form-label layui-form-required">是否常用</label>
							<div class="layui-input-block">
								<div class="layui-row" style="margin-left: -89px; width: 450px;">

									<select name="usedFood" id="usedFood" lay-verify="required">
							        <option value="0">不常用</option>
							        <option value="1">常用</option>
							      </select>
								</div>
							</div>
						</div>

					</div>
					
					
				 
					

						
					<div class="layui-form-item">
						<div class="layui-inline">
							<label style="width: 25%"
								class="layui-form-label ">不适宜食用人群</label>
							<div class="layui-input-block">
								<div class="layui-row" style="margin-left: -89px; width: 450px;">

									<select name="notRecommendFood" xm-select="select1"
									  lay-verType="tips">
									<option th:each="glist:${selectByExample}"
										th:value="${glist.id}">[[${glist.diseaseName}]]</option>

								</select>
								</div>
							</div>
						</div>

					</div>
					
					

					<div class="layui-form-item">
						<div class="layui-inline">
							<label class="layui-form-label ">描述信息</label>
							<div class="layui-input-block">
								<div class="layui-row">

									<input style="margin-left: -89px; width: 550px;" type="text"
										name="measuringUnit" id="measuringUnit"  
										lay-reqtext="描述信息是必填项，岂能为空？" maxlength="16"
										placeholder="请填写，最大限制20个字符。示例：25g小麦相当于一手掌的量。"
										autocomplete="off" class="layui-input">
								</div>
							</div>
						</div>
					</div>




					<div
						style="font-size: 20px; font-weight: bold; margin-left: 20px; padding-top: 30px;">构成成分(每100克菜肴，成分的重量配比)</div>
					<div class="layui-form-item">
					 

						<table id="form-create"  lay-filter="test" style="width: 45%;" class="layui-table">
							<thead>
								<tr>
									<th style="width: 50px;">序号</th>
									<th>食物</th>
									<th>克数</th>
									<th style="width: 150px;">操作</th>
								</tr>
							</thead>
							<tbody>
								<tr>
									<td colspan="3"><span>点击添加按钮，添加菜肴成分.成分克数相加为100</span></td>
									<td colspan="1">
										<div class="layui-btn-group">
											<button type="button" class="layui-btn add" onclick="add(0)">增加</button>
										</div>
									</td>
								</tr>
							</tbody>
						</table>


					</div>

					<div class="layui-form-item">
						<label style="width: 72px;" class="layui-form-label layui-form-required">制作方法</label>
						<div class="layui-input-block">
							<div class="layui-row">
								<textarea placeholder="请填写，最大限制1000个字符"
									maxlength="1000" style="margin-left: -89px; height: 36px;"
									id="foodMethod" name="foodMethod" lay-verify="required" class="layui-input"></textarea>
							</div>
						</div>
					</div>


					<div class="layui-form-item">
						<label style="width: 72px;" class="layui-form-label">食物图</label> <input
							id="fCImg" name="fCImg" type="hidden" value="">

						<div class="layui-inline">
							<div class="layui-input-block">
								<div class="layui-upload-drag" id="test10">
									<i class="layui-icon"></i>
									<p>点击上传，或将图片拖拽到此处</p>
									<p>(尺寸：4:3 )</p>
									<div class="layui-hide" id="uploadDemoView">
										<hr>
										<img src="" alt="上传成功后渲染" style="max-width: 196px">
									</div>
								</div>
							</div>
						</div>
					</div>




					<div class="layui-form-item"
						style="margin-left: -88px; padding-bottom: 40px;">
						<div class="layui-input-block">
							<button class="layui-btn " lay-submit='' lay-filter="regSubmit"
								id="">保存</button>
							<button type="reset" onclick="cancel()"
								class="layui-btn layui-btn-primary">&emsp;取消&emsp;</button>
						</div>
					</div>
				</form>
			</div>
		</div>
	</div>


</body>
<script type="text/javascript" th:src="@{/assets/libs/layui/layui.js}"></script>
<script type="text/javascript" th:src="@{/assets/js/common.js}"></script>
<script type="text/javascript" th:src="@{/assets/js/jquery-1.11.1.js}"></script>
<script type="text/javascript" th:src="@{/assets/js/xm-select.js}"></script>
<script type="text/javascript"
		th:src="@{/assets/js/formSelects-v4.min.js}"></script>
<script type="text/javascript">
	$('#fCName').blur(function() {
		var fCName = $("#fCName").val();
		var fCId = $("#fCId").val();
		$.ajax({
			type : 'get',
			url : '/YhFoodCookBook/selctFcNameRepetition',
			data : {
				fCName : fCName,
				fCId : fCId
			},
			success : function(data) {
				if (data == 1) {
					layer.msg("膳食名称已被占用!");
				}
			}
		});
	})

	cancel = function() {
		document.getElementById("cancel").click();
	}

	layui.use(['upload','table','form'], function() {
		var $ = layui.jquery, upload = layui.upload;
		var form = layui.form;
		var table = layui.table;
		var index = 1;
		
		 window.add= function(val){
			var element = $([
				'<tr>',
					'<td>'+ index +'</td>',
					'<td id="select'+ index +'"></td>',
					'<td style="width: 25%;"><input type="number"  step="0.1" name="gift_price" placeholder="请填写" autocomplete="off" class="layui-input numinput" required lay-verify="required" value="'+val+'"></td>',
					'<td class="handler">',
						'<button type="button" class="layui-btn layui-btn-danger del">删除</button>',
					'</td>',
				'</tr>',
			].join(''))
			$('#form-create tbody').append(element)
			var hobby = "#select"+index;
			var hobbySelect = xmSelect.render({
				el: hobby,
				language: 'zn',
				radio: true,
				paging: true,
				pageSize: 5,
				//配置搜索
				filterable: true,
				//配置远程分页
				paging: true,
				pageRemote: true,
				//数据处理
				remoteMethod: function(val, cb, show, pageIndex){
					//val: 搜索框的内容, 不开启搜索默认为空, cb: 回调函数, show: 当前下拉框是否展开, pageIndex: 当前第几页
					//这里的axios类似于ajax
					$.ajax({
               type: "get",
	              url: "/YhFoodSrecipeRecordContriller/findFoodCookBookByNo10",
					data :{
						"page": pageIndex,
						"val":val
					},
               success: function(data){
             	  console.log("renderingRecipes",data.data.data)
             	   cb(data.data.data, data.data.count)
               }   	
          });
			
					 
				}
			})
			 
			element.find('.get').on('click', function(){
			 
				

				alert('value: ' + this.getValue('value'));
			}.bind(hobbySelect))
			
			element.find('.del').on('click', function(){
				$(this).parents('tr').remove();
				index--;
			})
			
			index++;
			return hobby;
			
		};
		
		 
		
		//拖拽上传图片
		upload.render({
			elem : '#test10',
			url : '/Uploading/addEnrollImg' //改成您自己的上传接口
			,
			before : function(obj) { //obj参数包含的信息，跟 choose回调完全一致，可参见上文。
				this.layerIndex = layer.load(0, {
					shade : [ 0.5, '#666c7f' ]
				});
			},
			done : function(res) {
				layer.close(this.layerIndex);
				layer.msg('上传成功');
				layui.$('#uploadDemoView').removeClass('layui-hide')
						.find('img').attr('src', res.files);
				layui.$("#fCImg").val(res.files);
				console.log(res)
			}
		});

	});

	layui
			.use(
					[ 'form', 'layedit', 'laydate','formSelects' ],
					function() {
						var form = layui.form, layer = layui.layer, layedit = layui.layedit, laydate = layui.laydate;
						var formSelects = layui.formSelects;
						 var fcid = $("#fCId").val();
						if (fcid != 0) {
							$.ajax({
								type : "post",
								url : "/YhFoodCookBook/selectfCIdfood10",
								dataType : "json",
								data : {
									"fCId" : fcid
								},
								success : function(data) {
									console.log(data.data)
									var notfoodRecom=data.data.book.notRecommendFood.split(";");
									console.log(notfoodRecom)
									let arr = JSON.parse('[' + String(notfoodRecom) + ']')
									console.log(arr)
									formSelects.value('select1', arr); 
									$("#usedFood").val(data.data.book.usedFood);
									$("#measuringUnit").val(
											data.data.book.measuringUnit);
									$("#fCImg").val(data.data.book.fCImg);
									$("#fCName").val(data.data.book.fCName);
									$("#foodMethod").val(data.data.book10.foodmethod);
								var foodElem=	data.data.book10List;
								 
								$.each(foodElem,function(a,value){
									if(null==value||''==value){
										return true
									}
									
									var elinfo=	add(value.recipesNumber*100);
									var demo2 = xmSelect.get(elinfo, true);
									demo2.setValue([
									        		{name: value.fCName, value: value.fCId},
									        	])
								  });
									form.render('select');

									layui.$('#uploadDemoView').removeClass(
											'layui-hide').find('img').attr(
											'src', data.data.fCImg);
								}
							});
						} 

						//监听提交
						form.on('submit(regSubmit)', function(dataYh) {
							// console.log(JSON.stringify(dataYh.field))
							 if(dataYh.field.fCId!=0){
								 //修改
									var keshuNum=0;
									if($(".numinput").length<2){
										 layer.alert("菜肴成分需要大于1个!");
										 return false;
									}
									var arr=[];
									$(".numinput").each(function(){
										 
										 keshuNum=parseFloat(keshuNum)+parseFloat($(this).val());
									})
									 if(parseFloat(keshuNum)!=100){
										 layer.alert("菜肴成分克数相加要等于100!");
										 return false;
									 }
									 $(".numinput").each(function(){
											arr.push($(this).val());
										})
									 dataYh.field.foodKeshu=arr;
									 var selectArrjia = xmSelect.batch(/select.*/, 'getValue', 'value');
							console.log('获取匹配正则 /demo.*/ 的实例: ' + JSON.stringify(selectArrjia, null, 2))
							 dataYh.field.foodList=selectArrjia;
							
								 	$.ajax({
										type : 'post',
										url : '/YhFoodSrecipeRecordContriller/updateDishInfo',
										contentType:'application/json;charset=UTF-8',	//发送信息至服务器时内容编码类型
										traditional:true,	//传统的方式来序列化数据
										data : JSON.stringify({"fCId":dataYh.field.fCId,"usedFood":dataYh.field.usedFood,"fCName":dataYh.field.fCName,"cookPerson":dataYh.field.cookPerson,"measuringUnit":dataYh.field.measuringUnit,"foodMethod":dataYh.field.foodMethod,"fCImg":dataYh.field.fCImg,"foodKeshu":dataYh.field.foodKeshu,"foodList":dataYh.field.foodList,"notRecommendFood":dataYh.field.notRecommendFood}),
										success : function(data) {
											window.location.href="/manage/content/foodl";
											layer.msg('成功');
										}
									});  
									return false;
							 }else{
								 
									var keshuNum=0;
									if($(".numinput").length<2){
										 layer.alert("菜肴成分需要大于1个!");
										 return false;
									}
									var arr=[];
									$(".numinput").each(function(){
										 
										 keshuNum=parseFloat(keshuNum)+parseFloat($(this).val());
									})
									 if(parseFloat(keshuNum)!=100){
										 layer.alert("菜肴成分克数相加要等于100!");
										 return false;
									 }
									 $(".numinput").each(function(){
											arr.push($(this).val());
										})
									 dataYh.field.foodKeshu=arr;
									 var selectArrjia = xmSelect.batch(/select.*/, 'getValue', 'value');
							console.log('获取匹配正则 /demo.*/ 的实例: ' + JSON.stringify(selectArrjia, null, 2))
							 dataYh.field.foodList=selectArrjia;
							
								 	$.ajax({
										type : 'post',
										url : '/YhFoodSrecipeRecordContriller/addDishInfo',
										contentType:'application/json;charset=UTF-8',	//发送信息至服务器时内容编码类型
										traditional:true,	//传统的方式来序列化数据
										data : JSON.stringify({"usedFood":dataYh.field.usedFood,"fCName":dataYh.field.fCName,"cookPerson":dataYh.field.cookPerson,"measuringUnit":dataYh.field.measuringUnit,"foodMethod":dataYh.field.foodMethod,"fCImg":dataYh.field.fCImg,"foodKeshu":dataYh.field.foodKeshu,"foodList":dataYh.field.foodList,"notRecommendFood":dataYh.field.notRecommendFood}),
										success : function(data) {
											window.location.href="/manage/content/foodl";
											layer.msg('成功');
										}
									});  
									return false;
							 }
							
							
						});

					});
</script>
</html>
