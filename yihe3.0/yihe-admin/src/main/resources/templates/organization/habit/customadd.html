<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<html>
<head>
    <meta charset="utf-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>新建习惯</title>
   <link rel="stylesheet"  th:href="@{/assets/libs/layui/css/layui.css}" />
    <link rel="stylesheet"  th:href="@{/assets/module/admin.css}"  />
</head>
<body>
 <!-- 页面加载loading -->
<div class="page-loading">
    <div class="ball-loader">
        <span></span><span></span><span></span><span></span>
    </div>
</div>

<a id="cancel" target="_self" style="display: none" href="/manage/content/habit?type=1" lay-text="习惯管理">"习惯管理"</a>
<div class="layui-fluid">
		<div class="layui-row">
			<div style="width: 100%; height: 100%; background-color: #FFF; position: relative;">
					<div th:if="${id==0}" style="font-size: 20px; font-weight: bold; margin-left: 20px; padding-top: 30px;">新建习惯</div>
				<div th:if="${id!=0}" style="font-size: 20px; font-weight: bold; margin-left: 20px; padding-top: 30px;">修改习惯</div>
				<form class="layui-form" id="express">
				
				<input id="id" name="id" type="hidden" th:value="${id}">
				
				
  
  
  
   <div class="layui-form-item">
				    <div class="layui-inline">
				      <label style="width: 15%;;"
							class="layui-form-label layui-form-required">分类</label>
						<div class="layui-input-block">
							<div class="layui-row" style="margin-left: -89px; width: 250px;">
								<select lay-filter="aihao" id="habitType" name="habitType" lay-verify="required">
								
						    	</select>
							</div>
						</div>
				    </div>
				    
				    
				
				  </div>
				  
				  
				  
				  
				 <div class="layui-form-item">
				    <div class="layui-inline">
				      <label style="width: 10%;;"
							class="layui-form-label layui-form-required">名称</label>
						<div class="layui-input-block">
							<div class="layui-row">
							
								<input style="margin-left: -89px; width: 450px;" type="text"
									name="habitName" id="habitName" lay-verify="required" lay-reqtext="名称不能为空" maxlength="8"
									placeholder="请输入名称，最大限制16个字符" autocomplete="off" 
									class="layui-input">
							</div>
						</div>
				    </div>
				    
				    
				  </div>
				  
				  <div class="layui-form-item">
				    <div class="layui-inline">
				      <label style="width: 10%;;"
							class="layui-form-label layui-form-required">简介</label>
						<div class="layui-input-block">
							<div class="layui-row">
							
								<input style="margin-left: -89px; width: 450px;" type="text"
									name="habitDesc" id="habitDesc" lay-verify="required" maxlength="16"
									placeholder="请输入简介，最大限制32个字符" autocomplete="off" 
									class="layui-input">
							</div>
						</div>
				    </div>
				  </div>
				
				
					<input id="period" name="period" type="hidden" value="1,2,3,4,5,6,7">
				<div class="layui-form-item">
			    <div class="layui-inline">
			    <label style="width: 13%;;"
							class="layui-form-label layui-form-required" id="zhouqi">打卡周期</label><i class="layui-icon layui-icon-tips" style="font-size: 25px;color: #2d8cf0;"></i>
			       <div class="layui-input-block">
				       <div class="layui-row" style="margin-left: -89px;">
					      <input type="radio" name="periodWhether" lay-filter="eventType" value="1" id="periodWhether" title="允许用户修改" checked="">
					      <input type="radio" name="periodWhether" lay-filter="eventType" value="2" title="禁止用户修改">
					    </div>
				   </div>
				   
				   <div class="layui-input-block">
				   <div class="layui-row" style="margin-left: -89px;">
				      <input type="checkbox" name="like1" id="week1" value="1"  lay-filter='filter' title="周一"  lay-skin='primary'>
				      <input type="checkbox" name="like1"  id="week2" value="2" lay-filter='filter' title="周二"  lay-skin='primary'>
				       <input type="checkbox" name="like1" id="week3" value="3" lay-filter='filter' title="周三"  lay-skin='primary'>
				      <input type="checkbox" name="like1" id="week4" value="4" lay-filter='filter' title="周四"  lay-skin='primary'>
				       <input type="checkbox" name="like1" id="week5" value="5"   lay-filter='filter' title="周五"  lay-skin='primary'>
				      <input type="checkbox" name="like1" id="week6" value="6" lay-filter='filter' title="周六"  lay-skin='primary'>
				       <input type="checkbox" name="like1" id="week7" value="7" lay-filter='filter' title="周日"  lay-skin='primary'>
				   	</div>
				   </div>
			    </div>
			  </div>
						
						
						
			<div class="layui-form-item">
			   <div class="layui-inline">
			    <label style="width: 15%;;"
							class="layui-form-label layui-form-required" id="shijian">打卡时间</label><i class="layui-icon layui-icon-tips" style="font-size: 25px;color: #2d8cf0;"></i>
			       <div class="layui-input-block">
				       <div class="layui-row" style="margin-left: -89px;">
					      <input type="radio" name="timeWhether" lay-filter="eventType" value="1" title="允许用户修改" checked="">
					      <input type="radio" name="timeWhether"  lay-filter="eventType" value="2" title="禁止用户修改">
					    </div>
				   </div>
				   
				      <div class="layui-input-block">
				       <div class="layui-row" style="margin-left: -89px;">
				        <input type="text" class="layui-input" lay-verify="required" id="test9" name="beginTime" placeholder=" - " style="width: 450px;">
				      </div>
    				</div>
    
				 </div>
			</div>
			
			<div class="layui-form-item">
			   <div class="layui-inline">
			    <label class="layui-form-label layui-form-required" id="huizhang">徽章奖励</label><i class="layui-icon layui-icon-tips" style="font-size: 25px;color: #2d8cf0;"></i>
			       <div class="layui-form-item">
					
					    <div class="layui-inline">
					      <label style="width: 30%;"
							class="layui-form-label">一级要求</label>
						<div class="layui-input-block">
							<div class="layui-row">
									 <input type="number" style="margin-left: -89px; width: 200px;" placeholder="请输入" value="7"  id="oneRank" name="oneRank" lay-verify="required|number" autocomplete="off" class="layui-input">
							</div>
						</div>
					    </div>
					    
					    
					    <div class="layui-inline">
					      <label style="width: 30%;"
							class="layui-form-label">二级要求</label>
						<div class="layui-input-block">
							<div class="layui-row">
									 <input type="number" style="margin-left: -89px; width: 200px;" placeholder="请输入"  value="21" id="twoRank" name="twoRank" lay-verify="required|number" autocomplete="off" class="layui-input">
							</div>
						</div>
					    </div>
					    
					    
					    <div class="layui-inline">
					      <label style="width: 30%;"
							class="layui-form-label">三级要求</label>
						<div class="layui-input-block">
							<div class="layui-row">
									 <input type="number" style="margin-left: -89px; width: 200px;" placeholder="请输入" value="56" name="threeRank" id="threeRank" lay-verify="required|number" autocomplete="off" class="layui-input">
							</div>
						</div>
					    </div>
					    
					    
					    <div class="layui-inline">
					      <label style="width: 30%;"
							class="layui-form-label">四级要求</label>
						<div class="layui-input-block">
							<div class="layui-row">
									 <input type="number" style="margin-left: -89px; width: 200px;" placeholder="请输入" value="84" id="fourRank" name="fourRank" lay-verify="required|number" autocomplete="off" class="layui-input">
							</div>
						</div>
					    </div>
					    
					    <div class="layui-inline">
					      <label style="width: 30%;"
							class="layui-form-label">五级要求</label>
						<div class="layui-input-block">
							<div class="layui-row">
									 <input type="number" style="margin-left: -89px; width: 200px;" placeholder="请输入胆固醇" value="168" id="fiveRank" name="fiveRank" autocomplete="off" class="layui-input">
							</div>
						</div>
					    </div>
					  </div>
    
				 </div>
			</div>
				   		
				   		
				   	

				   		
				   		<div class="layui-form-item">
						<label style="width: 72px;"
							class="layui-form-label">习惯图</label>
							<input id="lifeImg" name="lifeImg" type="hidden" value="">
				    <div class="layui-inline">
				      <div class="layui-input-block">
					     <div class="layui-upload-drag" id="test10">
							  <i class="layui-icon"></i>
							  <p>点击上传，或将图片拖拽到此处</p>
							  <p>(尺寸：4:3 )</p>
							  <div class="layui-hide" id="uploadDemoView" >
							    <hr>
							    <img src="" alt="上传成功后渲染" style="max-width: 196px">
							  </div>
							</div>
					</div>
				    </div>
					</div>
					
					
				

					
					<div class="layui-form-item" style="margin-left: -88px;padding-bottom: 40px;">
						 <div class="layui-input-block" >
	      <button class="layui-btn " lay-submit='' lay-filter="regSubmit" id="">保存</button>
	     <button type="reset" onclick="cancel()" class="layui-btn layui-btn-primary">&emsp;取消&emsp;</button>
	 </div>
					</div>
				</form>
			</div>
		</div>
	</div>


</body>
<script type="text/javascript" th:src="@{/assets/libs/layui/layui.js}"></script>
<script type="text/javascript" th:src="@{/assets/js/common.js}"></script>
<script type="text/javascript" th:src="@{/assets/js/jquery-1.11.1.js}"></script>
<script type="text/javascript">

$('#habitName').blur(function () {
    var habitName = $("#habitName").val();
    var id = $("#id").val();
    $.ajax({
 		type:'get', 
 		url:'/YhLifeHabitDictController/selctbyhabitName',
 		data:{habitName:habitName,id:id},
 		success : function(data){
 			if(data ==1){
 				layer.msg("习惯名称已被占用!");	
 			}
 		}
 	});
 })





cancel=function(){
	document.getElementById("cancel").click();
}
	
layui.use('laydate', function(){
	  var laydate = layui.laydate;
//时间范围
laydate.render({
  elem: '#test9'
  ,type: 'time'
  ,range: true,
	trigger: 'click'
});

});

	layui.use('upload', function(){
	  var $ = layui.jquery
	  ,upload = layui.upload;
	  //拖拽上传图片
	  upload.render({
	    elem: '#test10'
	    ,url: '/Uploading/addEnrollImg' //改成您自己的上传接口
    	,before: function(obj){ //obj参数包含的信息，跟 choose回调完全一致，可参见上文。
    		this.layerIndex = layer.load(0, {shade: [0.5, '#666c7f']});
    	}
	    ,done: function(res){
	    layer.close(this.layerIndex);
	      layer.msg('上传成功');
	      layui.$('#uploadDemoView').removeClass('layui-hide').find('img').attr('src', res.files);
	      layui.$("#lifeImg").val(res.files);
	      console.log(res)
	    }
	  });

	
	  
	});
	
	layui.use(['form', 'layedit', 'laydate'], function(){
		  var form = layui.form
		  ,layer = layui.layer
		  ,layedit = layui.layedit
		  ,laydate = layui.laydate;
		  
		  
		 
		   
		    form.on('checkbox(filter)', function(data){
		    	  console.log(data.elem); //得到checkbox原始DOM对象
		    	  console.log(data.elem.checked); //是否被选中，true或者false
		    	  console.log(data.value); //复选框value值，也可以通过data.elem.value得到
		    	  console.log(data.othis); //得到美化后的DOM对象
		    	  
		    	  var idnum = data.elem.id; //得到dom的id 

		    	  var chk_value =[]; 
		    	  
		    	/*   var pitc=$("#pitch").val();
		    	  if(pitc!=null){
		    		  chk_value=pitc;
		    	  } */

		    	  $('input[name="like1"]:checked').each(function(){ 
		    	  chk_value.push($(this).val()); 
		    	  }); 
		    	  layer.msg(chk_value.toString());
		    	  $("#period").val(chk_value.toString());
		    	  form.render('checkbox');
		    	  
		    	}); 
		  
		    var tip_index;
			$("#huizhang").hover(function(){
			    tip_index =  layer.tips('连续打卡达到指定日期，奖励用户徽章', this,{
			        tips: [2, 'rgba(0, 0, 0, 1)'],
			        time:0
			    });
			},function(){
			    layer.close(tip_index);
			});
			
			
			 var tip_index1;
				$("#shijian").hover(function(){
				    tip_index1 =  layer.tips('允许修改,每个用户可以重新设置自己的打卡时间', this,{
				        tips: [2, 'rgba(0, 0, 0, 1)'],
				        time:0
				    });
				},function(){
				    layer.close(tip_index1);
				});
			
				
				var tip_index2;
				$("#zhouqi").hover(function(){
				    tip_index1 =  layer.tips('允许修改,每个用户可以重新设置自己的打卡周期', this,{
				        tips: [2, 'rgba(0, 0, 0, 1)'],
				        time:0
				    });
				},function(){
				    layer.close(tip_index2);
				});
				
				
			
		  
		    var id=$("#id").val();
			if(id!=0){
				 $.ajax({
			    	 type: "post",
			         url: "/YhLifeHabitDictController/selecthabitId",
			         dataType:"json",
			         data:{"id":id},
			         success: function(data){
			        	 option(data.data.habitType);
			        	 $("#lifeImg").val(data.data.lifeImg);
			        	 $("#habitName").val(data.data.habitName);
			        	 $("#habitDesc").val(data.data.habitDesc);
			        	 if(data.data.periodWhether==1){
			        		 document.getElementsByName('periodWhether')[0].checked  = true;
			        	 }else{
			        		 document.getElementsByName('periodWhether')[1].checked  = true;
			        	 }
			        	 if(data.data.timeWhether==1){
			        		 document.getElementsByName('timeWhether')[0].checked  = true;
			        	 }else{
			        		 document.getElementsByName('timeWhether')[1].checked  = true;
			        	 }
			        	 $("#period").val(data.data.period);
			        	 $("#test9").val(data.data.beginTime+" - "+data.data.finishTime);
			        	 var strs = new Array(); //定义一数组
			        	 strs = data.data.period.split(","); //字符分割
		        		 for (i=0; i<strs.length; i++ ){
				        	 if(strs[i]==1){
				        		 $("#week1").attr("checked", true);
				        		 form.render('checkbox');
				        	 }else if(strs[i]==2){
				        		 $("#week2").attr("checked", true);
				        		 form.render('checkbox');
				        	 }else if(strs[i]==3){
				        		 $("#week3").attr("checked", true);
				        		 form.render('checkbox');
				        	 }else if(strs[i]==4){
				        		 $("#week4").attr("checked", true);
				        		 form.render('checkbox');
				        	 }else if(strs[i]==5){
				        		 $("#week5").attr("checked", true);
				        		 form.render('checkbox');
				        	 }else if(strs[i]==6){
				        		 $("#week6").attr("checked", true);
				        		 form.render('checkbox');
				        	 }else if(strs[i]==7){
				        		 $("#week7").attr("checked", true);
				        		 form.render('checkbox');
				        	 }
				       	} 
			        		
			        	 $("#oneRank").val(data.data.oneRank);
			        	 $("#twoRank").val(data.data.twoRank);
			        	 $("#threeRank").val(data.data.threeRank);
			        	 $("#fourRank").val(data.data.fourRank);
			        	 $("#fiveRank").val(data.data.fiveRank);
			        	 layui.$('#uploadDemoView').removeClass('layui-hide').find('img').attr('src', data.data.lifeImg);
			         }   	
			    });
			}else{
				 $("#week1").attr("checked", true);
        		 $("#week2").attr("checked", true);
        		 $("#week3").attr("checked", true);
        		 $("#week4").attr("checked", true);
        		 $("#week5").attr("checked", true);
        		 $("#week6").attr("checked", true);
    		  $("#week7").attr("checked", true);
        		 form.render('checkbox');
				$("#test9").val("00:00:00 - 23:59:59");
				option(0);
			}
			
			function option(id){
				var url = "/YhLifeHabitDictCategoryController/ShowselectByPrimaryKey";
				var data2 = {
					
				};
				$.post(url, data2, function(data) {
					var htmld="<option value=''>全部</option>";
			       	var item=data.data;
			        for (var i = 0; i < item.length; i++) {
			        		if(id==item[i].id){
			        			htmld+="<option selected='' value="+item[i].id+">"+item[i].categoryName+"</option>";
			        		}else{
			        			htmld+="<option  value="+item[i].id+">"+item[i].categoryName+"</option>";
			        		}
					}
			       	$('#habitType').append(htmld);
			        form.render();
				})
			}
		  
			
		  //监听提交
		  form.on('submit(regSubmit)', function(dataYh){
		  /*   layer.alert(JSON.stringify(data.field), {
		      title: '最终的提交信息'
		    }) */
		   var period= $("#period").val();
		  
		   var oneRank= $("#oneRank").val();
		   var twoRank= $("#twoRank").val();
		   var threeRank= $("#threeRank").val();
		   var fourRank= $("#fourRank").val();
		   var fiveRank= $("#fiveRank").val();
		  if(period==null || period==""){
			  layer.msg("周期不能小于一天");	
		  }else if(parseInt(oneRank.trim())>=parseInt(twoRank.trim())){
			  layer.msg("打卡天数必须呈上升趋势,“第”一级不能大于“第”二级");	
		  }else if(parseInt(twoRank.trim())>=parseInt(threeRank.trim())){
			  layer.msg("打卡天数必须呈上升趋势,“第”二级不能大于“第”三级");	
		  }else if(parseInt(threeRank.trim())>=parseInt(fourRank.trim())){
			  layer.msg("打卡天数必须呈上升趋势,“第”三级不能大于“第”四级");	
		  }else if(parseInt(fourRank.trim())>=parseInt(fiveRank.trim())){
			  layer.msg("打卡天数必须呈上升趋势,“第”四级不能大于“第”五级");	
		  }else{
			  var habitName = $("#habitName").val();
			    var id = $("#id").val();
			    $.ajax({
			 		type:'get', 
			 		url:'/YhLifeHabitDictController/selctbyhabitName',
			 		data:{habitName:habitName,id:id},
			 		success : function(data){
			 			if(data ==1){
			 				layer.msg("习惯名称已被占用!");	
			 			}
			 			if(data==0){
			 				$.ajax({
					        	 type: "post",
					             url: "/YhLifeHabitDictController/inserthabit",
					             dataType:"json",
					             data:dataYh.field,
					             success: function(data){
					          	   if(data.data==1){
					          		    layer.msg('操作成功');
											cancel();
					          	   }else{
						            	   layer.msg('操作失败');
					          	   }
					             }   	
					        });
			 			}
			 		}
			 	}); 
		  }
		    
		    return false;
		  });
		 
		 
		  
		});
	
</script>
</html>
