<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<title>审核管理</title>
   <link rel="stylesheet"  th:href="@{/assets/libs/layui/css/layui.css}" />
    <link rel="stylesheet"  th:href="@{/assets/module/admin.css}"  />
     <!-- 注意：如果你直接复制所有代码到本地，上述css路径需要改成你本地的 -->
  <style type="text/css">

	#sousuo td{
		padding-right: 5px;
		padding-top: 5px;
	}
	#sousuo .layui-input {
 		height: 40px;
	}
	.layui-table-box {
 min-height:425px;
}
  </style>
</head>
<body> 



<div class="layui-fluid">
    <div class="layui-card">
        <div class="layui-card-body">


<div class="demoTable">
		 <!-- 搜索开始 -->
		 
		 <div class="demoTable">
		 			类型:
					  <div class="layui-inline">
					    <form class="layui-form" >
							<select lay-filter="aihao" id="auditType">
								<option value="">全部</option>
						       <option value="1">膳食</option>
						       <option value="2">运动</option>
						    </select>
						</form>
					  </div>
					  
					 状态:
					  <div class="layui-inline">
					    <form class="layui-form" >
							<select lay-filter="aihao" id="auditStatus">
								<option value="">全部</option>
						       <option value="1">待审核</option>
						       <option value="3">已同意</option>
						        <option value="2">已拒绝</option>
						    </select>
						</form>
					  </div>
					 申请时间：
					  <div class="layui-inline">
					    <input type="text" class="layui-input" id="test6" style="    width: 230px;" placeholder=" - ">
					  </div>
					名称:
					  <div class="layui-inline">
					    <input class="layui-input"  name="auditTitle" id="auditTitle" placeholder="请输入" autocomplete="off">
					  </div>
					  <button class="layui-btn" data-type="reload" onclick="solo()"><i class="layui-icon"></i>搜索</button>
					  <button class="layui-btn layui-btn-primary" id="btnempty" lay-submit="" lay-filter="reset">清除</button>
					</div>
					
<!-- 搜索结束 -->
		</div>
		
<br>
<table id="LAY_table_user" lay-filter="demo"></table>
	</div>
</div>
</div>
<script type="text/html" id="barDemo">
{{# if(d.auditStatus == 3) { }}
<a class="layui-btn layui-btn-primary layui-btn-xs" lay-event="examine">查看</a>
{{# } else if(d.auditStatus == 1) { }}
     <a class="layui-btn layui-btn-normal layui-btn-xs" lay-event="consent">同意</a>
 <a class="layui-btn layui-btn-normal layui-btn-xs" lay-event="refuse">拒绝</a>
<a class="layui-btn layui-btn-primary layui-btn-xs" lay-event="examine">查看</a>

{{# } else { }}
  <a class="layui-btn layui-btn-primary layui-btn-xs" lay-event="examine">查看</a>
{{# } }}
</script>

         

          <!-- js部分 -->
<script type="text/javascript" th:src="@{/assets/libs/layui/layui.js}"></script>
<script type="text/javascript" th:src="@{/assets/js/common.js}"></script>
<!-- 注意：如果你直接复制所有代码到本地，上述js路径需要改成你本地的 -->
<script>



layui.use(['layer', 'form', 'admin', 'table', 'util','laydate'], function () {
    var $ = layui.jquery;
    var layer = layui.layer;
    var form = layui.form;
    var admin = layui.admin;
    var util = layui.util;
    var laydate = layui.laydate;
    table = layui.table;
  //搜索的方法
   solo=function(){
     table.reload('tableBank', {
        where: { //设定异步数据接口的额外参数，任意设
        'auditStatus':$("#auditStatus").val(),
        'auditTitle':$("#auditTitle").val(),
        'auditType':$("#auditType").val(),
        'entryTime':$("#test6").val(),
       }
      });
     
    }
  
   //日期范围
   laydate.render({
     elem: '#test6'
     ,range: true,
	   trigger: 'click'
   });
   
 //清除按钮
   $("#btnempty").click(function(){
   	window.location.reload();
   })
  
	table.on('tool(demo)', function(obj) { //注：tool是工具条事件名，test是table原始容器的属性 lay-filter="对应的值"
		var data = obj.data; //获得当前行数据
		var layEvent = obj.event; //获得 lay-event 对应的值
		var tr = obj.tr; //获得当前行 tr 的DOM对象
		if (layEvent === 'consent') { //删除
			layer.confirm('您确定同意吗？', function(index) {
				layer.close(index);
				//向服务端发送删除指令.
				var url = "/YhAuditCheckController/updateCheck";
				var data2 = {
					'auditId' : data.auditId,
					'checkid' : data.checkid,
					'auditType' : data.auditType
				};
				$.post(url, data2, function(e) {
					table.reload('tableBank');
					if(e.data==1){
						layer.msg("成功");
						tableReload();//重载表格的方法
					}else{
						layer.msg("失败");
					}
						
					
				})
			});
		} else if (layEvent === 'examine') {
			if(data.auditType==1){//膳食
				window.location.href="/manage/content/foodladddit?id="+data.auditId;
			}else{//运动
				window.location.href="/manage/content/moveladddit?id="+data.auditId;
			}
			
		}else if(layEvent === 'refuse'){
			layer.confirm('您确定拒绝吗？', function(index) {
				layer.close(index);
				var url = "/YhAuditCheckController/updateCheckrefuse";
				var data2 = {
					'auditId' : data.auditId,
					'checkid' : data.checkid,
					'auditType' : data.auditType
				};
				$.post(url, data2, function(e) {
					table.reload('tableBank');
					if(e.data==1){
						layer.msg("成功");
						tableReload();//重载表格的方法
					}else{
						layer.msg("失败");
					}
						
					
				})
			});
		}
	});
    
  //方法级渲染
	table.render({
		elem : '#LAY_table_user',
		url : '/YhAuditCheckController/selectaudit',
		method:'post',
		cols : [ [ {type:'numbers'}, {
			field : 'auditId',
			title : '对于id',
			hide: true
		},
		{
            title: '审核类型', templet: function (d) {
                var strs = [
                    '<span >膳食</span>',
                    '<span >运动</span>'
                ];
                if(d.auditType==1){
                    return strs[0];
                }else{
                    return strs[1];
                }
            }, align: 'auditType', width: 100
        }, {
			field : 'auditTitle',
			title : '名称',
		},
        {
			field : 'auditName',
			title : '申请人',
		},{
            templet: function (d) {
                return util.toDateString(d.auditDate);
            }, title: '申请日期', align: 'auditDate'
        },
		{
            title: '审核状态', templet: function (d) {
                var strs = [
                    '<text>待审核</text>',	
                    '<text style="color:rgba(67, 207, 124, 1)">已同意</text>',
                    '<text style="color:red">已拒绝</text>'
                ];
                if(d.auditStatus==3){
                    return strs[1];
                }else if(d.auditStatus==1){
                    return strs[0];
                }else{
                	return strs[2];
                }
            }, align: 'auditStatus', width: 100
        },{
			fixed : 'right',
			title : '操作',
			align : 'center',
			toolbar : '#barDemo'
		} ] ],
		id : 'tableBank',
		page : true,
		done: function(res, curr, count){
	         if(count > 20) {
	          $(".layui-table-page").show();
	         }else {
	          $(".layui-table-page").hide();
	         }
	       }
	});


    

  
  
});




</script>

</body>
</html>
