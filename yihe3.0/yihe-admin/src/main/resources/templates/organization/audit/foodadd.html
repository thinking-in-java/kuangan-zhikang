<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<html>
<head>
    <meta charset="utf-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>食物库管理</title>
   <link rel="stylesheet"  th:href="@{/assets/libs/layui/css/layui.css}" />
    <link rel="stylesheet"  th:href="@{/assets/module/admin.css}"  />
</head>
<body>
 <!-- 页面加载loading -->
<div class="page-loading">
    <div class="ball-loader">
        <span></span><span></span><span></span><span></span>
    </div>
</div>

<a id="cancel" target="_self" style="display: none" href="/manage/content/manageaudit" lay-text="食物管理">"食物管理"</a>
<div class="layui-fluid">
		<div class="layui-row">
			<div style="width: 100%; height: 100%; background-color: #FFF; position: relative;">
				<div style="font-size: 20px; font-weight: bold; margin-left: 20px; padding-top: 30px;">新建食物</div>
				
				<form class="layui-form" id="express">
				
				<input id="fCId" name="fCId" type="hidden" th:value="${id}">
				
				 <div class="layui-form-item">
				    <div class="layui-inline">
				      <label style="width: 10%;;"
							class="layui-form-label layui-form-required">名称</label>
						<div class="layui-input-block">
							<div class="layui-row">
							
								<input style="margin-left: -89px; width: 450px;" type="text"
									name="fCName" id="fCName"  lay-verify="required" lay-reqtext="名称是必填项，岂能为空？" maxlength="10"
									placeholder="请输入名称，最大限制10个字符" autocomplete="off" lay-verType="tips"
									class="layui-input">
							</div>
						</div>
				    </div>
				    
				    
				<input id="fCImg" name="fCImg" type="hidden" value="">

				    <div class="layui-inline">
				      <div class="layui-input-block">
					     <div class="layui-upload-drag" id="test10">
							  <i class="layui-icon"></i>
							  <p>点击上传，或将图片拖拽到此处</p>
							  <div class="layui-hide" id="uploadDemoView" >
							    <hr>
							    <img src="" alt="上传成功后渲染" style="max-width: 196px">
							  </div>
							</div>
					</div>
				    </div>
				  </div>
				
					
					<div style="font-size: 20px; font-weight: bold; margin-left: 20px; padding-top: 30px;">营养成分(每100克营养元素参考值)</div>
					<div class="layui-form-item">
					
					    <div class="layui-inline">
					      <label style="width: 30%;"
							class="layui-form-label layui-form-required">重量(克)</label>
						<div class="layui-input-block">
							<div class="layui-row">
									 <input type="text" style="margin-left: -89px; width: 200px;" disabled name="number" id="number" value="100" lay-verify="required|number" autocomplete="off" class="layui-input">
							</div>
						</div>
					    </div>
					    
					    
					    <div class="layui-inline">
					      <label style="width: 40%;"
							class="layui-form-label layui-form-required">热量(千卡)</label>
						<div class="layui-input-block">
							<div class="layui-row">
									 <input type="number" style="margin-left: -89px; width: 200px;" placeholder="请输入热量"  id="energyKcal" name="energyKcal" lay-verify="required|number" autocomplete="off" class="layui-input">
							</div>
						</div>
					    </div>
					    
					    
					    <div class="layui-inline">
					      <label style="width: 50%;"
							class="layui-form-label layui-form-required">碳水化合物(克)</label>
						<div class="layui-input-block">
							<div class="layui-row">
									 <input type="number" style="margin-left: -89px; width: 200px;" placeholder="请输入碳水化合物" id="cho" name="cho" lay-verify="required|number" autocomplete="off" class="layui-input">
							</div>
						</div>
					    </div>
					    
					    
					    <div class="layui-inline">
					      <label style="width: 30%;"
							class="layui-form-label layui-form-required">脂肪(克)</label>
						<div class="layui-input-block">
							<div class="layui-row">
									 <input type="number" style="margin-left: -89px; width: 200px;" placeholder="请输入脂肪" name="fat" id="fat" lay-verify="required|number" autocomplete="off" class="layui-input">
							</div>
						</div>
					    </div>
					    
					    
					    <div class="layui-inline">
					      <label style="width: 40%;"
							class="layui-form-label layui-form-required">蛋白质(克)</label>
						<div class="layui-input-block">
							<div class="layui-row">
									 <input type="number" style="margin-left: -89px; width: 200px;" placeholder="请输入蛋白质" id="protein" name="protein" lay-verify="required|number" autocomplete="off" class="layui-input">
							</div>
						</div>
					    </div>
					    
					    <div class="layui-inline">
					      <label style="width: 40%;"
							class="layui-form-label layui-form-required">纤维素(克)</label>
						<div class="layui-input-block">
							<div class="layui-row">
									 <input type="number" style="margin-left: -89px; width: 200px;" placeholder="请输入纤维素" id="cellulose" name="cellulose" lay-verify="required|number" autocomplete="off" class="layui-input">
							</div>
						</div>
					    </div>
					  </div>
					
					
					<div class="layui-form-item">
						<label style="width: 72px;"
							class="layui-form-label layui-form-required">描述信息</label>
						<div class="layui-input-block">
							<div class="layui-row">
								<textarea placeholder="请输入内容"  style="margin-left: -89px;" id="appraise" name="appraise" class="layui-textarea"></textarea>
							</div>
						</div>
					</div>
					
					
				

					
					<div class="layui-form-item" style="margin-left: -88px;padding-bottom: 40px;">
						 <div class="layui-input-block" >
	      <button type="button" onclick="add()" class="layui-btn layui-btn-normal">立即添加</button>
	     <button type="reset" onclick="cancel()" class="layui-btn layui-btn-primary">&emsp;取消&emsp;</button>
	 </div>
					</div>
				</form>
			</div>
		</div>
	</div>


</body>
<script type="text/javascript" th:src="@{/assets/libs/layui/layui.js}"></script>
<script type="text/javascript" th:src="@{/assets/js/common.js}"></script>
<script type="text/javascript" th:src="@{/assets/js/jquery-1.11.1.js}"></script>
<script type="text/javascript">

$(function(){
	var fcid=$("#fCId").val();
	if(fcid!=0 || fcid!=""){
		 $.ajax({
	    	 type: "post",
	         url: "/YhFoodCookBook/selectfCIdfood",
	         dataType:"json",
	         data:{"fCId":fcid},
	         success: function(data){
	        	 $("#cellulose").val(data.data.cellulose);
	        	 $("#cho").val(data.data.cho);
	        	 $("#energyKcal").val(data.data.energyKcal);
	        	 $("#appraise").val(data.data.appraise);
	        	 $("#fCImg").val(data.data.fCImg);
	        	 $("#fCName").val(data.data.fCName);
	        	 $("#fat").val(data.data.fat);
	        	 $("#protein").val(data.data.protein);
	        	 layui.$('#uploadDemoView').removeClass('layui-hide').find('img').attr('src', data.data.fCImg);
	         }   	
	    });
	}
})

function add(){
	  var d =$("#express").serialize();
	  	 $.ajax({
        	 type: "post",
             url: "/YhFoodCookBook/insertfood",
             dataType:"json",
             data:d,
             success: function(data){
          	   if(data.data==1){
          		    layer.msg('操作成功');
						cancel();
          	   }else{
	            	   layer.msg('操作失败');
          	   }
             }   	
        });
}

cancel=function(){
	document.getElementById("cancel").click();
}
	
	layui.use('upload', function(){
	  var $ = layui.jquery
	  ,upload = layui.upload;
	  
	  //拖拽上传图片
	  upload.render({
	    elem: '#test10'
	    ,url: '/Uploading/addEnrollImg' //改成您自己的上传接口
	    ,done: function(res){
	      layer.msg('上传成功');
	      layui.$('#uploadDemoView').removeClass('layui-hide').find('img').attr('src', res.files);
	      layui.$("#fCImg").val(res.files);
	      console.log(res)
	    }
	  });

	
	  
	});
</script>
</html>
