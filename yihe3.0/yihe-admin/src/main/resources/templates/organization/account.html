                $(document).ready(function (){
                    var parent$ = window.layui.jquery;
                    var dk = $(window.parent.document).find("#layui-layer-iframe1").attr("src");
                    var query = window.parent.location.search.substring(1);
                    var vars = query.split("?");

                    var theRequest = new Object();

                    for(var i =0;i<vars.length;i++){
                        theRequest=decodeURI(vars[i].split("&")[1].split("=")[1]);

                    }
                    if(theRequest == 2) {
                        setTimeout(function(){
                            $(".layui-tab-title li").each(function() {
                                var tet  = $(this).text();
                                if(tet=="管理员账号"){
                                    $(this).click();
                                }
                            })
                            // $(".layui-tab-title li:nth-of-type(2)").click()
                        },400);
                    }
                });

                $('.site-demo-active').on('click', function() {
                    var othis = $(this), type = othis.data('type');
                    active[type] ? active[type].call(this, othis) : '';
                });

                    // layer.tips(this.value + ' ' + this.name + '：'+ obj.elem.checked, obj.othis);
                    var lockFlag=0;
                    if(obj.elem.checked==true){
                        lockFlag=2;
                    }else{
                        lockFlag=1;
                    }
                    $.ajax({
                        type: "post",
                        traditional:true,
                        dataType: "json",

                            notices.success({

                        }

                    //示范一个公告层

                        ,closeBtn: false

                        ,btn: ['保存', '取消']
                        ,btnAlign: 'c'
                        ,moveType: 1 //拖拽模式，0或者1

                              ,target: '_blank'
                            }); */
                        },yes: function(index, layero){
                            var val = $('input[name="killOrder"]:checked').val();

                            datas.roleid=val;

                                notices.error({
                                    title: '提示',

                                });

                                console.log(datas)
                                fenpeiyishis(datas);
                            }

                    $.ajax({

                        dataType: "json",
                        data:data,
                        url: "/YhUserManage/changeusermanager",
                        success:function(data){
                            notices.success({
                                title: '消息通知',
                                message: '修改成功'
                            });
                            window.location.reload();
                        }
                    })
                }

                    $.ajax({
                        type: "GET",

                        url: "/YhUserManage/selectallrole",
                        dataType: "json",
                        success:function(data){
                            var htmls="<div style='width: 100%;height: 10px'></div>";
                            for (var i = 0; i < data.data.length; i++) {
                                htmls+="<li style='margin-top: 10px;margin-left: 30px;'><input style='display: block;float: left;margin-top: 4px' type='radio'  name='killOrder' value='"+data.data[i].roleId+"'/><label class='yishiname' style='width: 25%;display: block;float: left;margin-left: 20px;'>"+data.data[i].roleName+"</label><label class='killOrder1' ;display: block;float: left>"+data.data[i].roleDescription+"</label></li>"
                            }

//                   选中节点，根据id筛选

//                   获取zTree对象，可以调用zTree方法

//                   刷新树结构
