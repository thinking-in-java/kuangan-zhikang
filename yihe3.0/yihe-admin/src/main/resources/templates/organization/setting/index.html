	  table.on('tool(slideshow)', function(obj) { //注：tool是工具条事件名，test是table原始容器的属性 lay-filter="对应的值"
		   var data = obj.data;
           var layEvent = obj.event;
           if (layEvent === 'slideedit') { // 修改
               showEditModel(data);
           } else if (layEvent === 'slidelete') { // 删除
        	   layer.confirm('真的删除行么', function(index) {
					obj.del(); //删除对应行（tr）的DOM结构，并更新缓存
					layer.close(index);
					//向服务端发送删除指令.
					var url = "/YhHomeinfoConfigControoler/deleteEnrooll";
					var data2 = {
						'id' : data.id
					};
					$.post(url, data2, function(e) {
						table.reload('lbtu');
						if(e.data==1){
							layer.msg("删除成功");
							window.location.reload();
							tableReload();//重载表格的方法
						}else{
							layer.msg("删除失败");
						}
							
						
					})
				});
           
           }else if(layEvent === 'below'){
        	   layer.confirm('真的确认下移吗?', function(index) {
					var url = "/YhHomeinfoConfigControoler/amendinfotip";

						'infotip':data.infoTip

						}else{
