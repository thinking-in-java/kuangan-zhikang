  function createTime(v){
		var date = new Date(v);
	    var y = date.getFullYear();
	    var m = date.getMonth()+1;
	    m = m<10?'0'+m:m;
	    var d = date.getDate();
	    d = d<10?("0"+d):d;
	    var h = date.getHours();
	    h = h<10?("0"+h):h;
	    var M = date.getMinutes();
	    M = M<10?("0"+M):M;
	    var str = y+"-"+m+"-"+d;
	    return str;
	}

	function exportData(shuz) {
		fetch('/YhUserReginfo/exportXls', {
			method: 'POST',
			headers: {
				'Content-Type': 'application/json',
			},
			body: JSON.stringify({ shuzu: shuz }), // JSON 格式
		})
				.then(response => {
					if (!response.ok) {
						throw new Error('Network response was not ok');
					}
					return response.blob(); // 将响应数据转换为 Blob 类型
				})
				.then(blob => {
					// 创建一个下载链接
					const url = window.URL.createObjectURL(blob);
					const a = document.createElement('a');
					a.href = url;
					a.download = '注册卡导出.xls'; // 设置文件名
					document.body.appendChild(a);
					a.click();
					document.body.removeChild(a);
					window.URL.revokeObjectURL(url); // 释放 URL 对象
				})
				.catch(error => {
					console.error('Error:', error);
				});
	}

	function jihuoma(data){
		var shuz=new Array()
		var jishu=0;
		for (var i = 0; i < data.length; i++) {
			if(data[i].checked){
				if((data[i].user_name==null||data[i].user_name=="")&&(data[i].key==null||data[i].key=="")){
					shuz[jishu]=data[i].Enrol_Card_Id
					jishu++;

						message: '请选择未使用的注册卡'
					});
					return;
				}
			}
		}

		datas.shuzu=shuz
		console.log(datas)
		cardIdActivation(datas);
	}
