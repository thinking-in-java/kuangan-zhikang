<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>报告与档案中心 · 报告上传中心</title><link rel="stylesheet" href="center.css?v=report-migration-20261125w2"></head>
<body><main class="center">
<nav class="breadcrumb"><strong>报告与档案中心</strong><span>/</span>报告上传中心</nav>
<div class="overview"><section class="upload-column"><h1>报告上传中心 <small>支持多种格式、批量上传、自动识别与处理</small></h1>
<div class="upload-tools"><div class="drop-zone" id="drop-zone" tabindex="0" role="button" aria-label="选择体检报告上传"><span class="cloud-icon" data-icon="cloud"></span><h2>拖拽文件到此处，或 <span class="upload-link">点击上传</span></h2><p>支持格式：PDF、JPG、PNG</p><p>单个文件≤20MB，支持多文件批量上传</p><div class="file-formats"><span class="format pdf"><b>PDF</b><small>PDF</small></span><span class="format jpg"><b>JPG</b><small>JPG</small></span><span class="format png"><b>PNG</b><small>PNG</small></span><span class="format unavailable" title="当前识别服务暂不支持 BMP"><b>BMP</b><small>待接入</small></span><span class="format unavailable" title="当前识别服务暂不支持 Word"><b>Word</b><small>待接入</small></span></div></div>
<div class="quick-actions"><button data-action="single"><span data-icon="user"></span><span><strong>单份上传</strong><small>上传单个体检报告文件</small></span></button><button class="batch-primary" data-action="batch"><span data-icon="layers"></span><span><strong>批量上传</strong><small>一次上传多个报告文件</small></span></button><button data-action="merge"><span data-icon="folder"></span><span><strong>多份报告合并</strong><small>按职工查看多份报告与原件</small></span></button><button data-action="tasks"><span data-icon="clock"></span><span><strong>上传任务中心</strong><small>查看上传与处理进度</small></span></button></div></div></section>
<section class="status-panel"><header><h2>报告处理状态统计</h2><button data-action="refresh"><span data-icon="refresh"></span>刷新</button></header><div class="status-content"><div id="status-chart"></div><div id="chart-legend"></div></div></section></div>
<section class="archive-tools" aria-label="档案与报告操作"><div><button data-action="single" class="primary">上传体检报告</button><button data-action="tasks">识别任务与进度</button><button data-action="camera">拍照上传</button><button data-action="sync">小程序同步</button><button data-action="new">新增档案</button><button data-action="corrections">资料更正申请</button><button data-action="import">批量导入档案</button><a href="/ehr/api/records/export">导出职工档案</a></div><p>原件保存 → 自动识别 → 结果核对 → 医生审核 → 正式归档。上传和小程序报告共用同一份档案数据。</p></section>
<div id="status-tabs" class="status-tabs" role="group" aria-label="报告处理状态"></div>
<form id="filters" class="filters"><label>体检时间：<span class="date-range"><input name="from" type="date" aria-label="开始日期"><span>-</span><input name="to" type="date" aria-label="结束日期"></span></label><label>所属单位：<select name="organization" aria-label="所属单位"><option value="">全部单位</option></select></label><label>报告来源：<select name="channel" aria-label="报告来源"><option value="">全部</option><option value="backend_file">后台文件</option><option value="phone_photo">拍照上传</option><option value="miniapp">小程序上传</option><option value="batch_import">批量导入</option><option value="legacy_import">历史导入</option></select></label><input name="search" class="search" placeholder="请输入职工姓名/工号/文件名" aria-label="搜索报告"><button type="reset">重置</button><button class="primary" type="submit"><span data-icon="search"></span>查询</button></form>
<p id="page-message" role="status" hidden></p><div class="table-scroll"><table><thead><tr><th><input type="checkbox" id="select-all" aria-label="选择当前页所有报告"></th><th>序号</th><th>文件名</th><th>文件类型</th><th>报告日期</th><th>识别状态</th><th>匹配状态</th><th>关联职工</th><th>上传时间</th><th>操作</th></tr></thead><tbody id="report-rows"><tr><td colspan="10" class="empty">正在加载报告…</td></tr></tbody></table></div>
<footer class="table-footer"><div class="batch-actions"><span id="selected-count">已选择 0 项</span><button data-action="batch-recognize" disabled>批量识别</button><button data-action="batch-check" disabled>批量核对</button><button data-action="batch-review" disabled>批量审核</button><button data-action="batch-archive" disabled>批量归档</button><button data-action="batch-delete" disabled>批量删除</button></div><div id="pagination" class="pagination"></div></footer>
</main><input id="file-picker" type="file" accept=".pdf,.jpg,.jpeg,.png" hidden><dialog id="center-dialog"><header><strong id="dialog-title"></strong><button data-action="close" aria-label="关闭">×</button></header><div id="dialog-body"></div></dialog><div id="toast" role="status"></div><script src="/assets/libs/echarts/echarts.min.js"></script><script src="upload-wizard.js?v=20261125w2"></script><script src="center.js?v=report-migration-20261125w2"></script></body></html>
