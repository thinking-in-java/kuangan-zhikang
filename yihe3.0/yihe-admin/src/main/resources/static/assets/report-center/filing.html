<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>档案填写工作台 · 报告与档案中心</title><link rel="stylesheet" href="occupational.css?v=20261124"><link rel="stylesheet" href="filing.css?v=20261124-release"></head><body><main class="filing-page"><nav class="breadcrumb"><a href="index.html">报告与档案中心</a><span>/</span><strong>档案填写工作台</strong></nav><header class="filing-heading"><h1>档案填写工作台</h1><p>支持多种档案模板、表单填写、AI 辅助填写、职工确认、医生审核、打印导出与版本管理</p></header><div id="filing-kpis" class="filing-kpis" aria-label="档案办理统计"></div><nav class="work-navigation"><div class="task-tabs" role="tablist"><button data-state="pending" class="active">待办任务</button><button data-state="progress">进行中</button><button data-state="completed">已完成</button></div><div class="type-tabs" role="tablist"><button data-kind="occupational" class="active">职业健康监护档案（法定业务档案）</button><button data-kind="general">普通健康数据档案（个人健康档案）</button></div><div class="work-tools"><button data-do="templates">模板管理</button><button data-do="versions">版本管理</button><button data-do="print">打印</button><button data-do="export">导出</button></div></nav><p id="error" role="alert" hidden></p><div class="filing-layout"><aside class="task-column"><form id="task-filter"><label>档案类型：<select name="kind" aria-label="选择档案类型"><option value="occupational">职业健康监护档案</option><option value="general">普通健康数据档案</option></select></label><input name="search" placeholder="请输入职工姓名/工号" aria-label="搜索办理职工"><button class="sr-only">查询</button></form><div id="task-list" class="task-list"><p class="empty">正在加载档案任务…</p></div><div id="task-pagination" class="task-pagination"></div><footer class="task-selection"><label><input id="select-all" type="checkbox">全选</label><span id="selected-count">已选 0 项</span><button class="primary" data-do="batch">批量填写</button></footer></aside><section class="work-center"><header class="form-heading"><h2 id="document-title">职业健康监护档案</h2><button class="title-person" data-do="employee">选择职工</button><span id="document-version"></span></header><div id="steps" class="workflow-steps"></div><p id="source-notice" hidden role="status"></p><div class="editor-layout"><aside class="form-catalog"><h3>表单目录</h3><nav id="form-catalog"></nav></aside><section id="form-body" class="form-body"><p class="empty">请选择左侧职工档案</p></section></div></section><aside class="work-assistant"><header><span id="assistant-icon"></span><h2>AI 辅助填写 <small>档案小谷</small></h2></header><div id="source-summary" class="source-summary"></div><ul id="source-checks" class="source-checks"></ul><div class="assistant-buttons"><button class="primary" data-do="fill">一键填充</button><button data-do="validate">智能校验</button></div><button class="ai-analyze" data-do="ai">AI 分析原始资料</button><section class="handling-log"><h3>办理进度与记录</h3><div id="handling-log"></div></section></aside></div><footer class="work-footer"><div><button data-do="save">保存草稿</button><button data-do="validate">表单校验</button></div><div><button data-do="preview">预览</button><button data-do="previous">上一步</button><button class="primary" data-do="next">下一步（职工确认）</button></div></footer></main><dialog id="dialog"><header><h2 id="dialog-title"></h2><button data-do="close" aria-label="关闭对话框">×</button></header><div id="dialog-body"></div></dialog><div id="toast" role="status"></div><script src="filing.js?v=20261124-release" defer></script></body></html>
