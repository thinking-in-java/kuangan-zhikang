<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>档案审核与归档 · 报告与档案中心</title><link rel="stylesheet" href="center.css?v=20261124"><link rel="stylesheet" href="review.css?v=20261126-paragraphs"></head><body>
<main class="review-page"><div class="review-layout"><section class="review-main"><header class="review-heading"><nav class="breadcrumb"><strong>报告与档案中心</strong><span>/</span>档案审核与归档</nav><h1>档案审核与归档</h1><p>正常报告由档案小谷自动入档并交给评估小谷，无需逐份打开原件或点击归档。此处主要处理身份、字段和医疗异常；行政入档与医疗审核分别记录。</p></header><div class="auto-archive-tools"><a href="review.html?status=exceptions">异常处理队列</a><a href="review.html?status=auto_archived">自动归档记录</a><a href="/assets/assessment/exam.html">查看评估小谷任务</a><button id="start-page-automation" type="button">启动本页历史报告自动整理</button></div><div id="review-kpis" class="review-kpis" aria-label="审核归档统计"></div><form id="review-filters" class="review-filters"><div><label>报告类型：<select name="type" aria-label="报告类型"><option value="">全部</option></select></label><label>所属单位：<select name="organization" aria-label="所属单位"><option value="">全部单位</option></select></label><label>审核状态：<select name="status" aria-label="审核状态"><option value="exceptions">异常任务</option><option value="auto_archived">已自动归档·待医疗审核</option><option value="partial_archived">已入档·字段待核验</option><option value="all">全部</option><option value="draft">待提交</option><option value="pending">待审核</option><option value="returned">退回修改</option><option value="ready">可归档</option><option value="archived">已归档</option><option value="rejected">已驳回</option></select></label></div><div><label>体检日期：<span class="review-dates"><input name="from" type="date" aria-label="开始日期"><span>—</span><input name="to" type="date" aria-label="结束日期"></span></label><label class="review-search-label">职工姓名/工号/报告号：<input name="search" placeholder="输入职工姓名/工号/报告号" aria-label="搜索审核报告"></label><button class="primary" type="submit">⌕ 查询</button><button type="reset">重置</button></div></form><p id="review-message" role="status" hidden></p><div class="review-table-scroll"><table class="review-table"><thead><tr><th><input type="checkbox" id="review-select-all" aria-label="选择当前页报告"></th><th>序号</th><th>职工姓名</th><th>工号</th><th>报告类型</th><th>体检日期</th><th>身份匹配</th><th>审核状态</th><th>提交时间</th><th>操作</th></tr></thead><tbody id="review-rows"><tr><td colspan="10" class="empty">正在加载审核报告…</td></tr></tbody></table></div><footer class="review-list-footer"><div class="review-batch"><span id="review-selected">已选择 0 项</span><button data-do="batch-approve" disabled>♙ 批量审核</button><button data-do="batch-return" disabled>♧ 批量退回修改</button><button data-do="batch-archive" disabled>▣ 批量归档</button><button data-do="export">⇩ 导出列表</button></div><div id="review-pagination" class="review-pagination"></div></footer></section>
<aside id="review-detail" class="review-detail"><header class="review-detail-heading"><h2>▣ 审核详情</h2><button data-do="close-detail" aria-label="关闭审核详情">×</button></header><nav class="review-tabs" role="tablist"><button data-tab="report" role="tab" aria-selected="true">报告信息</button><button data-tab="ocr" role="tab" aria-selected="false">OCR识别数据</button><button data-tab="changes" role="tab" aria-selected="false">字段修改记录</button><button data-tab="versions" role="tab" aria-selected="false">版本记录</button></nav><div id="review-detail-body" class="review-detail-body"><div class="empty">请选择左侧报告</div></div><footer class="review-detail-actions"><button class="return-button" data-do="return" disabled>↶ 退回修改</button><button class="primary" data-do="approve-archive" disabled>✓ 确认医疗审核并签署</button></footer></aside></div></main>
<dialog id="review-dialog"><header><strong id="review-dialog-title"></strong><button data-do="close" aria-label="关闭">×</button></header><div id="review-dialog-body"></div></dialog><div id="toast" role="status"></div><script type="module" src="review.js?v=20261126-quality-context"></script></body></html>
