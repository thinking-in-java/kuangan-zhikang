<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>报告匹配与核对 · 报告与档案中心</title><link rel="stylesheet" href="center.css?v=20261123"><link rel="stylesheet" href="matching.css?v=20261123-final"></head><body>
<main class="matching-page"><nav class="breadcrumb"><strong>报告与档案中心</strong><span>/</span>报告匹配与核对</nav><header class="matching-heading"><h1>报告匹配与核对 <span>AI辅助</span></h1><p>根据报告识别信息生成职工匹配建议，对匹配结果进行人工确认和校对，确保报告与职工正确关联。</p></header>
<div class="matching-workspace"><section class="matching-main"><div id="matching-kpis" class="matching-kpis" aria-label="匹配统计"></div><section class="matching-table-panel"><form id="matching-filters" class="matching-filters"><label>匹配状态：<select name="status" aria-label="匹配状态"><option value="all">全部状态</option><option value="pending">待匹配报告</option><option value="exact">精确匹配</option><option value="similar">疑似匹配</option><option value="none">无匹配</option><option value="flagged">待复核</option><option value="matched">已确认 / 归档</option><option value="confirmed">已确认匹配</option><option value="archived">已归档</option><option value="locked">已审核锁定</option></select></label><label>报告日期：<span class="matching-dates"><input name="from" type="date" aria-label="开始日期"><span>—</span><input name="to" type="date" aria-label="结束日期"></span></label><label>报告来源：<select name="channel" aria-label="报告来源"><option value="">全部</option><option value="backend_file">后台上传</option><option value="phone_photo">拍照上传</option><option value="miniapp">小程序上传</option><option value="batch_import">批量导入</option><option value="legacy_import">历史导入</option></select></label><input name="search" placeholder="输入姓名/工号/身份证…" aria-label="搜索报告"><button class="primary" type="submit">⌕ 查询</button><button type="reset">重置</button></form><p id="matching-error" class="error" role="status" hidden></p><div class="matching-table-scroll"><table class="matching-table"><thead><tr><th><input id="matching-select-all" type="checkbox" aria-label="选择当前页"></th><th>序号</th><th>报告文件</th><th>体检日期</th><th>识别信息（姓名 / 工号 / 身份证）</th><th>自动匹配建议</th><th>匹配职工</th><th>操作</th></tr></thead><tbody id="matching-rows"><tr><td colspan="8" class="empty">正在加载报告…</td></tr></tbody></table></div><footer class="matching-list-footer"><div class="matching-batch"><span id="matching-selected">已选择 0 项</span><button data-do="batch-match" disabled>批量匹配</button><button data-do="batch-recognize" disabled>批量重新识别</button><button data-do="batch-flag" disabled>批量标记</button><button data-do="export">导出列表</button></div><div id="matching-pagination" class="matching-pagination"></div></footer></section></section>
<aside id="matching-detail" class="matching-detail"><header class="matching-detail-heading"><h2>匹配与校对详情</h2><button data-do="close-detail" aria-label="关闭详情">×</button></header><nav class="matching-tabs" role="tablist"><button data-tab="report" role="tab" aria-selected="true">报告信息</button><button data-tab="result" role="tab" aria-selected="false">匹配结果</button><button data-tab="employee" role="tab" aria-selected="false">选择职工</button><button data-tab="history" role="tab" aria-selected="false">校对记录</button></nav><div id="matching-detail-body" class="matching-detail-body"><div class="empty">请选择左侧报告</div></div><footer class="matching-detail-actions"><button data-do="unmatched" disabled>标记为无匹配</button><button class="primary" data-do="confirm" disabled>确认匹配并关联</button><button class="green" data-do="save" disabled>保存校对结果</button></footer></aside></div></main>
<dialog id="matching-dialog"><header><strong id="matching-dialog-title"></strong><button data-do="close" aria-label="关闭">×</button></header><div id="matching-dialog-body"></div></dialog><div id="toast" role="status"></div><script type="module" src="matching.js?v=20261123-final"></script></body></html>
