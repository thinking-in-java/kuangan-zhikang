<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OCR 识别工作台 · 报告与档案中心</title><link rel="stylesheet" href="center.css?v=20261123"><link rel="stylesheet" href="ocr.css?v=20261123"></head><body>
<main class="ocr-workbench"><header class="workbench-heading"><div><h1>OCR 识别工作台 <span class="info-icon" title="以报告原件为依据，人工核对识别结果">ⓘ</span></h1><p>档案小谷 · 自动识别体检报告，提取结构化数据，支持人工校对与修改</p></div><div class="agent-profile"><span class="agent-avatar" aria-hidden="true"><svg viewBox="0 0 64 64"><path d="M32 5v8m-5-8h10"/><rect x="12" y="14" width="40" height="32" rx="14"/><rect class="agent-face" x="18" y="21" width="28" height="16" rx="8"/><circle cx="26" cy="29" r="2"/><circle cx="38" cy="29" r="2"/><path d="M22 47l-5 10m25-10 5 10M10 25H6v12h5m42-12h5v12h-5"/></svg></span><div><strong>档案小谷</strong><small>报告识别、数据提取、字段校验</small></div><span id="agent-status" class="agent-status">加载中</span></div></header>
<section id="ocr-kpis" class="ocr-kpis" aria-label="报告处理状态统计"></section>
<p id="workbench-message" role="status" hidden></p>
<div class="ocr-layout"><section class="original-panel" aria-label="报告原件预览"><div class="preview-toolbar"><strong id="current-file">当前文件：加载中…</strong><select id="source-selector" aria-label="选择原件" hidden></select><div class="preview-controls"><button data-do="previous" aria-label="上一页">‹</button><label><input id="page-number" type="number" min="1" value="1" aria-label="原件页码"><span id="page-total">/ 0</span></label><button data-do="next" aria-label="下一页">›</button><button data-do="zoom-out" aria-label="缩小">−</button><button data-do="zoom-reset" aria-label="适应宽度">适宽</button><button data-do="zoom-in" aria-label="放大">＋</button><button data-do="rotate" aria-label="旋转原件">↻</button><a id="original-download" href="#" target="_blank" rel="noopener">⇩ 原件下载</a></div></div><div class="document-viewer"><nav id="thumbnail-list" class="thumbnail-list" aria-label="原件页面缩略图"></nav><div id="page-stage" class="page-stage"><div id="preview-message">正在读取原件…</div><canvas id="original-canvas" hidden aria-label="当前页报告原件"></canvas><img id="original-image" hidden alt="报告原件"></div></div></section>
<section class="recognition-panel"><nav class="result-tabs" role="tablist"><button role="tab" aria-selected="true" data-tab="results">识别结果</button><button role="tab" aria-selected="false" data-tab="changes">字段修改记录</button><button role="tab" aria-selected="false" data-tab="logs">识别日志</button></nav><div id="result-body" class="result-body"><form id="result-form"><section class="basic-section"><header><h2>基本信息（自动识别）</h2><span class="confidence unknown" title="识别服务未返回置信度时不显示虚构百分比">整体置信度：<b id="overall-confidence">未提供</b></span></header><div id="metadata-fields" class="metadata-fields"></div><p class="metadata-note">报告候选信息 · 修改仅保存到本报告，不更新职工资料</p><div class="evidence-pages"><label>基本信息所在页 <input name="metadataPage" type="number" min="1" value="1" required></label><label>结论所在页 <input name="conclusionPage" type="number" min="1" value="1" required></label></div></section><section class="metrics-section"><header><h2>体检指标（结构化识别）</h2><span id="metric-count"></span></header><div class="metric-scroll"><table class="ocr-metrics"><thead><tr><th><input type="checkbox" id="metric-select-all" aria-label="选择全部指标"></th><th>检查项目</th><th>原始识别值</th><th>标准化数值</th><th>单位</th><th>参考范围</th><th>置信度</th><th>是否异常</th><th>操作</th></tr></thead><tbody id="metric-rows"></tbody></table></div><div class="metric-tools"><button type="button" data-do="add-item">＋ 添加项目</button><span>标准化值和置信度仅显示后端已提供的数据</span></div></section><section class="report-text-section"><h2>报告结论与建议（原文）</h2><label>完整体检结论<textarea name="formalConclusion" rows="4" maxlength="12000"></textarea></label><label>医师建议<textarea name="advice" rows="3" maxlength="12000"></textarea></label></section></form></div><div id="changes-panel" class="history-panel" role="tabpanel" hidden></div><div id="logs-panel" class="history-panel" role="tabpanel" hidden></div><footer class="workbench-actions"><a id="back-to-list" class="action-soft" href="index.html">‹ 返回列表</a><button data-do="recognize" class="action-soft">↻ 重新识别</button><button data-do="save" class="save-button">▣ 保存修改</button><button data-do="submit" class="primary">♙ 提交匹配 →</button></footer></section></div>
</main><dialog id="ocr-dialog"><header><strong id="ocr-dialog-title"></strong><button data-do="close" aria-label="关闭">×</button></header><div id="ocr-dialog-body"></div></dialog><div id="toast" role="status"></div><script type="module" src="ocr.js?v=20261123"></script></body></html>
