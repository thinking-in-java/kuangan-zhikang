<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI 体检评估 · 健康评估中心</title><link rel="stylesheet" href="/assets/report-center/occupational.css?v=20261124"><link rel="stylesheet" href="exam.css?v=20261126-private-health-report"></head><body><main class="assessment-page"><header class="assessment-heading"><span id="title-icon"></span><h1>AI 体检评估</h1><p>基于体检报告、历史数据与岗位信息进行风险线索识别和分析，辅助医生审核。</p></header><section id="assessment-kpis" class="assessment-kpis" aria-label="体检评估统计"></section><form id="filters" class="assessment-filters"><input name="search" placeholder="请输入姓名/工号/报告编号" aria-label="搜索评估报告"><label>报告日期<select name="period"><option value="">全部时间</option><option value="7">近7天</option><option value="30">近30天</option><option value="month">本月</option></select></label><label>风险等级<select name="riskLevel"><option value="">全部等级</option><option value="unknown">未评估</option><option value="low">低风险</option><option value="medium">中风险</option><option value="high">高风险</option><option value="elevated">高及极高风险</option><option value="critical">极高风险</option></select></label><label>AI 状态<select name="aiState"><option value="">全部状态</option><option value="pending">待评估</option><option value="queued">排队中</option><option value="running">评估中</option><option value="completed">已完成</option><option value="failed">评估失败</option><option value="cancelled">已取消</option></select></label><label>医生审核状态<select name="reviewState"><option value="">全部状态</option><option value="not_started">尚未提交</option><option value="pending">待审核</option><option value="confirmed">已审核</option><option value="rejected">已退回</option></select></label><label>所属单位<select name="organization"><option value="">全部单位</option></select></label><label>岗位<select name="job"><option value="">全部岗位</option></select></label><button type="submit" class="primary">查询</button><button type="reset">重置</button><button type="button" data-do="batch-assess" class="green-button">批量评估</button><button type="button" data-do="batch-publish" class="primary">批量发布健康报告</button></form><p id="error" role="alert" hidden></p><div class="assessment-layout"><section class="assessment-list panel"><header class="section-heading"><h2>待评估报告列表 <small id="list-total"></small></h2><div><button data-do="export-list">导出列表</button><button data-do="columns">字段设置</button></div></header><div class="assessment-table-scroll"><table id="report-table" class="assessment-table"><thead></thead><tbody id="report-rows"><tr><td class="empty">正在加载报告…</td></tr></tbody></table></div><footer class="assessment-pager"><span id="selected">已选 0 项</span><div id="pagination"></div></footer></section><aside class="assessment-insights"><section class="panel"><header class="section-heading"><h2>风险等级分布</h2><button data-do="risk-detail">查看详情 ›</button></header><div class="risk-distribution"><div id="risk-chart" role="img" aria-label="医生已审核的风险等级分布"></div><div id="risk-legend"></div></div><p class="chart-note">仅统计当前报告已由医生确认的评估。</p></section><section class="panel"><header class="section-heading"><h2>近7日评估完成趋势</h2><span id="trend-total"></span></header><div id="trend-chart" role="img" aria-label="近七日实际AI完成次数"></div></section><section class="panel"><header class="section-heading"><h2>AI 评估引擎状态</h2><span id="engine-status" class="tag"></span></header><div id="engine-metrics" class="engine-metrics"></div><p class="chart-note">复用现有独立 AI 服务；配置与队列状态不代表上游接口健康。</p></section><section class="panel assistant-panel"><h2>评估助手</h2><ul><li>AI 分析保留原始值、单位、参考范围和报告出处。</li><li>候选结果需核对原件；风险等级由医生确认。</li><li>批量评估只生成待审分析，不自动发布或发送通知。</li></ul><button data-do="help">查看办理说明</button></section></aside><section class="batch-panel panel"><header class="batch-tabs"><button data-batch-tab="batches" class="primary">批量操作记录</button><button data-batch-tab="recent">最近评估任务</button><span id="batch-selection-note"></span></header><div id="batch-content" class="batch-table-scroll"></div></section></div></main><dialog id="dialog"><header><h2 id="dialog-title"></h2><button data-do="close" aria-label="关闭对话框">×</button></header><div id="dialog-body"></div></dialog><div id="toast" role="status"></div><script src="/assets/libs/echarts/echarts.min.js"></script><script src="exam.js?v=20261126-current-report-risk" defer></script></body></html>
