<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>职业健康风险评估 · 健康评估中心</title><link rel="stylesheet" href="/assets/report-center/occupational.css?v=20261124"><link rel="stylesheet" href="occupational-risk.css?v=20261124"></head><body><main class="risk-page"><nav class="breadcrumb"><span>健康评估中心</span><span>/</span><strong>职业健康风险评估</strong></nav><header class="risk-heading"><div><h1><span id="heading-icon"></span>职业健康风险评估</h1><p>基于岗位、接触史、职业健康检查结果，识别职业危害暴露线索，辅助医生核定风险等级</p></div><nav class="top-actions"><button data-do="rules">评估规则配置</button><button data-do="hazards">风险模型管理</button><button data-do="tasks">评估任务</button><button data-do="assess" class="primary">批量评估</button><button data-do="reports">导出报告</button></nav></header><p id="error" hidden role="alert"></p><section id="stats" class="risk-stats" aria-label="职业风险评估统计"></section><section class="distribution-grid"><article class="distribution exposure-panel"><h2>职业危害因素风险分布 <small>（有相关接触记录人数）</small></h2><div id="hazards"></div></article><article class="distribution level-panel"><h2>职业健康风险等级分布</h2><div class="level-content"><div class="donut-wrap"><div id="level-chart" role="img" aria-label="职业健康风险等级分布图"></div><div class="donut-total"><strong id="chart-total">0</strong><span>评估人数</span></div></div><div id="legend"></div></div></article><article class="distribution focus-panel"><header><h2>重点关注人群 <span title="接触记录不等于已测定的高剂量暴露">ⓘ</span></h2><button data-do="focus">查看详情 ›</button></header><div id="focus-groups"></div></article></section><form id="filters" class="risk-filters"><label>评估年度：<select name="year" aria-label="评估年度"></select></label><label>所属单位：<select name="organization" aria-label="所属单位"></select></label><label>岗位：<select name="job" aria-label="岗位"></select></label><label>风险等级：<select name="riskLevel" aria-label="风险等级"></select></label><label>评估状态：<select name="state" aria-label="评估状态"></select></label><input name="search" aria-label="职工姓名或工号" placeholder="请输入职工姓名/工号"><button type="reset">重置</button><button class="primary" type="submit">查询</button></form><div id="filter-note" hidden role="status"></div><section class="table-panel"><div class="table-scroll"><table id="risk-table"><thead><tr><th rowspan="2"><input id="select-all" type="checkbox" aria-label="选择当前页所有职工"></th><th rowspan="2">序号</th><th rowspan="2">职工姓名</th><th rowspan="2">工号</th><th rowspan="2">部门/班组</th><th rowspan="2">岗位</th><th colspan="5">各职业危害因素风险（等级）</th><th rowspan="2">综合风险等级</th><th rowspan="2">评估时间</th><th rowspan="2">评估状态</th><th rowspan="2">操作</th></tr><tr><th>粉尘</th><th>噪声</th><th>有害气体</th><th>高温</th><th>其他</th></tr></thead><tbody id="rows"><tr><td colspan="15">正在读取授权职工档案…</td></tr></tbody></table></div><footer class="risk-footer"><div class="batch-actions"><label><input id="footer-select-all" type="checkbox"> 全选</label><span id="selected-count">已选择 0 项</span><button class="primary" data-do="assess">批量评估</button><button data-do="reports">批量生成报告</button><button data-do="csv">导出评估结果</button><button id="clear-selection" data-do="clear" hidden>清空选择</button></div><div id="pagination" class="risk-pagination"></div></footer></section><p class="data-note">风险等级仅统计本年度、来源及规则有效的医生确认结果；接触关键词仅用于人群筛选。<span id="sync-status"></span></p></main><dialog id="dialog"><header><h2 id="dialog-title"></h2><button data-do="close" aria-label="关闭">×</button></header><div id="dialog-body"></div></dialog><div id="toast" role="status"></div><script src="/assets/libs/echarts/echarts.min.js"></script><script src="occupational-risk.js?v=20261124" defer></script></body></html>
