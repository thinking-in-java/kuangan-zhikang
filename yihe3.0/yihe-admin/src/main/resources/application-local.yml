server:
  address: 0.0.0.0
spring:
  datasource:
    druid:
      master:
        connection-init-sqls:
          - "SET SESSION sql_mode=(SELECT REPLACE(@@SESSION.sql_mode,'ONLY_FULL_GROUP_BY',''))"
  redis:
    host: 127.0.0.1
    port: 16379
    password: ""
  quartz:
    job-store-type: memory
    auto-startup: false
logging:
  config: classpath:logback-local.xml
  level:
    com.yihe: info
    org.springframework: info

ehr:
  storage-root: ${EHR_STORAGE_ROOT:F:/upload}
  recognition:
    provider: ${EHR_RECOGNITION_PROVIDER:model}
    config-file: ${EHR_MODEL_CONFIG_FILE:F:/upload/.config/model-recognition.json}
    python: ${EHR_MODEL_PYTHON:python}
  ocr:
    lease-seconds: ${EHR_OCR_LEASE_SECONDS:600}
